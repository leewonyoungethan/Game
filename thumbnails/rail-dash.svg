  <text x="70" y="320" font-size="84" text-anchor="middle" dominant-baseline="central">😤</text>
  <text x="22" y="72" font-family="Black Han Sans, Jalnan, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-weight="900" font-size="72" letter-spacing="-1" fill="none" stroke="#000" stroke-width="16" stroke-linejoin="round">3분 버티면</text><text x="22" y="72" font-family="Black Han Sans, Jalnan, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-weight="900" font-size="72" letter-spacing="-1" fill="#ffffff">3분 버티면</text>
  <text x="22" y="146" font-family="Black Han Sans, Jalnan, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-weight="900" font-size="72" letter-spacing="-1" fill="none" stroke="#000" stroke-width="16" stroke-linejoin="round">인정해줌</text><text x="22" y="146" font-family="Black Han Sans, Jalnan, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-weight="900" font-size="72" letter-spacing="-1" fill="#ffe14d">인정해줌</text>
  <g transform="translate(534 14) rotate(4 46.0 20)">
