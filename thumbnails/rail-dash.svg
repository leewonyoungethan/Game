      <stop offset="0" stop-color="#2b1d5c"/><stop offset=".6" stop-color="#a2477e"/><stop offset="1" stop-color="#ff9a5c"/>
    </linearGradient>
    <linearGradient id="gr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3f5e"/><stop offset="1" stop-color="#2a2036"/>
    </linearGradient>
  </defs>
  <rect width="640" height="130" fill="url(#sky)"/>
  <path d="M410 130 A50 50 0 0 1 510 130 Z" fill="#ffd68c"/>
