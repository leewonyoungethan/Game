    <rect x="128" y="80" width="26" height="50"/><rect x="158" y="96" width="50" height="34"/><rect x="212" y="66" width="34" height="64"/>
    <rect x="250" y="102" width="40" height="28"/><rect x="520" y="78" width="36" height="52"/><rect x="560" y="98" width="44" height="32"/><rect x="608" y="84" width="32" height="46"/>
  </g>
  <g fill="#ffc93c" opacity=".6"><rect x="52" y="80" width="3" height="3"/><rect x="52" y="92" width="3" height="3"/><rect x="220" y="76" width="3" height="3"/><rect x="220" y="90" width="3" height="3"/><rect x="528" y="88" width="3" height="3"/><rect x="616" y="94" width="3" height="3"/></g>
  <rect y="130" width="640" height="230" fill="url(#gr)"/>
