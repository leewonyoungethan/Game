  <g transform="translate(330 300)">
    <rect x="-20" y="2" width="12" height="34" fill="#2b3a67"/><rect x="8" y="2" width="12" height="26" fill="#2b3a67"/>
    <rect x="-22" y="34" width="16" height="8" fill="#f2f2f2"/><rect x="6" y="26" width="16" height="8" fill="#f2f2f2"/>
    <rect x="-26" y="-46" width="52" height="52" rx="10" fill="#37e2c8"/>
    <rect x="-18" y="-40" width="36" height="36" rx="6" fill="#ff8a3d"/>
    <circle cx="0" cy="-60" r="16" fill="#3a2416"/>
    <path d="M-17 -63 A17 17 0 0 1 17 -63 Z" fill="#ff5d8f"/>
