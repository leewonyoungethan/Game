    <path d="M168 255 L472 255" stroke-width="5"/><path d="M220 220 L420 220" stroke-width="4"/>
    <path d="M256 194 L384 194" stroke-width="3"/><path d="M282 174 L358 174" stroke-width="2"/>
  </g>
