  <rect width="640" height="5" fill="#ffffff22"/><rect width="410" height="5" fill="#ffc93c"/>
</g></g>
  <circle cx="442" cy="190" r="95" fill="url(#flare)"/>
  <rect width="640" height="360" fill="url(#vig)"/>
