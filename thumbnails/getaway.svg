    <rect x="-30" y="-12" width="14" height="24" rx="3" fill="#1a1300" opacity=".5"/>
    <rect x="-36" y="-4" width="72" height="8" fill="#1a1300" opacity=".25"/>
    <rect x="32" y="-14" width="6" height="7" rx="2" fill="#fff"/><rect x="32" y="7" width="6" height="7" rx="2" fill="#fff"/>
    <rect x="-38" y="-14" width="4" height="7" fill="#ff3d55"/><rect x="-38" y="7" width="4" height="7" fill="#ff3d55"/>
