    <rect x="30" y="20" width="6" height="6"/><rect x="60" y="50" width="6" height="6"/><rect x="140" y="30" width="6" height="6"/><rect x="100" y="70" width="6" height="6"/>
    <rect x="360" y="30" width="6" height="6"/><rect x="420" y="70" width="6" height="6"/><rect x="40" y="290" width="6" height="6"/><rect x="110" y="320" width="6" height="6"/>
  </g>
  <g fill="#a8dcff" opacity=".7"><rect x="540" y="40" width="6" height="6"/><rect x="600" y="80" width="6" height="6"/><rect x="210" y="300" width="6" height="6"/><rect x="560" y="300" width="6" height="6"/></g>
