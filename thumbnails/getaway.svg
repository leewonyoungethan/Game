    <text x="0" y="12" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="18" fill="#3b2a00">$</text>
  </g>
  <!-- wanted stars -->
  <g fill="#ffc634" font-family="sans-serif" font-size="26"><text x="508" y="342">★★★</text></g>
  <text x="586" y="342" fill="#ffffff33" font-family="sans-serif" font-size="26">★★</text>
</g></g>
  <circle cx="112" cy="196" r="122" fill="url(#flare)"/>
  <rect width="640" height="360" fill="url(#vig)"/>
  <rect width="640" height="175" fill="url(#tshade)"/>
  <circle cx="112" cy="196" r="72" fill="none" stroke="#fff" stroke-width="16"/>
  <circle cx="112" cy="196" r="72" fill="none" stroke="#ff1e1e" stroke-width="9"/>
  <g transform="translate(300 300) rotate(-151.0)"><path d="M0 -9 L99 -9 L99 -26 L133 0 L99 26 L99 9 L0 9 Z" fill="#fff" stroke="#fff" stroke-width="10" stroke-linejoin="round"/><path d="M0 -9 L99 -9 L99 -26 L133 0 L99 26 L99 9 L0 9 Z" fill="#ff1e1e"/></g>
  <text x="590" y="250" font-size="84" text-anchor="middle" dominant-baseline="central">🚨</text>
  <text x="22" y="72" font-family="Black Han Sans, Jalnan, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-weight="900" font-size="72" letter-spacing="-1" fill="none" stroke="#000" stroke-width="16" stroke-linejoin="round">경찰 9대</text><text x="22" y="72" font-family="Black Han Sans, Jalnan, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-weight="900" font-size="72" letter-spacing="-1" fill="#ffffff">경찰 9대</text>
  <text x="22" y="146" font-family="Black Han Sans, Jalnan, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-weight="900" font-size="62" letter-spacing="-1" fill="none" stroke="#000" stroke-width="16" stroke-linejoin="round">다 따돌림ㅋㅋ</text><text x="22" y="146" font-family="Black Han Sans, Jalnan, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-weight="900" font-size="62" letter-spacing="-1" fill="#ffe14d">다 따돌림ㅋㅋ</text>
  <g transform="translate(534 14) rotate(4 46.0 20)">
    <rect width="92" height="42" rx="8" fill="#ff1e1e" stroke="#fff" stroke-width="4"/>
    <text x="46.0" y="30" text-anchor="middle" font-family="Black Han Sans, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-weight="900" font-size="24" fill="#fff">역대급</text>
