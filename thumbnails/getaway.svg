<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <filter id="pop" x="0" y="0" width="1" height="1"><feColorMatrix type="saturate" values="1.55"/>
      <feComponentTransfer><feFuncR type="linear" slope="1.12" intercept="-.03"/><feFuncG type="linear" slope="1.12" intercept="-.03"/><feFuncB type="linear" slope="1.12" intercept="-.03"/></feComponentTransfer></filter>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient>
    <linearGradient id="tshade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
    <linearGradient id="bshade" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".6"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
    <radialGradient id="flare"><stop offset="0" stop-color="#fff6a0" stop-opacity=".75"/><stop offset="1" stop-color="#fff6a0" stop-opacity="0"/></radialGradient>
  </defs>
  <g filter="url(#pop)"><g transform="translate(320 180) scale(1.04) translate(-320 -180)">
  <defs>
    <radialGradient id="glowR"><stop offset="0" stop-color="#ff3d55" stop-opacity=".7"/><stop offset="1" stop-color="#ff3d55" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0" stop-color="#3f86ff" stop-opacity=".7"/><stop offset="1" stop-color="#3f86ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowG"><stop offset="0" stop-color="#ffc634" stop-opacity=".6"/><stop offset="1" stop-color="#ffc634" stop-opacity="0"/></radialGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff3c4" stop-opacity=".45"/><stop offset="1" stop-color="#fff3c4" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="640" height="360" fill="#1a1d2b"/>
  <!-- city blocks (top-down rooftops) -->
  <g>
    <rect x="-20" y="-20" width="230" height="130" fill="#232946" stroke="#3a4170" stroke-width="3"/>
    <rect x="330" y="-20" width="160" height="130" fill="#2a2440" stroke="#463b6e" stroke-width="3"/>
    <rect x="510" y="-20" width="150" height="130" fill="#1f2c3a" stroke="#34506a" stroke-width="3"/>
    <rect x="-20" y="250" width="180" height="130" fill="#2a2440" stroke="#463b6e" stroke-width="3"/>
    <rect x="180" y="250" width="110" height="130" fill="#1f2c3a" stroke="#34506a" stroke-width="3"/>
    <rect x="510" y="250" width="150" height="130" fill="#232946" stroke="#3a4170" stroke-width="3"/>
    <rect x="230" y="-20" width="80" height="130" fill="#173022"/>
