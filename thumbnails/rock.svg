    <g fill="#1a1b20"><rect x="280" y="240" width="40" height="40"/><rect x="280" y="280" width="40" height="40"/><rect x="280" y="320" width="40" height="40"/></g>
  </g>
  <g fill="#ffd34d"><rect x="252" y="252" width="8" height="8"/><rect x="336" y="296" width="8" height="8"/><rect x="214" y="334" width="8" height="8"/></g>
  <g fill="#5ff0ff"><rect x="262" y="300" width="8" height="8"/><rect x="372" y="336" width="8" height="8"/></g>
  <!-- pickaxe -->
  <g transform="translate(470 150) rotate(-35)">
    <rect x="-6" y="-10" width="12" height="120" rx="3" fill="#a0672e" stroke="#5a3714" stroke-width="3"/>
    <path d="M-62 -6 Q0 -40 62 -6 L56 6 Q0 -18 -56 6 Z" fill="#cfd6e0" stroke="#4a5160" stroke-width="3"/>
  </g>
  <!-- flying chips -->
  <g fill="#8d8f96"><rect x="420" y="196" width="10" height="10" transform="rotate(20 425 201)"/><rect x="444" y="178" width="7" height="7"/></g>
</g></g>
  <circle cx="470" cy="160" r="105" fill="url(#flare)"/>
  <rect width="640" height="360" fill="url(#vig)"/>
  <rect y="185" width="640" height="175" fill="url(#bshade)"/>
  <circle cx="470" cy="160" r="62" fill="none" stroke="#fff" stroke-width="16"/>
  <circle cx="470" cy="160" r="62" fill="none" stroke="#ff1e1e" stroke-width="9"/>
  <g transform="translate(600 30) rotate(135.0)"><path d="M0 -9 L78 -9 L78 -26 L112 0 L78 26 L78 9 L0 9 Z" fill="#fff" stroke="#fff" stroke-width="10" stroke-linejoin="round"/><path d="M0 -9 L78 -9 L78 -26 L112 0 L78 26 L78 9 L0 9 Z" fill="#ff1e1e"/></g>
  <text x="585" y="225" font-size="84" text-anchor="middle" dominant-baseline="central">⛏️</text>
  <text x="22" y="262" font-family="Black Han Sans, Jalnan, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-weight="900" font-size="72" letter-spacing="-1" fill="none" stroke="#000" stroke-width="16" stroke-linejoin="round">산 하나를</text><text x="22" y="262" font-family="Black Han Sans, Jalnan, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-weight="900" font-size="72" letter-spacing="-1" fill="#ffffff">산 하나를</text>
  <text x="22" y="334" font-family="Black Han Sans, Jalnan, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-weight="900" font-size="62" letter-spacing="-1" fill="none" stroke="#000" stroke-width="16" stroke-linejoin="round">통째로 팜ㅋㅋ</text><text x="22" y="334" font-family="Black Han Sans, Jalnan, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-weight="900" font-size="62" letter-spacing="-1" fill="#ffe14d">통째로 팜ㅋㅋ</text>
  <g transform="translate(534 14) rotate(4 46.0 20)">
    <rect width="92" height="42" rx="8" fill="#ff1e1e" stroke="#fff" stroke-width="4"/>
    <text x="46.0" y="30" text-anchor="middle" font-family="Black Han Sans, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-weight="900" font-size="24" fill="#fff">역대급</text>
  </g>
  <rect x="3" y="3" width="634" height="354" fill="none" stroke="#ffe14d" stroke-width="6"/>
