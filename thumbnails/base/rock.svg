<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa8f0"/><stop offset="1" stop-color="#bfe3ff"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#sky)"/>
  <circle cx="540" cy="70" r="34" fill="#fff6c8"/>
  <g fill="#fff" opacity=".9">
    <rect x="60" y="50" width="90" height="22" rx="4"/><rect x="80" y="36" width="50" height="20" rx="4"/>
    <rect x="380" y="90" width="80" height="18" rx="4"/>
  </g>
  <!-- blocky mountain: rows of 40px blocks -->
  <g stroke="#00000022" stroke-width="2">
    <g fill="#5fbf4a"><rect x="280" y="80" width="40" height="40"/></g>
    <g fill="#8a5a33"><rect x="280" y="120" width="40" height="40"/></g>
    <g fill="#5fbf4a"><rect x="240" y="120" width="40" height="40"/><rect x="320" y="120" width="40" height="40"/></g>
    <g fill="#8a5a33"><rect x="240" y="160" width="40" height="40"/><rect x="320" y="160" width="40" height="40"/></g>
    <g fill="#8d8f96"><rect x="280" y="160" width="40" height="40"/></g>
    <g fill="#5fbf4a"><rect x="200" y="160" width="40" height="40"/><rect x="360" y="160" width="40" height="40"/><rect x="400" y="200" width="40" height="40"/><rect x="160" y="200" width="40" height="40"/></g>
    <g fill="#8a5a33"><rect x="200" y="200" width="40" height="40"/><rect x="360" y="200" width="40" height="40"/><rect x="160" y="240" width="40" height="40"/><rect x="400" y="240" width="40" height="40"/></g>
    <g fill="#8d8f96"><rect x="240" y="200" width="40" height="40"/><rect x="280" y="200" width="40" height="40"/><rect x="320" y="200" width="40" height="40"/><rect x="200" y="240" width="40" height="40"/><rect x="360" y="240" width="40" height="40"/></g>
    <g fill="#5fbf4a"><rect x="120" y="240" width="40" height="40"/><rect x="440" y="240" width="40" height="40"/><rect x="80" y="280" width="40" height="40"/><rect x="480" y="280" width="40" height="40"/></g>
    <g fill="#8a5a33"><rect x="120" y="280" width="40" height="40"/><rect x="440" y="280" width="40" height="40"/><rect x="40" y="320" width="40" height="40"/><rect x="80" y="320" width="40" height="40"/><rect x="520" y="320" width="40" height="40"/><rect x="480" y="320" width="40" height="40"/></g>
    <g fill="#8d8f96"><rect x="160" y="280" width="40" height="40"/><rect x="200" y="280" width="40" height="40"/><rect x="360" y="280" width="40" height="40"/><rect x="400" y="280" width="40" height="40"/><rect x="120" y="320" width="40" height="40"/><rect x="160" y="320" width="40" height="40"/><rect x="400" y="320" width="40" height="40"/><rect x="440" y="320" width="40" height="40"/></g>
    <!-- deep core rock with ore -->
    <g fill="#3b3d46"><rect x="240" y="240" width="40" height="40"/><rect x="320" y="240" width="40" height="40"/><rect x="240" y="280" width="40" height="40"/><rect x="320" y="280" width="40" height="40"/><rect x="200" y="320" width="40" height="40"/><rect x="240" y="320" width="40" height="40"/><rect x="320" y="320" width="40" height="40"/><rect x="360" y="320" width="40" height="40"/></g>
    <!-- dug tunnel -->
    <g fill="#1a1b20"><rect x="280" y="240" width="40" height="40"/><rect x="280" y="280" width="40" height="40"/><rect x="280" y="320" width="40" height="40"/></g>
  </g>
  <g fill="#ffd34d"><rect x="252" y="252" width="8" height="8"/><rect x="336" y="296" width="8" height="8"/><rect x="214" y="334" width="8" height="8"/></g>
  <g fill="#5ff0ff"><rect x="262" y="300" width="8" height="8"/><rect x="372" y="336" width="8" height="8"/></g>
  <!-- pickaxe -->
  <g transform="translate(470 150) rotate(-35)">
    <rect x="-6" y="-10" width="12" height="120" rx="3" fill="#a0672e" stroke="#5a3714" stroke-width="3"/>
    <path d="M-62 -6 Q0 -40 62 -6 L56 6 Q0 -18 -56 6 Z" fill="#cfd6e0" stroke="#4a5160" stroke-width="3"/>
  </g>
  <!-- flying chips -->
  <g fill="#8d8f96"><rect x="420" y="196" width="10" height="10" transform="rotate(20 425 201)"/><rect x="444" y="178" width="7" height="7"/></g>
</svg>
