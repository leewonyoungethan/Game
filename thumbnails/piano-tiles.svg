<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <filter id="pop" x="0" y="0" width="1" height="1"><feColorMatrix type="saturate" values="1.55"/>
      <feComponentTransfer><feFuncR type="linear" slope="1.12" intercept="-.03"/><feFuncG type="linear" slope="1.12" intercept="-.03"/><feFuncB type="linear" slope="1.12" intercept="-.03"/></feComponentTransfer></filter>
    <radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient>
    <linearGradient id="tshade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
    <linearGradient id="bshade" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".6"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
    <radialGradient id="flare"><stop offset="0" stop-color="#fff6a0" stop-opacity=".75"/><stop offset="1" stop-color="#fff6a0" stop-opacity="0"/></radialGradient>
  </defs>
  <g filter="url(#pop)"><g transform="translate(320 180) scale(1.04) translate(-320 -180)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1f4a"/><stop offset="1" stop-color="#4a2a6b"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2d3a"/><stop offset="1" stop-color="#0b0c12"/></linearGradient>
    <linearGradient id="hit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7ad7ff"/><stop offset="1" stop-color="#3f86ff"/></linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- lanes -->
  <g transform="translate(160 0)">
    <rect width="320" height="360" fill="#f6f4ff"/>
    <g stroke="#d8d4ec" stroke-width="2"><path d="M80 0 V360"/><path d="M160 0 V360"/><path d="M240 0 V360"/></g>
    <!-- falling tiles -->
    <rect x="2" y="-30" width="76" height="110" rx="4" fill="url(#tile)"/>
    <rect x="162" y="40" width="76" height="110" rx="4" fill="url(#tile)"/>
    <rect x="242" y="-80" width="76" height="230" rx="4" fill="url(#tile)"/>
    <rect x="252" y="-80" width="56" height="200" rx="3" fill="none" stroke="#ffc634" stroke-width="3" stroke-dasharray="8 6"/>
    <rect x="82" y="160" width="76" height="110" rx="4" fill="url(#tile)"/>
    <rect x="2" y="250" width="76" height="110" rx="4" fill="url(#hit)" opacity=".9"/>
    <!-- tap ripple -->
    <circle cx="40" cy="300" r="26" fill="none" stroke="#fff" stroke-width="4" opacity=".9"/>
    <circle cx="40" cy="300" r="42" fill="none" stroke="#fff" stroke-width="2" opacity=".5"/>
    <rect y="318" width="320" height="4" fill="#ff5d8f" opacity=".5"/>
  </g>
  <!-- music notes -->
  <g fill="#ffc634">
    <g transform="translate(80 110)"><ellipse cx="0" cy="40" rx="16" ry="12" transform="rotate(-20 0 40)"/><rect x="12" y="-10" width="5" height="50"/><path d="M17 -10 q24 8 20 30 q-4 -14 -20 -16 Z"/></g>
    <g transform="translate(540 70)" fill="#7ad7ff"><ellipse cx="0" cy="40" rx="13" ry="10" transform="rotate(-20 0 40)"/><ellipse cx="44" cy="30" rx="13" ry="10" transform="rotate(-20 44 30)"/><rect x="10" y="-6" width="4" height="46"/><rect x="54" y="-16" width="4" height="46"/><path d="M10 -6 L58 -16 L58 -6 L10 4 Z"/></g>
    <g transform="translate(520 230)" fill="#ff8fb0"><ellipse cx="0" cy="34" rx="14" ry="10" transform="rotate(-20 0 34)"/><rect x="10" y="-8" width="4" height="42"/></g>
  </g>
  <!-- score + stars -->
  <text x="320" y="44" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="38" fill="#ff5d8f" stroke="#fff" stroke-width="2">128</text>
  <text x="80" y="300" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#ffc634">★★★</text>
</g></g>
  <circle cx="200" cy="305" r="85" fill="url(#flare)"/>
  <rect width="640" height="360" fill="url(#vig)"/>
  <rect width="640" height="175" fill="url(#tshade)"/>
  <circle cx="200" cy="305" r="50" fill="none" stroke="#fff" stroke-width="16"/>
  <circle cx="200" cy="305" r="50" fill="none" stroke="#ff1e1e" stroke-width="9"/>
  <g transform="translate(70 200) rotate(38.9)"><path d="M0 -9 L73 -9 L73 -26 L107 0 L73 26 L73 9 L0 9 Z" fill="#fff" stroke="#fff" stroke-width="10" stroke-linejoin="round"/><path d="M0 -9 L73 -9 L73 -26 L107 0 L73 26 L73 9 L0 9 Z" fill="#ff1e1e"/></g>
  <text x="585" y="320" font-size="84" text-anchor="middle" dominant-baseline="central">🤯</text>
  <text x="22" y="72" font-family="Black Han Sans, Jalnan, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-weight="900" font-size="72" letter-spacing="-1" fill="none" stroke="#000" stroke-width="16" stroke-linejoin="round">255곡</text><text x="22" y="72" font-family="Black Han Sans, Jalnan, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-weight="900" font-size="72" letter-spacing="-1" fill="#ffffff">255곡</text>
  <text x="22" y="146" font-family="Black Han Sans, Jalnan, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-weight="900" font-size="54" letter-spacing="-1" fill="none" stroke="#000" stroke-width="16" stroke-linejoin="round">전부 깰 수 있음?</text><text x="22" y="146" font-family="Black Han Sans, Jalnan, Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-weight="900" font-size="54" letter-spacing="-1" fill="#ffe14d">전부 깰 수 있음?</text>
  <g transform="translate(468 14) rotate(4 79.0 20)">
    <rect width="158" height="42" rx="8" fill="#ff1e1e" stroke="#fff" stroke-width="4"/>
    <text x="79.0" y="30" text-anchor="middle" font-family="Black Han Sans, Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-weight="900" font-size="24" fill="#fff">고인물 전용</text>
  </g>
  <rect x="3" y="3" width="634" height="354" fill="none" stroke="#ffe14d" stroke-width="6"/>
</svg>
