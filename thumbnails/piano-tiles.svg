<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1f4a"/><stop offset="1" stop-color="#4a2a6b"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2d3a"/><stop offset="1" stop-color="#0b0c12"/></linearGradient>
    <linearGradient id="hit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7ad7ff"/><stop offset="1" stop-color="#3f86ff"/></linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- lanes -->
  <g transform="translate(160 0)">
    <rect width="320" height="360" fill="#f6f4ff"/>
    <g stroke="#d8d4ec" stroke-width="2"><path d="M80 0 V360"/><path d="M160 0 V360"/><path d="M240 0 V360"/></g>
    <!-- falling tiles -->
    <rect x="2" y="-30" width="76" height="110" rx="4" fill="url(#tile)"/>
    <rect x="162" y="40" width="76" height="110" rx="4" fill="url(#tile)"/>
    <rect x="242" y="-80" width="76" height="230" rx="4" fill="url(#tile)"/>
    <rect x="252" y="-80" width="56" height="200" rx="3" fill="none" stroke="#ffc634" stroke-width="3" stroke-dasharray="8 6"/>
    <rect x="82" y="160" width="76" height="110" rx="4" fill="url(#tile)"/>
    <rect x="2" y="250" width="76" height="110" rx="4" fill="url(#hit)" opacity=".9"/>
    <!-- tap ripple -->
    <circle cx="40" cy="300" r="26" fill="none" stroke="#fff" stroke-width="4" opacity=".9"/>
    <circle cx="40" cy="300" r="42" fill="none" stroke="#fff" stroke-width="2" opacity=".5"/>
    <rect y="318" width="320" height="4" fill="#ff5d8f" opacity=".5"/>
  </g>
  <!-- music notes -->
  <g fill="#ffc634">
    <g transform="translate(80 110)"><ellipse cx="0" cy="40" rx="16" ry="12" transform="rotate(-20 0 40)"/><rect x="12" y="-10" width="5" height="50"/><path d="M17 -10 q24 8 20 30 q-4 -14 -20 -16 Z"/></g>
    <g transform="translate(540 70)" fill="#7ad7ff"><ellipse cx="0" cy="40" rx="13" ry="10" transform="rotate(-20 0 40)"/><ellipse cx="44" cy="30" rx="13" ry="10" transform="rotate(-20 44 30)"/><rect x="10" y="-6" width="4" height="46"/><rect x="54" y="-16" width="4" height="46"/><path d="M10 -6 L58 -16 L58 -6 L10 4 Z"/></g>
    <g transform="translate(520 230)" fill="#ff8fb0"><ellipse cx="0" cy="34" rx="14" ry="10" transform="rotate(-20 0 34)"/><rect x="10" y="-8" width="4" height="42"/></g>
  </g>
  <!-- score + stars -->
  <text x="320" y="44" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="38" fill="#ff5d8f" stroke="#fff" stroke-width="2">128</text>
  <text x="80" y="300" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#ffc634">★★★</text>
</svg>
