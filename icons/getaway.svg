acity="0.85"/><stop offset="1" stop-color="#e6e8f2" stop-opacity="0"/></radialGradient><linearGradient id="bill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8f8a8"/><stop offset="1" stop-color="#2e9a4a"/></linearGradient><linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e3450"/><stop offset="1" stop-color="#1a1e30"/></linearGradient></defs>
