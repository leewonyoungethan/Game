<g fill="#e8fbff"><circle cx="352" cy="360" r="6"/><circle cx="430" cy="350" r="5"/><circle cx="380" cy="336" r="4"/><circle cx="446" cy="372" r="4"/><circle cx="330" cy="376" r="3"/></g>
