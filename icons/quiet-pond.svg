  <g stroke="#4a2410" stroke-width="3" stroke-linecap="round" opacity=".7"><path d="M-44 -24 H-72 M-44 -16 L-70 -8 M44 -24 H72 M44 -16 L70 -8"/></g>
  <ellipse cx="0" cy="-84" rx="78" ry="18" fill="url(#hat)" stroke="#8a6a1a" stroke-width="5"/>
