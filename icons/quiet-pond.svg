  <path d="M-42 -96 Q0 -88 42 -96 L42 -86 Q0 -78 -42 -86 Z" fill="#e8403a"/>
</g>
<g transform="translate(340.0 250.0) scale(1.0)"><circle r="26" fill="url(#spark)" opacity=".75"/><path d="M0 -30 Q2.6 -2.6 30 0 Q2.6 2.6 0 30 Q-2.6 2.6 -30 0 Q-2.6 -2.6 0 -30 Z" fill="#fffbe0"/></g><g transform="translate(470.0 120.0) scale(0.55)"><circle r="26" fill="url(#spark)" opacity=".75"/><path d="M0 -30 Q2.6 -2.6 30 0 Q2.6 2.6 0 30 Q-2.6 2.6 -30 0 Q-2.6 -2.6 0 -30 Z" fill="#fff"/></g><g transform="translate(80.0 120.0) scale(0.5)"><circle r="26" fill="url(#spark)" opacity=".75"/><path d="M0 -30 Q2.6 -2.6 30 0 Q2.6 2.6 0 30 Q-2.6 2.6 -30 0 Q-2.6 -2.6 0 -30 Z" fill="#fff"/></g>

<rect width="512" height="512" filter="url(#grain)"/>
<rect width="512" height="512" fill="url(#vig)"/>
<path d="M0 0 H512 V170 Q256 228 0 170 Z" fill="url(#gloss)"/>
</g>
