<radialGradient id="spark"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a5ac8"/><stop offset="0.45" stop-color="#ff8a7a"/><stop offset="1" stop-color="#ffd08a"/></linearGradient><radialGradient id="sun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fffbe0"/><stop offset="0.6" stop-color="#ffe08a"/><stop offset="1" stop-color="#ffb05a" stop-opacity="0"/></radialGradient><linearGradient id="lake" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ab0d8"/><stop offset="1" stop-color="#1a5a8a"/></linearGradient><linearGradient id="mount" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a6ab8"/><stop offset="1" stop-color="#5a4a8a"/></linearGradient><radialGradient id="cat" cx="0.38" cy="0.3" r="0.5"><stop offset="0" stop-color="#ffd6a0"/><stop offset="0.6" stop-color="#ffa856"/><stop offset="1" stop-color="#d8762a"/></radialGradient><linearGradient id="hat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0a0"/><stop offset="1" stop-color="#e0b040"/></linearGradient><linearGradient id="fish" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb070"/><stop offset="0.5" stop-color="#ff7a3a"/><stop offset="1" stop-color="#fff0e0"/></linearGradient><linearGradient id="dock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8784a"/><stop offset="1" stop-color="#6a3e1e"/></linearGradient></defs>
