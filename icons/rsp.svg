<radialGradient id="spark"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<radialGradient id="bg" cx="0.5" cy="0.42" r="0.75"><stop offset="0" stop-color="#8a1a2a"/><stop offset="0.5" stop-color="#3a0a18"/><stop offset="1" stop-color="#0a0208"/></radialGradient><radialGradient id="spot" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff0d0" stop-opacity="0.55"/><stop offset="1" stop-color="#fff0d0" stop-opacity="0"/></radialGradient><radialGradient id="skin" cx="0.35" cy="0.3" r="0.5"><stop offset="0" stop-color="#ffe2c8"/><stop offset="0.7" stop-color="#f4b48a"/><stop offset="1" stop-color="#d88a5a"/></radialGradient><linearGradient id="glove" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4a5a"/><stop offset="0.5" stop-color="#1e1e28"/><stop offset="1" stop-color="#0a0a10"/></linearGradient><radialGradient id="clash" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffffff"/><stop offset="0.25" stop-color="#fff3a0" stop-opacity="0.95"/><stop offset="0.6" stop-color="#ff8a3a" stop-opacity="0.5"/><stop offset="1" stop-color="#ff3a3a" stop-opacity="0"/></radialGradient></defs>
<g clip-path="url(#sq)">

