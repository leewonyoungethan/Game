<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🔥 앱개발부 | 여기 게임 다 깨면 전설 인정</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
  <style>
    :root { --bg: #f6f7fb; --card: #fff; --text: #1d2030; --muted: #667; --accent: #ff1e1e; --gold: #ffcc00;
      --display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f1018; --card: #1c1e2b; --text: #eceef6; --muted: #9aa; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    main { max-width: 960px; margin: 0 auto; padding: 0 16px 40px; }

    .hero { position: relative; overflow: hidden; margin: 0 0 28px; padding: 44px 16px 36px; text-align: center; color: #fff;
      background: radial-gradient(circle at 50% 120%, #ff5a1f 0, #c4002f 35%, #2a0a3d 75%, #0c0614 100%); }
    .hero::before { content: ""; position: absolute; inset: -50%;
      background: repeating-conic-gradient(from 0deg, rgba(255,220,80,.14) 0 8deg, transparent 8deg 20deg);
      animation: spin 40s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hero > * { position: relative; }
    .badge { display: inline-block; background: var(--accent); color: #fff; font-family: var(--display); font-size: 15px; padding: 4px 12px;
      border: 3px solid #fff; border-radius: 8px; transform: rotate(-3deg); box-shadow: 0 4px 0 rgba(0,0,0,.35); animation: wobble 1.6s ease-in-out infinite; }
    @keyframes wobble { 50% { transform: rotate(3deg) scale(1.06); } }
    h1 { font-family: var(--display); font-weight: 400; margin: 14px 0 6px; line-height: 1; font-size: clamp(56px, 16vw, 128px); letter-spacing: -2px;
      background: linear-gradient(180deg, #fff 0%, #fff6a0 45%, #ffcc00 55%, #ff8a00 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
      -webkit-text-stroke: 3px #1a0010; paint-order: stroke fill; filter: drop-shadow(0 6px 0 #1a0010) drop-shadow(0 0 24px rgba(255,170,0,.65)); }
    .tag { font-family: var(--display); font-size: clamp(20px, 5vw, 34px); margin: 0; color: #fff;
      text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 4px 0 #000; }
    .tag em { font-style: normal; color: var(--gold); }
    .ticker { margin: 18px auto 0; max-width: 640px; overflow: hidden; white-space: nowrap; background: rgba(0,0,0,.45); border: 2px solid var(--gold);
      border-radius: 999px; padding: 6px 0; font-weight: 700; font-size: 14px; }
    .ticker span { display: inline-block; padding-left: 100%; animation: tick 18s linear infinite; }
    @keyframes tick { to { transform: translateX(-100%); } }
    @media (prefers-reduced-motion: reduce) { .hero::before, .badge, .ticker span { animation: none; } .ticker span { padding-left: 16px; } }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
    a.card { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 14px; align-items: start; padding: 14px; background: var(--card); border-radius: 20px; color: inherit; text-decoration: none;
      box-shadow: 0 2px 6px rgba(0,0,0,.12); transition: transform .15s ease, box-shadow .15s ease; }
    a.card:hover { transform: translateY(-3px); box-shadow: 0 0 0 3px var(--accent), 0 12px 24px rgba(255,30,30,.2); }
    a.card:hover .icon { transform: rotate(-6deg) scale(1.06); }
    .card .icon { display: block; width: 104px; height: 104px; border-radius: 24px; box-shadow: 0 6px 14px rgba(0,0,0,.25); transition: transform .2s cubic-bezier(.3,1.6,.5,1); }
    .card .body { min-width: 0; }
    @media (max-width: 400px) { .grid { grid-template-columns: 1fr; } a.card { grid-template-columns: 84px minmax(0, 1fr); gap: 12px; } .card .icon { width: 84px; height: 84px; border-radius: 20px; } }
    .card h2 { margin: 2px 0 2px; font-size: 19px; line-height: 1.25; font-weight: 900; }
    .card .hook { margin: 0 0 4px; font-size: 13px; font-weight: 700; line-height: 1.35; color: var(--text); opacity: .85; }
    .card .hook b { color: var(--accent); }
    .card .author { color: var(--muted); font-size: 12px; }
    .card p.desc { margin: 6px 0 0; font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .tools { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0 10px; margin-bottom: 14px; }
    .search { position: relative; }
    .search input { width: 100%; font: inherit; font-size: 16px; padding: 13px 44px 13px 46px; border-radius: 999px; border: 3px solid var(--accent);
      background: var(--card); color: var(--text); outline: none; box-shadow: 0 4px 0 rgba(255,30,30,.18); }
    .search input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
    .search input:focus { box-shadow: 0 0 0 4px rgba(255,204,0,.45); }
    .search .ic { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 18px; pointer-events: none; }
    .search .clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); border: 0; background: rgba(127,127,127,.18); color: var(--text);
      width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 14px; }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 2px 4px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    @media (min-width: 700px) { .chips { flex-wrap: wrap; overflow: visible; } }
    .chip { flex: none; font: inherit; font-weight: 800; font-size: 14px; padding: 7px 14px; border-radius: 999px; cursor: pointer;
      border: 2px solid rgba(127,127,127,.3); background: var(--card); color: var(--text); white-space: nowrap; }
    .chip small { font-weight: 700; opacity: .6; margin-left: 3px; }
    .chip:hover { border-color: var(--accent); }
    .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 3px 0 #9e0000; }
    .chip:focus-visible, .search .clear:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 6px; }
    .count { font-size: 13px; color: var(--muted); margin: 0 2px; }
    .sort { display: flex; background: var(--card); border: 2px solid rgba(127,127,127,.3); border-radius: 999px; padding: 2px; flex: none; }
    .sort button { font: inherit; font-size: 13px; font-weight: 800; border: 0; background: none; color: var(--muted); padding: 5px 11px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
    .sort button.on { background: var(--text); color: var(--bg); }
    .sort button:focus-visible { outline: 3px solid var(--gold); outline-offset: 1px; }
    .medal { font-size: 12px; font-weight: 900; color: #fff; background: linear-gradient(90deg, #ff1e1e, #ff8a00); padding: 2px 8px; border-radius: 999px; margin-right: 2px; }
    .plays { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; white-space: nowrap; margin-top: 8px; font-size: 12px; font-weight: 800; color: #e8590c; }
    .count b { color: var(--accent); }
    .genres { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .genres span { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: rgba(127,127,127,.14); color: var(--muted); }
    mark { background: #ffe14d; color: #1d2030; border-radius: 3px; padding: 0 1px; }
    .empty { color: var(--muted); grid-column: 1 / -1; text-align: center; padding: 40px 0; font-size: 15px; }
    .empty b { display: block; font-size: 40px; margin-bottom: 6px; }
  </style>
</head>
<body>
  <header class="hero">
      <span class="badge">🔥 조회수 폭발 🔥</span>
      <h1>앱개발부</h1>
      <p class="tag">여기 있는 게임 <em>다 깨면 전설</em> 인정 ㅋㅋ</p>
      <div class="ticker" aria-hidden="true"><span id="ticker">⚠️ 한 판만 하려다 밤샘 주의 ⚠️ · 친구한테 링크 보내면 우정 파괴 가능 · 지금 바로 플레이 GO GO</span></div>
  </header>
  <main>
    <div class="tools">
      <label class="search">
        <span class="ic" aria-hidden="true">🔍</span>
        <input id="q" type="search" placeholder="게임 검색 (예: 여우, 드라이브)" autocomplete="off" aria-label="게임 검색">
        <button class="clear" id="clear" type="button" aria-label="검색어 지우기" hidden>✕</button>
      </label>
      <div class="chips" id="chips" role="group" aria-label="장르"></div>
      <div class="row">
        <p class="count" id="count"></p>
        <div class="sort" id="sort" role="group" aria-label="정렬">
          <button type="button" data-s="popular">🔥 인기순</button>
          <button type="button" data-s="new">🆕 최신순</button>
          <button type="button" data-s="name">가나다순</button>
        </div>
      </div>
    </div>
    <div class="grid" id="list"></div>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const list = $('list'), qEl = $('q'), chipsEl = $('chips'), countEl = $('count'), clearEl = $('clear');
    let games = [], genre = '전체', sort = 'popular';
    // 클릭 수: counterapi.dev 에 게임별로 저장 (모두가 같이 보는 숫자)
    const COUNTER = 'https://api.counterapi.dev/v1/leewonyoungethan-appdevclub';
    const plays = new Map();      // id -> 클릭 수 (불러온 것만)
    let playsLoaded = false, playsFailed = false;
    const SORTS = ['popular', 'new', 'name'];
    const norm = s => (s || '').toLowerCase().replace(/\s+/g, '');

    function highlight(el, text, q) {
      el.textContent = '';
      if (!q) { el.append(text); return; }
      const lower = text.toLowerCase(), needle = q.toLowerCase();
      let i = 0, j;
      while ((j = lower.indexOf(needle, i)) !== -1) {
        el.append(text.slice(i, j));
        const m = document.createElement('mark'); m.textContent = text.slice(j, j + needle.length); el.append(m);
        i = j + needle.length;
      }
      el.append(text.slice(i));
    }
    function hookTitle(h, text, q) {
      const m = /^(\[[^\]]+\])\s*(.*)$/.exec(text);
      if (m) { const b = document.createElement('b'); b.textContent = m[1] + ' '; const r = document.createElement('span'); highlight(r, m[2], q); h.append(b, r); }
      else highlight(h, text, q);
    }
    function card(g, q) {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = g.url || ('games/' + encodeURIComponent(g.id) + '/');
      const img = document.createElement('img');
      img.className = 'icon';
      img.src = g.icon || 'icons/default.svg';
      img.alt = ''; img.loading = 'lazy';
      img.onerror = () => { img.onerror = null; img.src = 'icons/default.svg'; };
      const h = document.createElement('h2'); highlight(h, g.title, q);
      const hk = document.createElement('div'); hk.className = 'hook';
      if (g.hook) hookTitle(hk, g.hook, q);
      const au = document.createElement('div'); au.className = 'author'; au.textContent = g.author || '';
      const d = document.createElement('p'); d.className = 'desc'; highlight(d, g.description || '', q);
      const gs = document.createElement('div'); gs.className = 'genres';
      for (const x of g.genres || []) { const s = document.createElement('span'); s.textContent = '#' + x; gs.append(s); }
      const body = document.createElement('div'); body.className = 'body';
      body.append(h, au, hk, d, gs);
      if (plays.has(g.id)) {
        const pl = document.createElement('div'); pl.className = 'plays';
        const rank = topRank(g.id);
        if (rank) { const m = document.createElement('span'); m.className = 'medal'; m.textContent = `${['🥇', '🥈', '🥉'][rank - 1]} 인기 ${rank}위`; pl.append(m); }
        pl.append(`🔥 ${plays.get(g.id).toLocaleString('ko-KR')}회 플레이`);
        body.append(pl);
      }
      a.append(img, body);
      a.addEventListener('click', () => countPlay(g.id));
      return a;
    }
    function topRank(id) {
      if (!playsLoaded) return 0;
      const ranked = games.filter(g => (plays.get(g.id) || 0) > 0).sort((a, b) => plays.get(b.id) - plays.get(a.id));
      const i = ranked.findIndex(g => g.id === id);
      return i >= 0 && i < 3 ? i + 1 : 0;
    }
    function sorted(arr) {
      const idx = new Map(games.map((g, i) => [g.id, i]));
      const a = arr.slice();
      if (sort === 'name') a.sort((x, y) => x.title.replace(/^\P{L}+/u, '').localeCompare(y.title.replace(/^\P{L}+/u, ''), 'ko'));
      else if (sort === 'new') a.sort((x, y) => (y.added || '').localeCompare(x.added || '') || idx.get(y.id) - idx.get(x.id));
      else a.sort((x, y) => (plays.get(y.id) || 0) - (plays.get(x.id) || 0) || idx.get(x.id) - idx.get(y.id));
      return a;
    }
    function countPlay(id) {
      // 같은 브라우저 창에서는 게임마다 한 번만 센다 (연타 방지)
      try { if (sessionStorage.getItem('played:' + id)) return; sessionStorage.setItem('played:' + id, '1'); } catch (e) {}
      try { fetch(`${COUNTER}/${encodeURIComponent(id)}/up`, { keepalive: true }).catch(() => {}); } catch (e) {}
    }
    async function loadPlays() {
      const get = async id => {
        const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 5000);
        try {
          const r = await fetch(`${COUNTER}/${encodeURIComponent(id)}`, { signal: ctl.signal });
          if (r.status === 400 || r.status === 404) return 0;         // 아직 아무도 안 누른 게임
          if (!r.ok) throw new Error(r.status);
          const j = await r.json(); return Number(j.count) || 0;
        } finally { clearTimeout(t); }
      };
      const res = await Promise.allSettled(games.map(g => get(g.id)));
      if (res.every(r => r.status === 'rejected')) return;
      res.forEach((r, i) => { if (r.status === 'fulfilled') plays.set(games[i].id, r.value); });
      playsLoaded = true;
      render();
    }
    function renderSort() {
      for (const b of $('sort').children) { const on = b.dataset.s === sort; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); }
    }
    $('sort').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { sort = b.dataset.s; sync(); } });
    function renderChips() {
      const counts = new Map([['전체', games.length]]);
      for (const g of games) for (const x of g.genres || []) counts.set(x, (counts.get(x) || 0) + 1);
      const order = ['전체', ...[...counts.keys()].filter(k => k !== '전체').sort((a, b) => counts.get(b) - counts.get(a) || a.localeCompare(b, 'ko'))];
      chipsEl.textContent = '';
      for (const k of order) {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'chip' + (k === genre ? ' on' : '');
        b.setAttribute('aria-pressed', k === genre);
        b.append(k === '전체' ? '🎮 전체' : '#' + k);
        const sm = document.createElement('small'); sm.textContent = counts.get(k); b.append(sm);
        b.onclick = () => { genre = k; sync(); };
        chipsEl.append(b);
      }
    }
    function render() {
      const raw = qEl.value.trim(), q = norm(raw);
      clearEl.hidden = !raw;
      const shown = games.filter(g =>
        (genre === '전체' || (g.genres || []).includes(genre)) &&
        (!q || norm([g.title, g.hook, g.description, g.author, ...(g.genres || [])].join(' ')).includes(q)));
      list.textContent = '';
      if (!shown.length) {
        const e = document.createElement('p'); e.className = 'empty';
        e.innerHTML = '<b>😱</b>';
        e.append(raw ? `"${raw}" 검색 결과가 없어요. 다른 단어로 찾아보세요!` : '이 장르에는 아직 게임이 없어요.');
        list.append(e);
      } else for (const g of sorted(shown)) list.append(card(g, raw));
      countEl.textContent = '';
      const b = document.createElement('b'); b.textContent = shown.length;
      countEl.append(genre === '전체' ? '' : `#${genre} · `, b, `개 게임`, raw ? ` · "${raw}" 검색 중` : '');
      if (sort === 'popular' && !playsLoaded) countEl.append(playsFailed ? ' · 인기 집계를 못 불러와서 기본 순서로 보여요' : ' · 인기 집계 불러오는 중…');
      renderSort();
    }
    function sync() {
      const p = new URLSearchParams();
      if (genre !== '전체') p.set('genre', genre);
      if (qEl.value.trim()) p.set('q', qEl.value.trim());
      if (sort !== 'popular') p.set('sort', sort);
      history.replaceState(null, '', p.toString() ? '?' + p : location.pathname);
      renderChips(); render();
    }
    qEl.addEventListener('input', sync);
    clearEl.addEventListener('click', () => { qEl.value = ''; sync(); qEl.focus(); });
    addEventListener('keydown', e => {
      if (e.key === '/' && document.activeElement !== qEl) { e.preventDefault(); qEl.focus(); }
      if (e.key === 'Escape' && document.activeElement === qEl && qEl.value) { qEl.value = ''; sync(); }
    });

    fetch('games.json')
      .then(r => r.json())
      .then(data => {
        games = data;
        $('ticker').textContent = `🎮 지금 게임 ${games.length}개 공개 중 · ⚠️ 한 판만 하려다 밤샘 주의 ⚠️ · 친구한테 링크 보내면 우정 파괴 가능 · 지금 바로 플레이 GO GO`;
        const p = new URLSearchParams(location.search);
        qEl.value = p.get('q') || '';
        const want = p.get('genre');
        if (want && games.some(g => (g.genres || []).includes(want))) genre = want;
        if (SORTS.includes(p.get('sort'))) sort = p.get('sort');
        renderChips(); render();
        loadPlays().catch(() => {}).finally(() => { if (!playsLoaded) { playsFailed = true; render(); } });
      })
      .catch(() => { list.innerHTML = '<p class="empty">games.json 을 불러오지 못했어요. 로컬 서버로 열어 주세요.</p>'; });
  </script>
</body>
</html>
