<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>앱개발부 · 게임 라이브러리</title>
  <meta name="description" content="앱개발부가 직접 만든 게임을 모아 둔 곳. 설치 없이 브라우저에서 바로 플레이하세요.">
  <meta name="theme-color" content="#08090f">
  <link rel="icon" href="icons/default.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #08090f;
      --surface: rgba(255, 255, 255, .045);
      --surface-hi: rgba(255, 255, 255, .08);
      --line: rgba(255, 255, 255, .09);
      --line-hi: rgba(255, 255, 255, .18);
      --text: #f3f4f8;
      --muted: #9097ab;
      --faint: #5d6478;
      --a1: #8b5cff;
      --a2: #ff4fa3;
      --a3: #ffb547;
      --grad: linear-gradient(100deg, var(--a1), var(--a2) 55%, var(--a3));
      --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      --r: 22px;
      --gutter: max(16px, env(safe-area-inset-left, 0px));
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: var(--font);
      -webkit-font-smoothing: antialiased; letter-spacing: -.01em; overflow-x: hidden; }
    a { color: inherit; }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--a2); outline-offset: 3px; border-radius: 10px; }
    .wrap { max-width: 1120px; margin: 0 auto; padding-left: var(--gutter); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

    /* ---------- background ---------- */
    .bgfx { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
    .bgfx .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; }
    .bgfx .b1 { width: 620px; height: 620px; left: -160px; top: -220px; background: #5b2cff; animation: drift1 22s ease-in-out infinite alternate; }
    .bgfx .b2 { width: 520px; height: 520px; right: -140px; top: -120px; background: #ff2f8a; opacity: .38; animation: drift2 26s ease-in-out infinite alternate; }
    .bgfx .b3 { width: 480px; height: 480px; left: 40%; top: 340px; background: #ff9a2f; opacity: .16; animation: drift1 30s ease-in-out infinite alternate-reverse; }
    .bgfx .grid { position: absolute; inset: 0; opacity: .5;
      background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 56px 56px; mask-image: radial-gradient(ellipse 80% 55% at 50% 0%, #000 30%, transparent 75%); -webkit-mask-image: radial-gradient(ellipse 80% 55% at 50% 0%, #000 30%, transparent 75%); }
    @keyframes drift1 { to { transform: translate(120px, 80px) scale(1.1); } }
    @keyframes drift2 { to { transform: translate(-100px, 120px) scale(.95); } }

    /* ---------- nav ---------- */
    nav { position: relative; z-index: 2; padding-top: calc(env(safe-area-inset-top, 0px) + 18px); }
    nav .wrap { display: flex; align-items: center; gap: 12px; }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 800; font-size: 19px; letter-spacing: -.03em; }
    .logo .mark { width: 36px; height: 36px; border-radius: 11px; background: var(--grad); display: grid; place-items: center;
      box-shadow: 0 6px 20px rgba(255, 79, 163, .35), inset 0 1px 0 rgba(255,255,255,.4); }
    .logo .mark svg { width: 22px; height: 22px; }
    .logo small { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .14em; margin-left: 2px; }
    nav .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .pill { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 999px;
      background: var(--surface); border: 1px solid var(--line); font-size: 13px; font-weight: 600; color: var(--muted); text-decoration: none; white-space: nowrap; }
    a.pill:hover { color: var(--text); border-color: var(--line-hi); }
    .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: #3ddc97; box-shadow: 0 0 0 4px rgba(61,220,151,.18); }

    /* ---------- hero ---------- */
    .hero { padding: 64px 0 56px; }
    .hero .wrap { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 32px; align-items: center; }
    .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: .16em; color: #d9c8ff;
      padding: 6px 12px; border-radius: 999px; background: rgba(139, 92, 255, .14); border: 1px solid rgba(139, 92, 255, .35); }
    h1 { margin: 20px 0 18px; font-size: clamp(40px, 7.2vw, 78px); line-height: 1.04; font-weight: 850; letter-spacing: -.045em; word-break: keep-all; }
    h1 .g { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .lead { margin: 0; max-width: 30em; font-size: clamp(15px, 1.9vw, 18px); line-height: 1.65; color: var(--muted); word-break: keep-all; }
    .cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 50px; padding: 0 22px; border-radius: 14px;
      font-weight: 700; font-size: 15px; text-decoration: none; border: 0; cursor: pointer; white-space: nowrap; transition: transform .15s ease, box-shadow .2s ease, background .2s; }
    .btn.primary { background: var(--grad); color: #fff; box-shadow: 0 10px 30px rgba(255, 79, 163, .35), inset 0 1px 0 rgba(255,255,255,.35); }
    .btn.primary:hover { transform: translateY(-2px); box-shadow: 0 14px 38px rgba(255, 79, 163, .5), inset 0 1px 0 rgba(255,255,255,.35); }
    .btn.ghost { background: var(--surface); border: 1px solid var(--line); color: var(--text); }
    .btn.ghost:hover { background: var(--surface-hi); }
    .btn .ic { width: 18px; height: 18px; flex: none; }
    .stats { display: flex; gap: 28px; margin-top: 36px; }
    .stats div { display: grid; gap: 2px; }
    .stats b { font-size: 26px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
    .stats span { font-size: 12px; color: var(--faint); font-weight: 600; }

    .showcase { position: relative; height: 380px; }
    .showcase .halo { position: absolute; left: 50%; top: 50%; width: 320px; height: 320px; transform: translate(-50%, -50%); border-radius: 50%;
      background: radial-gradient(circle, rgba(255,79,163,.45), rgba(139,92,255,.2) 45%, transparent 70%); filter: blur(20px); }
    .showcase a { position: absolute; display: block; border-radius: 26%; transition: filter .3s; box-shadow: 0 24px 50px rgba(0,0,0,.55); }
    .showcase img { display: block; width: 100%; height: 100%; border-radius: 26%; }
    .showcase a:hover { filter: brightness(1.1); z-index: 3; }
    .showcase .s0 { width: 190px; height: 190px; left: calc(50% - 95px); top: calc(50% - 95px); rotate: -4deg; z-index: 2; animation: float 6s ease-in-out infinite; }
    .showcase .s1 { width: 130px; height: 130px; left: 4%; top: 12%; rotate: -12deg; animation: float 7s ease-in-out -2s infinite; }
    .showcase .s2 { width: 120px; height: 120px; right: 4%; top: 4%; rotate: 10deg; animation: float 8s ease-in-out -4s infinite; }
    .showcase .s3 { width: 110px; height: 110px; left: 10%; bottom: 4%; rotate: 8deg; animation: float 7.5s ease-in-out -1s infinite; }
    .showcase .s4 { width: 124px; height: 124px; right: 8%; bottom: 0; rotate: -9deg; animation: float 6.5s ease-in-out -3s infinite; }
    .showcase .tag { position: absolute; left: 50%; bottom: -14px; transform: translateX(-50%) rotate(4deg); white-space: nowrap; font-size: 12px; font-weight: 800;
      padding: 5px 10px; border-radius: 999px; background: #fff; color: #14101f; box-shadow: 0 6px 16px rgba(0,0,0,.4); }
    @keyframes float { 50% { translate: 0 -10px; } }

    /* ---------- toolbar ---------- */
    .tools { position: sticky; top: 0; z-index: 10; padding: 12px 0; }
    .tools::before { content: ""; position: absolute; inset: 0; background: rgba(8, 9, 15, .72); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
      border-bottom: 1px solid transparent; transition: border-color .2s; }
    .tools.stuck::before { border-bottom-color: var(--line); }
    .tools .wrap { position: relative; display: grid; gap: 12px; }
    .bar { display: flex; gap: 10px; align-items: center; }
    .search { position: relative; flex: 1; min-width: 0; }
    .search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--faint); pointer-events: none; }
    .search input { width: 100%; height: 48px; padding: 0 44px 0 46px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
      color: var(--text); font: inherit; font-size: 16px; outline: none; transition: border-color .2s, background .2s, box-shadow .2s; }
    .search input::placeholder { color: var(--faint); }
    .search input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
    .search input:focus { border-color: rgba(255,79,163,.6); background: var(--surface-hi); box-shadow: 0 0 0 4px rgba(255,79,163,.14); }
    .search .kbd { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 12px; font-weight: 700; color: var(--faint);
      border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; }
    .search .clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border-radius: 50%; border: 0;
      background: var(--surface-hi); cursor: pointer; color: var(--muted); font-size: 13px; }
    .sort { display: flex; height: 48px; padding: 4px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); flex: none; }
    .sort button { border: 0; background: none; padding: 0 14px; border-radius: 10px; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; white-space: nowrap; }
    .sort button:hover { color: var(--text); }
    .sort button.on { background: var(--text); color: #0b0c12; }
    .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -2px; padding: 0 2px; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent;
      font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; white-space: nowrap; transition: color .15s, border-color .15s; }
    .chip small { font-weight: 600; color: var(--faint); margin-left: 4px; font-size: 12px; }
    .chip:hover { color: var(--text); border-color: var(--line-hi); }
    .chip.on { color: #fff; border-color: transparent; background: var(--grad); box-shadow: 0 6px 16px rgba(255,79,163,.28); }
    .chip.on small { color: rgba(255,255,255,.8); }

    /* ---------- list ---------- */
    .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 22px 0 16px; }
    .head h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.03em; }
    .count { margin: 0; font-size: 13px; color: var(--faint); font-weight: 600; text-align: right; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; padding-bottom: 48px; }

    a.card { position: relative; display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 16px; padding: 16px; border-radius: var(--r);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.025)); border: 1px solid var(--line);
      text-decoration: none; isolation: isolate; transition: transform .25s cubic-bezier(.2,.9,.3,1.1), background .25s; }
    a.card::before { content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1px; background: var(--grad); opacity: 0; transition: opacity .25s;
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
    a.card::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; opacity: 0; transition: opacity .3s;
      background: radial-gradient(400px circle at var(--mx, 50%) var(--my, 0%), rgba(255,79,163,.14), transparent 45%); }
    a.card:hover { transform: translateY(-3px); background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.035)); }
    a.card:hover::before, a.card:hover::after { opacity: 1; }
    .card .icon { width: 96px; height: 96px; border-radius: 24px; display: block; box-shadow: 0 12px 26px rgba(0,0,0,.5);
      transition: transform .35s cubic-bezier(.2,.9,.3,1.3); }
    a.card:hover .icon { transform: rotate(-5deg) scale(1.05); }
    .card .body { min-width: 0; display: flex; flex-direction: column; }
    .card .top { display: flex; align-items: center; gap: 8px; transition: padding .25s; }
    .card h3 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.03em; line-height: 1.25; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card .rank { flex: none; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; color: #1a1205; background: linear-gradient(180deg, #ffe08a, #ffb020); }
    .card .rank.r2 { background: linear-gradient(180deg, #f2f4fa, #b8bfd0); }
    .card .rank.r3 { background: linear-gradient(180deg, #ffc9a0, #d7834a); }
    .card .hook { margin: 4px 0 0; font-size: 13px; line-height: 1.45; color: #c9cddb; font-weight: 600;
      display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .card .hook b { font-weight: 800; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .card .desc { margin: 6px 0 0; font-size: 13px; line-height: 1.5; color: var(--muted);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: auto; padding-top: 12px; }
    .card .meta span { font-size: 11.5px; font-weight: 700; color: var(--muted); padding: 3px 8px; border-radius: 7px; background: var(--surface-hi); }
    .card .meta .plays { color: #ffb4d6; background: rgba(255,79,163,.12); }
    .card .play { position: absolute; right: 14px; top: 14px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
      background: var(--surface-hi); color: #fff; opacity: 0; transform: scale(.8); transition: opacity .25s, transform .25s; }
    .card .play svg { width: 14px; height: 14px; margin-left: 2px; }
    a.card:hover .play { opacity: 1; transform: scale(1); background: var(--grad); }
    a.card:hover .top { padding-right: 40px; }
    mark { background: rgba(255, 181, 71, .3); color: #fff; border-radius: 4px; padding: 0 2px; }
    .empty { grid-column: 1 / -1; text-align: center; padding: 64px 16px; color: var(--muted); border: 1px dashed var(--line-hi); border-radius: var(--r); }
    .empty b { display: block; font-size: 18px; color: var(--text); margin-bottom: 6px; }

    footer { border-top: 1px solid var(--line); padding: 28px 0 calc(env(safe-area-inset-bottom, 0px) + 32px); color: var(--faint); font-size: 13px; }
    footer .wrap { display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: space-between; }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--text); }

    @media (max-width: 820px) {
      .hero { padding: 28px 0 32px; }
      .hero .wrap { grid-template-columns: 1fr; gap: 12px; }
      .showcase { height: 250px; order: -1; margin: 0 auto; width: 100%; max-width: 380px; }
      .showcase .halo { width: 220px; height: 220px; }
      .showcase .s0 { width: 130px; height: 130px; left: calc(50% - 65px); top: calc(50% - 65px); }
      .showcase .s1, .showcase .s2, .showcase .s3, .showcase .s4 { width: 82px; height: 82px; }
      .stats { gap: 22px; }
    }
    @media (max-width: 560px) {
      .pill.hide-sm { display: none; }
      .bar { flex-wrap: wrap; }
      .sort { width: 100%; height: 42px; }
      .sort button { flex: 1; padding: 0 6px; }
      .search .kbd { display: none; }
      .grid { grid-template-columns: 1fr; }
      a.card { grid-template-columns: 80px minmax(0, 1fr); gap: 14px; padding: 14px; }
      .card .icon { width: 80px; height: 80px; border-radius: 20px; }
      .cta .btn { flex: 1; padding: 0 14px; }
      .stats b { font-size: 22px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="bgfx" aria-hidden="true"><div class="grid"></div><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

  <nav>
    <div class="wrap">
      <a class="logo" href="./">
        <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9h4M8 7v4"/><circle cx="15.5" cy="9.5" r="1" fill="#fff"/><circle cx="17.5" cy="12" r="1" fill="#fff"/><path d="M7 5h10a4 4 0 0 1 4 4l.6 6.2A3 3 0 0 1 16.4 17L15 15H9l-1.4 2a3 3 0 0 1-5.2-1.8L3 9a4 4 0 0 1 4-4z"/></svg></span>
        앱개발부 <small>GAMES</small>
      </a>
      <div class="right">
        <span class="pill"><span class="dot"></span><span id="liveCount">불러오는 중</span></span>
        <a class="pill hide-sm" href="https://github.com/leewonyoungethan/Game" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </nav>

  <header class="hero">
    <div class="wrap">
      <div>
        <span class="eyebrow">APP DEV CLUB · GAME LAB</span>
        <h1>우리가 만든 게임,<br><span class="g">지금 바로 플레이.</span></h1>
        <p class="lead">앱개발부가 직접 기획하고, 그리고, 코딩한 게임들이에요. 설치 없이 브라우저에서 바로 열리고 폰에서도 돼요.</p>
        <div class="cta">
          <a class="btn primary" id="ctaTop" href="#games">
            <svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5z"/></svg>
            <span id="ctaLabel">게임 둘러보기</span>
          </a>
          <a class="btn ghost" href="#games">전체 게임 보기</a>
        </div>
        <div class="stats">
          <div><b id="stGames">–</b><span>공개된 게임</span></div>
          <div><b id="stGenres">–</b><span>장르</span></div>
          <div><b id="stPlays">–</b><span>누적 플레이</span></div>
        </div>
      </div>
      <div class="showcase" id="showcase" aria-label="추천 게임"><div class="halo"></div></div>
    </div>
  </header>

  <div class="tools" id="tools">
    <div class="wrap">
      <div class="bar">
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="게임 이름, 장르로 검색" autocomplete="off" aria-label="게임 검색">
          <span class="kbd" id="kbd">/</span>
          <button class="clear" id="clear" type="button" aria-label="검색어 지우기" hidden>✕</button>
        </label>
        <div class="sort" id="sort" role="group" aria-label="정렬">
          <button type="button" data-s="popular">인기순</button>
          <button type="button" data-s="new">최신순</button>
          <button type="button" data-s="name">가나다순</button>
        </div>
      </div>
      <div class="chips" id="chips" role="group" aria-label="장르"></div>
    </div>
  </div>

  <main class="wrap" id="games">
    <div class="head"><h2 id="listTitle">모든 게임</h2><p class="count" id="count"></p></div>
    <div class="grid" id="list"></div>
  </main>

  <footer>
    <div class="wrap">
      <span>© 앱개발부 · 직접 만든 게임 모음</span>
      <span><a href="https://github.com/leewonyoungethan/Game" target="_blank" rel="noopener">GitHub 저장소</a></span>
    </div>
  </footer>

  <script>
    const $ = id => document.getElementById(id);
    const list = $('list'), qEl = $('q'), chipsEl = $('chips'), countEl = $('count'), clearEl = $('clear');
    let games = [], genre = '전체', sort = 'popular';
    // 클릭 수: counterapi.dev 에 게임별로 저장 (모두가 같이 보는 숫자)
    const COUNTER = 'https://api.counterapi.dev/v1/leewonyoungethan-appdevclub';
    const plays = new Map();
    let playsLoaded = false, playsFailed = false;
    const SORTS = ['popular', 'new', 'name'];
    const norm = s => (s || '').toLowerCase().replace(/\s+/g, '');
    const plain = t => t.replace(/^\P{L}+/u, '').trim();      // 제목 앞 이모지 제거
    const href = g => g.url || ('games/' + encodeURIComponent(g.id) + '/');
    const fmt = n => n.toLocaleString('ko-KR');
    const PLAY_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5z"/></svg>';

    function highlight(el, text, q) {
      el.textContent = '';
      if (!q) { el.append(text); return; }
      const lower = text.toLowerCase(), needle = q.toLowerCase();
      let i = 0, j;
      while ((j = lower.indexOf(needle, i)) !== -1) {
        el.append(text.slice(i, j));
        const m = document.createElement('mark'); m.textContent = text.slice(j, j + needle.length); el.append(m);
        i = j + needle.length;
      }
      el.append(text.slice(i));
    }
    function hookTitle(h, text, q) {
      const m = /^\[([^\]]+)\]\s*(.*)$/.exec(text);
      if (m) { const b = document.createElement('b'); b.textContent = m[1] + ' · '; const r = document.createElement('span'); highlight(r, m[2], q); h.append(b, r); }
      else highlight(h, text, q);
    }
    function ranked() {
      return games.filter(g => (plays.get(g.id) || 0) > 0).sort((a, b) => plays.get(b.id) - plays.get(a.id));
    }
    function topRank(id) {
      if (!playsLoaded) return 0;
      const i = ranked().findIndex(g => g.id === id);
      return i >= 0 && i < 3 ? i + 1 : 0;
    }
    function card(g, q) {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = href(g);
      const img = document.createElement('img');
      img.className = 'icon';
      img.src = g.icon || 'icons/default.svg';
      img.alt = ''; img.loading = 'lazy';
      img.onerror = () => { img.onerror = null; img.src = 'icons/default.svg'; };
      const body = document.createElement('div'); body.className = 'body';
      const top = document.createElement('div'); top.className = 'top';
      const h = document.createElement('h3'); highlight(h, plain(g.title), q);
      top.append(h);
      const rank = topRank(g.id);
      if (rank) { const r = document.createElement('span'); r.className = 'rank r' + rank; r.textContent = `인기 ${rank}위`; top.append(r); }
      body.append(top);
      if (g.hook) { const hk = document.createElement('p'); hk.className = 'hook'; hookTitle(hk, g.hook, q); body.append(hk); }
      const d = document.createElement('p'); d.className = 'desc'; highlight(d, g.description || '', q);
      const meta = document.createElement('div'); meta.className = 'meta';
      for (const x of g.genres || []) { const s = document.createElement('span'); highlight(s, x, q); meta.append(s); }
      if (plays.has(g.id)) { const s = document.createElement('span'); s.className = 'plays'; s.textContent = `▶ ${fmt(plays.get(g.id))}회`; meta.append(s); }
      body.append(d, meta);
      const play = document.createElement('span'); play.className = 'play'; play.innerHTML = PLAY_SVG;
      a.append(img, body, play);
      a.addEventListener('pointermove', e => { const r = a.getBoundingClientRect(); a.style.setProperty('--mx', (e.clientX - r.left) + 'px'); a.style.setProperty('--my', (e.clientY - r.top) + 'px'); });
      a.addEventListener('click', () => countPlay(g.id));
      return a;
    }
    function sorted(arr) {
      const idx = new Map(games.map((g, i) => [g.id, i]));
      const a = arr.slice();
      if (sort === 'name') a.sort((x, y) => plain(x.title).localeCompare(plain(y.title), 'ko'));
      else if (sort === 'new') a.sort((x, y) => (y.added || '').localeCompare(x.added || '') || idx.get(y.id) - idx.get(x.id));
      else a.sort((x, y) => (plays.get(y.id) || 0) - (plays.get(x.id) || 0) || idx.get(x.id) - idx.get(y.id));
      return a;
    }
    function countPlay(id) {
      // 같은 브라우저 창에서는 게임마다 한 번만 센다 (연타 방지)
      try { if (sessionStorage.getItem('played:' + id)) return; sessionStorage.setItem('played:' + id, '1'); } catch (e) {}
      try { fetch(`${COUNTER}/${encodeURIComponent(id)}/up`, { keepalive: true }).catch(() => {}); } catch (e) {}
    }
    async function loadPlays() {
      const get = async id => {
        const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 5000);
        try {
          const r = await fetch(`${COUNTER}/${encodeURIComponent(id)}`, { signal: ctl.signal });
          if (r.status === 400 || r.status === 404) return 0;         // 아직 아무도 안 누른 게임
          if (!r.ok) throw new Error(r.status);
          const j = await r.json(); return Number(j.count) || 0;
        } finally { clearTimeout(t); }
      };
      const res = await Promise.allSettled(games.map(g => get(g.id)));
      if (res.every(r => r.status === 'rejected')) return;
      res.forEach((r, i) => { if (r.status === 'fulfilled') plays.set(games[i].id, r.value); });
      playsLoaded = true;
      renderHero(); render();
    }

    function renderHero() {
      const genres = new Set(games.flatMap(g => g.genres || []));
      $('stGames').textContent = games.length;
      $('stGenres').textContent = genres.size;
      $('stPlays').textContent = playsLoaded ? fmt([...plays.values()].reduce((a, b) => a + b, 0)) : '–';
      $('liveCount').textContent = `${games.length}개 게임 플레이 가능`;
      const top = playsLoaded ? ranked()[0] : null;
      const newest = [...games].sort((x, y) => (y.added || '').localeCompare(x.added || ''))[0];
      const pick = top || newest;
      const cta = $('ctaTop');
      cta.href = href(pick);
      $('ctaLabel').textContent = `${plain(pick.title)} 플레이`;
      cta.onclick = () => countPlay(pick.id);
      const order = [pick, ...sorted(games).filter(g => g !== pick)].slice(0, 5);
      const sc = $('showcase');
      sc.querySelectorAll('a').forEach(n => n.remove());
      order.forEach((g, i) => {
        const a = document.createElement('a');
        a.className = 's' + i; a.href = href(g); a.title = plain(g.title);
        a.setAttribute('aria-label', plain(g.title) + ' 플레이');
        const img = document.createElement('img'); img.src = g.icon || 'icons/default.svg'; img.alt = '';
        a.append(img);
        if (i === 0) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = top ? '🔥 지금 인기 1위' : '✨ 새로 나온 게임'; a.append(t); }
        a.addEventListener('click', () => countPlay(g.id));
        sc.append(a);
      });
    }
    function renderSort() {
      for (const b of $('sort').children) { const on = b.dataset.s === sort; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); }
    }
    $('sort').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { sort = b.dataset.s; sync(); } });
    function renderChips() {
      const counts = new Map([['전체', games.length]]);
      for (const g of games) for (const x of g.genres || []) counts.set(x, (counts.get(x) || 0) + 1);
      const order = ['전체', ...[...counts.keys()].filter(k => k !== '전체').sort((a, b) => counts.get(b) - counts.get(a) || a.localeCompare(b, 'ko'))];
      chipsEl.textContent = '';
      for (const k of order) {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'chip' + (k === genre ? ' on' : '');
        b.setAttribute('aria-pressed', k === genre);
        b.append(k);
        const sm = document.createElement('small'); sm.textContent = counts.get(k); b.append(sm);
        b.onclick = () => { genre = k; sync(); };
        chipsEl.append(b);
      }
    }
    function render() {
      const raw = qEl.value.trim(), q = norm(raw);
      clearEl.hidden = !raw; $('kbd').hidden = !!raw;
      const shown = games.filter(g =>
        (genre === '전체' || (g.genres || []).includes(genre)) &&
        (!q || norm([g.title, g.hook, g.description, g.author, ...(g.genres || [])].join(' ')).includes(q)));
      list.textContent = '';
      if (!shown.length) {
        const e = document.createElement('div'); e.className = 'empty';
        const b = document.createElement('b'); b.textContent = raw ? `"${raw}"에 맞는 게임이 없어요` : '이 장르에는 아직 게임이 없어요';
        e.append(b, '다른 단어로 찾거나 장르를 바꿔 보세요.');
        list.append(e);
      } else for (const g of sorted(shown)) list.append(card(g, raw));
      $('listTitle').textContent = raw ? '검색 결과' : genre === '전체' ? '모든 게임' : genre;
      countEl.textContent = `${shown.length}개` +
        (sort === 'popular' && !playsLoaded ? (playsFailed ? ' · 인기 집계를 불러오지 못해 기본 순서' : ' · 인기 집계 불러오는 중') : '');
      renderSort();
    }
    function sync() {
      const p = new URLSearchParams();
      if (genre !== '전체') p.set('genre', genre);
      if (qEl.value.trim()) p.set('q', qEl.value.trim());
      if (sort !== 'popular') p.set('sort', sort);
      history.replaceState(null, '', (p.toString() ? '?' + p : location.pathname) + location.hash);
      renderChips(); render();
    }
    qEl.addEventListener('input', sync);
    clearEl.addEventListener('click', () => { qEl.value = ''; sync(); qEl.focus(); });
    addEventListener('keydown', e => {
      if (e.key === '/' && document.activeElement !== qEl) { e.preventDefault(); qEl.focus(); }
      if (e.key === 'Escape' && document.activeElement === qEl && qEl.value) { qEl.value = ''; sync(); }
    });
    new IntersectionObserver(([e]) => $('tools').classList.toggle('stuck', e.intersectionRatio < 1), { threshold: [1], rootMargin: '-1px 0px 0px 0px' }).observe($('tools'));

    fetch('games.json')
      .then(r => r.json())
      .then(data => {
        games = data;
        const p = new URLSearchParams(location.search);
        qEl.value = p.get('q') || '';
        const want = p.get('genre');
        if (want && games.some(g => (g.genres || []).includes(want))) genre = want;
        if (SORTS.includes(p.get('sort'))) sort = p.get('sort');
        renderHero(); renderChips(); render();
        loadPlays().catch(() => {}).finally(() => { if (!playsLoaded) { playsFailed = true; render(); } });
      })
      .catch(() => { list.innerHTML = '<div class="empty"><b>게임 목록을 불러오지 못했어요</b>로컬에서는 서버로 열어 주세요 (python3 -m http.server).</div>'; });
  </script>
</body>
</html>
