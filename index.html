<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>앱개발부</title>
  <style>
    :root { --bg: #f6f7fb; --card: #fff; --text: #1d2030; --muted: #667; --accent: #3b6cf6; }
    @media (prefers-color-scheme: dark) { :root { --bg: #14161f; --card: #1f2230; --text: #e8eaf2; --muted: #99a; --accent: #7a9cff; } }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
    main { max-width: 900px; margin: 0 auto; padding: 32px 16px; }
    h1 { margin: 0 0 4px; }
    p.sub { margin: 0 0 24px; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    a.card { display: block; background: var(--card); border-radius: 12px; overflow: hidden; color: inherit; text-decoration: none; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    a.card:hover { outline: 2px solid var(--accent); }
    .card img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #2a2d3a; }
    .card .body { padding: 14px 16px 16px; }
    .card p { margin: 8px 0 0; font-size: 14px; }
    .card h2 { margin: 0 0 6px; font-size: 18px; }
    .card .author { color: var(--muted); font-size: 13px; }
    .empty { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>앱개발부</h1>
    <p class="sub">앱개발부에서 만든 게임 모음</p>
    <div class="grid" id="list"></div>
  </main>
  <script>
    const list = document.getElementById('list');
    fetch('games.json')
      .then(r => r.json())
      .then(games => {
        if (!games.length) { list.innerHTML = '<p class="empty">아직 등록된 게임이 없어요.</p>'; return; }
        for (const g of games) {
          const a = document.createElement('a');
          a.className = 'card';
          a.href = g.url || ('games/' + encodeURIComponent(g.id) + '/');
          const h = document.createElement('h2'); h.textContent = g.title;
          const au = document.createElement('div'); au.className = 'author'; au.textContent = g.author || '';
          const d = document.createElement('p'); d.textContent = g.description || '';
          const img = document.createElement('img');
          img.src = g.thumbnail || 'thumbnails/default.svg';
          img.alt = '';
          img.loading = 'lazy';
          img.onerror = () => { img.onerror = null; img.src = 'thumbnails/default.svg'; };
          const body = document.createElement('div'); body.className = 'body';
          body.append(h, au, d);
          a.append(img, body);
          list.append(a);
        }
      })
      .catch(() => { list.innerHTML = '<p class="empty">games.json 을 불러오지 못했어요. 로컬 서버로 열어 주세요.</p>'; });
  </script>
</body>
</html>
