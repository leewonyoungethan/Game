<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>앱개발부 게임</title>
  <meta name="description" content="앱개발부가 직접 만든 게임을 모아 둔 곳. 설치 없이 브라우저에서 바로 플레이하세요.">
  <meta name="theme-color" content="#8fd0ff">
  <link rel="icon" href="icons/default.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root {
      --bg1: #8fd0ff; --bg2: #c9e9ff;
      --ink: #12204a; --muted: #5a6a92;
      --tile-r: 16px; --gap: 14px; --cell: 94px;
      --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg1); }
    body { margin: 0; min-height: 100vh; font-family: var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; letter-spacing: -.01em;
      background: linear-gradient(180deg, var(--bg1), var(--bg2) 60%, #e3f3ff); background-attachment: fixed; overflow-x: hidden; }
    body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .5;
      background-image: radial-gradient(rgba(255,255,255,.55) 1.6px, transparent 1.7px); background-size: 26px 26px; }
    a { color: inherit; }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 3px solid #ff4f9a; outline-offset: 3px; }

    main { padding: calc(env(safe-area-inset-top, 0px) + 16px) max(10px, env(safe-area-inset-right, 0px)) 24px max(10px, env(safe-area-inset-left, 0px)); }
    .grid { display: grid; grid-template-columns: repeat(var(--cols, 8), var(--cell)); grid-auto-rows: var(--cell); grid-auto-flow: dense; gap: var(--gap); justify-content: center; }

    /* ---------- game tile ---------- */
    .t { position: relative; display: block; border-radius: var(--tile-r); overflow: hidden; background: #fff; text-decoration: none; isolation: isolate;
      box-shadow: 0 6px 14px rgba(18, 32, 74, .18); transition: transform .22s cubic-bezier(.2,.9,.3,1.3), box-shadow .22s; animation: pop .45s cubic-bezier(.2,.9,.3,1.3) both; animation-delay: var(--d, 0s); }
    .t img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .35s ease; }
    .t .name { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 8px 7px; color: #fff; font-size: 13px; font-weight: 800; line-height: 1.2; text-align: center;
      background: linear-gradient(180deg, transparent, rgba(8,12,36,.85)); transform: translateY(100%); transition: transform .22s ease; word-break: keep-all;
      overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .t.big .name { font-size: 17px; padding-bottom: 10px; }
    .t.huge .name { font-size: 21px; padding-bottom: 14px; }
    @media (hover: hover) {
      .t:hover { transform: scale(1.06); box-shadow: 0 14px 28px rgba(18, 32, 74, .32); z-index: 2; }
      .t:hover img { transform: scale(1.04); }
      .t:hover .name, .t:focus-visible .name { transform: none; }
    }
    .t:active { transform: scale(.97); }
    .t.big { grid-column: span 2; grid-row: span 2; }
    .t.huge { grid-column: span 3; grid-row: span 3; }
    .badge { position: absolute; z-index: 2; top: 7px; left: 7px; font-size: 10.5px; font-weight: 900; letter-spacing: .02em; padding: 3px 7px; border-radius: 7px; color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
    .badge.new { background: linear-gradient(180deg, #ff5fa8, #ff2f7a); }
    .badge.hot { background: linear-gradient(180deg, #ffb53a, #ff7a1a); }
    .t.big .badge, .t.huge .badge { font-size: 12.5px; top: 10px; left: 10px; padding: 4px 9px; }
    @keyframes pop { from { opacity: 0; transform: scale(.7); } }

    /* ---------- logo tile ---------- */
    .logo { grid-column: span 2; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 10px 12px; border-radius: var(--tile-r); background: #fff;
      box-shadow: 0 6px 14px rgba(18, 32, 74, .18); }
    .logo .brand { display: flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 900; font-size: 17px; letter-spacing: -.04em; line-height: 1; white-space: nowrap; }
    .logo .mark { width: 30px; height: 30px; flex: none; border-radius: 9px; display: grid; place-items: center; background: linear-gradient(135deg, #7a5cff, #ff4f9a 60%, #ffb547); box-shadow: 0 4px 10px rgba(255,79,154,.35); }
    .logo .mark svg { width: 19px; height: 19px; }
    .logo .brand b { background: linear-gradient(100deg, #6a4cff, #ff3f8f); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .logo .btns { display: flex; gap: 6px; }
    .logo .btns button, .logo .btns a { flex: 1; height: 30px; border-radius: 10px; border: 0; background: #eef4ff; color: var(--ink); display: grid; place-items: center; cursor: pointer; text-decoration: none; transition: background .15s; }
    .logo .btns button:hover, .logo .btns a:hover { background: #dce8ff; }
    .logo .btns svg { width: 17px; height: 17px; }
    .logo .btns .on { background: var(--ink); color: #fff; }

    /* ---------- genre tiles ---------- */
    .g { grid-column: span 2; position: relative; overflow: hidden; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 0; border-radius: var(--tile-r); cursor: pointer; text-align: left;
      background: #fff; color: var(--ink); font-weight: 900; font-size: 15px; letter-spacing: -.03em; box-shadow: 0 6px 14px rgba(18, 32, 74, .14); transition: transform .2s cubic-bezier(.2,.9,.3,1.3); animation: pop .45s both; animation-delay: var(--d, 0s); }
    .g .e { font-size: 26px; flex: none; }
    .g small { display: block; font-size: 11.5px; font-weight: 700; color: var(--muted); letter-spacing: 0; }
    .g .thumbs { position: absolute; right: -14px; bottom: -14px; display: flex; gap: 4px; transform: rotate(-12deg); opacity: .9; }
    .g .thumbs img { width: 38px; height: 38px; border-radius: 9px; box-shadow: 0 3px 8px rgba(0,0,0,.2); }
    .g.on { background: var(--ink); color: #fff; }
    .g.on small { color: #b8c4ea; }
    @media (hover: hover) { .g:hover { transform: scale(1.05); } }

    /* ---------- search ---------- */
    .search { grid-column: 1 / -1; display: none; }
    .search.open { display: block; }
    .search label { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border-radius: var(--tile-r); background: #fff; box-shadow: 0 6px 14px rgba(18, 32, 74, .18); }
    .search svg { width: 20px; height: 20px; color: var(--muted); flex: none; }
    .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: 700 17px var(--font); color: var(--ink); }
    .search input::placeholder { color: #9aa6c8; font-weight: 600; }
    .search .x { width: 32px; height: 32px; border-radius: 50%; border: 0; background: #eef4ff; cursor: pointer; flex: none; }
    .empty { grid-column: 1 / -1; grid-row: span 2; display: grid; place-items: center; text-align: center; border-radius: var(--tile-r); background: rgba(255,255,255,.7); font-weight: 800; color: var(--muted); padding: 16px; }

    footer { text-align: center; color: var(--muted); font-size: 12.5px; font-weight: 600; padding: 8px 16px calc(env(safe-area-inset-bottom, 0px) + 22px); }
    footer a { color: var(--ink); text-decoration: none; font-weight: 800; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <div class="grid" id="grid" aria-live="polite">
      <div class="logo" id="logo">
        <a class="brand" href="./" aria-label="앱개발부 게임 홈">
          <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9h4M8 7v4"/><circle cx="15.5" cy="9.5" r="1" fill="#fff"/><circle cx="17.5" cy="12" r="1" fill="#fff"/><path d="M7 5h10a4 4 0 0 1 4 4l.6 6.2A3 3 0 0 1 16.4 17L15 15H9l-1.4 2a3 3 0 0 1-5.2-1.8L3 9a4 4 0 0 1 4-4z"/></svg></span>
          <span>앱개발부 <b>게임</b></span>
        </a>
        <div class="btns">
          <button type="button" id="homeBtn" aria-label="전체 게임" title="전체 게임"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v9h14v-9"/></svg></button>
          <button type="button" id="searchBtn" aria-label="검색" title="검색 ( / )"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
          <button type="button" id="randBtn" aria-label="아무 게임이나" title="아무 게임이나!"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="9" cy="9" r="1.2" fill="currentColor"/><circle cx="15" cy="15" r="1.2" fill="currentColor"/><circle cx="15" cy="9" r="1.2" fill="currentColor"/><circle cx="9" cy="15" r="1.2" fill="currentColor"/></svg></button>
        </div>
      </div>
      <div class="search" id="search">
        <label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="어떤 게임을 찾아요?" autocomplete="off" aria-label="게임 검색">
          <button type="button" class="x" id="qx" aria-label="검색 닫기">✕</button></label>
      </div>
    </div>
  </main>
  <footer>앱개발부가 직접 만든 게임 <span id="n"></span> · <a href="https://github.com/leewonyoungethan/Game" target="_blank" rel="noopener">GitHub</a></footer>

  <script>
    const $ = id => document.getElementById(id);
    const grid = $('grid'), qEl = $('q');
    const COUNTER = 'https://api.counterapi.dev/v1/leewonyoungethan-appdevclub';
    const GENRE_ICON = { '퍼즐': '🧩', '액션': '⚔️', '아케이드': '🕹️', '캐주얼': '🎈', 'RPG': '🛡️', '힐링': '🌿', '육성': '🌱', '시뮬레이션': '🏡', '두뇌': '🧠', '전략': '♟️', '3D': '🧊', '드라이브': '🚗', '반응속도': '⚡', '리듬': '🎵', '슈팅': '🚀', '로그라이크': '🗝️', '방치형': '⏳' };
    let games = [], plays = new Map(), playsLoaded = false, genre = null;
    const plain = t => t.replace(/^\P{L}+/u, '').trim();
    const href = g => g.url || ('games/' + encodeURIComponent(g.id) + '/');
    const norm = s => (s || '').toLowerCase().replace(/\s+/g, '');
    const DAY = 864e5;

    // cell size: fixed on wide screens, fluid columns on phones
    function fit() {
      const W = grid.parentElement.clientWidth, gap = W < 500 ? 10 : 14;
      let cell = 94, cols = Math.floor((W + gap) / (cell + gap));
      if (W < 500) { cols = W < 340 ? 3 : 4; cell = Math.floor((W - gap * (cols - 1)) / cols); }
      else if (W < 900) { cols = Math.max(5, cols); cell = Math.floor((W - gap * (cols - 1)) / cols); }
      cols = Math.min(cols, 14);
      document.documentElement.style.setProperty('--cell', cell + 'px');
      document.documentElement.style.setProperty('--gap', gap + 'px');
      document.documentElement.style.setProperty('--cols', cols);
      return cols;
    }
    function order() {
      const idx = new Map(games.map((g, i) => [g.id, i]));
      return [...games].sort((a, b) => (plays.get(b.id) || 0) - (plays.get(a.id) || 0) || (b.added || '').localeCompare(a.added || '') || idx.get(a.id) - idx.get(b.id));
    }
    function countPlay(id) {
      try { if (sessionStorage.getItem('played:' + id)) return; sessionStorage.setItem('played:' + id, '1'); } catch (e) {}
      try { fetch(`${COUNTER}/${encodeURIComponent(id)}/up`, { keepalive: true }).catch(() => {}); } catch (e) {}
    }
    function tile(g, size, i, badge) {
      const a = document.createElement('a');
      a.className = 't' + (size ? ' ' + size : ''); a.href = href(g); a.style.setProperty('--d', Math.min(i * .025, .6) + 's');
      a.setAttribute('aria-label', plain(g.title)); a.title = plain(g.title);
      const img = document.createElement('img'); img.src = g.icon || 'icons/default.svg'; img.alt = ''; img.loading = i < 24 ? 'eager' : 'lazy'; img.decoding = 'async';
      img.onerror = () => { img.onerror = null; img.src = 'icons/default.svg'; };
      const n = document.createElement('span'); n.className = 'name'; n.textContent = plain(g.title);
      a.append(img, n);
      if (badge) { const b = document.createElement('span'); b.className = 'badge ' + badge; b.textContent = badge === 'new' ? 'NEW' : '🔥 인기'; a.append(b); }
      a.addEventListener('click', () => countPlay(g.id));
      return a;
    }
    function render() {
      const cols = fit(), q = norm(qEl.value);
      grid.querySelectorAll('.t, .g, .empty').forEach(n => n.remove());
      let list = order();
      if (genre) list = list.filter(g => (g.genres || []).includes(genre));
      if (q) list = list.filter(g => norm([g.title, g.description, ...(g.genres || [])].join(' ')).includes(q));
      const filtered = !!(genre || q);
      const newest = [...games].sort((a, b) => (b.added || '').localeCompare(a.added || '')).slice(0, 6).map(g => g.id);
      const hot = playsLoaded ? order().filter(g => plays.get(g.id) > 0).slice(0, 3).map(g => g.id) : [];
      // mosaic: a few featured tiles scattered through the grid (Poki-like rhythm)
      const BIG = new Set(filtered ? [0] : [0, 5, 11, 18, 26, 35, 44]);
      const frag = document.createDocumentFragment();
      list.forEach((g, i) => {
        let size = '';
        if (BIG.has(i)) size = i === 0 && !filtered && cols >= 7 ? 'huge' : 'big';
        if (size === 'big' && cols < 4) size = '';
        const badge = hot.includes(g.id) ? 'hot' : newest.includes(g.id) && Date.now() - new Date(g.added).getTime() < 7 * DAY ? 'new' : '';
        frag.append(tile(g, size, i, badge));
      });
      if (!list.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = `"${qEl.value}"에 맞는 게임이 없어요 😢`; frag.append(e); }
      // genre tiles at the end, like category shelves
      const counts = new Map();
      for (const g of games) for (const x of g.genres || []) counts.set(x, (counts.get(x) || 0) + 1);
      const gs = [...counts.entries()].filter(([, n]) => n >= 2).sort((a, b) => b[1] - a[1]);
      gs.forEach(([name, n], k) => {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'g' + (genre === name ? ' on' : ''); b.style.setProperty('--d', Math.min((list.length + k) * .025, .8) + 's');
        b.innerHTML = `<span class="e">${GENRE_ICON[name] || '🎮'}</span><span>${name}<small>${n}개</small></span>`;
        const th = document.createElement('span'); th.className = 'thumbs';
        for (const g of games.filter(x => (x.genres || []).includes(name)).slice(0, 2)) { const im = document.createElement('img'); im.src = g.icon; im.alt = ''; im.loading = 'lazy'; th.append(im); }
        b.append(th);
        b.onclick = () => { genre = genre === name ? null : name; qEl.value = ''; closeSearch(false); sync(); scrollTo({ top: 0, behavior: 'smooth' }); };
        frag.append(b);
      });
      grid.append(frag);
      $('homeBtn').classList.toggle('on', !filtered);
      $('n').textContent = `${games.length}개`;
    }
    function sync() {
      const p = new URLSearchParams(); if (genre) p.set('genre', genre); if (qEl.value.trim()) p.set('q', qEl.value.trim());
      history.replaceState(null, '', (p.toString() ? '?' + p : location.pathname)); render();
    }
    function openSearch() { $('search').classList.add('open'); qEl.focus(); }
    function closeSearch(doSync = true) { $('search').classList.remove('open'); if (qEl.value) { qEl.value = ''; } if (doSync) sync(); }
    $('searchBtn').onclick = () => ($('search').classList.contains('open') ? closeSearch() : openSearch());
    $('qx').onclick = () => closeSearch();
    $('homeBtn').onclick = () => { genre = null; closeSearch(); };
    $('randBtn').onclick = () => { const g = games[Math.floor(Math.random() * games.length)]; if (g) { countPlay(g.id); location.href = href(g); } };
    qEl.addEventListener('input', sync);
    addEventListener('keydown', e => {
      if (e.key === '/' && document.activeElement !== qEl) { e.preventDefault(); openSearch(); }
      if (e.key === 'Escape' && $('search').classList.contains('open')) closeSearch();
    });
    let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { const before = getComputedStyle(document.documentElement).getPropertyValue('--cols'); fit(); if (getComputedStyle(document.documentElement).getPropertyValue('--cols') !== before) render(); }, 120); });

    async function loadPlays() {
      const get = async id => { const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 5000);
        try { const r = await fetch(`${COUNTER}/${encodeURIComponent(id)}`, { signal: ctl.signal }); if (r.status === 400 || r.status === 404) return 0; if (!r.ok) throw 0; return Number((await r.json()).count) || 0; } finally { clearTimeout(t); } };
      const res = await Promise.allSettled(games.map(g => get(g.id)));
      if (res.every(r => r.status === 'rejected')) return;
      res.forEach((r, i) => { if (r.status === 'fulfilled') plays.set(games[i].id, r.value); });
      playsLoaded = true; render();
    }
    fetch('games.json').then(r => r.json()).then(data => {
      games = data;
      const p = new URLSearchParams(location.search);
      if (p.get('genre') && games.some(g => (g.genres || []).includes(p.get('genre')))) genre = p.get('genre');
      if (p.get('q')) { qEl.value = p.get('q'); $('search').classList.add('open'); }
      render(); loadPlays().catch(() => {});
    }).catch(() => { const e = document.createElement('div'); e.className = 'empty'; e.textContent = '게임 목록을 불러오지 못했어요 (로컬에서는 python3 -m http.server 로 열어 주세요)'; grid.append(e); });
  </script>
</body>
</html>
