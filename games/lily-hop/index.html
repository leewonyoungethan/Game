<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>개구리 연잎 점프</title>
<meta name="theme-color" content="#0b3a40">
<link rel="icon" href="../../icons/lily-hop.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    color-scheme: dark;
    --bg: #0b3a40; --text: #f4fbf6; --muted: #a8d4c8; --line: rgba(255,255,255,.16);
    --a1: #3ee08a; --a2: #2ac8e0; --a3: #ffd24a;
    --grad: linear-gradient(100deg, var(--a1), var(--a2) 55%, #7a8aff);
    --font: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font);
    overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hud { position: fixed; z-index: 6; left: 0; right: 0; top: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; pointer-events: none;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
  .box { background: rgba(6, 40, 44, .62); border: 1px solid var(--line); border-radius: 14px; padding: 8px 14px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .lbl { font-size: 11px; font-weight: 700; letter-spacing: .1em; color: var(--muted); }
  #score { font-size: 28px; font-weight: 850; letter-spacing: -.03em; line-height: 1.05; font-variant-numeric: tabular-nums; }
  #best { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stack { display: grid; gap: 8px; justify-items: end; }
  a.back, button.ic { pointer-events: auto; display: inline-flex; align-items: center; justify-content: center; height: 36px; padding: 0 12px; border-radius: 999px;
    background: rgba(6,40,44,.62); border: 1px solid var(--line); color: var(--muted); font: 600 13px var(--font); text-decoration: none; cursor: pointer; }
  a.back:hover, button.ic:hover { color: var(--text); }
  #toast { position: fixed; z-index: 4; left: 50%; top: 24%; transform: translate(-50%, 10px); font-size: clamp(22px, 6vw, 32px); font-weight: 900; letter-spacing: -.03em;
    opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; white-space: nowrap; color: #fff6b0; text-shadow: 0 3px 0 rgba(0,40,30,.5), 0 6px 20px rgba(0,0,0,.4); }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  .screen { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px max(16px, env(safe-area-inset-left, 0px)); background: rgba(3, 26, 28, .58); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); z-index: 5; }
  .screen[hidden] { display: none; }
  .card { width: min(420px, 100%); background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.04)); border: 1px solid var(--line); border-radius: 24px;
    padding: 26px 22px 22px; text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,.4); }
  .card h1 { margin: 6px 0 8px; font-size: clamp(32px, 9vw, 44px); font-weight: 900; letter-spacing: -.05em; line-height: 1.08; }
  .card h1 span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .card p { margin: 0 0 16px; color: var(--muted); line-height: 1.6; font-size: 14px; word-break: keep-all; }
  .rules { display: grid; gap: 8px; text-align: left; margin: 0 0 18px; font-size: 13px; color: var(--text); }
  .rules div { display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: center; background: rgba(255,255,255,.06); border-radius: 12px; padding: 8px 10px; }
  .rules b { font-size: 18px; text-align: center; }
  .go { width: 100%; height: 52px; border: 0; border-radius: 14px; background: var(--grad); color: #04302c; font: 850 17px var(--font); cursor: pointer;
    box-shadow: 0 10px 30px rgba(42,200,224,.35), inset 0 1px 0 rgba(255,255,255,.45); }
  .go:focus-visible, a.back:focus-visible, button.ic:focus-visible { outline: 2px solid var(--a3); outline-offset: 3px; }
  .final { font-size: 48px; font-weight: 900; letter-spacing: -.04em; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
  .small { font-size: 12px; color: var(--muted); margin-top: 12px; }
  kbd { font: 600 11px var(--font); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud">
  <div class="box"><div class="lbl">점프</div><div id="score">0</div><div id="best">최고 0</div></div>
  <div class="stack">
    <a class="back" href="../../">← 게임 센터</a>
    <button class="ic" id="muteBtn" type="button">소리 켜짐</button>
  </div>
</div>
<div id="toast"></div>

<div class="screen" id="startScreen">
  <div class="card">
    <div class="lbl">앱개발부 원터치 아케이드</div>
    <h1>개구리 <span>연잎 점프</span></h1>
    <p>연잎 가장자리를 빙글빙글 도는 개구리. 바라보는 방향에 다음 연잎이 있을 때 탭하세요!</p>
    <div class="rules">
      <div><b>👆</b><span>탭 / 클릭 / <kbd>Space</kbd> 로 점프</span></div>
      <div><b>🍂</b><span>오래 머물면 연잎이 노랗게 변하다가 가라앉아요</span></div>
      <div><b>✨</b><span>점프하다 반딧불이를 지나가면 보너스 +5</span></div>
    </div>
    <button class="go" id="startBtn" type="button">시작하기</button>
  </div>
</div>
<div class="screen" id="overScreen" hidden>
  <div class="card">
    <div class="lbl" id="overLbl">퐁당!</div>
    <div class="final" id="finalScore">0</div>
    <p id="overText"></p>
    <button class="go" id="againBtn" type="button">다시 하기</button>
    <div class="small"><a class="back" href="../../" style="height:30px">게임 센터로</a></div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const W = 400;                         // world width; height follows the screen aspect
let vw, vh, dpr, scale, VH;
function resize() {
  dpr = Math.min(2, devicePixelRatio || 1); vw = innerWidth; vh = innerHeight;
  cv.width = vw * dpr; cv.height = vh * dpr;
  scale = Math.min(vw / W, vh / 560); VH = vh / scale;
}
addEventListener('resize', resize); resize();
const rand = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;

// ---------------------------------------------------------------- world
const JUMP = 168, JUMP_T = .42, SINK_WARN = 2.6, SINK_AT = 4.2;
let pads, flies, ripples, parts, fish, frog, camY, score, best = 0, hops, state = 'title', lastPadY, padN, flyBonus;
try { best = +localStorage.getItem('lily_best') || 0; } catch (e) {}

function makePad(x, y, r, extra = {}) {
  return Object.assign({ x, y, r, rot: rand(0, TAU), notch: rand(0, TAU), dir: Math.random() < .5 ? -1 : 1, spin: 0, drift: 0, t0: 0, sit: 0, sink: 0, bounce: 0, gone: false,
    flower: Math.random() < .22 ? ['#ff8ab8', '#fff2f8', '#ffd24a'][Math.random() * 3 | 0] : null, wob: rand(0, TAU) }, extra);
}
function spawnAhead() {
  while (lastPadY > camY - VH * 1.2) {
    padN++;
    const lvl = Math.min(1, padN / 70);
    const prev = pads[pads.length - 1];
    const r = rand(34, 52) - lvl * 8;
    // a jump lands exactly (0.55 * radius + JUMP) from the pad centre, so put the next pad on that ring,
    // in an upward direction that keeps it inside the pond
    const reach = prev.r * .55 + JUMP + rand(-.3, .3) * r;
    let x, y, tries = 0;
    do {
      const a = rand(-Math.PI * .86, -Math.PI * .14);
      x = prev.x + Math.cos(a) * reach; y = prev.y + Math.sin(a) * reach;
    } while ((x < r + 14 || x > W - r - 14 || prev.y - y < 70) && ++tries < 40);
    x = Math.max(r + 14, Math.min(W - r - 14, x));
    const p = makePad(x, y, r, { drift: padN > 12 && Math.random() < .2 + lvl * .25 ? rand(14, 26 + lvl * 20) * (Math.random() < .5 ? -1 : 1) : 0 });
    pads.push(p); lastPadY = y;
    if (Math.random() < .55) flies.push({ x: (prev.x + x) / 2 + rand(-14, 14), y: (prev.y + y) / 2 + rand(-12, 12), ph: rand(0, TAU), got: false });
    if (padN % 25 === 0) toast(`${padN}번째 연잎!`);
  }
}
function reset() {
  pads = []; flies = []; ripples = []; parts = []; padN = 0; hops = 0; score = 0; flyBonus = 0;
  const start = makePad(W / 2, 0, 56, { flower: '#ff8ab8' });
  pads.push(start); lastPadY = 0;
  camY = -VH * .68; spawnAhead();
  frog = { pad: start, ang: -Math.PI / 2, spd: 1.4, air: 0, from: null, to: null, dead: false, blink: 0 };
  start.t0 = 0; start.sit = 0;
  fish = Array.from({ length: 4 }, () => ({ x: rand(0, W), y: rand(-400, 200), a: rand(0, TAU), s: rand(14, 26), ph: rand(0, TAU) }));
  updateHud();
}

// ---------------------------------------------------------------- jump
function jump() {
  if (state !== 'play' || frog.air > 0 || frog.dead) return;
  const p = frog.pad, sx = p.x + Math.cos(frog.ang) * p.r * .55, sy = p.y + Math.sin(frog.ang) * p.r * .55;
  frog.from = { x: sx, y: sy };
  frog.to = { x: sx + Math.cos(frog.ang) * JUMP, y: sy + Math.sin(frog.ang) * JUMP };
  frog.air = JUMP_T; frog.dir = frog.ang; frog.pad = null;
  ripples.push({ x: sx, y: sy, r: 6, life: .6 });
  sfx('jump');
}
function land() {
  const { x, y } = frog.to;
  let hit = null, bd = 1e9;
  for (const p of pads) { if (p.gone || p.sink > .6) continue; const d = Math.hypot(p.x - x, p.y - y); if (d < p.r + 14 && d < bd) { bd = d; hit = p; } }
  ripples.push({ x, y, r: 8, life: .8 }, { x, y, r: 2, life: .6 });
  if (!hit) { frog.why = 'miss'; splash(x, y); return; }
  // count new pads only
  if (!hit.visited) { hit.visited = true; hops++; score = hops + flyBonus; if (hops > 1 && hops % 10 === 0) sfx('ten'); }
  hit.sit = 0; frog.pad = hit;
  frog.ang = Math.atan2(y - hit.y, x - hit.x);
  const lvl = Math.min(1, padN / 70);
  frog.spd = (1.35 + lvl * 1.15 + rand(-.1, .25)) * (Math.random() < .5 ? -1 : 1);
  hit.bounce = 1;
  sfx('land'); updateHud();
}
function splash(x, y) {
  frog.dead = true; frog.deadX = x; frog.deadY = y;
  for (let i = 0; i < 26; i++) { const a = rand(0, TAU), s = rand(60, 220); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(.4, .9), c: i % 3 ? '#bff4ff' : '#ffffff', r: rand(2, 5) }); }
  ripples.push({ x, y, r: 10, life: 1.2 }, { x, y, r: 4, life: 1 });
  sfx('splash'); gameOver();
}

// ---------------------------------------------------------------- update
let last = performance.now(), T = 0;
function frame(now) {
  const dt = Math.min(.04, (now - last) / 1000); last = now; T += dt;
  if (state === 'play') update(dt);
  else idle(dt);
  for (const r of ripples) { r.r += 46 * dt; r.life -= dt; } ripples = ripples.filter(r => r.life > 0);
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .94; p.vy *= .94; p.life -= dt; } parts = parts.filter(p => p.life > 0);
  for (const f of fish) { f.ph += dt * 3; f.a += Math.sin(f.ph * .3) * dt * .6; f.x += Math.cos(f.a) * 22 * dt; f.y += Math.sin(f.a) * 22 * dt;
    if (f.x < -40) f.x = W + 30; if (f.x > W + 40) f.x = -30; if (f.y > camY + VH + 60) f.y = camY - 40; if (f.y < camY - 80) f.y = camY + VH + 40; }
  draw();
  requestAnimationFrame(frame);
}
function update(dt) {
  for (const p of pads) {
    p.rot += dt * .2 * p.dir; p.wob += dt * 2;
    if (p.drift) { p.x0 ??= p.x; p.x += p.drift * dt; if (Math.abs(p.x - p.x0) > 26 || p.x < p.r + 6 || p.x > W - p.r - 6) { p.drift *= -1; p.x += p.drift * dt * 2; } p.x = Math.max(p.r + 6, Math.min(W - p.r - 6, p.x)); }
    if (p.bounce) p.bounce = Math.max(0, p.bounce - dt * 4);
    if (p.sinking) { p.sink += dt * .9; if (p.sink >= 1) p.gone = true; }
  }
  if (frog.pad) {
    const p = frog.pad;
    frog.ang += frog.spd * dt;
    p.sit += dt;
    if (p.sit > SINK_AT && !p.sinking) { p.sinking = true; sfx('sink'); }
    if (p.sinking && p.sink > .55) { const fx = p.x + Math.cos(frog.ang) * p.r * .55, fy = p.y + Math.sin(frog.ang) * p.r * .55; frog.pad = null; frog.why = 'sink'; splash(fx, fy); return; }
  } else if (frog.air > 0) {
    frog.air -= dt;
    const k = 1 - Math.max(0, frog.air) / JUMP_T;
    const x = frog.from.x + (frog.to.x - frog.from.x) * k, y = frog.from.y + (frog.to.y - frog.from.y) * k;
    for (const f of flies) if (!f.got && Math.hypot(f.x - x, f.y - y) < 26) { f.got = true; flyBonus += 5; score = hops + flyBonus; sfx('fly'); updateHud();
      for (let i = 0; i < 10; i++) { const a = rand(0, TAU); parts.push({ x: f.x, y: f.y, vx: Math.cos(a) * 90, vy: Math.sin(a) * 90, life: .5, c: '#fff6a0', r: 2.5 }); } }
    if (frog.air <= 0) land();
  }
  // camera follows the frog
  const fy = frogPos().y, target = fy - VH * .62;
  camY += (Math.min(camY, target) - camY) * Math.min(1, dt * 3);
  spawnAhead();
  // falling behind the camera means the pad scrolled away under you
  pads = pads.filter(p => !(p.y - p.r > camY + VH + 80));
  flies = flies.filter(f => f.y < camY + VH + 60);
}
function idle(dt) {
  if (!pads) return;
  for (const p of pads) { p.rot += dt * .2 * p.dir; p.wob += dt * 2; if (p.bounce) p.bounce = Math.max(0, p.bounce - dt * 4); }
  if (frog && frog.pad && !frog.dead) frog.ang += frog.spd * dt;
}
function frogPos() {
  if (frog.dead) return { x: frog.deadX, y: frog.deadY, h: 0 };
  if (frog.pad) { const p = frog.pad; return { x: p.x + Math.cos(frog.ang) * p.r * .55, y: p.y + Math.sin(frog.ang) * p.r * .55, h: 0 }; }
  const k = 1 - Math.max(0, frog.air) / JUMP_T;
  return { x: frog.from.x + (frog.to.x - frog.from.x) * k, y: frog.from.y + (frog.to.y - frog.from.y) * k, h: Math.sin(k * Math.PI) * 34 };
}

// ---------------------------------------------------------------- render
function draw() {
  const c = ctx; c.setTransform(dpr, 0, 0, dpr, 0, 0);
  // water
  const g = c.createLinearGradient(0, 0, 0, vh); g.addColorStop(0, '#0f5a5e'); g.addColorStop(.55, '#0c4850'); g.addColorStop(1, '#08343c');
  c.fillStyle = g; c.fillRect(0, 0, vw, vh);
  c.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * (vw - W * scale) / 2, 0);
  c.translate(0, -camY);
  const top = camY, bot = camY + VH;
  // banks outside the play width
  c.fillStyle = 'rgba(20,60,40,.55)'; c.fillRect(-400, top, 400, VH); c.fillRect(W, top, 400, VH);
  // caustic shimmer
  c.strokeStyle = 'rgba(160,255,240,.07)'; c.lineWidth = 2;
  for (let y = Math.floor(top / 40) * 40; y < bot + 40; y += 40) {
    c.beginPath();
    for (let x = -20; x <= W + 20; x += 20) { const yy = y + Math.sin(x * .05 + T * 1.3 + y * .03) * 6; x === -20 ? c.moveTo(x, yy) : c.lineTo(x, yy); }
    c.stroke();
  }
  // fish shadows
  for (const f of fish) { c.save(); c.translate(f.x, f.y); c.rotate(f.a); c.fillStyle = 'rgba(4,30,34,.35)';
    c.beginPath(); c.ellipse(0, 0, f.s, f.s * .38, 0, 0, TAU); c.fill(); c.beginPath(); c.moveTo(-f.s * .8, 0); c.lineTo(-f.s * 1.4, -f.s * .4 + Math.sin(f.ph) * 4); c.lineTo(-f.s * 1.4, f.s * .4 + Math.sin(f.ph) * 4); c.fill(); c.restore(); }
  // ripples
  for (const r of ripples) { c.strokeStyle = `rgba(220,255,250,${Math.max(0, r.life) * .55})`; c.lineWidth = 2; c.beginPath(); c.ellipse(r.x, r.y, r.r, r.r * .8, 0, 0, TAU); c.stroke(); }
  // aim guide (only while sitting)
  if (state === 'play' && frog.pad && !frog.dead) {
    const fp = frogPos(), ex = fp.x + Math.cos(frog.ang) * JUMP, ey = fp.y + Math.sin(frog.ang) * JUMP;
    c.strokeStyle = 'rgba(255,255,255,.28)'; c.setLineDash([6, 9]); c.lineWidth = 3; c.beginPath(); c.moveTo(fp.x, fp.y); c.lineTo(ex, ey); c.stroke(); c.setLineDash([]);
    c.strokeStyle = 'rgba(255,255,255,.4)'; c.beginPath(); c.ellipse(ex, ey, 9, 7, 0, 0, TAU); c.stroke();
  }
  // pads
  for (const p of pads) if (!p.gone && p.y + p.r > top - 20 && p.y - p.r < bot + 20) drawPad(c, p);
  // fireflies
  for (const f of flies) if (!f.got) {
    const y = f.y + Math.sin(T * 3 + f.ph) * 5, a = .6 + .4 * Math.sin(T * 5 + f.ph);
    const gg = c.createRadialGradient(f.x, y, 0, f.x, y, 20); gg.addColorStop(0, `rgba(255,250,160,${.75 * a})`); gg.addColorStop(1, 'rgba(255,250,160,0)');
    c.fillStyle = gg; c.beginPath(); c.arc(f.x, y, 20, 0, TAU); c.fill();
    c.fillStyle = '#fffbd0'; c.beginPath(); c.arc(f.x, y, 3.5, 0, TAU); c.fill();
  }
  // frog
  if (frog && !frog.dead) drawFrog(c);
  for (const p of parts) { c.globalAlpha = Math.max(0, p.life * 1.4); c.fillStyle = p.c; c.beginPath(); c.arc(p.x, p.y, p.r, 0, TAU); c.fill(); }
  c.globalAlpha = 1;
}
function drawPad(c, p) {
  const sinkK = p.sink || 0, sitK = p === (frog && frog.pad) ? Math.min(1, Math.max(0, (p.sit - SINK_WARN) / (SINK_AT - SINK_WARN))) : (p.sinking ? 1 : 0);
  const r = p.r * (1 + (p.bounce || 0) * .06 * Math.sin((1 - p.bounce) * 12)) * (1 - sinkK * .25);
  c.save(); c.translate(p.x, p.y + Math.sin(p.wob) * 1.2); c.globalAlpha = 1 - sinkK * .9;
  c.fillStyle = 'rgba(0,25,25,.35)'; c.beginPath(); c.ellipse(5, 8, r, r * .92, 0, 0, TAU); c.fill();
  c.rotate(p.rot);
  const col = mix([86, 196, 92], [214, 186, 70], sitK), dark = mix([40, 130, 60], [150, 110, 30], sitK);
  const gr = c.createRadialGradient(-r * .3, -r * .35, r * .1, 0, 0, r);
  gr.addColorStop(0, `rgb(${col.map(v => Math.min(255, v + 50)).join(',')})`); gr.addColorStop(.7, `rgb(${col.join(',')})`); gr.addColorStop(1, `rgb(${dark.join(',')})`);
  c.fillStyle = gr; c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, r, p.notch + .28, p.notch - .28 + TAU); c.closePath(); c.fill();
  c.strokeStyle = `rgb(${dark.map(v => v * .7 | 0).join(',')})`; c.lineWidth = 2.5; c.stroke();
  c.strokeStyle = `rgba(255,255,255,.22)`; c.lineWidth = 1.6;
  for (let i = 1; i < 9; i++) { const a = p.notch + .28 + i * (TAU - .56) / 9; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(a) * r * .9, Math.sin(a) * r * .9); c.stroke(); }
  c.fillStyle = 'rgba(255,255,255,.25)'; c.beginPath(); c.ellipse(-r * .35, -r * .4, r * .28, r * .13, -.6, 0, TAU); c.fill();
  if (p.flower) {
    const fx = Math.cos(p.notch + Math.PI) * r * .45, fy = Math.sin(p.notch + Math.PI) * r * .45;
    for (let i = 0; i < 6; i++) { const a = i * TAU / 6; c.fillStyle = p.flower; c.beginPath(); c.ellipse(fx + Math.cos(a) * 6, fy + Math.sin(a) * 6, 6, 3.6, a, 0, TAU); c.fill(); }
    c.fillStyle = '#ffd24a'; c.beginPath(); c.arc(fx, fy, 3.5, 0, TAU); c.fill();
  }
  c.restore(); c.globalAlpha = 1;
}
function mix(a, b, k) { return a.map((v, i) => Math.round(v + (b[i] - v) * k)); }
function drawFrog(c) {
  const fp = frogPos(), ang = frog.pad ? frog.ang : frog.dir, h = fp.h;
  c.fillStyle = 'rgba(0,25,25,.35)'; c.beginPath(); c.ellipse(fp.x + 3, fp.y + 5, 15 - h * .12, 12 - h * .1, 0, 0, TAU); c.fill();
  c.save(); c.translate(fp.x, fp.y - h); c.rotate(ang + Math.PI / 2); const s = 1 + h * .006; c.scale(s, s);
  const stretch = frog.air > 0 ? 1.15 : 1;
  // legs
  c.fillStyle = '#2f9e4a'; c.strokeStyle = '#14502a'; c.lineWidth = 2.4;
  const leg = (x, y, rot) => { c.save(); c.translate(x, y); c.rotate(rot); c.beginPath(); c.ellipse(0, 0, 6, 10 * stretch, 0, 0, TAU); c.fill(); c.stroke(); c.restore(); };
  leg(-12, 8, -.5); leg(12, 8, .5); leg(-11, -6, .4); leg(11, -6, -.4);
  // body
  const bg = c.createRadialGradient(-4, -6, 2, 0, 0, 18); bg.addColorStop(0, '#9af07a'); bg.addColorStop(.7, '#4cc85a'); bg.addColorStop(1, '#2a8a3c');
  c.fillStyle = bg; c.beginPath(); c.ellipse(0, 0, 15, 17 * stretch, 0, 0, TAU); c.fill(); c.strokeStyle = '#14502a'; c.lineWidth = 2.6; c.stroke();
  c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.ellipse(-5, -6, 5, 3, -.5, 0, TAU); c.fill();
  // eyes (front = -y)
  frog.blink = (frog.blink + .016) % 4;
  for (const sx of [-8, 8]) {
    c.fillStyle = '#5ad46a'; c.beginPath(); c.arc(sx, -13, 7, 0, TAU); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(sx, -14, 5, 0, TAU); c.fill();
    if (frog.blink > 3.85) { c.strokeStyle = '#14502a'; c.beginPath(); c.moveTo(sx - 4, -14); c.lineTo(sx + 4, -14); c.stroke(); }
    else { c.fillStyle = '#10201a'; c.beginPath(); c.arc(sx, -15, 2.8, 0, TAU); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.arc(sx + 1, -16, 1, 0, TAU); c.fill(); }
  }
  c.fillStyle = 'rgba(255,110,150,.45)'; c.beginPath(); c.ellipse(-9, -4, 3.5, 2, 0, 0, TAU); c.ellipse(9, -4, 3.5, 2, 0, 0, TAU); c.fill();
  c.restore();
}

// ---------------------------------------------------------------- ui
let toastT;
function toast(msg) { const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 1200); }
function updateHud() { $('score').textContent = score; $('best').textContent = '최고 ' + Math.max(best, score); }
function gameOver() {
  state = 'over';
  const isBest = score > best; if (isBest) { best = score; try { localStorage.setItem('lily_best', String(best)); } catch (e) {} }
  $('finalScore').textContent = score;
  $('overLbl').textContent = isBest ? '🎉 최고 기록!' : '퐁당!';
  $('overText').textContent = `연잎 ${hops}개를 건넜어요` + (flyBonus ? ` · 반딧불이 ${flyBonus / 5}마리` : '');
  setTimeout(() => { $('overScreen').hidden = false; $('againBtn').focus(); }, 700);
  updateHud();
}
function start() { initAudio(); reset(); state = 'play'; $('startScreen').hidden = true; $('overScreen').hidden = true; }
$('startBtn').onclick = start; $('againBtn').onclick = start;
cv.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); jump(); });
addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowUp') {
    if (state === 'play') { e.preventDefault(); jump(); }
    else if (document.activeElement?.tagName !== 'BUTTON' && document.activeElement?.tagName !== 'A') { e.preventDefault(); start(); }
  }
});

// ---------------------------------------------------------------- sound
let AC = null, muted = false;
try { muted = localStorage.getItem('lily_muted') === '1'; } catch (e) {}
function initAudio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); }
function tone(f, d, type = 'sine', v = .08, slide = 0, delay = 0) {
  if (!AC || muted) return; const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .02);
}
function noise(d, v = .1, f = 900) {
  if (!AC || muted) return; const n = AC.sampleRate * d | 0, b = AC.createBuffer(1, n, AC.sampleRate), x = b.getChannelData(0);
  for (let i = 0; i < n; i++) x[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain(); fl.type = 'lowpass'; fl.frequency.value = f; g.gain.value = v;
  s.buffer = b; s.connect(fl); fl.connect(g); g.connect(AC.destination); s.start();
}
function sfx(k) {
  if (k === 'jump') tone(300, .18, 'triangle', .07, 380);
  else if (k === 'land') { tone(180, .12, 'sine', .1, -60); noise(.08, .05, 1400); }
  else if (k === 'fly') { tone(1175, .1, 'triangle', .05); tone(1568, .14, 'triangle', .05, 0, .06); }
  else if (k === 'ten') [659, 784, 988].forEach((f, i) => tone(f, .16, 'triangle', .06, 0, i * .07));
  else if (k === 'sink') tone(220, .4, 'sine', .06, -120);
  else if (k === 'splash') { noise(.5, .16, 1200); tone(140, .4, 'sine', .08, -80); }
}
function setMuted(m) { muted = m; $('muteBtn').textContent = m ? '소리 꺼짐' : '소리 켜짐'; try { localStorage.setItem('lily_muted', m ? '1' : '0'); } catch (e) {} }
$('muteBtn').onclick = () => { initAudio(); setMuted(!muted); }; setMuted(muted);

// test hook used by automated play-testing (only with #test in the URL)
if (location.hash === '#test') window.__lily = { s: () => ({ why: frog.why, pads, frog, state, score, hops, JUMP, frogPos: frogPos() }) };
reset(); requestAnimationFrame(frame); $('startBtn').focus();
})();
</script>
