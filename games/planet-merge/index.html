<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>행성 합치기</title>
<meta name="theme-color" content="#070818">
<link rel="icon" href="../../icons/planet-merge.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    color-scheme: dark;
    --bg: #070818; --text: #f2f3fa; --muted: #9aa0c0; --line: rgba(255,255,255,.12);
    --a1: #8b5cff; --a2: #ff4fa3; --a3: #ffb547;
    --grad: linear-gradient(100deg, var(--a1), var(--a2) 55%, var(--a3));
    --font: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font);
    overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hud { position: fixed; z-index: 6; left: 0; right: 0; top: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; pointer-events: none;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
  .box { pointer-events: auto; background: rgba(14, 16, 38, .72); border: 1px solid var(--line); border-radius: 14px; padding: 8px 14px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .lbl { font-size: 11px; font-weight: 700; letter-spacing: .1em; color: var(--muted); }
  #score { font-size: 28px; font-weight: 850; letter-spacing: -.03em; line-height: 1.05; font-variant-numeric: tabular-nums; }
  #best { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .right { display: flex; gap: 8px; align-items: flex-start; }
  .next { text-align: center; min-width: 74px; }
  #nextCv { width: 44px; height: 44px; display: block; margin: 2px auto 0; }
  a.back, button.ic { pointer-events: auto; display: inline-flex; align-items: center; justify-content: center; height: 36px; padding: 0 12px; border-radius: 999px;
    background: rgba(14,16,38,.72); border: 1px solid var(--line); color: var(--muted); font: 600 13px var(--font); text-decoration: none; cursor: pointer; }
  a.back:hover, button.ic:hover { color: var(--text); }
  .stack { display: grid; gap: 8px; justify-items: end; }
  #toast { position: fixed; left: 50%; top: 22%; transform: translate(-50%, 10px); font-size: clamp(22px, 6vw, 34px); font-weight: 900; letter-spacing: -.03em;
    opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; white-space: nowrap; text-shadow: 0 4px 18px rgba(0,0,0,.6);
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  .screen { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px max(16px, env(safe-area-inset-left, 0px)); background: rgba(5, 6, 18, .72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 5; }
  .screen[hidden] { display: none; }
  .card { width: min(420px, 100%); background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03)); border: 1px solid var(--line); border-radius: 24px;
    padding: 26px 22px 22px; text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .card h1 { margin: 6px 0 6px; font-size: clamp(34px, 9vw, 46px); font-weight: 900; letter-spacing: -.05em; line-height: 1.05; }
  .card h1 span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .card p { margin: 0 0 16px; color: var(--muted); line-height: 1.6; font-size: 14px; word-break: keep-all; }
  .chain { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin: 4px 0 18px; }
  .chain canvas { width: 30px; height: 30px; }
  .go { width: 100%; height: 52px; border: 0; border-radius: 14px; background: var(--grad); color: #fff; font: 800 17px var(--font); cursor: pointer;
    box-shadow: 0 10px 30px rgba(255,79,163,.35), inset 0 1px 0 rgba(255,255,255,.35); }
  .go:focus-visible, a.back:focus-visible, button.ic:focus-visible { outline: 2px solid var(--a3); outline-offset: 3px; }
  .final { font-size: 44px; font-weight: 900; letter-spacing: -.04em; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
  .small { font-size: 12px; color: var(--muted); margin-top: 12px; }
  kbd { font: 600 11px var(--font); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud">
  <div class="box"><div class="lbl">점수</div><div id="score">0</div><div id="best">최고 0</div></div>
  <div class="right">
    <div class="stack">
      <a class="back" href="../../">← 게임 센터</a>
      <button class="ic" id="muteBtn" type="button">소리 켜짐</button>
    </div>
    <div class="box next"><div class="lbl">다음</div><canvas id="nextCv" width="88" height="88"></canvas></div>
  </div>
</div>
<div id="toast"></div>

<div class="screen" id="startScreen">
  <div class="card">
    <div class="lbl">앱개발부 퍼즐</div>
    <h1>행성 <span>합치기</span></h1>
    <p>행성을 떨어뜨려 같은 행성끼리 부딪히게 하세요. 합쳐질 때마다 더 큰 행성이 태어나요. 빨간 선 위로 넘치면 끝!</p>
    <div class="chain" id="chain"></div>
    <button class="go" id="startBtn" type="button">시작하기</button>
    <div class="small">드래그해서 위치를 정하고 손을 떼면 떨어져요 · <kbd>←</kbd><kbd>→</kbd> 이동 <kbd>Space</kbd> 떨어뜨리기</div>
  </div>
</div>
<div class="screen" id="overScreen" hidden>
  <div class="card">
    <div class="lbl" id="overLbl">우주가 가득 찼어요</div>
    <div class="final" id="finalScore">0</div>
    <p id="overText"></p>
    <button class="go" id="againBtn" type="button">다시 하기</button>
    <div class="small"><a class="back" href="../../" style="height:30px">게임 센터로</a></div>
  </div>
</div>

<script>
(() => {
'use strict';
// ---------------------------------------------------------------- planets
const PLANETS = [
  { name: '소행성', r: 15, pts: 1 },
  { name: '달',     r: 20, pts: 3 },
  { name: '수성',   r: 26, pts: 6 },
  { name: '화성',   r: 32, pts: 10 },
  { name: '금성',   r: 39, pts: 15 },
  { name: '지구',   r: 47, pts: 21 },
  { name: '해왕성', r: 55, pts: 28 },
  { name: '천왕성', r: 64, pts: 36 },
  { name: '토성',   r: 74, pts: 45 },
  { name: '목성',   r: 86, pts: 55 },
  { name: '태양',   r: 100, pts: 66 },
];
const MAX = PLANETS.length - 1;
const DROP_MAX = 4;              // only the first five can be dropped

// ---------------------------------------------------------------- planet art
function seeded(seed) { let s = seed * 9301 + 49297; return () => ((s = (s * 9301 + 49297) % 233280) / 233280); }
function grad(c, x0, y0, r0, x1, y1, r1, stops) { const g = c.createRadialGradient(x0, y0, r0, x1, y1, r1); stops.forEach(([o, col]) => g.addColorStop(o, col)); return g; }
function drawPlanet(c, t, r, face = true) {
  const rnd = seeded(t + 3);
  c.save();
  // rings behind (top half hidden by planet later)
  const ring = (rx, ry, rot, col, w) => { c.save(); c.rotate(rot); c.strokeStyle = col; c.lineWidth = w; c.beginPath(); c.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); c.stroke(); c.restore(); };
  if (t === MAX) { // corona
    c.fillStyle = grad(c, 0, 0, r * .8, 0, 0, r * 1.45, [[0, 'rgba(255,210,90,.75)'], [.5, 'rgba(255,140,40,.25)'], [1, 'rgba(255,120,30,0)']]);
    c.beginPath(); c.arc(0, 0, r * 1.45, 0, Math.PI * 2); c.fill();
  }
  c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.save(); c.clip();
  const base = [
    ['#d8d2c8', '#8a8076', '#4a423a'], ['#ffffff', '#d4d8e2', '#7e8698'], ['#e8cfb0', '#a88a6a', '#5a4430'],
    ['#ffb08a', '#e0582a', '#7a2208'], ['#fff3c4', '#f0c060', '#a06a1a'], ['#9ad8ff', '#2a7ae0', '#0c2a7a'],
    ['#9ac0ff', '#2f5ae0', '#101e6a'], ['#c8fff6', '#4ad6d0', '#127a80'], ['#fff0c8', '#e8c07a', '#8a6020'],
    ['#ffe6c0', '#e8a060', '#8a4418'], ['#fffbe0', '#ffd23a', '#ff7a10'],
  ][t];
  c.fillStyle = grad(c, -r * .35, -r * .4, r * .05, 0, 0, r * 1.05, [[0, base[0]], [.55, base[1]], [1, base[2]]]);
  c.fillRect(-r, -r, r * 2, r * 2);
  // surface details
  if (t <= 2) { // craters
    for (let i = 0; i < 5 + t; i++) { const a = rnd() * 6.28, d = rnd() * r * .75, cr = r * (.1 + rnd() * .16), x = Math.cos(a) * d, y = Math.sin(a) * d;
      c.fillStyle = 'rgba(0,0,0,.16)'; c.beginPath(); c.arc(x, y, cr, 0, 7); c.fill();
      c.fillStyle = 'rgba(255,255,255,.22)'; c.beginPath(); c.arc(x - cr * .25, y - cr * .25, cr * .6, 0, 7); c.fill(); }
  } else if (t === 3) { // mars
    c.fillStyle = 'rgba(120,30,10,.35)'; for (let i = 0; i < 5; i++) { c.beginPath(); c.ellipse((rnd() - .5) * r * 1.4, (rnd() - .5) * r * 1.2, r * (.2 + rnd() * .25), r * .12, rnd() * 3, 0, 7); c.fill(); }
    c.fillStyle = 'rgba(255,255,255,.85)'; c.beginPath(); c.ellipse(0, -r * .92, r * .45, r * .16, 0, 0, 7); c.fill();
  } else if (t === 4) { // venus swirls
    c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = r * .12; for (let i = -2; i <= 2; i++) { c.beginPath(); c.ellipse(0, i * r * .32, r * 1.1, r * .18, .15, 0, 7); c.stroke(); }
  } else if (t === 5) { // earth
    c.fillStyle = '#4fc46a'; [[-.35, -.2, .38, .3], [.35, .25, .3, .42], [.1, -.55, .22, .14], [-.45, .45, .2, .16]].forEach(([x, y, w, h]) => { c.beginPath(); c.ellipse(x * r, y * r, w * r, h * r, rnd() * 2, 0, 7); c.fill(); });
    c.fillStyle = 'rgba(40,120,50,.5)'; c.beginPath(); c.ellipse(-.3 * r, -.1 * r, .18 * r, .12 * r, 0, 0, 7); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = r * .09; c.lineCap = 'round';
    [[-.7, -.5, .2], [.1, .05, .5], [-.5, .7, .1]].forEach(([x, y, l]) => { c.beginPath(); c.moveTo(x * r, y * r); c.quadraticCurveTo((x + l / 2) * r, (y - .08) * r, (x + l + .3) * r, y * r); c.stroke(); });
  } else if (t === 6 || t === 9 || t === 8) { // banded giants
    const bands = t === 9 ? ['rgba(160,80,30,.45)', 'rgba(255,240,220,.4)', 'rgba(140,60,20,.4)', 'rgba(255,230,200,.35)', 'rgba(170,90,40,.4)']
      : t === 8 ? ['rgba(200,150,70,.35)', 'rgba(255,250,230,.35)', 'rgba(180,130,60,.35)', 'rgba(255,245,220,.3)']
      : ['rgba(20,40,140,.35)', 'rgba(140,180,255,.3)', 'rgba(20,40,140,.3)'];
    bands.forEach((col, i) => { c.fillStyle = col; const y = -r + (i + .6) * (2 * r / (bands.length + .4)); c.beginPath(); c.ellipse(0, y, r * 1.2, r * (t === 9 ? .13 : .1), 0, 0, 7); c.fill(); });
    if (t === 9) { c.fillStyle = '#c0402a'; c.beginPath(); c.ellipse(r * .35, r * .3, r * .22, r * .13, 0, 0, 7); c.fill(); c.fillStyle = 'rgba(255,200,170,.5)'; c.beginPath(); c.ellipse(r * .33, r * .28, r * .12, r * .06, 0, 0, 7); c.fill(); }
    if (t === 6) { c.fillStyle = 'rgba(10,20,80,.55)'; c.beginPath(); c.ellipse(-r * .3, r * .25, r * .2, r * .11, 0, 0, 7); c.fill(); }
  } else if (t === 7) { c.fillStyle = 'rgba(255,255,255,.18)'; c.beginPath(); c.ellipse(0, -r * .2, r * 1.1, r * .35, 0, 0, 7); c.fill(); }
  else if (t === MAX) { // sun granules + flares
    for (let i = 0; i < 26; i++) { c.fillStyle = `rgba(255,${150 + rnd() * 80 | 0},40,.3)`; c.beginPath(); c.arc((rnd() - .5) * 2 * r, (rnd() - .5) * 2 * r, r * (.06 + rnd() * .12), 0, 7); c.fill(); }
  }
  // terminator shadow + highlight
  c.fillStyle = grad(c, -r * .5, -r * .55, r * .2, -r * .2, -r * .2, r * 1.6, [[0, 'rgba(0,0,0,0)'], [.62, 'rgba(0,0,0,0)'], [1, t === MAX ? 'rgba(200,60,0,.35)' : 'rgba(5,6,30,.6)']]);
  c.fillRect(-r, -r, r * 2, r * 2);
  c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.ellipse(-r * .38, -r * .45, r * .3, r * .17, -.6, 0, 7); c.fill();
  c.restore();
  // rim
  c.lineWidth = Math.max(1.5, r * .05); c.strokeStyle = 'rgba(0,0,20,.45)'; c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.stroke();
  // rings in front
  if (t === 8) { c.save(); c.beginPath(); c.rect(-r * 2, 0, r * 4, r * 2); c.clip(); ring(r * 1.55, r * .38, -.28, 'rgba(255,236,190,.9)', r * .14); ring(r * 1.32, r * .3, -.28, 'rgba(200,160,90,.8)', r * .07); c.restore(); }
  if (t === 7) { c.save(); c.beginPath(); c.rect(-r * 2, 0, r * 4, r * 2); c.clip(); ring(r * 1.35, r * .2, 1.3, 'rgba(200,255,250,.7)', r * .06); c.restore(); }
  // cute face
  if (face && r >= 12) {
    const e = r * .11, ey = r * .02, ex = r * .3;
    c.fillStyle = '#1a1030';
    c.beginPath(); c.ellipse(-ex, ey, e, e * 1.25, 0, 0, 7); c.ellipse(ex, ey, e, e * 1.25, 0, 0, 7); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(-ex + e * .35, ey - e * .45, e * .38, 0, 7); c.arc(ex + e * .35, ey - e * .45, e * .38, 0, 7); c.fill();
    c.fillStyle = 'rgba(255,90,140,.35)'; c.beginPath(); c.ellipse(-ex - e * .8, ey + e * 2.1, e * 1.1, e * .6, 0, 0, 7); c.ellipse(ex + e * .8, ey + e * 2.1, e * 1.1, e * .6, 0, 0, 7); c.fill();
    c.strokeStyle = '#1a1030'; c.lineWidth = Math.max(1.2, r * .045); c.lineCap = 'round';
    c.beginPath(); c.arc(0, ey + e * 1.4, e * .9, .15 * Math.PI, .85 * Math.PI); c.stroke();
  }
  c.restore();
}
const sprites = [];
function buildSprites(scale) {
  const d = Math.min(2, devicePixelRatio || 1);
  for (let t = 0; t <= MAX; t++) {
    const r = PLANETS[t].r * scale * d, pad = t === 8 ? 1.7 : t === MAX ? 1.5 : 1.15;
    const s = Math.ceil(r * 2 * pad) + 4, cv = document.createElement('canvas'); cv.width = cv.height = s;
    const c = cv.getContext('2d'); c.translate(s / 2, s / 2); drawPlanet(c, t, r);
    sprites[t] = { cv, s: s / d };
  }
}
function planetThumb(t, size) {
  const cv = document.createElement('canvas'), d = Math.min(2, devicePixelRatio || 1);
  cv.width = cv.height = size * d; const c = cv.getContext('2d'); c.scale(d, d); c.translate(size / 2, size / 2);
  const r = size * (t === 8 ? .3 : .42); drawPlanet(c, t, r, size >= 28); return cv;
}

// ---------------------------------------------------------------- world
const W = 400, H = 600, DANGER = 96, DROP_Y = 46, G = 1500;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let vw, vh, dpr, scale, ox, oy;
function resize() {
  dpr = Math.min(2, devicePixelRatio || 1); vw = innerWidth; vh = innerHeight;
  cv.width = vw * dpr; cv.height = vh * dpr;
  const top = 100, bottom = 70;
  scale = Math.min((vw - 24) / W, (vh - top - bottom) / H);
  ox = (vw - W * scale) / 2; oy = top + (vh - top - bottom - H * scale) / 2;
  buildSprites(scale); drawNext();
}
addEventListener('resize', resize);

let bodies = [], parts = [], floats = [], nextId = 1;
let state = 'title', score = 0, best = 0, aimX = W / 2, cur = 0, nxt = 0, cooldown = 0, dangerT = 0, combo = 0, comboT = 0, maxTier = 0, shake = 0, t0 = 0;
try { best = +localStorage.getItem('planet_best') || 0; } catch (e) {}
const rndTier = () => { const w = [34, 28, 20, 12, 6]; let x = Math.random() * 100; for (let i = 0; i < w.length; i++) { if ((x -= w[i]) < 0) return i; } return 0; };
function newBody(t, x, y) { return { id: nextId++, t, r: PLANETS[t].r, x, y, px: x, py: y, a: 0, born: performance.now(), dead: false, pop: 0 }; }

function reset() {
  bodies = []; parts = []; floats = []; score = 0; dangerT = 0; combo = 0; maxTier = 0;
  cur = rndTier(); nxt = rndTier(); cooldown = 0; aimX = W / 2; updateHud(); drawNext();
}
function drop() {
  if (state !== 'play' || cooldown > 0) return;
  const r = PLANETS[cur].r, x = Math.max(r, Math.min(W - r, aimX));
  const b = newBody(cur, x, DROP_Y); b.py = DROP_Y - 2; bodies.push(b);
  cur = nxt; nxt = rndTier(); cooldown = .45; drawNext(); sfx('drop', b.t);
}

// ---------------------------------------------------------------- physics (verlet + position solve)
function step(dt) {
  for (const b of bodies) {
    const vx = (b.x - b.px) * .995, vy = (b.y - b.py) * .995;
    b.px = b.x; b.py = b.y;
    b.x += vx; b.y += vy + G * dt * dt;
    b.a += vx / b.r;
  }
  const merges = [];
  for (let it = 0; it < 6; it++) {
    for (let i = 0; i < bodies.length; i++) {
      const a = bodies[i]; if (a.dead) continue;
      for (let j = i + 1; j < bodies.length; j++) {
        const b = bodies[j]; if (b.dead) continue;
        const dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r, d2 = dx * dx + dy * dy;
        if (d2 >= rr * rr) continue;
        if (a.t === b.t && !a.m && !b.m) { a.m = b.m = true; merges.push([a, b]); continue; }
        const d = Math.sqrt(d2) || .01, ov = (rr - d) / d, ma = a.r * a.r, mb = b.r * b.r, k = .5;
        const wa = mb / (ma + mb), wb = ma / (ma + mb);
        a.x -= dx * ov * wa * k * 2; a.y -= dy * ov * wa * k * 2;
        b.x += dx * ov * wb * k * 2; b.y += dy * ov * wb * k * 2;
      }
      // walls
      if (a.x < a.r) { a.x = a.r; a.px = a.x + (a.x - a.px) * -.3; }
      if (a.x > W - a.r) { a.x = W - a.r; a.px = a.x + (a.x - a.px) * -.3; }
      if (a.y > H - a.r) { a.y = H - a.r; a.px += (a.x - a.px) * .08; }
    }
  }
  for (const [a, b] of merges) merge(a, b);
  bodies = bodies.filter(b => !b.dead);
  for (const b of bodies) b.m = false;
}
function merge(a, b) {
  a.dead = b.dead = true;
  const x = (a.x * a.r * a.r + b.x * b.r * b.r) / (a.r * a.r + b.r * b.r), y = (a.y + b.y) / 2, t = a.t;
  combo = comboT > 0 ? combo + 1 : 1; comboT = 1.1;
  let gain;
  if (t === MAX) {
    gain = 300; burst(x, y, 70, ['#fff6c0', '#ffd23a', '#ff8a2a'], 520); shake = 18; toast('초신성 폭발! +300'); sfx('nova');
  } else {
    const nb = newBody(t + 1, x, y); nb.pop = 1; nb.px = x - ((a.x - a.px) + (b.x - b.px)) / 2 * .5; nb.py = y - ((a.y - a.py) + (b.y - b.py)) / 2 * .5;
    bodies.push(nb); gain = PLANETS[t + 1].pts;
    burst(x, y, 14 + t * 3, planetColors(t + 1), 160 + t * 30); shake = Math.max(shake, 1 + t * .8); sfx('merge', t + 1);
    if (t + 1 > maxTier) { maxTier = t + 1; if (t + 1 >= 5) toast(`${PLANETS[t + 1].name} 탄생!`); }
  }
  if (combo > 1) gain = Math.round(gain * (1 + (combo - 1) * .25));
  score += gain; floats.push({ x, y, txt: `+${gain}${combo > 1 ? ` ×${combo}` : ''}`, life: 1 });
  updateHud();
}
function planetColors(t) { return [['#c8c0b6', '#fff'], ['#fff', '#cfd6e6'], ['#e8cfb0', '#fff'], ['#ff8a5a', '#ffd0b0'], ['#ffe08a', '#fff'], ['#6ac8ff', '#6ae08a', '#fff'],
  ['#6a9aff', '#c8dcff'], ['#7af0e6', '#fff'], ['#ffe0a0', '#fff6e0'], ['#ffb070', '#fff0d8'], ['#ffd23a', '#fff6c0']][t]; }
function burst(x, y, n, cols, sp) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, s = sp * (.3 + Math.random() * .7);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: .5 + Math.random() * .5, max: 1, c: cols[i % cols.length], r: 1.5 + Math.random() * 3 }); }
}

// ---------------------------------------------------------------- loop
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (state === 'play') {
    acc += dt; while (acc >= 1 / 120) { step(1 / 120); acc -= 1 / 120; }
    cooldown -= dt; comboT -= dt;
    // danger check: settled bodies poking above the line
    const over = bodies.some(b => now - b.born > 1200 && b.y - b.r < DANGER);
    dangerT = over ? dangerT + dt : Math.max(0, dangerT - dt * 2);
    if (dangerT > 2.2) gameOver();
  }
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; p.vx *= .98; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const f of floats) { f.y -= 40 * dt; f.life -= dt; } floats = floats.filter(f => f.life > 0);
  for (const b of bodies) if (b.pop > 0) b.pop = Math.max(0, b.pop - dt * 4);
  shake = Math.max(0, shake - dt * 30);
  draw(now);
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- render
const starsBg = Array.from({ length: 140 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.4 + .3, p: Math.random() * 6 }));
function draw(now) {
  const c = ctx; c.setTransform(dpr, 0, 0, dpr, 0, 0);
  // background
  const bg = c.createLinearGradient(0, 0, 0, vh); bg.addColorStop(0, '#120c3a'); bg.addColorStop(.6, '#0a0a22'); bg.addColorStop(1, '#05050f');
  c.fillStyle = bg; c.fillRect(0, 0, vw, vh);
  const neb = c.createRadialGradient(vw * .75, vh * .2, 0, vw * .75, vh * .2, Math.max(vw, vh) * .6);
  neb.addColorStop(0, 'rgba(255,79,163,.18)'); neb.addColorStop(1, 'rgba(255,79,163,0)'); c.fillStyle = neb; c.fillRect(0, 0, vw, vh);
  const neb2 = c.createRadialGradient(vw * .15, vh * .75, 0, vw * .15, vh * .75, Math.max(vw, vh) * .55);
  neb2.addColorStop(0, 'rgba(139,92,255,.2)'); neb2.addColorStop(1, 'rgba(139,92,255,0)'); c.fillStyle = neb2; c.fillRect(0, 0, vw, vh);
  for (const s of starsBg) { c.globalAlpha = .4 + .6 * Math.abs(Math.sin(now / 900 + s.p)); c.fillStyle = '#fff'; c.beginPath(); c.arc(s.x * vw, s.y * vh, s.r, 0, 7); c.fill(); }
  c.globalAlpha = 1;
  // world transform
  const sx = (Math.random() - .5) * shake, sy = (Math.random() - .5) * shake;
  c.translate(ox + sx, oy + sy); c.scale(scale, scale);
  // jar
  c.save();
  c.fillStyle = 'rgba(120,110,255,.07)'; roundRect(c, -8, -8, W + 16, H + 16, 22); c.fill();
  c.lineWidth = 3; c.strokeStyle = 'rgba(190,180,255,.35)'; roundRect(c, -8, -8, W + 16, H + 16, 22); c.stroke();
  const glass = c.createLinearGradient(-8, 0, W + 8, 0); glass.addColorStop(0, 'rgba(255,255,255,.12)'); glass.addColorStop(.08, 'rgba(255,255,255,0)'); glass.addColorStop(.92, 'rgba(255,255,255,0)'); glass.addColorStop(1, 'rgba(255,255,255,.08)');
  c.fillStyle = glass; c.fillRect(-8, -8, W + 16, H + 16);
  c.restore();
  // danger line
  const pulse = dangerT > 0 ? .5 + .5 * Math.sin(now / 90) : 0;
  c.strokeStyle = dangerT > 0 ? `rgba(255,70,90,${.6 + .4 * pulse})` : 'rgba(255,90,110,.35)';
  c.lineWidth = 2.5; c.setLineDash([10, 8]); c.beginPath(); c.moveTo(0, DANGER); c.lineTo(W, DANGER); c.stroke(); c.setLineDash([]);
  // aim guide + current planet
  if (state === 'play') {
    const r = PLANETS[cur].r, x = Math.max(r, Math.min(W - r, aimX));
    const gl = c.createLinearGradient(0, DROP_Y, 0, H); gl.addColorStop(0, 'rgba(255,255,255,.28)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = gl; c.fillRect(x - 1, DROP_Y, 2, H - DROP_Y);
    if (cooldown <= 0) drawSprite(c, cur, x, DROP_Y, 0, 1);
    else { c.globalAlpha = .35; drawSprite(c, cur, x, DROP_Y, 0, 1); c.globalAlpha = 1; }
  }
  // bodies
  for (const b of bodies) drawSprite(c, b.t, b.x, b.y, b.a, 1 + b.pop * .25);
  // particles
  for (const p of parts) { c.globalAlpha = Math.max(0, p.life); c.fillStyle = p.c; c.beginPath(); c.arc(p.x, p.y, p.r, 0, 7); c.fill(); }
  c.globalAlpha = 1;
  c.textAlign = 'center'; c.font = '800 18px "Pretendard Variable", system-ui, sans-serif';
  for (const f of floats) { c.globalAlpha = Math.min(1, f.life * 2); c.fillStyle = 'rgba(0,0,0,.5)'; c.fillText(f.txt, f.x + 1, f.y + 2); c.fillStyle = '#fff6c0'; c.fillText(f.txt, f.x, f.y); }
  c.globalAlpha = 1;
  // evolution strip under the jar
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const n = MAX + 1, sz = Math.min(28, (vw - 32) / n - 4), y = oy + H * scale + 20 + sz / 2, x0 = vw / 2 - (n * (sz + 4)) / 2 + sz / 2;
  for (let t = 0; t < n; t++) { c.globalAlpha = t <= maxTier ? 1 : .28; c.drawImage(thumbs[t], x0 + t * (sz + 4) - sz / 2, y - sz / 2, sz, sz); }
  c.globalAlpha = 1;
}
const thumbs = PLANETS.map((_, t) => planetThumb(t, 56));
function drawSprite(c, t, x, y, a, k) {
  const sp = sprites[t]; if (!sp) return;
  const s = sp.s / scale * k;
  c.save(); c.translate(x, y); if (t !== 8 && t !== 7) c.rotate(a * .35); c.drawImage(sp.cv, -s / 2, -s / 2, s, s); c.restore();
}
function roundRect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

// ---------------------------------------------------------------- HUD
const $ = id => document.getElementById(id);
function updateHud() { $('score').textContent = score.toLocaleString('ko-KR'); $('best').textContent = '최고 ' + Math.max(best, score).toLocaleString('ko-KR'); }
function drawNext() {
  const c = $('nextCv').getContext('2d'); c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, 88, 88);
  c.translate(44, 44); drawPlanet(c, nxt, 16 + nxt * 4.5);
}
let toastT;
function toast(msg) { const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 1300); }
function gameOver() {
  state = 'over'; sfx('over');
  const isBest = score > best; if (isBest) { best = score; try { localStorage.setItem('planet_best', String(best)); } catch (e) {} }
  $('finalScore').textContent = score.toLocaleString('ko-KR');
  $('overLbl').textContent = isBest ? '🎉 최고 기록!' : '우주가 가득 찼어요';
  $('overText').textContent = `가장 큰 행성: ${PLANETS[maxTier].name}` + (maxTier === MAX ? ' — 태양까지 만들었어요!' : '');
  setTimeout(() => { $('overScreen').hidden = false; $('againBtn').focus(); }, 500);
  updateHud();
}
function start() { initAudio(); reset(); state = 'play'; $('startScreen').hidden = true; $('overScreen').hidden = true; }
$('startBtn').onclick = start; $('againBtn').onclick = start;
const chain = $('chain'); PLANETS.forEach((p, t) => { const th = planetThumb(t, 60); th.title = p.name; chain.append(th); });

// ---------------------------------------------------------------- input
const toWorld = e => (e.clientX - ox) / scale;
let pointerDown = false;
cv.addEventListener('pointerdown', e => { if (state !== 'play') return; pointerDown = true; aimX = toWorld(e); initAudio(); });
addEventListener('pointermove', e => { if (state === 'play' && (pointerDown || e.pointerType === 'mouse')) aimX = toWorld(e); });
addEventListener('pointerup', e => { if (state === 'play' && pointerDown) { aimX = toWorld(e); drop(); } pointerDown = false; });
addEventListener('pointercancel', () => { pointerDown = false; });
addEventListener('keydown', e => {
  if (state !== 'play') { if ((e.key === 'Enter' || e.key === ' ') && document.activeElement?.tagName !== 'BUTTON') { e.preventDefault(); start(); } return; }
  if (e.key === 'ArrowLeft' || e.key === 'a') { aimX -= 18; e.preventDefault(); }
  if (e.key === 'ArrowRight' || e.key === 'd') { aimX += 18; e.preventDefault(); }
  if (e.key === ' ' || e.key === 'ArrowDown' || e.key === 'Enter') { e.preventDefault(); drop(); }
  aimX = Math.max(0, Math.min(W, aimX));
});

// ---------------------------------------------------------------- sound
let AC = null, muted = false;
try { muted = localStorage.getItem('planet_muted') === '1'; } catch (e) {}
function initAudio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); }
function tone(f, d, type = 'sine', v = .08, slide = 0, delay = 0) {
  if (!AC || muted) return; const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .02);
}
const SCALE = [523, 587, 659, 784, 880, 988, 1047, 1175, 1319, 1568, 1760];
function sfx(k, t = 0) {
  if (k === 'drop') tone(320 + t * 30, .12, 'triangle', .05, -120);
  else if (k === 'merge') { tone(SCALE[Math.min(t, 10)] / 2, .18, 'sine', .09); tone(SCALE[Math.min(t, 10)], .22, 'triangle', .05, 0, .04); }
  else if (k === 'nova') [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .3, 'triangle', .07, 0, i * .07));
  else if (k === 'over') [440, 349, 262].forEach((f, i) => tone(f, .35, 'sine', .07, 0, i * .15));
}
function setMuted(m) { muted = m; $('muteBtn').textContent = m ? '소리 꺼짐' : '소리 켜짐'; try { localStorage.setItem('planet_muted', m ? '1' : '0'); } catch (e) {} }
$('muteBtn').onclick = () => { initAudio(); setMuted(!muted); }; setMuted(muted);

// ---------------------------------------------------------------- go
resize(); reset(); updateHud();
// a few idle planets behind the title screen
for (let i = 0; i < 9; i++) { const t = (Math.random() * 6) | 0, b = newBody(t, 40 + Math.random() * 320, 200 + Math.random() * 300); bodies.push(b); }
(function settle() { for (let i = 0; i < 240; i++) step(1 / 120); })();
requestAnimationFrame(frame);
$('startBtn').focus();
})();
</script>
</body>
</html>
