<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>구름 위 블록 탑</title>
<meta name="theme-color" content="#5ab8f0">
<link rel="icon" href="../../icons/cloud-tower.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../_shared/kit.css">
<style>
  :root { --bg: #5ab8f0; --panel: rgba(20, 50, 90, .45); --a1: #ffb0d8; --a2: #8a9aff; --a3: #7ae0ff; --ink-on-grad: #1a1a4a; --glow: rgba(138,154,255,.35); }
  .tap { position: fixed; z-index: 4; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(-50%); color: #fff; font-weight: 800; font-size: 15px;
    text-shadow: 0 2px 8px rgba(0,0,40,.5); pointer-events: none; animation: bob 1.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translate(-50%, -6px); } }
</style>
</head>
<body>
<canvas class="stage" id="cv"></canvas>
<div class="hud">
  <div class="group">
    <div class="box"><div class="lbl">높이</div><div class="big" id="score">0</div><div class="sub" id="best">최고 0</div></div>
    <div class="box"><div class="lbl">퍼펙트</div><div class="big" id="perfect">0</div><div class="sub" id="zone">땅 위</div></div>
  </div>
  <div class="stack">
    <a class="pill" href="../../">← 게임 센터</a>
    <button class="pill" id="muteBtn" type="button"></button>
  </div>
</div>
<div class="tap" id="tapHint" hidden>화면을 탭해서 블록을 내려놓아요</div>

<div class="screen" id="startScreen">
  <div class="card">
    <div class="lbl">앱개발부 타이밍 게임</div>
    <h1>구름 위 <span>블록 탑</span></h1>
    <p>좌우로 움직이는 블록을 딱 맞춰 쌓아서 구름 위, 성층권, 우주까지 올라가 보세요!</p>
    <div class="rules">
      <div><b>👆</b><span>탭 / 클릭 / <kbd>Space</kbd> 로 블록 내려놓기</span></div>
      <div><b>✂️</b><span>아래 블록 밖으로 삐져나온 부분은 잘려서 떨어져요</span></div>
      <div><b>✨</b><span>딱 맞추면 퍼펙트! 3번 연속이면 블록이 다시 넓어져요</span></div>
    </div>
    <button class="go" id="startBtn" type="button">쌓기 시작</button>
  </div>
</div>
<div class="screen" id="overScreen" hidden>
  <div class="card">
    <div class="lbl" id="overLbl"></div>
    <div class="final" id="finalScore">0</div>
    <p id="overText"></p>
    <button class="go" id="againBtn" type="button">다시 쌓기</button>
  </div>
</div>

<script src="../_shared/kit.js"></script>
<script>
(() => {
'use strict';
const { $, rand, clamp, roundRect, tone, noise, chord, toast } = Kit;
const W = 360, BH = 28, DEPTH = 12, BASE_W = 200;
const cv = $('cv'), ctx = cv.getContext('2d');
let vw, vh, dpr, scale;
function resize() { dpr = Math.min(2, devicePixelRatio || 1); vw = innerWidth; vh = innerHeight; cv.width = vw * dpr; cv.height = vh * dpr; scale = Math.min(vw / W, 1.6); }
addEventListener('resize', resize); resize();
const best = Kit.best('ct_best');
const ZONES = [[0, '땅 위'], [8, '구름 위'], [22, '하늘 높이'], [40, '성층권'], [60, '우주']];
let stack, cur, falling, parts, rings, camY, state = 'title', height, perfect, combo, speed, dir, shake, flash, birds;

function hue(i) { return (200 + i * 9) % 360; }
function newGame() {
  stack = [{ x: (W - BASE_W) / 2, w: BASE_W, y: 0, i: 0 }];
  falling = []; parts = []; rings = []; camY = 0; height = 0; perfect = 0; combo = 0; speed = 150; dir = 1; shake = 0; flash = 0;
  birds = Array.from({ length: 3 }, (_, i) => ({ x: rand(-100, W), y: 100 + i * 260, s: rand(20, 40), ph: rand(0, 6) }));
  spawn(); hud();
}
function spawn() {
  const top = stack[stack.length - 1];
  dir = (stack.length % 2) ? 1 : -1;
  cur = { w: top.w, y: top.y + BH, i: stack.length, x: dir > 0 ? -top.w - 20 : W + 20 };
  speed = Math.min(420, 150 + stack.length * 6.5);
}
function drop() {
  if (state !== 'play') return;
  const top = stack[stack.length - 1];
  const off = cur.x - top.x;
  if (Math.abs(off) <= 5) {
    cur.x = top.x; combo++; perfect++;
    if (combo >= 3 && cur.w < BASE_W) { const grow = Math.min(12, BASE_W - cur.w); cur.x -= grow / 2; cur.w += grow; toast('✨ 블록이 넓어졌어요!'); }
    rings.push({ x: cur.x + cur.w / 2, y: cur.y, r: cur.w / 2, life: .6 });
    chord([523 * Math.pow(1.06, Math.min(combo, 12)), 784 * Math.pow(1.06, Math.min(combo, 12))], .04, 'triangle', .06, .14); flash = .25;
  } else {
    const left = Math.max(cur.x, top.x), right = Math.min(cur.x + cur.w, top.x + top.w), keep = right - left;
    if (keep <= 0) { falling.push({ ...cur, vx: dir * speed * .3, vy: 0, rot: 0, vr: dir * 1.5 }); return over(); }
    const cutX = cur.x < top.x ? cur.x : right, cutW = cur.w - keep;
    falling.push({ x: cutX, w: cutW, y: cur.y, i: cur.i, vx: (cur.x < top.x ? -1 : 1) * 40, vy: 0, rot: 0, vr: (cur.x < top.x ? -1 : 1) * rand(1, 3) });
    cur.x = left; cur.w = keep; combo = 0;
    tone(330 + Math.min(stack.length, 30) * 12, .08, 'square', .045); noise(.05, .05, 1600);
  }
  stack.push({ x: cur.x, w: cur.w, y: cur.y, i: cur.i, land: 1 });
  height = stack.length - 1;
  for (let k = 0; k < 6; k++) parts.push({ x: cur.x + rand(0, cur.w), y: cur.y, vx: rand(-40, 40), vy: rand(20, 80), life: .5, c: '#fff' });
  const z = ZONES.slice().reverse().find(z => height >= z[0]);
  if (ZONES.some(q => q[0] === height && height > 0)) { toast(`🎉 ${z[1]}!`); chord([523, 659, 784, 1047], .07, 'triangle', .06, .25); }
  shake = 2; hud(); spawn();
}
function over() {
  state = 'over'; shake = 10; tone(200, .45, 'sawtooth', .06, -120); noise(.3, .08, 600);
  const isBest = best.submit(height);
  $('finalScore').textContent = height + '층';
  $('overLbl').textContent = isBest ? '🎉 최고 기록!' : '탑이 멈췄어요';
  const z = ZONES.slice().reverse().find(z => height >= z[0]);
  $('overText').textContent = `${z[1]}까지 올라갔어요 · 퍼펙트 ${perfect}번`;
  setTimeout(() => Kit.show('overScreen'), 900); hud(); $('tapHint').hidden = true;
}
function hud() {
  $('score').textContent = height; $('best').textContent = '최고 ' + Math.max(best.get() || 0, height);
  $('perfect').textContent = perfect; $('zone').textContent = ZONES.slice().reverse().find(z => height >= z[0])[1];
}

// ---------------------------------------------------------------- loop
let last = performance.now(), TT = 0;
function frame(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now; TT += dt;
  if (state === 'play' && cur) {
    cur.x += dir * speed * dt;
    if (dir > 0 && cur.x > W + 10) dir = -1;
    if (dir < 0 && cur.x + cur.w < -10) dir = 1;
  }
  for (const f of falling) { f.vy += 900 * dt; f.x += f.vx * dt; f.y -= f.vy * dt; f.rot += f.vr * dt; }
  falling = falling.filter(f => f.y > camY - 600);
  for (const p of parts) { p.x += p.vx * dt; p.y -= p.vy * dt; p.life -= dt; } parts = parts.filter(p => p.life > 0);
  for (const r of rings) { r.r += 120 * dt; r.life -= dt; } rings = rings.filter(r => r.life > 0);
  for (const s of stack) if (s.land) s.land = Math.max(0, s.land - dt * 5);
  const target = Math.max(0, (stack[stack.length - 1].y) - (vh / scale) * .45);
  camY += (target - camY) * Math.min(1, dt * 4);
  shake = Math.max(0, shake - dt * 30); flash = Math.max(0, flash - dt);
  for (const b of birds) { b.x += b.s * dt; if (b.x > W + 60) { b.x = -60; b.y = camY + rand(100, vh / scale); } }
  draw(); requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- draw
function skyAt(h) {
  const stops = [[0, [130, 210, 255], [215, 242, 255]], [8, [90, 170, 240], [190, 225, 255]], [22, [60, 110, 210], [140, 180, 245]], [40, [30, 40, 110], [90, 80, 170]], [60, [6, 6, 30], [30, 20, 70]]];
  let i = 0; while (i < stops.length - 2 && h > stops[i + 1][0]) i++;
  const [a, t1, b1] = stops[i], [b, t2, b2] = stops[i + 1], k = clamp((h - a) / (b - a), 0, 1);
  const m = (x, y) => `rgb(${x.map((v, j) => Math.round(v + (y[j] - v) * k)).join(',')})`;
  return [m(t1, t2), m(b1, b2)];
}
function draw() {
  const c = ctx, viewH = vh / scale, hNow = camY / BH;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const [top, bot] = skyAt(hNow);
  const g = c.createLinearGradient(0, 0, 0, vh); g.addColorStop(0, top); g.addColorStop(1, bot); c.fillStyle = g; c.fillRect(0, 0, vw, vh);
  if (hNow > 30) { c.fillStyle = '#fff'; for (let i = 0; i < 80; i++) { c.globalAlpha = clamp((hNow - 30) / 25, 0, 1) * (.3 + .6 * Math.abs(Math.sin(TT * .7 + i))); c.fillRect((i * 97.3) % vw, (i * 61.7 + camY * .05) % vh, 1.8, 1.8); } c.globalAlpha = 1; }
  // world transform: y up, centered horizontally
  const ox = (vw - W * scale) / 2 + (Math.random() - .5) * shake;
  const Y = y => vh - (y - camY) * scale - 70;   // world y (up) -> screen y
  // clouds (parallax)
  for (let i = 0; i < 14; i++) {
    const cy = i * 230 + 160, sy = vh - (cy - camY * .6) * scale * .9; if (sy < -80 || sy > vh + 80) continue;
    const cx = ((i * 137 + TT * (6 + i % 3 * 4)) % (vw + 300)) - 150;
    c.fillStyle = hNow > 35 ? 'rgba(255,255,255,.15)' : 'rgba(255,255,255,.85)';
    c.beginPath(); c.ellipse(cx, sy, 70, 22, 0, 0, 7); c.ellipse(cx + 40, sy - 14, 46, 24, 0, 0, 7); c.ellipse(cx - 40, sy - 6, 40, 18, 0, 0, 7); c.fill();
  }
  // ground
  const gy = Y(0) + 0;
  if (gy < vh + 200) {
    c.fillStyle = '#5ac85a'; c.beginPath(); c.ellipse(vw / 2, gy + 90, vw * .9, 110, 0, 0, 7); c.fill();
    c.fillStyle = '#7ad86a'; c.beginPath(); c.ellipse(vw / 2, gy + 70, vw * .7, 70, 0, 0, 7); c.fill();
    for (let i = 0; i < 6; i++) { const tx = vw / 2 + (i - 2.5) * 70 * scale; c.fillStyle = '#3a9a4a'; c.beginPath(); c.arc(tx, gy + 30, 18 * scale, 0, 7); c.fill(); }
  }
  // birds
  for (const b of birds) { const sx = ox + b.x * scale, sy = vh - (b.y - camY) * scale; if (sy < -20 || sy > vh + 20 || hNow > 35) continue;
    c.strokeStyle = 'rgba(30,40,70,.6)'; c.lineWidth = 2; const fl = Math.sin(TT * 10 + b.ph) * 5;
    c.beginPath(); c.moveTo(sx - 9, sy - fl); c.quadraticCurveTo(sx - 4, sy - 6, sx, sy); c.quadraticCurveTo(sx + 4, sy - 6, sx + 9, sy - fl); c.stroke(); }
  c.save(); c.translate(ox, 0); c.scale(scale, scale);
  const SY = y => (vh - (y - camY) * scale - 70) / scale;
  // stack
  const from = Math.max(0, Math.floor((camY - 80) / BH));
  for (let k = from; k < stack.length; k++) block(c, stack[k], SY(stack[k].y), stack[k].land || 0);
  if (state === 'play' && cur) {
    const top = stack[stack.length - 1];
    c.globalAlpha = .18; c.fillStyle = '#fff'; c.fillRect(top.x, SY(cur.y) - BH, top.w, BH); c.globalAlpha = 1;   // ghost guide
    block(c, cur, SY(cur.y), 0);
  }
  for (const f of falling) { c.save(); c.translate(f.x + f.w / 2, SY(f.y) - BH / 2); c.rotate(f.rot); block(c, { ...f, x: -f.w / 2 }, BH / 2, 0); c.restore(); }
  for (const r of rings) { c.strokeStyle = `rgba(255,255,255,${r.life * 1.5})`; c.lineWidth = 3; c.beginPath(); c.ellipse(r.x, SY(r.y) - BH / 2, r.r, r.r * .25, 0, 0, 7); c.stroke(); }
  for (const p of parts) { c.globalAlpha = p.life * 2; c.fillStyle = p.c; c.fillRect(p.x, SY(p.y), 3, 3); } c.globalAlpha = 1;
  c.restore();
  if (flash > 0) { c.fillStyle = `rgba(255,255,255,${flash * .5})`; c.fillRect(0, 0, vw, vh); }
}
function block(c, b, sy, land) {
  const h = hue(b.i), x = b.x, y = sy - BH, w = b.w;
  // top face (parallelogram for a little depth)
  c.fillStyle = `hsl(${h} 80% 82%)`;
  c.beginPath(); c.moveTo(x, y); c.lineTo(x + DEPTH, y - DEPTH); c.lineTo(x + w + DEPTH, y - DEPTH); c.lineTo(x + w, y); c.closePath(); c.fill();
  // side face
  c.fillStyle = `hsl(${h} 60% 45%)`;
  c.beginPath(); c.moveTo(x + w, y); c.lineTo(x + w + DEPTH, y - DEPTH); c.lineTo(x + w + DEPTH, y + BH - DEPTH); c.lineTo(x + w, y + BH); c.closePath(); c.fill();
  // front face
  const g = c.createLinearGradient(0, y, 0, y + BH); g.addColorStop(0, `hsl(${h} 85% 68%)`); g.addColorStop(1, `hsl(${h} 70% 54%)`);
  c.fillStyle = g; c.fillRect(x, y, w, BH);
  c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(x + 4, y + 4, Math.max(0, w - 8), 4);
  c.fillStyle = 'rgba(0,0,40,.12)'; c.fillRect(x, y + BH - 4, w, 4);
  // windows for a building feel
  if (w > 30) { c.fillStyle = `hsla(${h} 90% 92% / .55)`; for (let wx = x + 10; wx < x + w - 14; wx += 18) c.fillRect(wx, y + 11, 8, 9); }
  if (land > 0) { c.strokeStyle = `rgba(255,255,255,${land})`; c.lineWidth = 3; c.strokeRect(x - 2, y - 2, w + 4, BH + 4); }
}

// ---------------------------------------------------------------- input
cv.addEventListener('pointerdown', e => { e.preventDefault(); drop(); });
addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && state === 'play') { e.preventDefault(); if (!e.repeat) drop(); } });
function start() { newGame(); state = 'play'; Kit.hide('startScreen', 'overScreen'); $('tapHint').hidden = false; setTimeout(() => $('tapHint').hidden = true, 4000); }
$('startBtn').onclick = start; $('againBtn').onclick = start;
Kit.bindMute($('muteBtn'));
newGame(); requestAnimationFrame(frame);
if (location.hash === '#test') window.__game = { s: () => ({ stack, cur, state, height, perfect, combo }), drop };
})();
</script>
</body>
</html>
