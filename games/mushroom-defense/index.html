<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>버섯 마을 수비대</title>
<meta name="theme-color" content="#3a7a3a">
<link rel="icon" href="../../icons/mushroom-defense.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../_shared/kit.css">
<style>
  :root { --bg: #2a5a2a; --panel: rgba(20, 50, 20, .66); --a1: #ffd24a; --a2: #ff8a3a; --a3: #ff4f7a; --ink-on-grad: #3a1a00; --glow: rgba(255,170,60,.35); }
  .bottom { position: fixed; z-index: 6; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); display: flex; justify-content: center; gap: 8px; padding: 0 12px; }
  .bottom .pill { height: 46px; font-size: 14px; padding: 0 16px; }
  .bottom .wave { background: linear-gradient(100deg, #ffd24a, #ff8a3a); color: #3a1a00; border: 0; font-weight: 850; }
  .bottom .wave:disabled { opacity: .5; }
  .pop { position: fixed; z-index: 8; background: rgba(18, 30, 18, .94); border: 1px solid var(--line); border-radius: 16px; padding: 10px; width: 230px; box-shadow: 0 14px 40px rgba(0,0,0,.5); }
  .pop[hidden] { display: none; }
  .pop h3 { margin: 0 0 6px; font-size: 14px; }
  .pop .opts { display: grid; gap: 6px; }
  .pop button { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; text-align: left; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--text); padding: 7px 9px; cursor: pointer; font-size: 13px; }
  .pop button small { display: block; color: var(--muted); font-size: 11px; }
  .pop button b { color: #ffd24a; font-size: 13px; }
  .pop button:disabled { opacity: .4; cursor: default; }
  .pop .ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 20px; background: rgba(255,255,255,.08); }
</style>
</head>
<body>
<canvas class="stage" id="cv"></canvas>
<div class="hud">
  <div class="group">
    <div class="box"><div class="lbl">코인</div><div class="big" id="coins">0</div><div class="sub" id="lives">❤️ 20</div></div>
    <div class="box"><div class="lbl">웨이브</div><div class="big" id="wave">0/15</div><div class="sub" id="waveInfo">준비</div></div>
  </div>
  <div class="stack">
    <a class="pill" href="../../">← 게임 센터</a>
    <button class="pill" id="muteBtn" type="button"></button>
  </div>
</div>
<div class="bottom" id="bottom" hidden>
  <button class="pill wave" id="waveBtn" type="button">▶ 웨이브 시작</button>
  <button class="pill" id="speedBtn" type="button">×1 속도</button>
</div>
<div class="pop" id="pop" hidden><h3 id="popTitle"></h3><div class="opts" id="popOpts"></div></div>

<div class="screen" id="startScreen">
  <div class="card">
    <div class="lbl">앱개발부 전략 게임</div>
    <h1>버섯 마을 <span>수비대</span></h1>
    <p>숲 해충들이 버섯 마을로 몰려와요! 길 옆 풀밭에 수비탑을 세워 15번의 공격을 막아 주세요.</p>
    <div class="rules">
      <div><b>🌰</b><span>도토리 발사대 — 싸고 든든한 기본 탑</span></div>
      <div><b>🐝</b><span>꿀벌집 — 아주 빠르게 쏘지만 약해요</span></div>
      <div><b>🌼</b><span>민들레 포자포 — 여러 마리를 한꺼번에</span></div>
      <div><b>❄️</b><span>얼음 버섯 — 주변 적을 느리게 해요</span></div>
    </div>
    <p class="small">풀밭을 탭하면 탑을 세우고, 탑을 탭하면 강화·판매할 수 있어요.</p>
    <button class="go" id="startBtn" type="button">마을 지키러 가기</button>
  </div>
</div>
<div class="screen" id="overScreen" hidden>
  <div class="card">
    <div class="lbl" id="overLbl"></div>
    <h2 id="overTitle"></h2>
    <div class="final" id="finalScore"></div>
    <p id="overText"></p>
    <button class="go" id="againBtn" type="button">다시 하기</button>
    <div class="row"><button class="go ghost" id="endlessBtn" type="button" hidden>무한 모드로 계속</button></div>
  </div>
</div>

<script src="../_shared/kit.js"></script>
<script>
(() => {
'use strict';
const { $, rand, pick, clamp, roundRect, tone, noise, chord, toast } = Kit;
const COLS = 9, ROWS = 13, T = 40, W = COLS * T, H = ROWS * T, WAVES = 15;
const cv = $('cv'), ctx = cv.getContext('2d');
let F; function resize() { F = Kit.fit(cv, W, H, { top: 100, bottom: 70 }); } addEventListener('resize', resize); resize();

// ---------------------------------------------------------------- map (path cells by waypoints)
const WAY = [[1, -1], [1, 2], [7, 2], [7, 5], [2, 5], [2, 8], [6, 8], [6, 11], [4, 11], [4, 13]];
const pathCells = new Set(), pathPts = [];
for (let i = 0; i < WAY.length - 1; i++) {
  const [x0, y0] = WAY[i], [x1, y1] = WAY[i + 1];
  const dx = Math.sign(x1 - x0), dy = Math.sign(y1 - y0); let x = x0, y = y0;
  while (x !== x1 || y !== y1) { if (y >= 0 && y < ROWS) pathCells.add(x + ',' + y); x += dx; y += dy; }
}
pathCells.add('4,12');
WAY.forEach(([x, y]) => pathPts.push({ x: (x + .5) * T, y: (y + .5) * T }));
const segLen = []; let totalLen = 0; for (let i = 0; i < pathPts.length - 1; i++) { const l = Math.hypot(pathPts[i + 1].x - pathPts[i].x, pathPts[i + 1].y - pathPts[i].y); segLen.push(l); totalLen += l; }
function posAt(d) { for (let i = 0; i < segLen.length; i++) { if (d <= segLen[i]) { const k = d / segLen[i], a = pathPts[i], b = pathPts[i + 1]; return { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k, ang: Math.atan2(b.y - a.y, b.x - a.x) }; } d -= segLen[i]; } const e = pathPts[pathPts.length - 1]; return { x: e.x, y: e.y, ang: Math.PI / 2 }; }
const deco = []; for (let i = 0; i < 26; i++) { const x = Math.floor(rand(0, COLS)), y = Math.floor(rand(0, ROWS)); if (!pathCells.has(x + ',' + y)) deco.push({ x: (x + rand(.2, .8)) * T, y: (y + rand(.2, .8)) * T, k: pick(['flower', 'grass', 'grass', 'stone']), c: pick(['#ff8ab8', '#ffd24a', '#fff', '#b8a8ff']) }); }

// ---------------------------------------------------------------- data
const TOWERS = {
  acorn: { name: '도토리 발사대', ico: '🌰', cost: 50, desc: '단일 공격', lv: [{ dmg: 12, rate: .85, range: 2.3 }, { dmg: 22, rate: .75, range: 2.5 }, { dmg: 40, rate: .65, range: 2.8 }], up: [55, 100] },
  bee:   { name: '꿀벌집', ico: '🐝', cost: 70, desc: '빠른 연사', lv: [{ dmg: 4, rate: .25, range: 2.0 }, { dmg: 7, rate: .2, range: 2.2 }, { dmg: 11, rate: .15, range: 2.4 }], up: [80, 140] },
  spore: { name: '민들레 포자포', ico: '🌼', cost: 100, desc: '범위 공격', lv: [{ dmg: 12, rate: 1.5, range: 2.4, splash: .9 }, { dmg: 22, rate: 1.35, range: 2.6, splash: 1.1 }, { dmg: 38, rate: 1.2, range: 2.9, splash: 1.3 }], up: [110, 180] },
  ice:   { name: '얼음 버섯', ico: '❄️', cost: 80, desc: '주변 둔화', lv: [{ dmg: 2, rate: .6, range: 1.6, slow: .45 }, { dmg: 4, rate: .5, range: 1.9, slow: .55 }, { dmg: 7, rate: .45, range: 2.2, slow: .65 }], up: [90, 150] },
};
const ENEMIES = {
  ant:    { name: '개미', hp: 22, spd: 66, gold: 5, r: 9, col: '#3a2a2a' },
  snail:  { name: '달팽이', hp: 70, spd: 30, gold: 8, r: 13, col: '#e0a060' },
  beetle: { name: '딱정벌레', hp: 110, spd: 40, gold: 12, r: 14, col: '#3a6a9a', armor: 2 },
  moth:   { name: '나방', hp: 40, spd: 80, gold: 7, r: 11, col: '#b8a8e8' },
  caterp: { name: '애벌레 장군', hp: 320, spd: 30, gold: 35, r: 18, col: '#7ad04a', armor: 3 },
  king:   { name: '사슴벌레 대왕', hp: 1400, spd: 24, gold: 120, r: 24, col: '#8a3a1a', armor: 5, boss: true },
};
function waveList(n) {
  const L = [], add = (k, c, gap) => { for (let i = 0; i < c; i++) L.push({ k, gap }); };
  const s = 1 + (n - 1) * .13 + Math.max(0, n - 9) * .09;
  if (n <= 2) add('ant', 6 + n * 3, .8);
  else if (n <= 4) { add('ant', 6, .6); add('snail', n, 1.2); }
  else if (n === 5) { add('caterp', 1, 1); add('ant', 10, .45); }
  else if (n <= 7) { add('moth', 8, .5); add('snail', 4, 1); add('beetle', n - 4, 1.4); }
  else if (n <= 9) { add('beetle', n - 4, 1); add('moth', 10, .35); add('ant', 12, .3); }
  else if (n === 10) { add('caterp', 3, 2); add('snail', 6, .7); add('moth', 8, .35); }
  else if (n < 15) { add('beetle', n - 6, .8); add('moth', 12, .3); add('caterp', n - 9, 2); add('ant', 14, .25); }
  else if (n === 15) { add('king', 1, 1); add('caterp', 3, 2.5); add('moth', 14, .3); }
  else { add('beetle', n - 6, .6); add('caterp', n - 11, 1.5); add('moth', 14, .25); if (n % 5 === 0) add('king', Math.floor((n - 10) / 5), 4); }
  return L.map(e => ({ ...e, hpMul: s }));
}

// ---------------------------------------------------------------- state
let towers, enemies, shots, effects, coins, lives, wave, spawnQ, spawnT, inWave, speed = 1, state = 'title', endless = false, killed, sel = null, TT = 0;
function newGame() { towers = []; enemies = []; shots = []; effects = []; coins = 170; lives = 20; wave = 0; spawnQ = []; spawnT = 0; inWave = false; killed = 0; endless = false; closePop(); hud(); }
const towerAt = (cx, cy) => towers.find(t => t.cx === cx && t.cy === cy);
const stat = t => TOWERS[t.type].lv[t.lvl];

function build(type, cx, cy) {
  const D = TOWERS[type]; if (coins < D.cost) return;
  coins -= D.cost; towers.push({ type, cx, cy, x: (cx + .5) * T, y: (cy + .5) * T, lvl: 0, cd: 0, ang: Math.PI / 2, spent: D.cost, pop: 1 });
  chord([523, 659], .05, 'triangle', .05, .12); closePop(); hud();
}
function upgrade(t) { const D = TOWERS[t.type], c = D.up[t.lvl]; if (c === undefined || coins < c) return; coins -= c; t.spent += c; t.lvl++; t.pop = 1; chord([659, 880, 1175], .05, 'triangle', .05, .15); closePop(); hud(); }
function sell(t) { coins += Math.floor(t.spent * .7); towers = towers.filter(x => x !== t); tone(400, .1, 'sine', .05, -200); closePop(); hud(); }
function startWave() {
  if (inWave || state !== 'play') return;
  wave++; spawnQ = waveList(wave); spawnT = .2; inWave = true; hud();
  toast(wave === 15 ? '👑 마지막 웨이브! 대왕 등장' : wave === 5 || wave === 10 ? `⚠️ 웨이브 ${wave}: 장군 등장!` : `웨이브 ${wave}`);
  tone(330, .2, 'square', .04, 100);
}
function spawnEnemy(e) {
  const E = ENEMIES[e.k]; enemies.push({ k: e.k, ...E, hp: E.hp * e.hpMul, max: E.hp * e.hpMul, pend: 0, d: 0, slow: 0, hit: 0, wob: rand(0, 6) });
}

// ---------------------------------------------------------------- update
function update(dt) {
  if (inWave) {
    spawnT -= dt;
    if (spawnT <= 0 && spawnQ.length) { const e = spawnQ.shift(); spawnEnemy(e); spawnT = e.gap; }
    if (!spawnQ.length && !enemies.length) {
      inWave = false; const bonus = 25 + wave * 7; coins += bonus; hud();
      if (wave >= WAVES && !endless) return win();
      toast(`웨이브 ${wave} 막았어요! +${bonus}코인`); chord([523, 659, 784], .07, 'triangle', .05, .2);
    }
  }
  for (const e of enemies) {
    const slowK = e.slow > 0 ? 1 - e.slowAmt : 1;
    e.d += e.spd * slowK * dt; e.slow = Math.max(0, e.slow - dt); e.hit = Math.max(0, e.hit - dt); e.wob += dt * 10;
    const p = posAt(e.d); e.x = p.x; e.y = p.y; e.ang = p.ang;
    if (e.d >= totalLen) { e.dead = true; lives -= e.boss ? 10 : e.k === 'caterp' ? 3 : 1; noise(.2, .1, 500); tone(150, .2, 'sawtooth', .05); hud(); if (lives <= 0) return lose(); }
  }
  enemies = enemies.filter(e => !e.dead);
  for (const t of towers) {
    const S = stat(t), range = S.range * T; t.cd -= dt; t.pop = Math.max(0, t.pop - dt * 3);
    const inR = enemies.filter(e => Math.hypot(e.x - t.x, e.y - t.y) <= range);
    if (t.type === 'ice') { for (const e of inR) { e.slow = .3; e.slowAmt = S.slow; } if (t.cd <= 0 && inR.length) { t.cd = S.rate; for (const e of inR) damage(e, S.dmg); effects.push({ k: 'frost', x: t.x, y: t.y, r: range, life: .4 }); } continue; }
    if (!inR.length) continue;
    const live = inR.filter(e => e.hp - e.pend > 0), pool = live.length ? live : inR;
    const tgt = pool.reduce((a, b) => (b.d > a.d ? b : a));
    t.ang = Math.atan2(tgt.y - t.y, tgt.x - t.x);
    if (t.cd <= 0) {
      t.cd = S.rate;
      if (!S.splash) tgt.pend += Math.max(1, S.dmg - (tgt.armor || 0));
      shots.push({ type: t.type, x: t.x, y: t.y, tgt, dmg: S.dmg, splash: S.splash ? S.splash * T : 0, spd: t.type === 'bee' ? 420 : t.type === 'spore' ? 220 : 320 });
      if (t.type === 'acorn') tone(500, .04, 'triangle', .02); else if (t.type === 'bee') tone(900 + rand(0, 100), .02, 'sawtooth', .008); else tone(300, .08, 'sine', .03);
    }
  }
  for (const s of shots) {
    if (s.tgt.dead && !s.splash) { s.dead = true; continue; }
    const dx = s.tgt.x - s.x, dy = s.tgt.y - s.y, d = Math.hypot(dx, dy), step = s.spd * dt;
    if (d <= step + 4) {
      s.dead = true;
      if (s.splash) { for (const e of enemies) if (Math.hypot(e.x - s.tgt.x, e.y - s.tgt.y) <= s.splash) damage(e, s.dmg); effects.push({ k: 'boom', x: s.tgt.x, y: s.tgt.y, r: s.splash, life: .35 }); }
      else { s.tgt.pend -= Math.max(1, s.dmg - (s.tgt.armor || 0)); damage(s.tgt, s.dmg); }
    } else { s.x += dx / d * step; s.y += dy / d * step; }
  }
  shots = shots.filter(s => !s.dead);
  for (const e of effects) e.life -= dt; effects = effects.filter(e => e.life > 0);
}
function damage(e, dmg) {
  if (e.dead) return;
  e.hp -= Math.max(1, dmg - (e.armor || 0)); e.hit = .1;
  if (e.hp <= 0) {
    e.dead = true; coins += e.gold; killed++;
    effects.push({ k: 'coin', x: e.x, y: e.y, txt: '+' + e.gold, life: .8 });
    for (let i = 0; i < 8; i++) effects.push({ k: 'part', x: e.x, y: e.y, vx: rand(-80, 80), vy: rand(-80, 80), c: e.col, life: .5 });
    if (e.boss) { toast('👑 대왕을 물리쳤어요!'); chord([523, 659, 784, 1047], .08, 'triangle', .07, .3); }
    tone(700 + rand(0, 200), .05, 'triangle', .03); hud();
  }
}
function win() {
  state = 'over'; chord([523, 659, 784, 1047, 1319], .09, 'triangle', .07, .3);
  const b = Kit.best('md_best'); b.submit(wave);
  $('overLbl').textContent = '🎉 승리!'; $('overTitle').textContent = '버섯 마을을 지켜냈어요!';
  $('finalScore').textContent = '❤️ ' + lives; $('overText').textContent = `15웨이브 모두 막았어요 · 물리친 해충 ${killed}마리. 무한 모드에서 기록에 도전해 보세요!`;
  $('endlessBtn').hidden = false; Kit.show('overScreen');
}
function lose() {
  state = 'over'; noise(.6, .15, 400); tone(120, .6, 'sawtooth', .07, -60);
  const isBest = Kit.best('md_best').submit(wave - 1);
  $('overLbl').textContent = isBest ? '🎉 최고 기록!' : '마을이 점령됐어요';
  $('overTitle').textContent = '해충들이 마을에 들어왔어요 🍄';
  $('finalScore').textContent = `웨이브 ${wave}`; $('overText').textContent = `물리친 해충 ${killed}마리. 얼음 버섯으로 느리게 하고, 포자포로 무리를 한꺼번에!`;
  $('endlessBtn').hidden = true; setTimeout(() => Kit.show('overScreen'), 500);
}
function hud() {
  $('coins').textContent = coins; $('lives').textContent = '❤️ ' + Math.max(0, lives);
  $('wave').textContent = endless ? `${wave}` : `${wave}/${WAVES}`;
  $('waveInfo').textContent = inWave ? `남은 적 ${spawnQ.length + enemies.length}` : '준비 중';
  $('waveBtn').disabled = inWave; $('waveBtn').textContent = inWave ? '공격 중…' : `▶ 웨이브 ${wave + 1} 시작`;
}

// ---------------------------------------------------------------- draw
function draw() {
  const c = ctx, { dpr, scale, ox, oy, vw, vh } = F;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.fillStyle = '#2a5a2a'; c.fillRect(0, 0, vw, vh);
  c.translate(ox, oy); c.scale(scale, scale);
  // grass
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) { c.fillStyle = (x + y) % 2 ? '#7ac85a' : '#86d466'; c.fillRect(x * T, y * T, T, T); }
  for (const d of deco) { if (d.k === 'flower') { c.fillStyle = d.c; for (let i = 0; i < 5; i++) { c.beginPath(); c.arc(d.x + Math.cos(i * 1.26) * 3, d.y + Math.sin(i * 1.26) * 3, 2.4, 0, 7); c.fill(); } c.fillStyle = '#ffd24a'; c.beginPath(); c.arc(d.x, d.y, 1.8, 0, 7); c.fill(); }
    else if (d.k === 'grass') { c.strokeStyle = '#4a9a3a'; c.lineWidth = 2; c.beginPath(); c.moveTo(d.x - 3, d.y + 4); c.lineTo(d.x - 4, d.y - 3); c.moveTo(d.x, d.y + 4); c.lineTo(d.x, d.y - 5); c.moveTo(d.x + 3, d.y + 4); c.lineTo(d.x + 4, d.y - 3); c.stroke(); }
    else { c.fillStyle = '#a8a8b0'; c.beginPath(); c.ellipse(d.x, d.y, 5, 3.5, 0, 0, 7); c.fill(); } }
  // path (clipped to the field)
  c.save(); c.beginPath(); c.rect(0, 0, W, H); c.clip();
  c.lineCap = 'round'; c.lineJoin = 'round';
  c.strokeStyle = '#b8894e'; c.lineWidth = T * .92; c.beginPath(); pathPts.forEach((p, i) => i ? c.lineTo(p.x, p.y) : c.moveTo(p.x, p.y)); c.stroke();
  c.strokeStyle = '#e0bc80'; c.lineWidth = T * .74; c.stroke();
  c.strokeStyle = 'rgba(160,110,60,.35)'; c.lineWidth = 2; c.setLineDash([3, 9]); c.stroke(); c.setLineDash([]);
  c.restore();
  // forest entrance (bushes either side of the start)
  for (const [bx, by, r, col] of [[14, 8, 22, '#3a8a3a'], [96, 6, 22, '#3a8a3a'], [0, 22, 16, '#4aa04a'], [110, 22, 15, '#4aa04a']]) { c.fillStyle = col; c.beginPath(); c.arc(bx, by, r, 0, 7); c.fill(); }
  c.fillStyle = 'rgba(20,40,10,.35)'; c.beginPath(); c.ellipse(60, 0, 22, 12, 0, 0, Math.PI); c.fill();
  c.strokeStyle = 'rgba(0,0,0,.25)'; c.lineWidth = 3; c.strokeRect(1.5, 1.5, W - 3, H - 3);
  // village at the end
  drawVillage(c, (4.5) * T, H - 4);
  // selection / build hint
  if (sel) {
    c.strokeStyle = '#fff'; c.lineWidth = 3; c.strokeRect(sel.cx * T + 2, sel.cy * T + 2, T - 4, T - 4);
    const t = towerAt(sel.cx, sel.cy), r = t ? stat(t).range : sel.preview ? TOWERS[sel.preview].lv[0].range : 0;
    if (r) { c.fillStyle = 'rgba(255,255,255,.12)'; c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 2; c.beginPath(); c.arc((sel.cx + .5) * T, (sel.cy + .5) * T, r * T, 0, 7); c.fill(); c.stroke(); }
  }
  for (const e of effects) if (e.k === 'frost') { c.fillStyle = `rgba(180,230,255,${e.life * .5})`; c.beginPath(); c.arc(e.x, e.y, e.r * (1.2 - e.life), 0, 7); c.fill(); }
  for (const t of towers) drawTower(c, t);
  for (const e of enemies) drawEnemy(c, e);
  for (const s of shots) {
    if (s.type === 'acorn') { c.fillStyle = '#8a5a2a'; c.beginPath(); c.ellipse(s.x, s.y, 4, 5, 0, 0, 7); c.fill(); c.fillStyle = '#5a3a1a'; c.fillRect(s.x - 4, s.y - 5, 8, 3); }
    else if (s.type === 'bee') { c.fillStyle = '#ffd24a'; c.beginPath(); c.ellipse(s.x, s.y, 3.5, 2.5, 0, 0, 7); c.fill(); c.fillStyle = '#2a1a0a'; c.fillRect(s.x - .8, s.y - 2.5, 1.6, 5); }
    else { c.fillStyle = 'rgba(255,255,255,.9)'; c.beginPath(); c.arc(s.x, s.y, 5, 0, 7); c.fill(); c.strokeStyle = '#ffd24a'; c.lineWidth = 1.5; for (let i = 0; i < 6; i++) { c.beginPath(); c.moveTo(s.x, s.y); c.lineTo(s.x + Math.cos(i + TT * 6) * 8, s.y + Math.sin(i + TT * 6) * 8); c.stroke(); } }
  }
  for (const e of effects) {
    if (e.k === 'boom') { c.fillStyle = `rgba(255,240,150,${e.life * 1.6})`; c.beginPath(); c.arc(e.x, e.y, e.r * (1.3 - e.life * 1.5), 0, 7); c.fill(); }
    else if (e.k === 'part') { e.x += e.vx / 60; e.y += e.vy / 60; c.globalAlpha = e.life * 2; c.fillStyle = e.c; c.fillRect(e.x - 2, e.y - 2, 4, 4); c.globalAlpha = 1; }
    else if (e.k === 'coin') { e.y -= .6; c.globalAlpha = Math.min(1, e.life * 2); c.fillStyle = '#ffe06a'; c.font = '800 12px "Pretendard Variable", sans-serif'; c.textAlign = 'center'; c.fillText(e.txt, e.x, e.y - 10); c.globalAlpha = 1; }
  }
  if (state === 'play' && wave === 0 && !towers.length) { c.fillStyle = 'rgba(0,0,0,.45)'; roundRect(c, 40, H / 2 - 22, W - 80, 44, 14); c.fill(); c.fillStyle = '#fff'; c.font = '800 14px "Pretendard Variable", sans-serif'; c.textAlign = 'center'; c.fillText('길 옆 풀밭을 탭해서 탑을 세워요', W / 2, H / 2 + 5); }
}
function drawVillage(c, x, y) {
  for (const [dx, s, col] of [[-48, .8, '#ff6a5a'], [0, 1.1, '#ff4a4a'], [48, .85, '#ffa040']]) {
    c.save(); c.translate(x + dx, y); c.scale(s, s);
    c.fillStyle = '#fff4e0'; roundRect(c, -12, -22, 24, 22, 4); c.fill(); c.fillStyle = '#8a5a3a'; roundRect(c, -4, -12, 8, 12, 3); c.fill();
    c.fillStyle = col; c.beginPath(); c.ellipse(0, -24, 22, 15, 0, Math.PI, 0); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(-8, -30, 3.5, 0, 7); c.arc(6, -33, 3, 0, 7); c.arc(10, -26, 2.5, 0, 7); c.fill();
    c.restore();
  }
}
function drawTower(c, t) {
  const s = 1 + t.pop * .2, x = t.x, y = t.y;
  c.save(); c.translate(x, y); c.scale(s, s);
  c.fillStyle = 'rgba(0,30,0,.25)'; c.beginPath(); c.ellipse(2, 13, 15, 5, 0, 0, 7); c.fill();
  if (t.type === 'acorn') {
    c.fillStyle = '#a8703a'; roundRect(c, -13, -4, 26, 18, 5); c.fill(); c.strokeStyle = '#5a3a1a'; c.lineWidth = 2; c.stroke();
    c.save(); c.rotate(t.ang); c.fillStyle = '#6a4220'; roundRect(c, 0, -4, 18, 8, 3); c.fill(); c.restore();
    c.fillStyle = '#c89a5a'; c.beginPath(); c.ellipse(0, -6, 9, 10, 0, 0, 7); c.fill(); c.fillStyle = '#6a4220'; c.beginPath(); c.ellipse(0, -12, 10, 5, 0, 0, 7); c.fill();
  } else if (t.type === 'bee') {
    c.fillStyle = '#f0b83a'; for (let i = 0; i < 3; i++) { c.beginPath(); c.ellipse(0, 8 - i * 8, 14 - i * 3, 6, 0, 0, 7); c.fill(); }
    c.strokeStyle = '#a8701a'; c.lineWidth = 1.5; c.stroke(); c.fillStyle = '#3a2a0a'; c.beginPath(); c.arc(0, 4, 3.5, 0, 7); c.fill();
    for (let i = 0; i < 2; i++) { const a = TT * 6 + i * 3; c.fillStyle = '#ffd24a'; c.beginPath(); c.arc(Math.cos(a) * 16, -6 + Math.sin(a) * 6, 2.5, 0, 7); c.fill(); }
  } else if (t.type === 'spore') {
    c.strokeStyle = '#3a8a3a'; c.lineWidth = 3; c.beginPath(); c.moveTo(0, 14); c.lineTo(0, -2); c.stroke();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(0, -8, 11, 0, 7); c.fill(); c.strokeStyle = 'rgba(200,200,200,.9)'; c.lineWidth = 1;
    for (let i = 0; i < 12; i++) { c.beginPath(); c.moveTo(0, -8); c.lineTo(Math.cos(i * .52) * 12, -8 + Math.sin(i * .52) * 12); c.stroke(); }
    c.fillStyle = '#ffd24a'; c.beginPath(); c.arc(0, -8, 3, 0, 7); c.fill();
  } else {
    c.fillStyle = '#e8f4ff'; roundRect(c, -5, -2, 10, 16, 3); c.fill();
    const g = c.createRadialGradient(-3, -10, 1, 0, -6, 15); g.addColorStop(0, '#e8fbff'); g.addColorStop(1, '#4ab0e8');
    c.fillStyle = g; c.beginPath(); c.ellipse(0, -4, 15, 11, 0, Math.PI, 0); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(-6, -9, 2.5, 0, 7); c.arc(5, -11, 2, 0, 7); c.fill();
  }
  // level stars
  for (let i = 0; i < t.lvl; i++) { c.fillStyle = '#ffd24a'; c.font = '9px sans-serif'; c.textAlign = 'center'; c.fillText('★', -6 + i * 12, 20); }
  c.restore();
}
function drawEnemy(c, e) {
  const wob = Math.sin(e.wob) * 1.5;
  c.save(); c.translate(e.x, e.y); c.rotate(e.ang + Math.PI / 2);
  if (e.hit > 0) c.filter = 'brightness(2.2)';
  c.fillStyle = 'rgba(0,30,0,.25)'; c.beginPath(); c.ellipse(2, 4, e.r, e.r * .7, 0, 0, 7); c.fill();
  if (e.k === 'ant') { c.fillStyle = e.col; for (const [y, r] of [[-7, 4], [0, 3.5], [8, 5.5]]) { c.beginPath(); c.arc(0, y + wob * .3, r, 0, 7); c.fill(); }
    c.strokeStyle = e.col; c.lineWidth = 1.5; for (const s of [-1, 1]) for (let i = 0; i < 3; i++) { c.beginPath(); c.moveTo(0, -2 + i * 3); c.lineTo(s * 8, -5 + i * 5 + wob * s); c.stroke(); } }
  else if (e.k === 'snail') { c.fillStyle = '#c8b090'; c.beginPath(); c.ellipse(0, 4, 7, 14, 0, 0, 7); c.fill();
    const g = c.createRadialGradient(-2, 4, 1, 0, 4, 12); g.addColorStop(0, '#ffd8a0'); g.addColorStop(1, '#c87a3a'); c.fillStyle = g; c.beginPath(); c.arc(0, 4, 11, 0, 7); c.fill();
    c.strokeStyle = '#8a4a1a'; c.lineWidth = 2; c.beginPath(); c.arc(0, 4, 6, 0, 5); c.stroke(); c.strokeStyle = '#a89070'; c.beginPath(); c.moveTo(-2, -9); c.lineTo(-4, -15); c.moveTo(2, -9); c.lineTo(4, -15); c.stroke(); }
  else if (e.k === 'beetle' || e.k === 'king') { const s = e.k === 'king' ? 1.6 : 1; c.scale(s, s);
    c.fillStyle = e.k === 'king' ? '#5a2a10' : '#1a2a4a'; c.beginPath(); c.arc(0, -9, 6, 0, 7); c.fill();
    if (e.k === 'king') { c.strokeStyle = '#3a1a08'; c.lineWidth = 3; c.beginPath(); c.moveTo(-3, -13); c.quadraticCurveTo(-12, -22, -4, -26); c.moveTo(3, -13); c.quadraticCurveTo(12, -22, 4, -26); c.stroke(); }
    const g = c.createLinearGradient(-12, 0, 12, 0); g.addColorStop(0, e.col); g.addColorStop(.5, '#fff8'); g.addColorStop(1, e.col);
    c.fillStyle = e.col; c.beginPath(); c.ellipse(0, 4, 11, 13, 0, 0, 7); c.fill(); c.fillStyle = 'rgba(255,255,255,.3)'; c.beginPath(); c.ellipse(-4, 0, 3, 7, 0, 0, 7); c.fill();
    c.strokeStyle = 'rgba(0,0,0,.4)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(0, -8); c.lineTo(0, 17); c.stroke();
    if (e.k === 'king') { c.fillStyle = '#ffd24a'; c.beginPath(); c.moveTo(-6, -14); c.lineTo(-4, -19); c.lineTo(0, -15); c.lineTo(4, -19); c.lineTo(6, -14); c.fill(); } }
  else if (e.k === 'moth') { const f = Math.sin(e.wob * 3) * .4 + .8; c.fillStyle = e.col;
    c.beginPath(); c.ellipse(-8 * f, 0, 9 * f, 7, -.4, 0, 7); c.ellipse(8 * f, 0, 9 * f, 7, .4, 0, 7); c.fill(); c.fillStyle = '#6a5a8a'; c.beginPath(); c.ellipse(0, 0, 3, 9, 0, 0, 7); c.fill(); }
  else if (e.k === 'caterp') { for (let i = 4; i >= 0; i--) { c.fillStyle = i % 2 ? '#5ab83a' : '#8ae05a'; c.beginPath(); c.arc(Math.sin(e.wob + i) * 2, i * 8 - 12, 9 - i * .6, 0, 7); c.fill(); }
    c.fillStyle = '#ffd24a'; c.beginPath(); c.moveTo(-7, -20); c.lineTo(-4, -27); c.lineTo(0, -21); c.lineTo(4, -27); c.lineTo(7, -20); c.fill(); }
  c.restore();
  if (e.slow > 0) { c.strokeStyle = 'rgba(160,220,255,.8)'; c.lineWidth = 2; c.beginPath(); c.arc(e.x, e.y, e.r + 3, 0, 7); c.stroke(); }
  if (e.hp < e.max) { const w = e.r * 2; c.fillStyle = 'rgba(0,0,0,.5)'; c.fillRect(e.x - w / 2, e.y - e.r - 9, w, 4); c.fillStyle = e.hp / e.max > .4 ? '#7cf09a' : '#ff6a5a'; c.fillRect(e.x - w / 2, e.y - e.r - 9, w * Math.max(0, e.hp / e.max), 4); }
}

// ---------------------------------------------------------------- input / popovers
function closePop() { $('pop').hidden = true; sel = null; }
function openPop(cx, cy, sx, sy) {
  const pop = $('pop'), opts = $('popOpts'); opts.textContent = '';
  const t = towerAt(cx, cy);
  sel = { cx, cy };
  if (t) {
    const D = TOWERS[t.type], S = stat(t), up = D.up[t.lvl];
    $('popTitle').textContent = `${D.ico} ${D.name} ${'★'.repeat(t.lvl + 1)}`;
    const b1 = document.createElement('button'); b1.type = 'button';
    if (up !== undefined) { const N = D.lv[t.lvl + 1]; b1.innerHTML = `<span class="ico">⬆️</span><span>강화<small>공격 ${S.dmg}→${N.dmg} · 사거리 ${S.range}→${N.range}</small></span><b>${up}</b>`; b1.disabled = coins < up; b1.onclick = () => upgrade(t); }
    else { b1.innerHTML = `<span class="ico">⭐</span><span>최고 단계<small>더 강화할 수 없어요</small></span><b></b>`; b1.disabled = true; }
    const b2 = document.createElement('button'); b2.type = 'button'; b2.innerHTML = `<span class="ico">💰</span><span>판매<small>들인 코인의 70%</small></span><b>+${Math.floor(t.spent * .7)}</b>`; b2.onclick = () => sell(t);
    opts.append(b1, b2);
  } else {
    $('popTitle').textContent = '수비탑 세우기';
    for (const [k, D] of Object.entries(TOWERS)) {
      const b = document.createElement('button'); b.type = 'button'; const S = D.lv[0];
      b.innerHTML = `<span class="ico">${D.ico}</span><span>${D.name}<small>${D.desc} · 사거리 ${S.range}</small></span><b>${D.cost}</b>`;
      b.disabled = coins < D.cost; b.onclick = () => build(k, cx, cy);
      b.onpointerenter = () => { sel.preview = k; }; b.onfocus = () => { sel.preview = k; };
      opts.append(b);
    }
  }
  pop.hidden = false;
  const pw = 230, ph = pop.offsetHeight;
  pop.style.left = clamp(sx - pw / 2, 8, innerWidth - pw - 8) + 'px';
  pop.style.top = (sy + 30 + ph > innerHeight - 70 ? sy - ph - 30 : sy + 30) + 'px';
}
cv.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  const x = (e.clientX - F.ox) / F.scale, y = (e.clientY - F.oy) / F.scale, cx = Math.floor(x / T), cy = Math.floor(y / T);
  if (cx < 0 || cy < 0 || cx >= COLS || cy >= ROWS || pathCells.has(cx + ',' + cy)) { closePop(); return; }
  if (sel && sel.cx === cx && sel.cy === cy) { closePop(); return; }
  openPop(cx, cy, e.clientX, e.clientY);
});
addEventListener('keydown', e => { if (e.key === 'Escape') closePop(); if ((e.key === ' ' || e.key === 'Enter') && state === 'play' && document.activeElement === document.body) { e.preventDefault(); startWave(); } });
$('waveBtn').onclick = startWave;
$('speedBtn').onclick = () => { speed = speed === 1 ? 2 : 1; $('speedBtn').textContent = `×${speed} 속도`; $('speedBtn').classList.toggle('on', speed === 2); };
function start() { newGame(); state = 'play'; Kit.hide('startScreen', 'overScreen'); $('bottom').hidden = false; }
$('startBtn').onclick = start; $('againBtn').onclick = start;
$('endlessBtn').onclick = () => { endless = true; state = 'play'; Kit.hide('overScreen'); hud(); toast('무한 모드! 어디까지 버틸까요?'); };
Kit.bindMute($('muteBtn'));

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; TT += dt;
  if (state === 'play') { const sub = speed; for (let i = 0; i < sub; i++) update(dt); if (inWave) $('waveInfo').textContent = `남은 적 ${spawnQ.length + enemies.length}`; }
  draw(); requestAnimationFrame(frame);
}
newGame(); requestAnimationFrame(frame);
if (location.hash === '#test') window.__game = { s: () => ({ coins, lives, wave, inWave, state, towers: towers.length, enemies: enemies.length, killed }), build, startWave, upgrade: i => upgrade(towers[i]), towers: () => towers, pathCells: [...pathCells], setSpeed: v => { speed = v; } };
})();
</script>
