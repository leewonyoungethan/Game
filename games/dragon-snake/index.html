<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>꼬마 용 꼬리잡기</title>
<meta name="theme-color" content="#2a6a3a">
<link rel="icon" href="../../icons/dragon-snake.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../_shared/kit.css">
<style>
  :root { --bg: #1e4a2a; --panel: rgba(10, 40, 20, .6); --a1: #7cf09a; --a2: #3ad0c0; --a3: #ffd24a; --ink-on-grad: #06301e; --glow: rgba(124,240,154,.35); }
  .pad { position: fixed; z-index: 6; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
    display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(2, 50px); gap: 6px; }
  .pad button { border-radius: 14px; border: 1px solid var(--line); background: var(--panel); color: #fff; font-size: 20px; cursor: pointer; backdrop-filter: blur(8px); touch-action: none; }
  .pad button:active { background: rgba(124,240,154,.3); }
  .pad .u { grid-column: 2; } .pad .l { grid-column: 1; grid-row: 2; } .pad .d { grid-column: 2; grid-row: 2; } .pad .r { grid-column: 3; grid-row: 2; }
  @media (pointer: fine) and (min-width: 700px) { .pad { display: none; } }
</style>
</head>
<body>
<canvas class="stage" id="cv"></canvas>
<div class="hud">
  <div class="group">
    <div class="box"><div class="lbl">점수</div><div class="big" id="score">0</div><div class="sub" id="best">최고 0</div></div>
    <div class="box"><div class="lbl">길이</div><div class="big" id="len">3</div><div class="sub" id="modeLbl">쉬움</div></div>
  </div>
  <div class="stack">
    <a class="pill" href="../../">← 게임 센터</a>
    <button class="pill" id="muteBtn" type="button"></button>
  </div>
</div>
<div class="pad" id="pad" hidden>
  <button class="u" data-d="0,-1" type="button" aria-label="위">▲</button>
  <button class="l" data-d="-1,0" type="button" aria-label="왼쪽">◀</button>
  <button class="d" data-d="0,1" type="button" aria-label="아래">▼</button>
  <button class="r" data-d="1,0" type="button" aria-label="오른쪽">▶</button>
</div>

<div class="screen" id="startScreen">
  <div class="card">
    <div class="lbl">앱개발부 아케이드</div>
    <h1>꼬마 용 <span>꼬리잡기</span></h1>
    <p>배고픈 꼬마 용이 과일을 먹을수록 길어져요. 자기 꼬리나 바위에 부딪히지 않게 조심!</p>
    <div class="rules">
      <div><b>👆</b><span>스와이프 · 방향키 · WASD · 아래 버튼으로 방향 바꾸기</span></div>
      <div><b>🍎</b><span>사과 +10 · 💎 보석 +50 (곧 사라져요) · 🌶️ 고추 +20, 잠깐 빨라져요</span></div>
      <div><b>🪨</b><span>길어질수록 바위가 생겨요</span></div>
    </div>
    <div class="seg" id="modeSeg"><button type="button" data-m="0">쉬움 · 벽 통과</button><button type="button" data-m="1">보통 · 벽 조심</button></div>
    <button class="go" id="startBtn" type="button">시작하기</button>
  </div>
</div>
<div class="screen" id="overScreen" hidden>
  <div class="card">
    <div class="lbl" id="overLbl"></div>
    <div class="final" id="finalScore">0</div>
    <p id="overText"></p>
    <button class="go" id="againBtn" type="button">다시 하기</button>
    <div class="row"><button class="go ghost" id="menuBtn" type="button">모드 바꾸기</button></div>
  </div>
</div>

<script src="../_shared/kit.js"></script>
<script>
(() => {
'use strict';
const { $, rand, randi, pick, roundRect, tone, noise, chord, toast } = Kit;
const C = 15, R = 20, T = 24;                    // grid columns, rows, cell size
const cv = $('cv'), ctx = cv.getContext('2d');
let F; function resize() { F = Kit.fit(cv, C * T, R * T, { top: 96, bottom: 136 }); } addEventListener('resize', resize); resize();
let mode = Kit.store.get('ds_mode', 0), state = 'title';
let snake, dir, queue, foods, rocks, score, grow, stepT, stepK, speedBoost, parts, floats, eaten, shake, deathT, gemT;

const key = (x, y) => x + ',' + y;
function newGame() {
  snake = [{ x: 7, y: 12 }, { x: 7, y: 13 }, { x: 7, y: 14 }].map(p => ({ ...p, px: p.x, py: p.y }));
  dir = { x: 0, y: -1 }; queue = []; foods = []; rocks = []; score = 0; grow = 0; stepT = 0; stepK = 0; speedBoost = 0; parts = []; floats = []; eaten = 0; shake = 0; deathT = 0; gemT = 6;
  placeFood('apple'); hud();
}
function occupied(x, y) { return snake.some(s => s.x === x && s.y === y) || rocks.some(r => r.x === x && r.y === y) || foods.some(f => f.x === x && f.y === y); }
function freeCell(margin = 0) {
  for (let i = 0; i < 500; i++) {
    const x = randi(margin, C - 1 - margin), y = randi(margin, R - 1 - margin);
    const h = snake[0]; if (Math.abs(h.x - x) + Math.abs(h.y - y) < 3) continue;
    if (!occupied(x, y)) return { x, y };
  }
  return null;
}
function placeFood(type) { const c = freeCell(); if (c) foods.push({ ...c, type, born: performance.now(), life: type === 'gem' ? 7 : Infinity }); }
function interval() { return Math.max(.065, .16 - snake.length * .0028) * (speedBoost > 0 ? .62 : 1); }

function turn(dx, dy) {
  if (state !== 'play') return;
  const lastDir = queue.length ? queue[queue.length - 1] : dir;
  if ((dx === -lastDir.x && dy === -lastDir.y) || (dx === lastDir.x && dy === lastDir.y)) return;
  if (queue.length < 2) queue.push({ x: dx, y: dy });
}
function step() {
  if (queue.length) dir = queue.shift();
  const h = snake[0]; let nx = h.x + dir.x, ny = h.y + dir.y, wrapped = false;
  if (nx < 0 || ny < 0 || nx >= C || ny >= R) {
    if (mode === 0) { nx = (nx + C) % C; ny = (ny + R) % R; wrapped = true; }
    else return die('벽에 쿵!');
  }
  const willGrow = grow > 0;
  const body = willGrow ? snake : snake.slice(0, -1);
  if (body.some(s => s.x === nx && s.y === ny)) return die('꼬리를 물었어요!');
  if (rocks.some(r => r.x === nx && r.y === ny)) return die('바위에 쿵!');
  for (const s of snake) { s.px = s.x; s.py = s.y; }
  const head = { x: nx, y: ny, px: wrapped ? nx - dir.x : h.x, py: wrapped ? ny - dir.y : h.y };
  snake.unshift(head);
  if (grow > 0) grow--; else snake.pop();
  // tail piece keeps interpolating from its old position
  const fi = foods.findIndex(f => f.x === nx && f.y === ny);
  if (fi >= 0) eat(foods.splice(fi, 1)[0]);
}
function eat(f) {
  const cx = (f.x + .5) * T, cy = (f.y + .5) * T, pts = { apple: 10, gem: 50, chili: 20 }[f.type];
  score += pts; eaten++; grow += f.type === 'gem' ? 2 : 1;
  floats.push({ x: cx, y: cy, txt: '+' + pts, life: 1, c: f.type === 'gem' ? '#8af6ff' : f.type === 'chili' ? '#ff8a6a' : '#fff6c0' });
  const cols = { apple: ['#ff5a5a', '#7cf09a', '#fff'], gem: ['#8af6ff', '#fff', '#b8a8ff'], chili: ['#ff5a2a', '#ffd24a', '#fff'] }[f.type];
  for (let i = 0; i < 14; i++) parts.push({ x: cx, y: cy, vx: rand(-120, 120), vy: rand(-140, 60), life: rand(.3, .7), c: pick(cols), r: rand(1.5, 3.5) });
  if (f.type === 'chili') { speedBoost = 4; toast('🌶️ 매워서 빨라졌어요!'); tone(300, .25, 'sawtooth', .05, 500); }
  else tone(f.type === 'gem' ? 1320 : 660 + Math.min(eaten, 20) * 20, .08, 'triangle', .07);
  if (f.type === 'apple') placeFood(Math.random() < .14 ? 'chili' : 'apple');
  if (!foods.some(x => x.type === 'apple')) placeFood('apple');
  // rocks appear as the dragon grows
  const wantRocks = Math.min(12, Math.floor((snake.length + grow - 3) / 5));
  while (rocks.length < wantRocks) { const c = freeCell(1); if (!c) break; rocks.push({ ...c, born: performance.now() }); if (rocks.length === 1) toast('바위가 생겼어요! 🪨'); }
  hud();
}
function die(msg) {
  state = 'dying'; deathT = 0; shake = 14; noise(.4, .15, 500); tone(160, .5, 'sawtooth', .07, -90);
  const h = snake[0]; for (let i = 0; i < 30; i++) parts.push({ x: (h.x + .5) * T, y: (h.y + .5) * T, vx: rand(-200, 200), vy: rand(-220, 120), life: rand(.4, 1), c: pick(['#7cf09a', '#ffd24a', '#fff']), r: rand(2, 4) });
  const isBest = Kit.best('ds_best_' + mode).submit(score);
  $('overLbl').textContent = isBest ? '🎉 최고 기록!' : msg;
  $('finalScore').textContent = score;
  $('overText').textContent = `${msg} · 길이 ${snake.length} · 먹은 음식 ${eaten}개`;
  setTimeout(() => { state = 'over'; Kit.show('overScreen'); }, 900);
}
function hud() {
  $('score').textContent = score; $('len').textContent = snake.length + grow;
  $('best').textContent = '최고 ' + Math.max(Kit.store.get('ds_best_' + mode, 0) || 0, score);
  $('modeLbl').textContent = mode ? '보통 · 벽 조심' : '쉬움 · 벽 통과';
}

// ---------------------------------------------------------------- loop
let last = performance.now(), TT = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; TT += dt;
  if (state === 'play') {
    speedBoost = Math.max(0, speedBoost - dt);
    stepT += dt; const iv = interval();
    while (stepT >= iv && state === 'play') { stepT -= iv; step(); }
    stepK = Math.min(1, stepT / iv);
    gemT -= dt; if (gemT <= 0) { if (!foods.some(f => f.type === 'gem')) placeFood('gem'); gemT = rand(9, 15); }
    for (const f of foods) if (f.type === 'gem' && (now - f.born) / 1000 > f.life) f.dead = true;
    foods = foods.filter(f => !f.dead);
  } else if (state === 'dying') deathT += dt;
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; p.life -= dt; } parts = parts.filter(p => p.life > 0);
  for (const f of floats) { f.y -= 40 * dt; f.life -= dt; } floats = floats.filter(f => f.life > 0);
  shake = Math.max(0, shake - dt * 40);
  draw(now); requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- draw
function draw(now) {
  const c = ctx, { dpr, scale, ox, oy, vw, vh } = F, W = C * T, H = R * T;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const bg = c.createLinearGradient(0, 0, 0, vh); bg.addColorStop(0, '#3a8a4a'); bg.addColorStop(1, '#14361e');
  c.fillStyle = bg; c.fillRect(0, 0, vw, vh);
  c.translate(ox + (Math.random() - .5) * shake, oy + (Math.random() - .5) * shake); c.scale(scale, scale);
  // board
  c.fillStyle = mode ? '#5a3a20' : '#2a6a3a'; roundRect(c, -8, -8, W + 16, H + 16, 16); c.fill();
  if (!mode) { c.strokeStyle = 'rgba(255,255,255,.35)'; c.setLineDash([6, 6]); c.lineWidth = 2; roundRect(c, -5, -5, W + 10, H + 10, 14); c.stroke(); c.setLineDash([]); }
  for (let y = 0; y < R; y++) for (let x = 0; x < C; x++) { c.fillStyle = (x + y) % 2 ? '#8ad86a' : '#7ccc5c'; c.fillRect(x * T, y * T, T, T); }
  // rocks
  for (const r of rocks) {
    const k = Math.min(1, (now - r.born) / 300), x = (r.x + .5) * T, y = (r.y + .5) * T;
    c.save(); c.translate(x, y); c.scale(k, k);
    c.fillStyle = 'rgba(0,0,0,.2)'; c.beginPath(); c.ellipse(2, 7, 11, 4, 0, 0, 7); c.fill();
    const g = c.createLinearGradient(0, -10, 0, 10); g.addColorStop(0, '#b8bcc8'); g.addColorStop(1, '#6a6e7c');
    c.fillStyle = g; c.beginPath(); c.moveTo(-10, 6); c.lineTo(-9, -4); c.lineTo(-2, -10); c.lineTo(7, -7); c.lineTo(10, 2); c.lineTo(6, 8); c.closePath(); c.fill();
    c.strokeStyle = '#4a4e5a'; c.lineWidth = 1.5; c.stroke(); c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.ellipse(-3, -5, 4, 2, -.5, 0, 7); c.fill();
    c.restore();
  }
  // food
  for (const f of foods) {
    const x = (f.x + .5) * T, y = (f.y + .5) * T + Math.sin(now / 250 + f.x) * 1.5, age = (now - f.born) / 1000;
    const blink = f.type === 'gem' && f.life - age < 2 && Math.floor(age * 8) % 2;
    if (blink) continue;
    c.save(); c.translate(x, y); c.scale(Math.min(1, age * 5), Math.min(1, age * 5));
    if (f.type === 'apple') {
      const g = c.createRadialGradient(-3, -3, 1, 0, 0, 10); g.addColorStop(0, '#ff9a9a'); g.addColorStop(1, '#d8202a');
      c.fillStyle = g; c.beginPath(); c.arc(-3, 1, 7, 0, 7); c.arc(3, 1, 7, 0, 7); c.fill();
      c.strokeStyle = '#5a3010'; c.lineWidth = 2; c.beginPath(); c.moveTo(0, -5); c.lineTo(1, -10); c.stroke();
      c.fillStyle = '#3ac04a'; c.beginPath(); c.ellipse(4, -8, 4, 2, -.5, 0, 7); c.fill();
      c.fillStyle = 'rgba(255,255,255,.6)'; c.beginPath(); c.ellipse(-4, -2, 2, 3, -.5, 0, 7); c.fill();
    } else if (f.type === 'gem') {
      const g2 = c.createRadialGradient(0, 0, 0, 0, 0, 18); g2.addColorStop(0, 'rgba(140,246,255,.6)'); g2.addColorStop(1, 'rgba(140,246,255,0)'); c.fillStyle = g2; c.beginPath(); c.arc(0, 0, 18, 0, 7); c.fill();
      c.fillStyle = '#5ae0ff'; c.beginPath(); c.moveTo(0, -10); c.lineTo(9, -2); c.lineTo(0, 10); c.lineTo(-9, -2); c.closePath(); c.fill();
      c.fillStyle = '#d8fbff'; c.beginPath(); c.moveTo(0, -10); c.lineTo(9, -2); c.lineTo(0, 0); c.lineTo(-9, -2); c.closePath(); c.fill();
      c.strokeStyle = '#1a6a9a'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(0, -10); c.lineTo(9, -2); c.lineTo(0, 10); c.lineTo(-9, -2); c.closePath(); c.stroke();
    } else {
      c.rotate(.5); const g = c.createLinearGradient(-8, 0, 8, 0); g.addColorStop(0, '#ff7a4a'); g.addColorStop(1, '#c8100a');
      c.fillStyle = g; c.beginPath(); c.moveTo(-8, -3); c.quadraticCurveTo(6, -6, 10, 6); c.quadraticCurveTo(0, 2, -8, 4); c.closePath(); c.fill();
      c.fillStyle = '#3ac04a'; c.fillRect(-11, -3, 4, 6);
    }
    c.restore();
  }
  drawDragon(c, now);
  for (const p of parts) { c.globalAlpha = Math.max(0, p.life * 1.5); c.fillStyle = p.c; c.beginPath(); c.arc(p.x, p.y, p.r, 0, 7); c.fill(); }
  c.globalAlpha = 1; c.textAlign = 'center'; c.font = '900 15px "Pretendard Variable", system-ui, sans-serif';
  for (const f of floats) { c.globalAlpha = Math.min(1, f.life * 2); c.lineWidth = 4; c.strokeStyle = 'rgba(0,40,10,.5)'; c.strokeText(f.txt, f.x, f.y); c.fillStyle = f.c; c.fillText(f.txt, f.x, f.y); }
  c.globalAlpha = 1;
  if (state === 'play' && snake.length === 3 && eaten === 0 && stepT < .5 && TT < 3) { c.fillStyle = 'rgba(255,255,255,.85)'; c.font = '800 14px "Pretendard Variable", sans-serif'; c.fillText('방향을 바꿔 사과를 먹어요!', W / 2, H - 16); }
}
function segPos(s, i) {
  const k = state === 'play' ? stepK : 1;
  let px = s.px, py = s.py;
  if (Math.abs(s.x - px) > 1 || Math.abs(s.y - py) > 1) { px = s.x; py = s.y; }  // wrapped: no tween across the board
  return { x: (px + (s.x - px) * k + .5) * T, y: (py + (s.y - py) * k + .5) * T };
}
function drawDragon(c, now) {
  const n = snake.length, pts = snake.map(segPos);
  // body: one continuous tapered tube from tail to neck (split where the dragon wraps around the edge)
  const hot = speedBoost > 0, dark = hot ? '#b8401a' : '#1e7a3a', mid = hot ? '#f0703a' : '#46b85a', light = hot ? '#ffd0a0' : '#b8ff9a';
  const width = i => T * (.92 - (i / Math.max(1, n - 1)) * .42);
  c.lineCap = 'round'; c.lineJoin = 'round';
  for (const [col, k, off] of [['rgba(0,40,10,.2)', 1, 3], [dark, 1, 0], [mid, .78, 0], [light, .3, -T * .12]]) {
    c.strokeStyle = col;
    for (let i = n - 1; i >= 1; i--) {
      const a = pts[i], b = pts[i - 1];
      if (Math.hypot(a.x - b.x, a.y - b.y) > T * 1.6) continue;
      c.lineWidth = width(i) * k; c.beginPath(); c.moveTo(a.x + (off > 0 ? off : 0), a.y + off); c.lineTo(b.x + (off > 0 ? off : 0), b.y + off); c.stroke();
    }
  }
  // back spikes
  c.fillStyle = '#ffd24a'; c.strokeStyle = '#a8700a'; c.lineWidth = 1.2;
  for (let i = 2; i < n - 1; i += 2) {
    const a = pts[i], b = pts[i - 1]; if (Math.hypot(a.x - b.x, a.y - b.y) > T * 1.6) continue;
    const ang = Math.atan2(b.y - a.y, b.x - a.x), nx = Math.cos(ang - Math.PI / 2), ny = Math.sin(ang - Math.PI / 2), w = width(i) * .5;
    c.beginPath(); c.moveTo(a.x + nx * w - Math.cos(ang) * 3, a.y + ny * w - Math.sin(ang) * 3); c.lineTo(a.x + nx * (w + 6), a.y + ny * (w + 6)); c.lineTo(a.x + nx * w + Math.cos(ang) * 3, a.y + ny * w + Math.sin(ang) * 3); c.closePath(); c.fill(); c.stroke();
  }
  // tail tip
  if (n > 1) { const t = pts[n - 1], u = pts[n - 2], ang = Math.atan2(t.y - u.y, t.x - u.x);
    if (Math.hypot(t.x - u.x, t.y - u.y) <= T * 1.6) { c.fillStyle = '#ffd24a'; c.beginPath(); c.moveTo(t.x + Math.cos(ang) * 10, t.y + Math.sin(ang) * 10); c.lineTo(t.x + Math.cos(ang + 2.3) * 6, t.y + Math.sin(ang + 2.3) * 6); c.lineTo(t.x + Math.cos(ang - 2.3) * 6, t.y + Math.sin(ang - 2.3) * 6); c.fill(); } }
  // head
  const h = pts[0], ang = Math.atan2(dir.y, dir.x);
  c.save(); c.translate(h.x, h.y); c.rotate(ang);
  const r = T * .55;
  c.fillStyle = 'rgba(0,40,10,.2)'; c.beginPath(); c.ellipse(2, 3, r, r * .85, 0, 0, 7); c.fill();
  // horns
  c.fillStyle = '#ffe08a'; c.strokeStyle = '#8a5a10'; c.lineWidth = 1.5;
  for (const s of [-1, 1]) { c.beginPath(); c.moveTo(-r * .4, s * r * .55); c.lineTo(-r * 1.1, s * r * 1.0); c.lineTo(-r * .1, s * r * .7); c.closePath(); c.fill(); c.stroke(); }
  const g = c.createRadialGradient(-r * .2, -r * .3, 1, 0, 0, r * 1.1);
  g.addColorStop(0, speedBoost > 0 ? '#ffd0a0' : '#c8ffaa'); g.addColorStop(1, speedBoost > 0 ? '#e0602a' : '#3aaa52');
  c.fillStyle = g; c.beginPath(); c.ellipse(0, 0, r * 1.05, r * .85, 0, 0, 7); c.fill();
  c.strokeStyle = '#1e6a2e'; c.lineWidth = 1.5; c.stroke();
  // snout + nostrils
  c.fillStyle = speedBoost > 0 ? '#ffe0c0' : '#e0ffc8'; c.beginPath(); c.ellipse(r * .55, 0, r * .45, r * .5, 0, 0, 7); c.fill();
  c.fillStyle = '#1e5a2a'; c.beginPath(); c.arc(r * .85, -r * .18, 1.6, 0, 7); c.arc(r * .85, r * .18, 1.6, 0, 7); c.fill();
  // eyes
  const blink = Math.floor(now / 2600) % 3 === 0 && (now % 2600) < 140;
  for (const s of [-1, 1]) {
    c.fillStyle = '#fff'; c.beginPath(); c.arc(r * .05, s * r * .42, r * .3, 0, 7); c.fill();
    if (state === 'dying' || state === 'over') { c.strokeStyle = '#1a2a1a'; c.lineWidth = 2; c.beginPath(); c.moveTo(r * -.1, s * r * .42 - 3); c.lineTo(r * .2, s * r * .42 + 3); c.moveTo(r * .2, s * r * .42 - 3); c.lineTo(r * -.1, s * r * .42 + 3); c.stroke(); }
    else if (blink) { c.strokeStyle = '#1a2a1a'; c.lineWidth = 2; c.beginPath(); c.moveTo(r * -.12, s * r * .42); c.lineTo(r * .22, s * r * .42); c.stroke(); }
    else { c.fillStyle = '#1a2a1a'; c.beginPath(); c.arc(r * .14, s * r * .42, r * .16, 0, 7); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.arc(r * .2, s * r * .42 - 2, 1.3, 0, 7); c.fill(); }
  }
  c.fillStyle = 'rgba(255,110,150,.45)'; c.beginPath(); c.ellipse(-r * .15, -r * .75, 3, 2, 0, 0, 7); c.ellipse(-r * .15, r * .75, 3, 2, 0, 0, 7); c.fill();
  if (speedBoost > 0) { c.fillStyle = `rgba(255,${120 + Math.random() * 80 | 0},40,.85)`; c.beginPath(); c.moveTo(r * 1, 0); c.lineTo(r * 1.9, -r * .35); c.lineTo(r * 1.6, 0); c.lineTo(r * 1.9, r * .35); c.closePath(); c.fill(); }
  c.restore();
}

// ---------------------------------------------------------------- input
const DIRS = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] };
addEventListener('keydown', e => { const d = DIRS[e.key] || DIRS[e.key.toLowerCase()]; if (d && state === 'play') { e.preventDefault(); turn(...d); } });
let sw = null;
cv.addEventListener('pointerdown', e => { sw = { x: e.clientX, y: e.clientY }; });
addEventListener('pointermove', e => {
  if (!sw || state !== 'play') return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (Math.hypot(dx, dy) > 26) { Math.abs(dx) > Math.abs(dy) ? turn(Math.sign(dx), 0) : turn(0, Math.sign(dy)); sw = { x: e.clientX, y: e.clientY }; }
});
addEventListener('pointerup', () => { sw = null; });
document.querySelectorAll('.pad button').forEach(b => { const [dx, dy] = b.dataset.d.split(',').map(Number); b.addEventListener('pointerdown', e => { e.preventDefault(); turn(dx, dy); }); });

const segs = [...$('modeSeg').children];
function paintMode() { segs.forEach(b => b.classList.toggle('on', +b.dataset.m === mode)); }
segs.forEach(b => b.onclick = () => { mode = +b.dataset.m; Kit.store.set('ds_mode', mode); paintMode(); hud(); });
function start() { newGame(); state = 'play'; Kit.hide('startScreen', 'overScreen'); $('pad').hidden = false; }
$('startBtn').onclick = start; $('againBtn').onclick = start;
$('menuBtn').onclick = () => { Kit.hide('overScreen'); state = 'title'; $('pad').hidden = true; Kit.show('startScreen'); };
Kit.bindMute($('muteBtn'));
paintMode(); newGame(); requestAnimationFrame(frame);
if (location.hash === '#test') window.__game = { s: () => ({ snake, dir, foods, rocks, state, score, C, R, mode }), turn };
})();
</script>
