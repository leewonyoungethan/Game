<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>말랑 슬라임 키우기</title>
<meta name="theme-color" content="#2a1f4a">
<link rel="icon" href="../../icons/slime-pet.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../_shared/kit.css">
<style>
  :root { --bg: #241b40; --a1: #7af0c0; --a2: #6ab8ff; --a3: #c08aff; --ink-on-grad: #0a2a2a; --glow: rgba(120,220,200,.35); }
  .top { position: fixed; z-index: 6; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 0; display: grid; gap: 8px; pointer-events: none; }
  .top > * { pointer-events: auto; }
  .top[hidden], .actions[hidden] { display: none; }
  .row1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .name { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 6px 12px; backdrop-filter: blur(8px); min-width: 0; }
  .name b { font-size: 17px; font-weight: 850; letter-spacing: -.03em; }
  .name .sub { display: flex; gap: 8px; align-items: center; }
  .xp { height: 5px; width: 120px; border-radius: 9px; background: rgba(255,255,255,.12); overflow: hidden; margin-top: 4px; }
  .xp i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #7af0c0, #6ab8ff); transition: width .4s; }
  .r { display: flex; gap: 6px; align-items: center; }
  .coins { font-weight: 850; font-variant-numeric: tabular-nums; }
  .bars { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .bar { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 5px 8px 6px; backdrop-filter: blur(8px); }
  .bar .l { font-size: 11px; font-weight: 750; color: var(--muted); display: flex; justify-content: space-between; gap: 2px; white-space: nowrap; }
  .bar .l span:first-child { overflow: hidden; text-overflow: ellipsis; }
  .bar .t { height: 6px; border-radius: 9px; background: rgba(255,255,255,.12); overflow: hidden; margin-top: 4px; }
  .bar .t i { display: block; height: 100%; border-radius: 9px; transition: width .4s, background .4s; }
  .bar.low { animation: low 1s infinite; }
  @keyframes low { 50% { border-color: rgba(255,90,110,.8); } }
  .actions { position: fixed; z-index: 6; left: 0; right: 0; bottom: 0; padding: 8px 10px calc(env(safe-area-inset-bottom, 0px) + 10px); display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; background: linear-gradient(180deg, transparent, rgba(10,8,24,.7) 40%); }
  .act { display: grid; justify-items: center; gap: 2px; padding: 8px 0 6px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 12px; font-weight: 750; cursor: pointer; backdrop-filter: blur(8px); }
  .act span { font-size: 22px; line-height: 1; }
  .act:disabled { opacity: .45; }
  .act.on { border-color: #7af0c0; background: rgba(122,240,192,.18); }
  .sheet { position: fixed; z-index: 7; left: 0; right: 0; bottom: 0; max-height: 72vh; overflow-y: auto; background: #1c1636; border-top: 1px solid var(--line); border-radius: 22px 22px 0 0; padding: 14px 14px calc(env(safe-area-inset-bottom, 0px) + 16px); box-shadow: 0 -20px 50px rgba(0,0,0,.5); transform: translateY(0); transition: transform .25s; }
  .sheet[hidden] { display: block; transform: translateY(110%); pointer-events: none; }
  .sheet h3 { margin: 0 0 4px; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
  .sheet h3 button { border: 0; background: rgba(255,255,255,.08); color: var(--text); border-radius: 10px; width: 34px; height: 34px; cursor: pointer; font-size: 16px; }
  .sheet .hint { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .opt { display: grid; grid-template-columns: 40px 1fr; gap: 4px 10px; align-items: center; text-align: left; padding: 10px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.05); color: var(--text); cursor: pointer; font-size: 14px; font-weight: 750; }
  .opt .e { grid-row: span 2; font-size: 28px; text-align: center; }
  .opt small { color: var(--muted); font-size: 11.5px; font-weight: 600; }
  .opt:disabled { opacity: .4; cursor: default; }
  .opt.eq { border-color: #7af0c0; background: rgba(122,240,192,.12); }
  .statrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 0 0 10px; text-align: center; }
  .statrow div { background: rgba(255,255,255,.06); border-radius: 12px; padding: 6px 0; font-size: 12px; color: var(--muted); }
  .statrow b { display: block; font-size: 18px; color: var(--text); }
  /* training timing bar */
  .meter { position: relative; height: 44px; border-radius: 14px; background: rgba(255,255,255,.08); overflow: hidden; margin: 10px 0; }
  .meter .zone { position: absolute; top: 0; bottom: 0; background: rgba(122,240,192,.35); border-left: 2px solid #7af0c0; border-right: 2px solid #7af0c0; }
  .meter .zone.perfect { background: rgba(255,224,106,.55); border-color: #ffe06a; }
  .meter .needle { position: absolute; top: -2px; bottom: -2px; width: 6px; margin-left: -3px; background: #fff; border-radius: 3px; box-shadow: 0 0 12px #fff; }
  /* battle */
  .battle { position: fixed; z-index: 8; left: 0; right: 0; bottom: 0; padding: 10px 12px calc(env(safe-area-inset-bottom, 0px) + 12px); background: linear-gradient(180deg, transparent, rgba(10,8,24,.92) 30%); }
  .battle[hidden] { display: none; }
  .blog { min-height: 44px; font-size: 14px; font-weight: 700; text-align: center; margin-bottom: 8px; line-height: 1.5; word-break: keep-all; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
  .bbtns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .bbtns button { padding: 10px 0; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.08); color: var(--text); font-weight: 800; font-size: 13px; cursor: pointer; display: grid; gap: 2px; justify-items: center; }
  .bbtns button span { font-size: 20px; }
  .bbtns button small { font-size: 10px; color: var(--muted); }
  .bbtns button:disabled { opacity: .4; }
  .colors { display: flex; gap: 10px; justify-content: center; margin: 0 0 14px; }
  .colors button { width: 44px; height: 44px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; }
  .colors button.on { border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.25); }
  .nm { width: 100%; height: 48px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--text); font: 800 18px var(--font); text-align: center; margin: 0 0 12px; }
  .bubble { position: fixed; z-index: 5; transform: translate(-50%, -100%); background: #fff; color: #2a1a3a; font-weight: 800; font-size: 14px; padding: 8px 12px; border-radius: 14px; pointer-events: none; white-space: nowrap; transition: opacity .3s; box-shadow: 0 8px 20px rgba(0,0,0,.3); }
  .bubble::after { content: ''; position: absolute; left: 50%; bottom: -7px; margin-left: -7px; border: 7px solid transparent; border-top-color: #fff; border-bottom: 0; }
  .bubble[hidden] { display: block; opacity: 0; }
</style>
</head>
<body>
<canvas class="stage" id="cv"></canvas>
<div class="top" id="top" hidden>
  <div class="row1">
    <div class="name"><b id="petName">말랑이</b><div class="sub"><span class="sub" id="petLv">Lv.1 아기 슬라임</span></div><div class="xp"><i id="xpBar"></i></div></div>
    <div class="r">
      <button class="pill coins" id="coins" type="button" aria-label="모자 가게">🪙 0</button>
      <a class="pill" href="../../">←</a>
      <button class="pill" id="muteBtn" type="button"></button>
    </div>
  </div>
  <div class="bars" id="bars"></div>
</div>
<div class="bubble" id="bubble" hidden></div>
<div class="actions" id="actions" hidden>
  <button class="act" id="aFeed" type="button"><span>🍎</span>밥</button>
  <button class="act" id="aWash" type="button"><span>🫧</span>씻기</button>
  <button class="act" id="aPlay" type="button"><span>🎾</span>놀기</button>
  <button class="act" id="aSleep" type="button"><span>💤</span>재우기</button>
  <button class="act" id="aTrain" type="button"><span>💪</span>훈련</button>
  <button class="act" id="aAdv" type="button"><span>⚔️</span>모험</button>
</div>

<div class="sheet" id="sheet" hidden><h3><span id="sheetTitle"></span><button type="button" id="sheetClose" aria-label="닫기">✕</button></h3><div id="sheetBody"></div></div>

<div class="battle" id="battle" hidden>
  <div class="blog" id="blog"></div>
  <div class="bbtns">
    <button type="button" id="bAtk"><span>💥</span>몸통박치기<small>힘</small></button>
    <button type="button" id="bSkill"><span>✨</span><b id="skillName">특기</b><small id="skillCd">지능</small></button>
    <button type="button" id="bGuard"><span>🛡️</span>웅크리기<small>방어+회복</small></button>
    <button type="button" id="bRun"><span>🏃</span>도망<small>민첩</small></button>
  </div>
</div>

<div class="screen" id="startScreen">
  <div class="card">
    <div class="lbl">앱개발부 육성 RPG</div>
    <h1>말랑 슬라임 <span>키우기</span></h1>
    <p>숲에서 주운 작은 젤리 알에서 슬라임이 태어났어요! 밥 주고, 씻기고, 훈련시켜서 멋진 슬라임으로 진화시켜 주세요.</p>
    <input class="nm" id="nameInput" maxlength="8" value="말랑이" aria-label="슬라임 이름">
    <div class="colors" id="colors"></div>
    <div class="rules">
      <div><b>💗</b><span>배부름·기분·청결·체력을 잘 챙겨 주세요</span></div>
      <div><b>💪</b><span>훈련으로 힘·지능·민첩·매력을 키우면 Lv.10에 진화!</span></div>
      <div><b>⚔️</b><span>모험을 떠나 몬스터와 싸우고 코인을 모아요</span></div>
      <div><b>🪙</b><span>코인을 누르면 모자 가게! 슬라임을 꾸며 줘요</span></div>
      <div><b>💾</b><span>자동 저장돼요. 내일 또 놀러 와요!</span></div>
    </div>
    <button class="go" id="hatchBtn" type="button">알 깨우기</button>
  </div>
</div>
<div class="screen" id="evoScreen" hidden>
  <div class="card">
    <div class="lbl">✨ 진화 ✨</div>
    <h2 id="evoTitle"></h2>
    <p id="evoText"></p>
    <button class="go" id="evoBtn" type="button">멋져!</button>
  </div>
</div>

<script src="../_shared/kit.js"></script>
<script>
(() => {
'use strict';
const { $, rand, randi, pick, clamp, tone, noise, chord, toast, roundRect } = Kit;
const cv = $('cv'), ctx = cv.getContext('2d');
let VW = innerWidth, VH = innerHeight, DPR = 1;
function resize() { DPR = Math.min(2, devicePixelRatio || 1); VW = innerWidth; VH = innerHeight; cv.width = VW * DPR; cv.height = VH * DPR; }
addEventListener('resize', resize); resize();

// ---------------------------------------------------------------- data
const COLORS = { mint: ['#9af5d0', '#3ac89a'], sky: ['#a8d8ff', '#4a9ae8'], peach: ['#ffc8b0', '#f0806a'], grape: ['#d8b8ff', '#9a6ae0'] };
const FORMS = {
  str: { name: '불꽃 슬라임', col: ['#ffb07a', '#e8502a'], skill: '불꽃 몸통', desc: '힘이 넘치는 뜨거운 슬라임! 불꽃 몸통 공격이 아주 강해요.' },
  int: { name: '별빛 슬라임', col: ['#c8b8ff', '#6a4ae0'], skill: '별똥별 마법', desc: '똑똑한 별빛 슬라임! 별똥별 마법으로 적을 크게 공격해요.' },
  agi: { name: '바람 슬라임', col: ['#b8ffe0', '#2ab890'], skill: '회오리 연타', desc: '날쌘 바람 슬라임! 공격을 잘 피하고 여러 번 때려요.' },
  cha: { name: '하트 슬라임', col: ['#ffc0dc', '#f05a9a'], skill: '사랑의 빛', desc: '모두가 좋아하는 하트 슬라임! 회복하면서 공격하고 코인을 더 받아요.' },
};
const FOODS = [
  { id: 'jelly', e: '🍮', name: '젤리', price: 0, hunger: 15, mood: 0, desc: '공짜 · 배부름 +15' },
  { id: 'apple', e: '🍎', name: '사과', price: 8, hunger: 25, mood: 6, desc: '배부름 +25 · 기분 +6' },
  { id: 'cake', e: '🍰', name: '딸기 케이크', price: 30, hunger: 40, mood: 25, desc: '배부름 +40 · 기분 +25' },
  { id: 'potion', e: '🧃', name: '힘내 주스', price: 45, hunger: 10, mood: 5, energy: 50, desc: '체력 +50 · 배부름 +10' },
];
const HATS = [
  { id: 'ribbon', e: '🎀', name: '리본', price: 60 }, { id: 'straw', e: '👒', name: '밀짚모자', price: 100 },
  { id: 'glasses', e: '👓', name: '동글 안경', price: 140 }, { id: 'crown', e: '👑', name: '황금 왕관', price: 400 },
];
const TRAINS = [
  { k: 'str', e: '🏋️', name: '젤리 역기', stat: '힘' }, { k: 'int', e: '📚', name: '그림책 읽기', stat: '지능' },
  { k: 'agi', e: '🏃', name: '장애물 달리기', stat: '민첩' }, { k: 'cha', e: '💃', name: '춤 연습', stat: '매력' },
];
const AREAS = [
  { name: '풀밭 언덕', lv: 1, bg: ['#9ad870', '#5aa040'], foes: [['🐛', '애벌레', 30, 5], ['🐝', '꿀벌', 36, 7], ['🐸', '대장 개구리', 60, 9]] },
  { name: '버섯 숲', lv: 4, bg: ['#7a9a5a', '#3a5a3a'], foes: [['🍄', '독버섯', 70, 11], ['🦔', '고슴도치', 85, 13], ['🐗', '멧돼지 대장', 140, 16]] },
  { name: '얼음 동굴', lv: 8, bg: ['#5a8ac0', '#1a3466'], foes: [['🦇', '얼음 박쥐', 130, 18], ['🐧', '펭귄 기사', 160, 21], ['🐻‍❄️', '빙하 곰', 260, 26]] },
  { name: '불꽃 화산', lv: 12, bg: ['#e8804a', '#6a2a2a'], foes: [['🦎', '불도마뱀', 230, 27], ['🔥', '불의 정령', 270, 31], ['🐲', '용암 드래곤', 430, 38]] },
  { name: '구름 위 성', lv: 16, bg: ['#d8d0ff', '#7a6ac8'], foes: [['👻', '구름 유령', 380, 38], ['🗿', '하늘 석상', 460, 44], ['🌩️', '번개 마왕', 760, 52]] },
];

// ---------------------------------------------------------------- save
const SAVE_KEY = 'slime_save';
let P = null; // pet state
function newPet(name, color) {
  return { name, color, lv: 1, xp: 0, coins: 20, hunger: 80, mood: 80, clean: 90, energy: 90, str: 1, int: 1, agi: 1, cha: 1, form: null, legend: false, hats: [], hat: null, poops: [], asleep: false, cleared: {}, wins: 0, born: Date.now(), last: Date.now() };
}
function save() { if (P) { P.last = Date.now(); Kit.store.set(SAVE_KEY, P); } }
setInterval(save, 5000); addEventListener('pagehide', save); document.addEventListener('visibilitychange', () => document.hidden && save());

// ---------------------------------------------------------------- derived
const xpNeed = lv => 40 + lv * 25;
const stage = () => (P.legend ? '전설의 ' + FORMS[P.form].name : P.form ? FORMS[P.form].name : P.lv >= 5 ? '어린이 슬라임' : '아기 슬라임');
const bodyCol = () => (P.form ? FORMS[P.form].col : COLORS[P.color]);
const sizeK = () => (P.form ? (P.legend ? 1.25 : 1.12) : P.lv >= 5 ? .95 : .8);

// ---------------------------------------------------------------- slime simulation
const S = { x: 0, y: 0, sq: 0, sqv: 0, hop: 0, hopV: 0, blink: 0, look: 0, tx: 0, vx: 0, mode: 'idle', modeT: 0, emote: null, emoteT: 0 };
let ball = null, bubbles = [], parts = [], scene = 'room', washing = false, rubbed = 0, TT = 0;
function jiggle(a = 1) { S.sqv += .6 * a; }
function hop(a = 1) { if (S.hop <= 0.01) { S.hopV = 300 * a; jiggle(.7); } }
function emote(e, t = 1.6) { S.emote = e; S.emoteT = t; }
function sparkleAt(x, y, col = '#fff', n = 10) { for (let i = 0; i < n; i++) { const a = rand(0, 7), s = rand(40, 140); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: rand(.5, 1), c: col, r: rand(2, 4) }); } }

// ---------------------------------------------------------------- stats & ticking
const BARS = [['hunger', '🍎 배부름', '#ffb44a'], ['mood', '💗 기분', '#ff7aa8'], ['clean', '🫧 청결', '#6ad8ff'], ['energy', '⚡ 체력', '#7af0c0']];
function buildBars() { $('bars').innerHTML = BARS.map(([k, l]) => `<div class="bar" id="bar-${k}"><div class="l"><span>${l}</span><span id="v-${k}">0</span></div><div class="t"><i id="b-${k}"></i></div></div>`).join(''); }
function hud() {
  if (!P) return;
  $('petName').textContent = P.name; $('petLv').textContent = `Lv.${P.lv} ${stage()}`;
  $('xpBar').style.width = Math.min(100, P.xp / xpNeed(P.lv) * 100) + '%'; $('coins').textContent = '🪙 ' + P.coins;
  for (const [k, , c] of BARS) { const v = Math.round(P[k]); $('v-' + k).textContent = v; const b = $('b-' + k); b.style.width = v + '%'; b.style.background = v < 25 ? '#ff5a6e' : c; $('bar-' + k).classList.toggle('low', v < 20); }
  $('aSleep').classList.toggle('on', P.asleep); $('aSleep').innerHTML = P.asleep ? '<span>☀️</span>깨우기' : '<span>💤</span>재우기';
  $('aWash').classList.toggle('on', washing);
}
function add(k, v) { P[k] = clamp(P[k] + v, 0, 100); }
let tickAcc = 0, poopT = 70, talkT = 6;
function tick(dt) {
  if (!P || scene !== 'room') return;
  tickAcc += dt; if (tickAcc < 1) return; const s = tickAcc; tickAcc = 0;
  if (P.asleep) { add('energy', 2.2 * s); add('hunger', -.04 * s); add('mood', .05 * s); if (P.energy >= 100) { wake(); toast(`${P.name}가 개운하게 일어났어요!`); } }
  else { add('hunger', -.085 * s); add('mood', -(P.hunger < 25 || P.clean < 25 ? .16 : .07) * s); add('clean', -(.045 + P.poops.length * .05) * s); add('energy', .03 * s); }
  if (!P.asleep && P.hunger > 30) { poopT -= s; if (poopT <= 0 && P.poops.length < 4) { P.poops.push({ x: rand(.15, .85), s: rand(.85, 1.1) }); poopT = rand(60, 110); emote('💩'); } }
  talkT -= s; if (talkT <= 0) { talkT = rand(9, 16); talk(); }
  hud();
}
function talk() {
  if (P.asleep) return say('쿨쿨… 💤');
  if (P.hunger < 25) return say('배고파… 🍎');
  if (P.clean < 25) return say('끈적끈적해… 씻고 싶어 🫧');
  if (P.energy < 20) return say('졸려… 💤');
  if (P.mood < 30) return say('심심해… 놀아 줘 🎾');
  if (P.poops.length) return say('응가 치워 줘! 💩');
  say(pick(['말랑말랑~ 🫧', `${P.name}는 행복해!`, '오늘도 모험 갈까? ⚔️', '쓰다듬어 줘 💗', '뿌잉뿌잉~', P.form ? `나는 ${FORMS[P.form].name}!` : '얼른 진화하고 싶어 ✨']));
}
let bubbleT = 0;
function say(t) { const b = $('bubble'); b.textContent = t; b.hidden = false; bubbleT = 2.8; }
function gainXP(n) {
  const mul = P.mood >= 70 ? 1.3 : P.mood < 30 ? .7 : 1; n = Math.round(n * mul); P.xp += n;
  while (P.xp >= xpNeed(P.lv)) {
    P.xp -= xpNeed(P.lv); P.lv++; chord([523, 659, 784, 1047], .07, 'triangle', .06, .3); toast(`레벨 업! Lv.${P.lv}`); sparkleAt(S.x, S.y - 60, '#ffe06a', 24); hop(1.3);

}

  const fg = c.createLinearGradient(0, floorY, 0, VH); fg.addColorStop(0, night ? '#3a2a48' : '#d8a878'); fg.addColorStop(1, night ? '#24182e' : '#b07a50'); c.fillStyle = fg; c.fillRect(0, floorY, VW, VH - floorY);
  c.strokeStyle = 'rgba(0,0,0,.08)'; c.lineWidth = 2; for (let x = -40; x < VW + 40; x += 70) { c.beginPath(); c.moveTo(x, floorY); c.lineTo(x - 40, VH); c.stroke(); }
  // rug
  c.fillStyle = night ? '#4a3a6a' : '#ff9ab8'; c.beginPath(); c.ellipse(VW / 2, floorY + 34, Math.min(170, VW * .42), 34, 0, 0, 7); c.fill();
  c.strokeStyle = night ? '#6a5a8a' : '#fff'; c.setLineDash([8, 8]); c.lineWidth = 3; c.beginPath(); c.ellipse(VW / 2, floorY + 34, Math.min(150, VW * .37), 26, 0, 0, 7); c.stroke(); c.setLineDash([]);
  // plant
  const px = Math.min(VW - 50, VW * .5 + 190), py = floorY + 6;
  c.fillStyle = '#c86a4a'; c.beginPath(); c.moveTo(px - 20, py - 30); c.lineTo(px + 20, py - 30); c.lineTo(px + 15, py + 6); c.lineTo(px - 15, py + 6); c.fill();
  c.fillStyle = '#4ab060'; for (const [a, l] of [[-.6, 40], [0, 52], [.6, 40], [-.25, 46], [.3, 44]]) { c.save(); c.translate(px, py - 30); c.rotate(a + Math.sin(TT + a) * .05); c.beginPath(); c.ellipse(0, -l / 2, 8, l / 2, 0, 0, 7); c.fill(); c.restore(); }
  // poops
  if (P) for (const p of P.poops) { const x = p.x * VW, y = floorY + 30; c.save(); c.translate(x, y); c.scale(p.s, p.s); c.fillStyle = '#8a5a3a'; for (const [yy, rr] of [[0, 14], [-10, 10], [-18, 6]]) { c.beginPath(); c.ellipse(0, yy, rr, rr * .7, 0, 0, 7); c.fill(); } c.fillStyle = '#fff'; c.beginPath(); c.arc(-4, -8, 2.2, 0, 7); c.arc(4, -8, 2.2, 0, 7); c.fill(); c.restore(); if (Math.sin(TT * 3 + x) > .6) { c.strokeStyle = 'rgba(120,160,60,.5)'; c.lineWidth = 2; c.beginPath(); c.moveTo(x - 6, y - 26); c.quadraticCurveTo(x - 12, y - 34, x - 4, y - 42); c.stroke(); } }
  if (night) { c.fillStyle = 'rgba(10,10,40,.35)'; c.fillRect(0, 0, VW, VH); }
}
function drawSlime(c, x, y, k, opts = {}) {
  if (!P) return;
  const [c1, c2] = opts.col || bodyCol(), r = 62 * k, sq = clamp(S.sq * .35, -.25, .3), w = r * (1 + sq), h = r * 1.05 * (1 - sq);
  const yy = y - (opts.hop ?? S.hop);
  // shadow
  c.fillStyle = 'rgba(0,0,0,.18)'; c.beginPath(); c.ellipse(x, y + 4, w * (1 - (opts.hop ?? S.hop) / 400), 10, 0, 0, 7); c.fill();
  // aura for legend
  if (P.legend) { const ag = c.createRadialGradient(x, yy - h * .6, 10, x, yy - h * .6, r * 2.2); ag.addColorStop(0, 'rgba(255,240,160,.45)'); ag.addColorStop(1, 'rgba(255,240,160,0)'); c.fillStyle = ag; c.beginPath(); c.arc(x, yy - h * .6, r * 2.2, 0, 7); c.fill(); }
  // form decorations behind
  if (P.form === 'str') { for (let i = 0; i < 3; i++) { const fx = x + (i - 1) * 16, fh = (i === 1 ? 46 : 34) + Math.sin(TT * 10 + i * 2) * 7; c.fillStyle = i === 1 ? '#ffd24a' : '#ff7a3a'; c.beginPath(); c.moveTo(fx - 12, yy - h * 1.45); c.quadraticCurveTo(fx - 8, yy - h * 1.6 - fh * .5, fx, yy - h * 1.6 - fh); c.quadraticCurveTo(fx + 8, yy - h * 1.6 - fh * .5, fx + 12, yy - h * 1.45); c.fill(); } }
  // body path (dome with flat bottom)
  const wob = Math.sin(TT * 3) * 2;
  c.beginPath(); c.moveTo(x - w, yy);
  c.bezierCurveTo(x - w * 1.05, yy - h * 1.1 + wob, x - w * .5, yy - h * 1.6, x, yy - h * 1.6 - wob);
  c.bezierCurveTo(x + w * .5, yy - h * 1.6, x + w * 1.05, yy - h * 1.1 - wob, x + w, yy);
  c.quadraticCurveTo(x, yy + 10, x - w, yy); c.closePath();
  const g = c.createRadialGradient(x - w * .35, yy - h * 1.2, 4, x, yy - h * .6, w * 1.4); g.addColorStop(0, '#fff'); g.addColorStop(.25, c1); g.addColorStop(1, c2);
  c.fillStyle = g; c.globalAlpha = .96; c.fill(); c.globalAlpha = 1;
  c.strokeStyle = 'rgba(0,0,0,.18)'; c.lineWidth = 3; c.stroke();
  // gloss
  c.fillStyle = 'rgba(255,255,255,.7)'; c.beginPath(); c.ellipse(x - w * .45, yy - h * 1.15, w * .14, h * .22, -.5, 0, 7); c.fill();
  c.beginPath(); c.arc(x - w * .2, yy - h * 1.42, w * .05, 0, 7); c.fill();
  // dirt spots when dirty
  if (!opts.battle && P.clean < 40) { c.fillStyle = `rgba(110,80,50,${(40 - P.clean) / 60})`; for (const [dx, dy, rr] of [[.4, .5, .12], [-.3, .3, .09], [.1, .9, .08]]) { c.beginPath(); c.arc(x + dx * w, yy - dy * h, rr * w, 0, 7); c.fill(); } }
  // face
  const asleep = !opts.battle && P.asleep, ey = yy - h * .75, ex = w * .32, lookX = clamp((S.tx - S.x) / 40, -4, 4);
  c.fillStyle = '#2a1a2a'; c.strokeStyle = '#2a1a2a'; c.lineWidth = 3.5; c.lineCap = 'round';
  if (asleep || S.blink > 0) { for (const s of [-1, 1]) { c.beginPath(); c.arc(x + s * ex + lookX, ey, 7 * k, .2, Math.PI - .2); c.stroke(); } }
  else if (opts.hurt) { for (const s of [-1, 1]) { c.beginPath(); c.moveTo(x + s * ex - 7, ey - 6); c.lineTo(x + s * ex + 7, ey + 2); c.moveTo(x + s * ex + 7, ey - 6); c.lineTo(x + s * ex - 7, ey + 2); c.stroke(); } }
  else for (const s of [-1, 1]) { c.beginPath(); c.ellipse(x + s * ex + lookX, ey, 7.5 * k, 10 * k, 0, 0, 7); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.arc(x + s * ex + lookX - 2.5 * k, ey - 4 * k, 3 * k, 0, 7); c.fill(); c.fillStyle = '#2a1a2a'; }
  // cheeks
  c.fillStyle = 'rgba(255,110,150,.45)'; for (const s of [-1, 1]) { c.beginPath(); c.ellipse(x + s * w * .55, ey + 14 * k, 10 * k, 6 * k, 0, 0, 7); c.fill(); }
  // mouth by mood
  const mood = opts.battle ? 70 : P.mood, my = ey + 16 * k;
  c.beginPath();
  if (S.mode === 'eat' && !opts.battle) { c.ellipse(x, my + 2, 7 * k, 6 * k * (1 + Math.sin(TT * 20) * .4), 0, 0, 7); c.fill(); }
  else if (mood >= 60) { c.arc(x, my - 2, 8 * k, .15, Math.PI - .15); c.stroke(); }
  else if (mood >= 30) { c.moveTo(x - 6 * k, my + 2); c.lineTo(x + 6 * k, my + 2); c.stroke(); }
  else { c.arc(x, my + 8 * k, 7 * k, Math.PI + .3, -0.3); c.stroke(); }
  // form decorations front
  const top = yy - h * 1.6 - wob;
  if (P.form === 'int') { c.strokeStyle = '#6a4ae0'; c.lineWidth = 3; c.beginPath(); c.moveTo(x, top); c.quadraticCurveTo(x + 10, top - 20, x + 4, top - 30); c.stroke(); drawStar(c, x + 4, top - 34, 11, '#ffe06a'); }
  if (P.form === 'agi') { c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = 3; for (let i = 0; i < 2; i++) { c.beginPath(); c.arc(x + w * (i ? .9 : -.95), yy - h * (i ? .9 : .5), 12 + i * 4, TT * 4 + i, TT * 4 + i + 4); c.stroke(); } c.fillStyle = '#5ad070'; c.save(); c.translate(x + 4, top - 4); c.rotate(-.5 + Math.sin(TT * 3) * .2); c.beginPath(); c.ellipse(0, -10, 7, 13, 0, 0, 7); c.fill(); c.restore(); }
  if (P.form === 'cha') { drawHeart(c, x, top - 12 + Math.sin(TT * 3) * 2, 14, '#ff4a8a'); }
  // hat
  if (P.hat && !asleep) { const em = HATS.find(hh => hh.id === P.hat).e; c.font = `${(P.hat === 'glasses' ? 36 : 44) * k}px sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(em, x, P.hat === 'glasses' ? ey + 2 : top + (P.hat === 'crown' ? -6 : 2) * k); c.textBaseline = 'alphabetic'; }
  if (asleep) { c.fillStyle = '#fff'; c.font = '800 20px sans-serif'; c.textAlign = 'center'; for (let i = 0; i < 3; i++) { const t = (TT * .6 + i / 3) % 1; c.globalAlpha = 1 - t; c.fillText('z', x + w * .7 + t * 30, top - t * 50); } c.globalAlpha = 1; }
}
function drawStar(c, x, y, r, col) { c.fillStyle = col; c.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } c.fill(); }
function drawHeart(c, x, y, s, col) { c.fillStyle = col; c.beginPath(); c.moveTo(x, y + s * .9); c.bezierCurveTo(x - s * 1.4, y, x - s * .7, y - s * 1.1, x, y - s * .35); c.bezierCurveTo(x + s * .7, y - s * 1.1, x + s * 1.4, y, x, y + s * .9); c.fill(); }
function drawBattle(c) {
  const A = AREAS[B.area]; const g = c.createLinearGradient(0, 0, 0, VH); g.addColorStop(0, A.bg[0]); g.addColorStop(1, A.bg[1]); c.fillStyle = g; c.fillRect(0, 0, VW, VH);
  c.fillStyle = 'rgba(0,0,0,.15)'; c.beginPath(); c.ellipse(VW / 2, VH * .62, VW * .7, 60, 0, 0, 7); c.fill();
  const sx = B.shake ? rand(-6, 6) : 0;
  // foe
  const fx = VW * .7 + (B.foeShake ? rand(-8, 8) : 0), fy = VH * .42, fs = B.foe.boss ? 110 : 84;
  c.fillStyle = 'rgba(0,0,0,.2)'; c.beginPath(); c.ellipse(fx, fy + fs * .5, fs * .5, 12, 0, 0, 7); c.fill();
  c.globalAlpha = B.foe.hp <= 0 ? .3 : 1; c.font = `${fs}px sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(B.foe.e, fx, fy + Math.sin(TT * 3) * 4); c.textBaseline = 'alphabetic'; c.globalAlpha = 1;
  hpBar(c, fx, fy - fs * .7, 130, B.foe.hp, B.foe.max, (B.foe.boss ? '👑 ' : '') + B.foe.name);
  // slime (lunges when attacking)
  const lunge = B.anim > 0 ? Math.sin(B.anim * Math.PI) * VW * .2 : 0;
  drawSlime(c, VW * .3 + sx + lunge, VH * .62, sizeK() * .9, { battle: true, hurt: B.flash > 0, hop: 0 });
  hpBar(c, VW * .3, VH * .62 - 150 * sizeK(), 130, B.hp, B.st.maxHp, P.name);
  c.fillStyle = 'rgba(255,255,255,.85)'; c.font = '800 14px "Pretendard Variable", sans-serif'; c.textAlign = 'center'; c.fillText(`${A.name} · ${B.step + 1}/3`, VW / 2, VH * .2);
  if (B.flash) { c.fillStyle = `rgba(255,60,80,${B.flash})`; c.fillRect(0, 0, VW, VH); }
}
function hpBar(c, x, y, w, v, m, name) {
  c.fillStyle = 'rgba(0,0,0,.5)'; roundRect(c, x - w / 2, y, w, 12, 6); c.fill();
  c.fillStyle = v / m > .4 ? '#7af0a0' : '#ff6a7a'; roundRect(c, x - w / 2 + 2, y + 2, (w - 4) * Math.max(0, v / m), 8, 4); c.fill();
  c.fillStyle = '#fff'; c.font = '800 13px "Pretendard Variable", sans-serif'; c.textAlign = 'center'; c.fillText(`${name}  ${Math.ceil(v)}/${m}`, x, y - 6);
}
function draw() {
  const c = ctx; c.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (scene === 'battle' && B) drawBattle(c);
  else { drawRoom(c); if (P) { if (ball) { c.fillStyle = 'rgba(0,0,0,.15)'; c.beginPath(); c.ellipse(ball.x, VH * .74 + 34, 14, 5, 0, 0, 7); c.fill(); c.fillStyle = '#d8f04a'; c.beginPath(); c.arc(ball.x, ball.y, 15, 0, 7); c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 2.5; c.beginPath(); c.arc(ball.x - 10, ball.y, 12, -1, 1); c.stroke(); } drawSlime(c, S.x, S.y, sizeK()); if (S.emoteT > 0 && S.emote) { c.globalAlpha = Math.min(1, S.emoteT * 2); c.font = '34px sans-serif'; c.textAlign = 'center'; c.fillText(S.emote, S.x + 70 * sizeK(), S.y - S.hop - 120 * sizeK() + (1.6 - S.emoteT) * -10); c.globalAlpha = 1; } }
    if (washing) { c.fillStyle = 'rgba(255,255,255,.85)'; c.font = '800 14px "Pretendard Variable", sans-serif'; c.textAlign = 'center'; c.fillText('🫧 슬라임을 문질문질!', VW / 2, VH * .74 + 90); } }
  for (const b of bubbles) { c.globalAlpha = Math.min(1, b.life); c.strokeStyle = 'rgba(255,255,255,.9)'; c.fillStyle = 'rgba(200,240,255,.35)'; c.lineWidth = 2; c.beginPath(); c.arc(b.x, b.y, b.r, 0, 7); c.fill(); c.stroke(); } c.globalAlpha = 1;

}

// ---------------------------------------------------------------- start / load
let pickColor = 'mint';
function buildColors() { $('colors').innerHTML = ''; for (const [k, [a, b]] of Object.entries(COLORS)) { const btn = document.createElement('button'); btn.type = 'button'; btn.style.background = `radial-gradient(circle at 35% 30%, #fff, ${a} 35%, ${b})`; btn.className = k === pickColor ? 'on' : ''; btn.setAttribute('aria-label', k); btn.onclick = () => { pickColor = k; buildColors(); }; $('colors').append(btn); } }
function enter() {
  Kit.hide('startScreen'); $('top').hidden = false; $('actions').hidden = false; buildBars(); hud(); S.x = VW / 2; hop(1.2);
}
$('hatchBtn').onclick = () => {
  Kit.initAudio(); const nm = $('nameInput').value.trim() || '말랑이';
  P = newPet(nm, pickColor); save(); enter(); chord([523, 659, 784, 1047], .08, 'triangle', .06, .3); sparkleAt(VW / 2, VH * .65, '#fff', 30); setTimeout(() => say(`안녕! 나는 ${nm}야 💗`), 600);
};
function load() {
  const saved = Kit.store.get(SAVE_KEY, null);
  if (!saved) { buildColors(); return; }
  P = Object.assign(newPet('말랑이', 'mint'), saved);
  // offline progress: gentle decay (never below 10), sleeping restores energy
  const hrs = Math.min(12, (Date.now() - (P.last || Date.now())) / 3600000);
  if (hrs > .02) {
    add('hunger', -hrs * 6); add('mood', -hrs * 4); add('clean', -hrs * 3);
    if (P.asleep) add('energy', hrs * 40); else add('energy', hrs * 10);
    for (const k of ['hunger', 'mood', 'clean']) P[k] = Math.max(10, P[k]);
  }
  enter();
  setTimeout(() => say(hrs > 1 ? `보고 싶었어! ${Math.floor(hrs)}시간이나 기다렸어 💗` : `다시 왔구나! 💗`), 500);
}
Kit.bindMute($('muteBtn'));
$('coins').onclick = () => { if (scene === 'room' && P) { stopWash(); shop(); } };

let last = performance.now();
function frame(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; update(dt); if (meter) { meter.t += dt; meter.pos = 50 + 50 * Math.sin(meter.t * meter.speed / 40); const n = $('needle'); if (n) n.style.left = meter.pos + '%'; } draw(); requestAnimationFrame(frame); }
load(); requestAnimationFrame(frame);
if (location.hash === '#test') window.__game = { P: () => P, set: o => { Object.assign(P, o); hud(); }, B: () => B, gainXP, startAdventure, playerTurn, trainHit, trainGame, TRAINS, meter: () => meter, feed, FOODS, S };
})();
