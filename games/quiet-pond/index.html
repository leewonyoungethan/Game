<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>고요한 낚시터</title>
<meta name="theme-color" content="#2a6a8a">
<link rel="icon" href="../../icons/quiet-pond.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../_shared/kit.css">
<style>
  :root { --bg: #2a6a8a; --panel: rgba(10, 40, 60, .58); --a1: #7ae0ff; --a2: #4aa8ff; --a3: #ffd24a; --ink-on-grad: #062a40; --glow: rgba(122,224,255,.35); }
  .action { position: fixed; z-index: 6; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); width: min(340px, 86vw); }
  .action .go { min-height: 60px; font-size: 18px; touch-action: none; }
  .hint { position: fixed; z-index: 6; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 90px); color: #fff; font-weight: 700; font-size: 14px;
    text-shadow: 0 2px 6px rgba(0,0,0,.5); white-space: nowrap; pointer-events: none; }
  .dex { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 16px; max-height: 52vh; overflow-y: auto; }
  .dex div { background: rgba(255,255,255,.06); border-radius: 14px; padding: 8px 4px; font-size: 12px; color: var(--muted); }
  .dex canvas { width: 72px; height: 44px; display: block; margin: 0 auto 4px; }
  .dex b { display: block; color: var(--text); font-size: 13px; }
  .rare1 { color: #7ae0ff !important; } .rare2 { color: #c8a8ff !important; } .rare3 { color: #ffd24a !important; }
  #catchCv { width: 220px; height: 130px; display: block; margin: 0 auto 6px; }
</style>
</head>
<body>
<canvas class="stage" id="cv"></canvas>
<div class="hud">
  <div class="group">
    <div class="box"><div class="lbl">코인</div><div class="big" id="coins">0</div><div class="sub" id="dexLbl">도감 0/12</div></div>
  </div>
  <div class="stack">
    <a class="pill" href="../../">← 게임 센터</a>
    <button class="pill" id="muteBtn" type="button"></button>
    <button class="pill" id="dexBtn" type="button">📖 물고기 도감</button>
  </div>
</div>
<div class="hint" id="hint" hidden></div>
<div class="action" id="action" hidden><button class="go" id="actBtn" type="button">🎣 꾹 눌러서 던지기</button></div>

<div class="screen" id="startScreen">
  <div class="card">
    <div class="lbl">앱개발부 힐링 게임</div>
    <h1>고요한 <span>낚시터</span></h1>
    <p>고양이 낚시꾼과 함께 조용한 호수에서 낚시를 해요. 낮과 밤에 잡히는 물고기가 달라요!</p>
    <div class="rules">
      <div><b>1</b><span>버튼을 꾹 눌렀다 떼서 찌를 던져요. 멀리 던질수록 큰 물고기!</span></div>
      <div><b>2</b><span>찌가 톡톡 움직이는 건 입질 연습. 쑥 들어가며 <b>!</b> 가 뜨면 바로 탭!</span></div>
      <div><b>3</b><span>꾹 누르면 감기, 떼면 풀기. 줄 장력을 초록 칸 안에 유지하세요</span></div>
    </div>
    <button class="go" id="startBtn" type="button">낚시하러 가기</button>
  </div>
</div>
<div class="screen" id="catchScreen" hidden>
  <div class="card">
    <div class="lbl" id="catchLbl"></div>
    <canvas id="catchCv" width="440" height="260"></canvas>
    <h2 id="catchName"></h2>
    <p id="catchText"></p>
    <button class="go" id="keepBtn" type="button">계속 낚시하기</button>
  </div>
</div>
<div class="screen" id="dexScreen" hidden>
  <div class="card">
    <div class="lbl">물고기 도감</div>
    <h2 id="dexTitle"></h2>
    <div class="dex" id="dex"></div>
    <button class="go" id="dexClose" type="button">닫기</button>
  </div>
</div>

<script src="../_shared/kit.js"></script>
<script>
(() => {
'use strict';
const { $, rand, pick, clamp, roundRect, tone, noise, chord, toast } = Kit;
// zone: 0 near, 1 mid, 2 far · time: 'day' | 'night' | 'any' · rare: 0..3 · pull: how hard it fights
const FISH = [
  { id: 'ricefish', name: '송사리', zone: [0, 1], time: 'any', rare: 0, w: 30, size: [3, 5], pull: .25, val: 5, col: ['#c8d8d0', '#7a9a8a'], shape: 'slim' },
  { id: 'crucian', name: '붕어', zone: [0, 1, 2], time: 'any', rare: 0, w: 34, size: [12, 28], pull: .45, val: 12, col: ['#d8c878', '#8a7a3a'], shape: 'round' },
  { id: 'carp', name: '잉어', zone: [1, 2], time: 'day', rare: 1, w: 18, size: [35, 70], pull: .7, val: 30, col: ['#e8a85a', '#a8582a'], shape: 'round' },
  { id: 'catfish', name: '메기', zone: [1, 2], time: 'night', rare: 1, w: 22, size: [40, 90], pull: .75, val: 35, col: ['#6a7068', '#3a403a'], shape: 'cat' },
  { id: 'mandarin', name: '쏘가리', zone: [1, 2], time: 'any', rare: 2, w: 9, size: [25, 50], pull: .85, val: 60, col: ['#e8d070', '#6a5a2a'], shape: 'spot' },
  { id: 'trout', name: '무지개송어', zone: [2], time: 'day', rare: 2, w: 8, size: [30, 60], pull: .8, val: 70, col: ['#9ad0e8', '#ff8aa8'], shape: 'rainbow' },
  { id: 'eel', name: '뱀장어', zone: [1, 2], time: 'night', rare: 2, w: 8, size: [50, 100], pull: .9, val: 80, col: ['#5a6a4a', '#2a3020'], shape: 'eel' },
  { id: 'goldfish', name: '금붕어', zone: [0, 1], time: 'any', rare: 2, w: 6, size: [8, 16], pull: .35, val: 90, col: ['#ff8a3a', '#ff4a2a'], shape: 'gold' },
  { id: 'koi', name: '비단잉어', zone: [2], time: 'day', rare: 3, w: 3, size: [50, 80], pull: .95, val: 200, col: ['#ffffff', '#ff4a3a'], shape: 'koi' },
  { id: 'moon', name: '달빛 물고기', zone: [2], time: 'night', rare: 3, w: 3, size: [30, 45], pull: .9, val: 250, col: ['#e8f4ff', '#9ab8ff'], shape: 'moon' },
  { id: 'boot', name: '헌 장화', zone: [0, 1, 2], time: 'any', rare: 0, w: 6, size: [24, 28], pull: .2, val: 1, col: ['#6a5a4a', '#3a2a1a'], shape: 'boot', junk: true },
  { id: 'can', name: '빈 깡통', zone: [0, 1], time: 'any', rare: 0, w: 6, size: [10, 12], pull: .15, val: 1, col: ['#c8ccd8', '#ff5a5a'], shape: 'can', junk: true },
];
const RARE = ['흔함', '조금 귀함', '귀함', '전설'];
const SAVE = 'qp_save';
let save = Kit.store.get(SAVE, { coins: 0, dex: {} });
const cv = $('cv'), ctx = cv.getContext('2d');
const W = 400, H = 640;
let F; function resize() { F = Kit.fit(cv, W, H, { top: 0, bottom: 0, side: 0 }); } addEventListener('resize', resize); resize();
// cover the whole screen (crop) instead of letterboxing
function cover() { const s = Math.max(F.vw / W, F.vh / H); return { s, ox: (F.vw - W * s) / 2, oy: (F.vh - H * s) / 2 }; }

let phase = 'idle', power = 0, powerDir = 1, bob = null, biteT = 0, nibbles = 0, fish = null, tension = .35, progress = 0, slack = 0, holding = false, waitT = 0, clock = Kit.store.get('qp_clock', .25), ripples = [], splash = [], hookWindow = 0, escapeWarn = 0;
const ROD = { x: 120, y: 470 };            // where the cat sits (world)
function rodAngle() { return phase === 'charge' ? -.35 - power * .35 : phase === 'fight' && holding ? .55 : phase === 'fight' ? .8 : 1.0; }
function rodTip() { const a = rodAngle(); return { x: ROD.x + 18 + Math.sin(a) * 150, y: ROD.y + 30 - 36 - Math.cos(a) * 150 }; }
const isNight = () => { const t = clock % 1; return t > .72 || t < .08; };

function setHint(t) { const h = $('hint'); if (!t) { h.hidden = true; return; } h.hidden = false; h.textContent = t; }
function setBtn(t, disabled = false) { $('actBtn').textContent = t; $('actBtn').disabled = disabled; }

// ---------------------------------------------------------------- phases
function toIdle() { phase = 'idle'; bob = null; fish = null; setBtn('🎣 꾹 눌러서 던지기'); setHint('멀리 던질수록 큰 물고기가 있어요'); }
function startCharge() { if (phase !== 'idle') return; phase = 'charge'; power = 0; powerDir = 1; setBtn('놓으면 던져요!'); setHint(''); }
function release() {
  if (phase !== 'charge') return;
  const dist = .15 + power * .85, tx = W * .28 + dist * W * .62, ty = 360 - dist * 120;
  const tp = rodTip(); bob = { x: tp.x, y: tp.y, sx: tp.x, sy: tp.y, tx, ty, t: 0, zone: dist < .4 ? 0 : dist < .72 ? 1 : 2, dip: 0, flying: true };
  phase = 'cast'; tone(500, .25, 'sine', .04, -300); noise(.2, .04, 2500);
  setBtn('기다리는 중…', true);
}
function landed() {
  phase = 'wait'; bob.flying = false; ripples.push({ x: bob.x, y: bob.y, r: 4, life: 1 }); noise(.15, .06, 900);
  waitT = rand(2.5, 6); nibbles = Math.random() < .7 ? Kit.randi(1, 3) : 0;
  setHint(['찌를 잘 보세요…', '조용히… 입질을 기다려요', '쑥 들어가면 바로 탭!'][bob.zone]);
  setBtn('🫧 쑥 들어가면 탭!');
}
function chooseFish(zone) {
  const night = isNight();
  const pool = FISH.filter(f => f.zone.includes(zone) && (f.time === 'any' || (f.time === 'night') === night));
  let x = Math.random() * pool.reduce((a, f) => a + f.w, 0);
  for (const f of pool) if ((x -= f.w) < 0) return f;
  return pool[0];
}
function tapDuringWait() {
  if (phase === 'bite') return hook();
  if (phase === 'wait') { // pulled too early
    toast('너무 빨랐어요! 물고기가 도망갔어요'); tone(200, .2, 'sine', .05, -80);
    phase = 'reelEmpty'; setTimeout(toIdle, 700);
  }
}
function hook() {
  fish = chooseFish(bob.zone); phase = 'fight'; tension = .4; progress = .15; slack = 0; escapeWarn = 0;
  fish.size_ = Math.round(rand(...fish.size) * (fish.junk ? 1 : .8 + bob.zone * .12) * 10) / 10;
  fish.pullNow = 0; fish.burst = 0;
  chord([523, 784], .04, 'square', .05, .12); if (navigator.vibrate) navigator.vibrate(40);
  setBtn('꾹 = 감기 · 떼기 = 풀기'); setHint(fish.junk ? '뭔가 가벼운데…?' : fish.rare >= 2 ? '엄청 힘이 세요!!' : '걸렸다! 장력을 초록 칸에!');
}
function caught() {
  phase = 'caught'; const f = fish;
  const prev = save.dex[f.id], first = !prev;
  save.dex[f.id] = { n: (prev ? prev.n : 0) + 1, best: Math.max(prev ? prev.best : 0, f.size_) };
  const gain = Math.round(f.val * (1 + f.size_ / (f.size[1] * 2)));
  save.coins += gain; Kit.store.set(SAVE, save); hud();
  for (let i = 0; i < 20; i++) splash.push({ x: bob.x, y: bob.y, vx: rand(-90, 90), vy: rand(-220, -80), life: rand(.5, 1), r: rand(2, 4) });
  chord(f.rare >= 2 ? [523, 659, 784, 1047, 1319] : [659, 880, 1047], .07, 'triangle', .07, .25);
  $('catchLbl').innerHTML = first ? '✨ 새로운 발견!' : `${RARE[f.rare]}`;
  $('catchLbl').className = 'lbl rare' + f.rare;
  $('catchName').textContent = f.junk ? `${f.name}… 😅` : f.name;
  $('catchText').textContent = f.junk ? `${f.size_}cm짜리 ${f.name}. 호수를 청소했어요! +${gain}코인` : `${f.size_}cm · ${RARE[f.rare]} · +${gain}코인` + (prev && f.size_ > prev.best ? ' · 최고 크기 갱신!' : '');
  const cc = $('catchCv').getContext('2d'); cc.clearRect(0, 0, 440, 260); cc.save(); cc.translate(220, 130); drawFish(cc, f, 1.6, 0); cc.restore();
  setTimeout(() => Kit.show('catchScreen'), 300); setHint('');
}
function lost(msg) {
  phase = 'lost'; toast(msg); tone(180, .3, 'sawtooth', .05, -60); if (navigator.vibrate) navigator.vibrate(80);
  setTimeout(toIdle, 900);
}

// ---------------------------------------------------------------- update
let last = performance.now(), TT = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; TT += dt;
  clock = (clock + dt / 240) % 1; if (Math.floor(TT) % 5 === 0) Kit.store.set('qp_clock', clock);
  if (phase === 'charge') { power += powerDir * dt * 1.2; if (power > 1) { power = 1; powerDir = -1; } if (power < 0) { power = 0; powerDir = 1; } }
  if (bob && bob.flying) {
    bob.t += dt / .7; const k = Math.min(1, bob.t);
    bob.x = bob.sx + (bob.tx - bob.sx) * k; bob.y = bob.sy + (bob.ty - bob.sy) * k - Math.sin(k * Math.PI) * 120;
    if (k >= 1) landed();
  }
  if (phase === 'wait') {
    waitT -= dt;
    if (nibbles > 0 && waitT < nibbles * 1.1 && !bob.nib) { bob.nib = .35; nibbles--; tone(900, .03, 'sine', .03); ripples.push({ x: bob.x, y: bob.y, r: 3, life: .5 }); }
    if (waitT <= 0) { phase = 'bite'; hookWindow = .9 - bob.zone * .12; bob.dip = 1; ripples.push({ x: bob.x, y: bob.y, r: 6, life: 1 }, { x: bob.x, y: bob.y, r: 2, life: .8 }); noise(.12, .08, 700); tone(1200, .06, 'square', .04); if (navigator.vibrate) navigator.vibrate(30); }
  }
  if (bob && bob.nib) { bob.nib = Math.max(0, bob.nib - dt); }
  if (phase === 'bite') { hookWindow -= dt; if (hookWindow <= 0) { phase = 'lost'; toast('놓쳤어요… 좀 더 빨리!'); setTimeout(toIdle, 700); } }
  if (phase === 'fight') updateFight(dt);
  for (const r of ripples) { r.r += 30 * dt; r.life -= dt; } ripples = ripples.filter(r => r.life > 0);
  for (const s of splash) { s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 500 * dt; s.life -= dt; } splash = splash.filter(s => s.life > 0);
  if (bob && !bob.flying && Math.random() < dt * .6) ripples.push({ x: bob.x, y: bob.y + 2, r: 4, life: .9 });
  draw(); drawMeters(); requestAnimationFrame(frame);
}
function updateFight(dt) {
  const f = fish;
  // fish pulls in bursts
  f.burst -= dt; if (f.burst <= 0) { f.pullNow = Math.random() < .55 ? rand(.4, 1) * f.pull : rand(0, .25) * f.pull; f.burst = rand(.5, 1.4); }
  const reel = holding ? 1 : 0;
  tension += (reel * .55 + f.pullNow * .7 - .45) * dt * 1.3;
  tension = clamp(tension, 0, 1.05);
  const inGreen = tension > .3 && tension < .78;
  if (holding && inGreen) progress += dt * (.28 - f.pull * .12);
  else if (!holding) progress -= dt * f.pullNow * .12;
  progress = clamp(progress, 0, 1);
  if (tension < .12) slack += dt; else slack = Math.max(0, slack - dt * 2);
  if (tension >= 1) return lost('줄이 끊어졌어요! 너무 세게 감았어요');
  if (slack > 2.4) return lost('물고기가 줄을 풀고 도망갔어요');
  if (progress >= 1) return caught();
  // bob follows the fish toward the dock as progress grows
  bob.x = bob.tx + (ROD.x + 40 - bob.tx) * progress + Math.sin(TT * 9) * f.pullNow * 6;
  bob.y = bob.ty + (ROD.y - 50 - bob.ty) * progress + Math.cos(TT * 7) * f.pullNow * 4;
  if (Math.random() < dt * 6) ripples.push({ x: bob.x, y: bob.y, r: 3, life: .5 });
  if (holding && Math.random() < dt * 14) tone(260 + tension * 300, .03, 'triangle', .015);
}

// ---------------------------------------------------------------- draw
function skyCols() {
  const t = clock % 1;
  const keys = [[0, ['#0c1438', '#2a2a5a']], [.08, ['#3a3a7a', '#ff9a7a']], [.18, ['#5ab8f0', '#c8ecff']], [.55, ['#5ab8f0', '#d8f4ff']], [.66, ['#ff8a5a', '#ffd08a']], [.72, ['#3a2a6a', '#ff7a8a']], [.8, ['#0c1438', '#2a2a5a']], [1, ['#0c1438', '#2a2a5a']]];
  let i = 0; while (i < keys.length - 2 && t > keys[i + 1][0]) i++;
  const [a, ca] = keys[i], [b, cb] = keys[i + 1], k = (t - a) / (b - a);
  const mix = (x, y) => { const p = s => [1, 3, 5].map(j => parseInt(s.slice(j, j + 2), 16)); const A = p(x), B = p(y); return `rgb(${A.map((v, j) => Math.round(v + (B[j] - v) * k)).join(',')})`; };
  return [mix(ca[0], cb[0]), mix(ca[1], cb[1])];
}
function draw() {
  const c = ctx, { dpr } = F, { s, ox, oy } = cover();
  c.setTransform(dpr * s, 0, 0, dpr * s, dpr * ox, dpr * oy);
  const [top, bottom] = skyCols(), night = isNight(), t = clock % 1;
  let g = c.createLinearGradient(0, 0, 0, 300); g.addColorStop(0, top); g.addColorStop(1, bottom); c.fillStyle = g; c.fillRect(-200, -200, W + 400, 520);
  // sun / moon
  const ang = (t - .25) * Math.PI * 2, cx = W / 2 + Math.cos(ang - Math.PI / 2) * 170, cy = 300 + Math.sin(ang - Math.PI / 2) * 230;
  if (cy < 300) { c.fillStyle = night ? '#fff6d8' : '#fff2a0'; c.shadowColor = night ? '#c8d8ff' : '#ffd24a'; c.shadowBlur = 30; c.beginPath(); c.arc(cx, cy, night ? 22 : 28, 0, 7); c.fill(); c.shadowBlur = 0; }
  if (night) { c.fillStyle = 'rgba(255,255,255,.8)'; for (let i = 0; i < 40; i++) { const x = (i * 97) % W, y = (i * 53) % 220; c.globalAlpha = .4 + .5 * Math.abs(Math.sin(TT + i)); c.fillRect(x, y, 1.6, 1.6); } c.globalAlpha = 1; }
  // mountains & trees
  c.fillStyle = night ? '#1a2240' : '#6a8ab8'; c.beginPath(); c.moveTo(-200, 300); for (let x = -200; x <= W + 200; x += 40) c.lineTo(x, 230 + Math.sin(x * .02) * 30 + Math.sin(x * .05) * 12); c.lineTo(W + 200, 300); c.fill();
  c.fillStyle = night ? '#0e1a2a' : '#3a7a5a';
  for (let x = -200; x < W + 200; x += 22) { const h = 30 + (x * 7 % 23); c.beginPath(); c.moveTo(x, 300); c.lineTo(x + 11, 300 - h); c.lineTo(x + 22, 300); c.fill(); }
  // lake
  g = c.createLinearGradient(0, 300, 0, H); g.addColorStop(0, night ? '#1a2a50' : '#4ab0d8'); g.addColorStop(1, night ? '#0a1430' : '#1a6a9a'); c.fillStyle = g; c.fillRect(-200, 300, W + 400, H);
  if (cy < 300) { c.fillStyle = night ? 'rgba(255,246,216,.25)' : 'rgba(255,242,160,.3)'; for (let i = 0; i < 8; i++) c.fillRect(cx - 30 + Math.sin(TT * 2 + i) * 8, 310 + i * 14, 60 - i * 5, 3); }
  c.strokeStyle = night ? 'rgba(160,190,255,.12)' : 'rgba(255,255,255,.18)'; c.lineWidth = 2;
  for (let y = 320; y < H; y += 26) { c.beginPath(); for (let x = -200; x <= W + 200; x += 16) { const yy = y + Math.sin(x * .05 + TT * 1.2 + y) * 2; x === -200 ? c.moveTo(x, yy) : c.lineTo(x, yy); } c.stroke(); }
  // lily pads
  c.fillStyle = night ? '#1e4a3a' : '#5ab85a'; for (const [x, y, r] of [[330, 560, 22], [360, 590, 16], [40, 360, 14]]) { c.beginPath(); c.moveTo(x, y); c.ellipse(x, y, r, r * .4, 0, .3, Math.PI * 2 - .3); c.closePath(); c.fill(); }
  // zone hint while charging
  if (phase === 'charge') { const dist = .15 + power * .85, tx = W * .28 + dist * W * .62, ty = 360 - dist * 120; c.strokeStyle = 'rgba(255,255,255,.7)'; c.setLineDash([5, 6]); c.lineWidth = 2; c.beginPath(); c.ellipse(tx, ty, 18, 7, 0, 0, 7); c.stroke(); c.setLineDash([]); }
  for (const r of ripples) { c.strokeStyle = `rgba(255,255,255,${r.life * .5})`; c.lineWidth = 1.5; c.beginPath(); c.ellipse(r.x, r.y, r.r, r.r * .35, 0, 0, 7); c.stroke(); }
  // dock
  c.fillStyle = '#8a5a3a'; c.fillRect(-200, 520, 340, 30); c.fillStyle = '#6a4228'; for (let x = -200; x < 140; x += 30) c.fillRect(x, 520, 3, 30);
  c.fillStyle = '#5a3820'; for (const x of [10, 110]) c.fillRect(x, 550, 10, 110);
  drawCat(c);
  // line
  const { x: tipX, y: tipY } = rodTip();
  if (bob) {
    c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(tipX, tipY);
    const sag = phase === 'fight' ? 10 + (1 - tension) * 40 : 50;
    c.quadraticCurveTo((tipX + bob.x) / 2, Math.max(tipY, bob.y) + sag, bob.x, bob.y - 6); c.stroke();
    drawBob(c);
  }
  for (const sp of splash) { c.globalAlpha = Math.max(0, sp.life); c.fillStyle = '#e8fbff'; c.beginPath(); c.arc(sp.x, sp.y, sp.r, 0, 7); c.fill(); }
  c.globalAlpha = 1;
  // power meter / tension meter (screen-space-ish in world)
  if (phase === 'bite') { c.fillStyle = '#fff'; c.font = '900 34px "Pretendard Variable", sans-serif'; c.textAlign = 'center'; c.lineWidth = 6; c.strokeStyle = '#ff4a5a'; c.strokeText('!', bob.x, bob.y - 30); c.fillText('!', bob.x, bob.y - 30); }
}
function drawMeters() {
  if (phase !== 'charge' && phase !== 'fight') return;
  const c = ctx; c.setTransform(F.dpr, 0, 0, F.dpr, 0, 0);
  if (phase === 'charge') meter(c, power, '던질 힘', [[0, .4, '#7ae0ff'], [.4, .72, '#7cf09a'], [.72, 1, '#ffd24a']]);
  else { meter(c, tension, '줄 장력 — 초록 칸을 지켜요', [[0, .3, '#ffd24a'], [.3, .78, '#7cf09a'], [.78, 1, '#ff5a5a']]); progressBar(c); }
}
function meterBox() { const w = Math.min(340, F.vw - 56); return { x: (F.vw - w) / 2, w, y: Math.min(190, F.vh * .26) }; }
function meter(c, v, label, bands) {
  const { x, w, y } = meterBox(), h = 20;
  c.fillStyle = 'rgba(0,0,0,.45)'; roundRect(c, x - 8, y - 26, w + 16, h + 36, 12); c.fill();
  for (const [a, b, col] of bands) { c.fillStyle = col; c.globalAlpha = .85; c.fillRect(x + a * w, y, (b - a) * w, h); }
  c.globalAlpha = 1; c.strokeStyle = '#fff'; c.lineWidth = 2; c.strokeRect(x, y, w, h);
  c.fillStyle = '#fff'; c.fillRect(x + clamp(v, 0, 1) * w - 3, y - 6, 6, h + 12);
  c.font = '800 13px "Pretendard Variable", sans-serif'; c.textAlign = 'left'; c.fillText(label, x, y - 9);
}
function progressBar(c) {
  const { x, w } = meterBox(), y = meterBox().y + 48;
  c.fillStyle = 'rgba(0,0,0,.45)'; roundRect(c, x - 8, y - 6, w + 16, 22, 10); c.fill();
  c.fillStyle = '#7ae0ff'; roundRect(c, x, y, w * progress, 10, 5); c.fill();
  c.font = '700 12px "Pretendard Variable", sans-serif'; c.fillStyle = slack > .8 ? '#ffd24a' : '#fff'; c.textAlign = 'right'; c.fillText(slack > .8 ? '줄이 느슨해요! 감아요!' : `끌어오는 중 ${Math.round(progress * 100)}%`, x + w, y + 26);
}
function drawBob(c) {
  const dip = phase === 'bite' ? 10 : bob.nib ? Math.sin(bob.nib * 30) * 3 : phase === 'fight' ? 6 : Math.sin(TT * 2) * 1.2;
  const x = bob.x, y = bob.y + dip;
  c.fillStyle = '#fff'; c.beginPath(); c.ellipse(x, y, 6, 8, 0, 0, 7); c.fill();
  c.fillStyle = '#ff4a5a'; c.beginPath(); c.ellipse(x, y - 4, 6, 5, 0, Math.PI, 0); c.fill(); c.fillRect(x - 1, y - 14, 2, 8);
}
function drawCat(c) {
  const x = ROD.x, y = ROD.y + 30, pulling = phase === 'fight' && holding;
  c.save(); c.translate(x, y);
  // rod
  c.save(); c.translate(18, -36); c.rotate(rodAngle()); c.strokeStyle = '#5a3a1a'; c.lineWidth = 4; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -40); c.stroke();
  c.strokeStyle = '#c8a86a'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(0, -40); c.lineTo(0, -150); c.stroke(); c.restore();
  // body
  c.fillStyle = '#ffb46a'; c.beginPath(); c.ellipse(0, -20, 26, 30, 0, 0, 7); c.fill();
  c.fillStyle = '#fff2e0'; c.beginPath(); c.ellipse(4, -14, 14, 18, 0, 0, 7); c.fill();
  // tail
  c.strokeStyle = '#ffb46a'; c.lineWidth = 9; c.lineCap = 'round'; c.beginPath(); c.moveTo(-20, -6); c.quadraticCurveTo(-46, -10 + Math.sin(TT * 2) * 6, -40, -40); c.stroke();
  // head
  c.fillStyle = '#ffb46a'; c.beginPath(); c.moveTo(-20, -62); c.lineTo(-14, -84); c.lineTo(-2, -66); c.moveTo(20, -62); c.lineTo(16, -84); c.lineTo(4, -66); c.fill();
  c.beginPath(); c.arc(0, -56, 22, 0, 7); c.fill();
  c.fillStyle = '#ff7a3a'; c.fillRect(-6, -78, 3, 8); c.fillRect(0, -78, 3, 8);
  c.fillStyle = '#2a1a10';
  if (phase === 'wait') { c.fillRect(-12, -58, 7, 2); c.fillRect(6, -58, 7, 2); }
  else { c.beginPath(); c.arc(-8, -58, 3, 0, 7); c.arc(10, -58, 3, 0, 7); c.fill(); }
  c.fillStyle = '#ff7a9a'; c.beginPath(); c.arc(1, -50, 2.5, 0, 7); c.fill();
  // hat
  c.fillStyle = '#f0d070'; c.beginPath(); c.ellipse(0, -74, 30, 7, 0, 0, 7); c.fill(); c.beginPath(); c.ellipse(0, -80, 16, 10, 0, Math.PI, 0); c.fill();
  c.fillStyle = '#e0503a'; c.fillRect(-16, -80, 32, 4);
  c.restore();
}
function drawFish(c, f, s, wig) {
  c.save(); c.scale(s, s);
  const [c1, c2] = f.col;
  if (f.shape === 'boot') {
    c.fillStyle = c1; c.strokeStyle = c2; c.lineWidth = 3; c.beginPath(); c.moveTo(-20, -30); c.lineTo(8, -30); c.lineTo(8, 4); c.lineTo(34, 10); c.lineTo(34, 26); c.lineTo(-20, 26); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = c2; c.fillRect(-20, 20, 54, 6); c.restore(); return;
  }
  if (f.shape === 'can') {
    c.fillStyle = c1; c.strokeStyle = '#6a6e7a'; c.lineWidth = 2; roundRect(c, -16, -22, 32, 44, 5); c.fill(); c.stroke();
    c.fillStyle = c2; c.fillRect(-16, -8, 32, 14); c.restore(); return;
  }
  const len = f.shape === 'eel' ? 60 : f.shape === 'slim' ? 34 : 42, ht = f.shape === 'eel' ? 9 : f.shape === 'round' || f.shape === 'koi' || f.shape === 'gold' ? 20 : 15;
  // tail
  c.fillStyle = c2; c.beginPath(); c.moveTo(len * .55, 0); c.lineTo(len * .95, -ht * .9 + wig); c.lineTo(len * .95, ht * .9 + wig); c.closePath(); c.fill();
  const g = c.createLinearGradient(0, -ht, 0, ht); g.addColorStop(0, c2); g.addColorStop(.5, c1); g.addColorStop(1, '#fff');
  c.fillStyle = g; c.beginPath(); c.ellipse(0, 0, len * .6, ht, 0, 0, 7); c.fill();
  if (f.shape === 'rainbow') { c.fillStyle = 'rgba(255,120,160,.6)'; c.fillRect(-len * .5, -3, len, 6); }
  if (f.shape === 'spot') { c.fillStyle = '#4a3a1a'; for (let i = 0; i < 7; i++) { c.beginPath(); c.arc(-len * .4 + i * 7, (i % 2 ? -5 : 3), 2.5, 0, 7); c.fill(); } }
  if (f.shape === 'koi') { c.fillStyle = c2; c.beginPath(); c.ellipse(-6, -6, 12, 8, .3, 0, 7); c.ellipse(14, 4, 8, 6, 0, 0, 7); c.fill(); }
  if (f.shape === 'moon') { c.fillStyle = 'rgba(200,220,255,.9)'; c.beginPath(); c.arc(4, 0, 7, 0, 7); c.fill(); c.fillStyle = c2; c.beginPath(); c.arc(7, -2, 6, 0, 7); c.fill(); }
  if (f.shape === 'cat') { c.strokeStyle = c2; c.lineWidth = 2; c.beginPath(); c.moveTo(-len * .55, 3); c.quadraticCurveTo(-len * .8, 10, -len * .85, 16); c.moveTo(-len * .55, 5); c.quadraticCurveTo(-len * .75, 4, -len * .9, 6); c.stroke(); }
  c.fillStyle = c2; c.beginPath(); c.moveTo(-4, -ht + 2); c.quadraticCurveTo(6, -ht - 10, 14, -ht + 4); c.closePath(); c.fill();
  c.fillStyle = '#fff'; c.beginPath(); c.arc(-len * .38, -3, 4.5, 0, 7); c.fill(); c.fillStyle = '#10141a'; c.beginPath(); c.arc(-len * .4, -3, 2.6, 0, 7); c.fill();
  c.fillStyle = 'rgba(255,255,255,.5)'; c.beginPath(); c.ellipse(-4, -ht * .5, len * .3, 2.5, 0, 0, 7); c.fill();
  c.restore();
}

// ---------------------------------------------------------------- input
function down(e) { if (e) e.preventDefault(); Kit.initAudio(); holding = true;
  if (phase === 'idle') startCharge(); else if (phase === 'wait' || phase === 'bite') tapDuringWait(); }
function up() { holding = false; if (phase === 'charge') release(); }
$('actBtn').addEventListener('pointerdown', down);
addEventListener('pointerup', up); addEventListener('pointercancel', up);
cv.addEventListener('pointerdown', e => { if (!$('startScreen').hidden || !$('catchScreen').hidden || !$('dexScreen').hidden) return; down(e); });
addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && $('startScreen').hidden && $('catchScreen').hidden && $('dexScreen').hidden) { e.preventDefault(); if (!e.repeat) down(); } });
addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') up(); });

// ---------------------------------------------------------------- ui
function hud() { $('coins').textContent = save.coins.toLocaleString('ko-KR'); $('dexLbl').textContent = `도감 ${Object.keys(save.dex).length}/${FISH.length}`; }
function openDex() {
  const box = $('dex'); box.textContent = '';
  FISH.forEach(f => {
    const d = save.dex[f.id], el = document.createElement('div'), c = document.createElement('canvas'); c.width = 144; c.height = 88;
    const cc = c.getContext('2d'); cc.translate(72, 44);
    if (d) drawFish(cc, f, .9, 0); else { cc.globalAlpha = .9; cc.filter = 'brightness(0)'; drawFish(cc, f, .9, 0); }
    el.append(c);
    const b = document.createElement('b'); b.textContent = d ? f.name : '???'; if (d) b.className = 'rare' + f.rare; el.append(b);
    el.append(d ? `최고 ${d.best}cm · ${d.n}마리` : (f.time === 'night' ? '🌙 밤에만' : f.time === 'day' ? '☀️ 낮에만' : RARE[f.rare]));
    box.append(el);
  });
  $('dexTitle').textContent = `${Object.keys(save.dex).length} / ${FISH.length} 발견`;
  Kit.show('dexScreen');
}
$('dexBtn').onclick = openDex; $('dexClose').onclick = () => Kit.hide('dexScreen');
$('keepBtn').onclick = () => { Kit.hide('catchScreen'); toIdle(); };
$('startBtn').onclick = () => { Kit.hide('startScreen'); $('action').hidden = false; toIdle(); };
Kit.bindMute($('muteBtn'));
hud(); requestAnimationFrame(frame);
if (location.hash === '#test') window.__game = { s: () => ({ phase, power, tension, progress, slack, fish: fish && fish.id, coins: save.coins, dex: save.dex, night: isNight() }), down, up, setClock: v => { clock = v; } };
})();
</script>
</body>
