<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>별빛 서바이버</title>
<meta name="theme-color" content="#1a2a1a">
<link rel="icon" href="../../icons/star-survivor.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../_shared/kit.css">
<style>
  :root { --bg: #14201a; --a1: #8af0ff; --a2: #c08aff; --a3: #ffd24a; --ink-on-grad: #1a0a3a; --glow: rgba(160,140,255,.35); }
  .xp { position: fixed; z-index: 6; left: 0; right: 0; top: 0; height: 7px; background: rgba(0,0,0,.4); }
  .xp i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #5ad8ff, #c08aff); transition: width .2s; }
  .hud { top: 7px; }
  .cards { display: grid; gap: 10px; margin: 6px 0 0; }
  .upc { display: grid; grid-template-columns: 54px 1fr; gap: 2px 12px; align-items: center; text-align: left; padding: 12px; border-radius: 16px; border: 2px solid rgba(255,255,255,.18); background: rgba(255,255,255,.07); color: var(--text); cursor: pointer; transition: transform .12s, border-color .12s; }
  .upc:hover, .upc:focus-visible { transform: scale(1.02); border-color: #ffd24a; }
  .upc .e { grid-row: span 2; font-size: 38px; text-align: center; }
  .upc b { font-size: 16px; } .upc b small { color: #ffd24a; font-size: 12px; margin-left: 4px; }
  .upc span { color: var(--muted); font-size: 13px; line-height: 1.45; word-break: keep-all; }
  .upc.new { border-color: rgba(255,210,74,.6); }
</style>
</head>
<body>
<canvas class="stage" id="cv"></canvas>
<div class="xp"><i id="xpBar"></i></div>
<div class="hud">
  <div class="group">
    <div class="box"><div class="lbl" id="lvl">Lv.1</div><div class="big" id="time">0:00</div><div class="sub" id="kills">처치 0</div></div>
  </div>
  <div class="stack">
    <a class="pill" href="../../">← 게임 센터</a>
    <button class="pill" id="muteBtn" type="button"></button>
  </div>
</div>
<div class="screen" id="startScreen">
  <div class="card">
    <div class="lbl">앱개발부 액션</div>
    <h1>별빛 <span>서바이버</span></h1>
    <p>밤의 숲에 몬스터가 끝없이 몰려와요! 꼬마 별 마법사가 되어 <b>5분</b> 동안 살아남으세요.</p>
    <div class="rules">
      <div><b>🕹️</b><span>화면 아무 데나 누른 채 끌면 그쪽으로 움직여요 (키보드 WASD·방향키)</span></div>
      <div><b>✨</b><span>공격은 자동! 몬스터가 떨어뜨린 💎를 모아 레벨 업</span></div>
      <div><b>🃏</b><span>레벨 업마다 마법 카드 3장 중 하나를 골라 점점 강해져요</span></div>
      <div><b>👹</b><span>2분 30초와 5분에 보스 등장!</span></div>
    </div>
    <button class="go" id="startBtn" type="button">모험 시작</button>
    <p class="small" id="bestLine"></p>
  </div>
</div>
<div class="screen" id="upScreen" hidden>
  <div class="card">
    <div class="lbl" id="upLbl">레벨 업!</div>
    <h2>마법을 하나 골라요</h2>
    <div class="cards" id="cards"></div>
  </div>
</div>
<div class="screen" id="overScreen" hidden>
  <div class="card">
    <div class="lbl" id="overLbl"></div>
    <h2 id="overTitle"></h2>
    <div class="final" id="finalScore"></div>
    <p id="overText"></p>
    <button class="go" id="againBtn" type="button">다시 도전</button>
  </div>
</div>
<script src="../_shared/kit.js"></script>
<script>
(() => {
'use strict';
const { $, rand, randi, pick, clamp, shuffle, tone, noise, chord, toast } = Kit;
const cv = $('cv'), ctx = cv.getContext('2d');
let VW, VH, DPR, Z; function resize() { DPR = Math.min(2, devicePixelRatio || 1); VW = innerWidth; VH = innerHeight; cv.width = VW * DPR; cv.height = VH * DPR; Z = clamp(Math.min(VW, VH) / 430, .85, 1.4); } addEventListener('resize', resize); resize();
const best = Kit.best('ss_best');
const GOAL = 300, BOSS_AT = [150, 300];

// ---------------------------------------------------------------- data
const FOES = {
  slime: { e: '🟢', hp: 9, spd: 52, dmg: 6, r: 15, xp: 1, col: '#6ad86a' },
  bat: { e: '🦇', hp: 6, spd: 92, dmg: 5, r: 13, xp: 1, col: '#9a7ad8' },
  skull: { e: '💀', hp: 24, spd: 60, dmg: 9, r: 16, xp: 2, col: '#e8e0d0' },
  ghost: { e: '👻', hp: 34, spd: 74, dmg: 11, r: 17, xp: 3, col: '#d8e8ff' },
  ogre: { e: '👹', hp: 120, spd: 44, dmg: 16, r: 26, xp: 8, col: '#e85a4a' },
  boss: { e: '🐲', hp: 2600, spd: 56, dmg: 26, r: 46, xp: 60, col: '#6ad8a0', boss: true },
};
const UPS = {
  bolt: { e: '✨', name: '별빛 화살', max: 6, desc: l => l === 0 ? '가장 가까운 적에게 별빛 화살을 쏴요' : `화살 ${['', '+1개', '피해 +40%', '+1개', '관통 +1', '+1개 · 피해 +40%'][l]}` },
  orbit: { e: '🌙', name: '달빛 방패', max: 5, desc: l => l === 0 ? '몸 주위를 도는 달이 적을 때려요' : `달 +1개${l >= 3 ? ' · 더 빠르게' : ''}` },
  nova: { e: '💫', name: '별폭발', max: 5, desc: l => l === 0 ? '주기적으로 주변을 터뜨려요' : `범위·피해 증가${l >= 3 ? ' · 더 자주' : ''}` },
  zap: { e: '⚡', name: '번개 사슬', max: 5, desc: l => l === 0 ? '번개가 적 사이를 튀어 다녀요' : `튀는 횟수 +${l === 4 ? 2 : 1} · 피해 증가` },
  speed: { e: '👟', name: '바람 신발', max: 4, desc: () => '이동 속도 +12%' },
  heart: { e: '❤️', name: '튼튼한 마음', max: 4, desc: () => '최대 체력 +25, 체력 회복' },
  magnet: { e: '🧲', name: '별가루 자석', max: 3, desc: () => '💎를 더 멀리서 끌어와요' },
  haste: { e: '⏱️', name: '시간 마법', max: 4, desc: () => '모든 마법 대기 시간 -10%' },
};

// ---------------------------------------------------------------- state
let state = 'title', P, foes, shots, gems, fx, lv, T, spawnT, kills, TT = 0, bossLeft = [], hitFlash = 0;
function newGame() {
  P = { x: 0, y: 0, hp: 100, max: 100, spd: 150, magnet: 115, inv: 0, face: 1, cd: { bolt: 0, nova: 2, zap: 1.5 }, ang: 0 };
  lv = { lvl: 1, xp: 0, need: 4, w: { bolt: 1 } }; foes = []; shots = []; gems = []; fx = []; T = 0; spawnT = 0; kills = 0; bossLeft = [...BOSS_AT]; hud();
}
const L = k => lv.w[k] || 0;
const haste = () => Math.pow(.9, L('haste'));

// ---------------------------------------------------------------- spawning
function spawn(kind, mul = 1) {
  const F = FOES[kind], a = rand(0, Math.PI * 2), d = Math.hypot(VW, VH) / 2 / Z + 60;
  const hpK = 1 + T / 130;
  foes.push({ k: kind, ...F, x: P.x + Math.cos(a) * d, y: P.y + Math.sin(a) * d, hp: F.hp * hpK * mul, max: F.hp * hpK * mul, hit: 0, kb: 0, kx: 0, ky: 0, ph: rand(0, 6) });
}
function spawner(dt) {
  spawnT -= dt;
  const rate = .9 + T * .04;               // enemies per second grows with time
  if (spawnT <= 0) {
    spawnT = 1 / rate;
    const pool = T < 30 ? ['slime', 'slime', 'bat'] : T < 80 ? ['slime', 'bat', 'bat', 'skull'] : T < 150 ? ['bat', 'skull', 'skull', 'ghost'] : ['skull', 'ghost', 'ghost', 'bat', 'skull'];
    spawn(pick(pool));
    if (T > 60 && Math.random() < .04 + T / 4000) spawn('ogre');
    if (foes.length < 4 && T > 10) for (let i = 0; i < 6; i++) spawn(pick(pool));
  }
  if (bossLeft.length && T >= bossLeft[0]) { bossLeft.shift(); spawn('boss', T > 200 ? 1.6 : 1); toast('🐲 보스 등장!'); noise(.8, .12, 300); tone(90, .8, 'sawtooth', .06); }
  // ring wave every 45 seconds
  if (Math.floor(T / 45) !== Math.floor((T - dt) / 45) && T > 40) { for (let i = 0; i < 24; i++) { const a = i / 24 * Math.PI * 2, d = 420; foes.push({ k: 'bat', ...FOES.bat, x: P.x + Math.cos(a) * d, y: P.y + Math.sin(a) * d, hp: 6 * (1 + T / 130), max: 6 * (1 + T / 130), hit: 0, kb: 0, kx: 0, ky: 0, ph: 0 }); } toast('🦇 박쥐 떼가 포위해요!'); }
}

// ---------------------------------------------------------------- weapons
function nearest(maxD = 1e9, skip) { let b = null, bd = maxD; for (const f of foes) { if (skip && skip.has(f)) continue; const d = Math.hypot(f.x - P.x, f.y - P.y); if (d < bd) { bd = d; b = f; } } return b; }
function damage(f, n, kx = 0, ky = 0) {
  if (f.dead) return; f.hp -= n; f.hit = .12; if (!f.boss) { f.kx = kx; f.ky = ky; f.kb = .12; }
  fx.push({ k: 'num', x: f.x + rand(-6, 6), y: f.y - f.r, t: Math.round(n), life: .55 });
  if (f.hp <= 0) {
    f.dead = true; kills++;
    for (let i = 0; i < (f.boss ? 30 : 5); i++) { const a = rand(0, 7), s = rand(40, 160); fx.push({ k: 'p', x: f.x, y: f.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, c: f.col, life: .45 }); }
    const n = f.boss ? 12 : 1; for (let i = 0; i < n; i++) gems.push({ x: f.x + rand(-f.r, f.r) * (n > 1), y: f.y + rand(-f.r, f.r) * (n > 1), v: f.boss ? 5 : f.xp, pull: false });
    if (Math.random() < (f.boss ? 1 : .006)) gems.push({ x: f.x + 10, y: f.y, v: 0, heal: true });
    else if (Math.random() < .004) gems.push({ x: f.x - 10, y: f.y, v: 0, vac: true });
    if (f.boss) { chord([523, 659, 784, 1047], .08, 'triangle', .06, .3); toast('🐲 보스를 물리쳤어요!'); }
    else if (Math.random() < .3) tone(600 + rand(0, 300), .03, 'triangle', .015);
  }
}
function weapons(dt) {
  const h = haste();
  // bolt
  const bl = L('bolt');
  if (bl) { P.cd.bolt -= dt; if (P.cd.bolt <= 0) { P.cd.bolt = .55 * h; const n = 1 + (bl >= 2) + (bl >= 4) + (bl >= 6), dmg = 10 * (bl >= 3 ? 1.4 : 1) * (bl >= 6 ? 1.4 : 1), pierce = bl >= 5 ? 2 : 1; const used = new Set();
      for (let i = 0; i < n; i++) { const t = nearest(520, used) || nearest(520); if (!t) break; used.add(t); const a = Math.atan2(t.y - P.y, t.x - P.x) + (i && !nearest(520, used) ? rand(-.25, .25) : 0); shots.push({ x: P.x, y: P.y, vx: Math.cos(a) * 520, vy: Math.sin(a) * 520, dmg, pierce, life: 1.2, hits: new Set() }); }
      tone(1100 + rand(0, 200), .03, 'sine', .015); } }
  // orbit
  const ol = L('orbit');
  if (ol) { P.ang += dt * (ol >= 3 ? 4.2 : 3); const n = ol + 1, R = 74;
    for (let i = 0; i < n; i++) { const a = P.ang + i / n * Math.PI * 2, ox = P.x + Math.cos(a) * R, oy = P.y + Math.sin(a) * R;
      for (const f of foes) if (!f.dead && Math.hypot(f.x - ox, f.y - oy) < f.r + 14 && (f.oT || 0) <= TT) { f.oT = TT + .35; damage(f, 9 + ol * 3, Math.cos(a) * 160, Math.sin(a) * 160); } } }
  // nova
  const nl = L('nova');
  if (nl) { P.cd.nova -= dt; if (P.cd.nova <= 0) { P.cd.nova = (nl >= 3 ? 2.2 : 3) * h; const R = 90 + nl * 18; for (const f of foes) { const d = Math.hypot(f.x - P.x, f.y - P.y); if (d < R + f.r) damage(f, 14 + nl * 6, (f.x - P.x) / d * 260, (f.y - P.y) / d * 260); } fx.push({ k: 'ring', x: P.x, y: P.y, r: R, life: .4 }); noise(.15, .05, 1800); } }
  // zap
  const zl = L('zap');
  if (zl) { P.cd.zap -= dt; if (P.cd.zap <= 0) { P.cd.zap = 1.6 * h; let cur = nearest(460); const hit = new Set(), pts = [[P.x, P.y]]; const jumps = 2 + zl + (zl >= 5 ? 1 : 0);
      for (let i = 0; i < jumps && cur; i++) { hit.add(cur); pts.push([cur.x, cur.y]); damage(cur, 16 + zl * 6); let nx = null, nd = 170; for (const f of foes) { if (hit.has(f) || f.dead) continue; const d = Math.hypot(f.x - cur.x, f.y - cur.y); if (d < nd) { nd = d; nx = f; } } cur = nx; }
      if (pts.length > 1) { fx.push({ k: 'zap', pts, life: .18 }); tone(1600, .05, 'square', .02, -900); } } }
}

// ---------------------------------------------------------------- level up
function gainXP(v) {
  lv.xp += v;
  if (lv.xp >= lv.need && state === 'play') { lv.xp -= lv.need; lv.lvl++; lv.need = Math.floor(4 + lv.lvl * 3 + Math.pow(lv.lvl, 1.45)); levelUp(); }
  hud();
}
function levelUp() {
  state = 'pick'; chord([523, 659, 784, 1047], .06, 'triangle', .05, .25);
  const opts = shuffle(Object.keys(UPS).filter(k => L(k) < UPS[k].max)).slice(0, 3);
  $('upLbl').textContent = `레벨 ${lv.lvl}!`;
  const box = $('cards'); box.innerHTML = '';
  if (!opts.length) { P.hp = P.max; state = 'play'; return; }
  for (const k of opts) {
    const U = UPS[k], l = L(k), b = document.createElement('button'); b.type = 'button'; b.className = 'upc' + (l ? '' : ' new');
    b.innerHTML = `<span class="e">${U.e}</span><b>${U.name}<small>${l ? `Lv.${l} → ${l + 1}` : 'NEW'}</small></b><span>${U.desc(l)}</span>`;
    b.onclick = () => { lv.w[k] = l + 1; if (k === 'speed') P.spd *= 1.12; if (k === 'heart') { P.max += 25; P.hp = Math.min(P.max, P.hp + 40); } if (k === 'magnet') P.magnet += 60; Kit.hide('upScreen'); state = 'play'; tone(880, .1, 'triangle', .05); hud(); if (lv.xp >= lv.need) gainXP(0); };
    box.append(b);
  }
  Kit.show('upScreen');
}

// ---------------------------------------------------------------- update
const keys = {}; let joy = null;
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
cv.addEventListener('pointerdown', e => { if (state !== 'play') return; Kit.initAudio(); joy = { sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => { if (joy) { joy.x = e.clientX; joy.y = e.clientY; } });
addEventListener('pointerup', () => { joy = null; }); addEventListener('pointercancel', () => { joy = null; });
function update(dt) {
  if (state !== 'play') return;
  T += dt;
  // move
  let mx = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0), my = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0);
  if (joy) { const dx = joy.x - joy.sx, dy = joy.y - joy.sy, d = Math.hypot(dx, dy); if (d > 6) { const k = Math.min(1, d / 50); mx = dx / d * k; my = dy / d * k; } }
  const ml = Math.hypot(mx, my); if (ml > 1) { mx /= ml; my /= ml; }
  P.x += mx * P.spd * dt; P.y += my * P.spd * dt; if (mx) P.face = Math.sign(mx); P.moving = ml > .1;
  P.inv = Math.max(0, P.inv - dt);
  spawner(dt); weapons(dt);
  // foes: chase + light separation via a spatial grid
  const cell = 40, grid = new Map();
  for (const f of foes) { const key = (Math.floor(f.x / cell)) + ',' + (Math.floor(f.y / cell)); (grid.get(key) || grid.set(key, []).get(key)).push(f); }
  for (const f of foes) {
    f.hit = Math.max(0, f.hit - dt);
    const dx = P.x - f.x, dy = P.y - f.y, d = Math.hypot(dx, dy) || 1;
    if (f.kb > 0) { f.kb -= dt; f.x += f.kx * dt; f.y += f.ky * dt; }
    else { f.x += dx / d * f.spd * dt; f.y += dy / d * f.spd * dt; }
    const gx = Math.floor(f.x / cell), gy = Math.floor(f.y / cell);
    for (let ax = -1; ax <= 1; ax++) for (let ay = -1; ay <= 1; ay++) { const L2 = grid.get((gx + ax) + ',' + (gy + ay)); if (!L2) continue; for (const o of L2) { if (o === f) continue; const ex = f.x - o.x, ey = f.y - o.y, ed = Math.hypot(ex, ey), m = (f.r + o.r) * .8; if (ed < m && ed > 0) { const push = (m - ed) * .5; f.x += ex / ed * push * .5; f.y += ey / ed * push * .5; } } }
    if (d < f.r + 14 && P.inv <= 0) { P.hp -= f.dmg; P.inv = .5; hitFlash = .3; tone(160, .12, 'sawtooth', .05, -40); if (P.hp <= 0) return end(false); }
    if (d > 1400) f.dead = true; // far stragglers despawn
  }
  foes = foes.filter(f => !f.dead);
  // shots
  for (const s of shots) { s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt; for (const f of foes) { if (s.hits.has(f) || f.dead) continue; if (Math.hypot(f.x - s.x, f.y - s.y) < f.r + 6) { s.hits.add(f); damage(f, s.dmg, s.vx * .3, s.vy * .3); if (s.hits.size >= s.pierce) { s.life = 0; break; } } } }
  shots = shots.filter(s => s.life > 0); foes = foes.filter(f => !f.dead);
  // gems
  for (const g of gems) { const dx = P.x - g.x, dy = P.y - g.y, d = Math.hypot(dx, dy); if (d < P.magnet) g.pull = true; if (g.pull) { const s = Math.max(300, 700 - d); g.x += dx / d * s * dt; g.y += dy / d * s * dt; } if (d < 18) { g.got = true; if (g.heal) { P.hp = Math.min(P.max, P.hp + 30); toast('❤️ +30'); } else if (g.vac) { for (const o of gems) o.pull = true; toast('🧲 별가루 싹쓸이!'); chord([880, 1175], .05, 'sine', .04, .2); } else { gainXP(g.v); if (Math.random() < .4) tone(1300 + rand(0, 400), .03, 'sine', .012); } } }
  gems = gems.filter(g => !g.got);
  if (gems.length > 400) { const extra = gems.splice(0, gems.length - 400); gainXP(extra.reduce((a, g) => a + g.v, 0)); }
  if (T >= GOAL && !foes.some(f => f.boss)) return end(true);
  if (Math.floor(T * 4) !== Math.floor((T - dt) * 4)) hud();
}
function end(won) {
  state = 'over'; const sc = Math.floor(T) * 10 + kills;
  const isBest = best.submit(sc);
  won ? chord([523, 659, 784, 1047, 1319, 1568], .1, 'triangle', .07, .5) : (noise(.6, .12, 400), tone(130, .7, 'sawtooth', .06, -60));
  $('overLbl').textContent = isBest ? '🎉 최고 기록!' : `최고 기록 ${best.get()}`;
  $('overTitle').textContent = won ? '🌟 5분 생존 성공!' : '별빛이 꺼졌어요…';
  $('finalScore').textContent = sc.toLocaleString();
  $('overText').textContent = `${fmtT(T)} 생존 · Lv.${lv.lvl} · 처치 ${kills} · ${Object.entries(lv.w).map(([k, l]) => UPS[k].e + l).join(' ')}`;
  setTimeout(() => Kit.show('overScreen'), won ? 600 : 900);
}
const fmtT = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
function hud() {
  $('lvl').textContent = `Lv.${lv.lvl}`; $('time').textContent = fmtT(T); $('kills').textContent = `처치 ${kills} · 목표 5:00`;
  $('xpBar').style.width = Math.min(100, lv.xp / lv.need * 100) + '%';
}

// ---------------------------------------------------------------- draw
function draw(dt) {
  const c = ctx; c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.fillStyle = '#2b4c33'; c.fillRect(0, 0, VW, VH);
  c.setTransform(DPR * Z, 0, 0, DPR * Z, DPR * (VW / 2 - P.x * Z), DPR * (VH / 2 - P.y * Z));
  const vw = VW / Z, vh = VH / Z, x0 = P.x - vw / 2, y0 = P.y - vh / 2;
  // ground tiles with deterministic decor
  const S = 80; for (let gx = Math.floor(x0 / S) - 1; gx <= Math.floor((x0 + vw) / S) + 1; gx++) for (let gy = Math.floor(y0 / S) - 1; gy <= Math.floor((y0 + vh) / S) + 1; gy++) {
    const h = ((gx * 73856093) ^ (gy * 19349663)) >>> 0; c.fillStyle = (gx + gy) & 1 ? '#2e5236' : '#2b4c33'; c.fillRect(gx * S, gy * S, S + 1, S + 1);
    const k = h % 13; const X = gx * S + (h % 61) + 10, Y = gy * S + ((h >> 8) % 61) + 10;
    if (k === 0) { c.fillStyle = '#ff9ac0'; c.beginPath(); c.arc(X, Y, 3, 0, 7); c.fill(); }
    else if (k === 1) { c.fillStyle = '#ffe06a'; c.beginPath(); c.arc(X, Y, 2.5, 0, 7); c.fill(); }
    else if (k < 5) { c.strokeStyle = '#2e5a3a'; c.lineWidth = 2; c.beginPath(); c.moveTo(X, Y); c.lineTo(X - 3, Y - 8); c.moveTo(X + 3, Y); c.lineTo(X + 4, Y - 9); c.stroke(); }
    else if (k === 5) { c.fillStyle = '#3a4a40'; c.beginPath(); c.ellipse(X, Y, 9, 6, 0, 0, 7); c.fill(); }
  }
  // gems
  for (const g of gems) { if (g.heal || g.vac) { c.font = '20px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(g.heal ? '🍖' : '🧲', g.x, g.y + Math.sin(TT * 4) * 2); continue; }
    const big = g.v >= 5, s = big ? 7 : g.v >= 2 ? 5.5 : 4.5; c.fillStyle = big ? '#ff6ab8' : g.v >= 2 ? '#7ae0ff' : '#8af0a0'; c.beginPath(); c.moveTo(g.x, g.y - s * 1.4); c.lineTo(g.x + s, g.y); c.lineTo(g.x, g.y + s * 1.4); c.lineTo(g.x - s, g.y); c.fill(); }
  // nova rings
  for (const f of fx) if (f.k === 'ring') { c.strokeStyle = `rgba(200,170,255,${f.life * 2})`; c.lineWidth = 8 * f.life * 2; c.beginPath(); c.arc(f.x, f.y, f.r * (1.2 - f.life), 0, 7); c.stroke(); c.fillStyle = `rgba(200,170,255,${f.life * .5})`; c.fill(); }
  // foes
  c.textAlign = 'center'; c.textBaseline = 'middle';
  for (const f of foes) {
    if (f.x < x0 - 60 || f.x > x0 + vw + 60 || f.y < y0 - 60 || f.y > y0 + vh + 60) continue;
    c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(f.x, f.y + f.r * .8, f.r * .8, f.r * .3, 0, 0, 7); c.fill();
    const bob = Math.sin(TT * 8 + f.ph) * 2;
    if (f.hit > 0) c.filter = 'brightness(2.6)';
    c.shadowColor = 'rgba(255,255,255,.55)'; c.shadowBlur = 6; c.font = `${f.r * 2.4}px sans-serif`; c.fillText(f.e, f.x, f.y + bob); c.shadowBlur = 0; c.filter = 'none';
    if (f.boss) { const w = 110; c.fillStyle = 'rgba(0,0,0,.6)'; c.fillRect(f.x - w / 2, f.y - f.r - 18, w, 8); c.fillStyle = '#ff5a6a'; c.fillRect(f.x - w / 2, f.y - f.r - 18, w * f.hp / f.max, 8); }
  }
  // shots
  for (const s of shots) { c.fillStyle = '#fff6c0'; c.shadowColor = '#ffe06a'; c.shadowBlur = 12; c.beginPath(); c.arc(s.x, s.y, 6.5, 0, 7); c.fill(); c.shadowBlur = 0; c.strokeStyle = 'rgba(255,240,160,.5)'; c.lineWidth = 3; c.beginPath(); c.moveTo(s.x, s.y); c.lineTo(s.x - s.vx * .03, s.y - s.vy * .03); c.stroke(); }
  // orbit moons
  const ol = L('orbit'); if (ol) for (let i = 0; i <= ol; i++) { const a = P.ang + i / (ol + 1) * Math.PI * 2; c.font = '28px sans-serif'; c.fillText('🌙', P.x + Math.cos(a) * 74, P.y + Math.sin(a) * 74); }
  // hero
  drawHero(c);
  // zaps & particles & numbers
  for (const f of fx) {
    f.life -= dt;
    if (f.k === 'zap') { c.strokeStyle = `rgba(160,220,255,${f.life * 5})`; c.lineWidth = 4; c.beginPath(); f.pts.forEach(([x, y], i) => { const jx = i ? rand(-6, 6) : 0; i ? c.lineTo(x + jx, y + jx) : c.moveTo(x, y); }); c.stroke(); c.strokeStyle = `rgba(255,255,255,${f.life * 5})`; c.lineWidth = 1.5; c.stroke(); }
    else if (f.k === 'p') { f.x += f.vx * dt; f.y += f.vy * dt; c.globalAlpha = clamp(f.life * 2.5, 0, 1); c.fillStyle = f.c; c.fillRect(f.x - 3, f.y - 3, 6, 6); c.globalAlpha = 1; }
    else if (f.k === 'num') { f.y -= 30 * dt; c.globalAlpha = clamp(f.life * 2.5, 0, 1); c.font = '800 13px "Pretendard Variable", sans-serif'; c.fillStyle = '#fff'; c.fillText(f.t, f.x, f.y); c.globalAlpha = 1; }
  }
  fx = fx.filter(f => f.life > 0); if (fx.length > 500) fx.splice(0, fx.length - 500);
  c.textBaseline = 'alphabetic';
  // screen-space overlays
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  const vg = c.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * .35, VW / 2, VH / 2, Math.max(VW, VH) * .75); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,10,20,.6)'); c.fillStyle = vg; c.fillRect(0, 0, VW, VH);
  if (hitFlash > 0) { hitFlash -= dt; c.fillStyle = `rgba(255,40,60,${hitFlash * .6})`; c.fillRect(0, 0, VW, VH); }
  if (joy) { c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 3; c.beginPath(); c.arc(joy.sx, joy.sy, 50, 0, 7); c.stroke(); const dx = joy.x - joy.sx, dy = joy.y - joy.sy, d = Math.min(50, Math.hypot(dx, dy)), a = Math.atan2(dy, dx); c.fillStyle = 'rgba(255,255,255,.5)'; c.beginPath(); c.arc(joy.sx + Math.cos(a) * d, joy.sy + Math.sin(a) * d, 20, 0, 7); c.fill(); }
  if (state === 'play' && T < 4) { c.fillStyle = `rgba(0,0,0,${.5 * Math.min(1, 4 - T)})`; c.fillRect(VW / 2 - 150, VH - 120, 300, 44); c.fillStyle = `rgba(255,255,255,${Math.min(1, 4 - T)})`; c.font = '800 15px "Pretendard Variable", sans-serif'; c.textAlign = 'center'; c.fillText('누른 채 끌어서 움직여요 · 공격은 자동!', VW / 2, VH - 92); }
}
function drawHero(c) {
  const x = P.x, y = P.y, bob = P.moving ? Math.abs(Math.sin(TT * 12)) * -3 : Math.sin(TT * 3) * 1.2, blink = P.inv > 0 && Math.floor(P.inv * 20) % 2;
  if (blink) c.globalAlpha = .4;
  c.fillStyle = 'rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(x, y + 22, 18, 6, 0, 0, 7); c.fill();
  const ag = c.createRadialGradient(x, y, 4, x, y, 60); ag.addColorStop(0, 'rgba(255,240,170,.25)'); ag.addColorStop(1, 'rgba(255,240,170,0)'); c.fillStyle = ag; c.beginPath(); c.arc(x, y, 60, 0, 7); c.fill();
  c.save(); c.translate(x, y + bob); c.scale(P.face * 1.45, 1.45);
  c.fillStyle = '#5a3ad8'; c.beginPath(); c.moveTo(-11, 14); c.quadraticCurveTo(-12, -2, 0, -4); c.quadraticCurveTo(12, -2, 11, 14); c.fill();
  c.fillStyle = '#ffe0c8'; c.beginPath(); c.arc(0, -8, 9, 0, 7); c.fill();
  c.fillStyle = '#2a1a2a'; c.fillRect(1, -10, 2.4, 3.4); c.fillRect(5.5, -10, 2.4, 3.4);
  c.fillStyle = '#7a5aff'; c.beginPath(); c.ellipse(0, -15, 15, 4, 0, 0, 7); c.fill(); c.beginPath(); c.moveTo(-8, -16); c.quadraticCurveTo(-2, -30, 6, -36); c.quadraticCurveTo(7, -26, 9, -16); c.fill();
  c.fillStyle = '#ffe06a'; c.beginPath(); c.arc(6, -36, 3, 0, 7); c.fill();
  c.strokeStyle = '#8a5a2a'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(10, 4); c.lineTo(18, -10); c.stroke(); c.fillStyle = '#fff6c0'; c.beginPath(); c.arc(18, -11, 3.5 + Math.sin(TT * 10), 0, 7); c.fill();
  c.restore(); c.globalAlpha = 1;
  // hp bar
  c.fillStyle = 'rgba(0,0,0,.6)'; c.fillRect(x - 22, y + 28, 44, 6); c.fillStyle = P.hp / P.max > .35 ? '#7af0a0' : '#ff5a6a'; c.fillRect(x - 22, y + 28, 44 * Math.max(0, P.hp / P.max), 6);
}

function start() { Kit.initAudio(); newGame(); state = 'play'; Kit.hide('startScreen', 'overScreen', 'upScreen'); }
$('startBtn').onclick = start; $('againBtn').onclick = start;
Kit.bindMute($('muteBtn'));
$('bestLine').textContent = best.get() ? `최고 기록 ${best.get().toLocaleString()}점` : '';
newGame();
let last = performance.now(), SPEED = 1;
function frame(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; TT += dt; for (let i = 0; i < SPEED; i++) update(dt); draw(dt); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
if (location.hash === '#test') window.__game = { s: () => ({ state, T: Math.round(T), lvl: lv.lvl, kills, hp: Math.round(P.hp), foes: foes.length, w: { ...lv.w } }), P: () => P, foes: () => foes, speed: v => { SPEED = v; }, pickFirst: () => { const b = document.querySelector('.upc'); if (b) b.click(); } };
})();
</script>
