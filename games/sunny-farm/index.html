<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>햇살 농장</title>
<meta name="theme-color" content="#5aa848">
<link rel="icon" href="../../icons/sunny-farm.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../_shared/kit.css">
<style>
  :root { --bg: #2a4a22; --panel: rgba(30, 40, 20, .7); --a1: #ffe06a; --a2: #9ae05a; --a3: #4ac070; --ink-on-grad: #1a3a10; --glow: rgba(160,230,90,.35); }
  .hud .box { padding: 7px 11px; }
  .hud .big { font-size: 21px; }
  .en { height: 6px; width: 92px; border-radius: 9px; background: rgba(255,255,255,.15); overflow: hidden; margin-top: 4px; }
  .en i { display: block; height: 100%; background: linear-gradient(90deg, #ffd24a, #9ae05a); transition: width .25s; }
  .bar { position: fixed; z-index: 6; left: 0; right: 0; bottom: 0; padding: 8px 10px calc(env(safe-area-inset-bottom, 0px) + 10px); display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 6px; background: linear-gradient(180deg, transparent, rgba(10,20,6,.65) 40%); }
  .bar[hidden] { display: none; }
  .bar button { display: grid; justify-items: center; gap: 1px; padding: 7px 2px 6px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 12px; font-weight: 750; cursor: pointer; backdrop-filter: blur(8px); }
  .bar button span { font-size: 21px; line-height: 1.1; }
  .bar button small { font-size: 10.5px; color: var(--muted); font-weight: 650; }
  .sheet { position: fixed; z-index: 7; left: 0; right: 0; bottom: 0; max-height: 74vh; overflow-y: auto; background: #1c2614; border-top: 1px solid var(--line); border-radius: 22px 22px 0 0; padding: 14px 14px calc(env(safe-area-inset-bottom, 0px) + 16px); box-shadow: 0 -20px 50px rgba(0,0,0,.5); transition: transform .25s; }
  .sheet[hidden] { display: block; transform: translateY(110%); pointer-events: none; }
  .sheet h3 { margin: 0 0 4px; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
  .sheet h3 button { border: 0; background: rgba(255,255,255,.08); color: var(--text); border-radius: 10px; width: 34px; height: 34px; cursor: pointer; }
  .sheet h4 { margin: 14px 0 6px; font-size: 13px; color: var(--muted); }
  .sheet .hint { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .opt { display: grid; grid-template-columns: 38px 1fr; gap: 2px 10px; align-items: center; text-align: left; padding: 9px 10px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.05); color: var(--text); cursor: pointer; font-size: 14px; font-weight: 750; }
  .opt .e { grid-row: span 2; font-size: 26px; text-align: center; }
  .opt small { color: var(--muted); font-size: 11.5px; font-weight: 600; }
  .opt:disabled { opacity: .4; cursor: default; }
  .opt.sel { border-color: #9ae05a; background: rgba(154,224,90,.14); }
  .tip { position: fixed; z-index: 6; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); background: rgba(10,20,6,.75); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 700; white-space: nowrap; pointer-events: none; }
  .tip[hidden] { display: none; }
</style>
</head>
<body>
<canvas class="stage" id="cv"></canvas>
<div class="hud">
  <div class="group">
    <div class="box"><div class="lbl" id="seasonLbl">봄 · 1일</div><div class="big" id="gold">🪙 0</div><div class="sub" id="yearLbl">1년차</div></div>
    <div class="box"><div class="lbl">기운</div><div class="big" id="energy">40</div><div class="en"><i id="enBar"></i></div></div>
  </div>
  <div class="stack">
    <a class="pill" href="../../">← 센터</a>
    <button class="pill" id="muteBtn" type="button"></button>
  </div>
</div>
<div class="tip" id="tip" hidden></div>
<div class="bar" id="bar" hidden>
  <button type="button" id="seedBtn"><span id="seedIco">🌱</span><b id="seedName">씨앗 없음</b><small id="seedCnt">상점에서 사요</small></button>
  <button type="button" id="shopBtn"><span>🏪</span>상점<small>씨앗·건물</small></button>
  <button type="button" id="shipBtn"><span>🧺</span>출하<small id="basketInfo">0개</small></button>
  <button type="button" id="sleepBtn"><span>🌙</span>잠자기<small>다음 날</small></button>
</div>
<div class="sheet" id="sheet" hidden><h3><span id="sheetTitle"></span><button type="button" id="sheetClose" aria-label="닫기">✕</button></h3><div id="sheetBody"></div></div>

<div class="screen" id="startScreen">
  <div class="card">
    <div class="lbl">앱개발부 농장 RPG</div>
    <h1>햇살 <span>농장</span></h1>
    <p>할머니가 물려주신 작은 밭에서 새 생활을 시작해요. 씨앗을 심고, 물을 주고, 수확해서 멋진 농장을 꾸며 보세요!</p>
    <div class="rules">
      <div><b>👆</b><span>밭을 탭하면 알아서 해요: 갈기 → 씨앗 심기 → 물 주기 → 수확</span></div>
      <div><b>💧</b><span>물을 준 작물만 하룻밤 자라요. 비 오는 날은 물 안 줘도 OK</span></div>
      <div><b>🍂</b><span>계절마다 키울 수 있는 작물이 달라요. 계절이 바뀌면 시들어요!</span></div>
      <div><b>🏡</b><span>돈을 모아 밭을 넓히고 닭·소를 키워요. 자동 저장!</span></div>
    </div>
    <button class="go" id="startBtn" type="button">농장 시작하기</button>
  </div>
</div>
<div class="screen" id="dayScreen" hidden>
  <div class="card">
    <div class="lbl" id="dayLbl"></div>
    <h2 id="dayTitle"></h2>
    <p id="dayText" style="white-space:pre-line"></p>
    <button class="go" id="dayBtn" type="button">좋은 아침!</button>
  </div>
</div>

<script src="../_shared/kit.js"></script>
<script>
(() => {
'use strict';
const { $, rand, randi, pick, clamp, tone, noise, chord, toast, roundRect } = Kit;
const cv = $('cv'), ctx = cv.getContext('2d');
let VW, VH, DPR; function resize() { DPR = Math.min(2, devicePixelRatio || 1); VW = innerWidth; VH = innerHeight; cv.width = VW * DPR; cv.height = VH * DPR; } addEventListener('resize', resize); resize();

// ---------------------------------------------------------------- data
const SEASONS = [
  { name: '봄', sky: ['#9ad8ff', '#e0f6ff'], grass: ['#8ad860', '#6ac048'], tree: '#ff9ac0' },
  { name: '여름', sky: ['#5ab8ff', '#c8ecff'], grass: ['#6ac848', '#48a838'], tree: '#3a9a3a' },
  { name: '가을', sky: ['#ffb87a', '#ffe8c8'], grass: ['#c8b858', '#a89040'], tree: '#e8702a' },
  { name: '겨울', sky: ['#a8b8d8', '#eef4ff'], grass: ['#e8f0f8', '#c8d4e4'], tree: '#ffffff' },
];
const DAYS = 7; // days per season
const CROPS = [
  { id: 'carrot', e: '🥕', name: '당근', s: 0, cost: 10, days: 3, sell: 26 },
  { id: 'potato', e: '🥔', name: '감자', s: 0, cost: 16, days: 4, sell: 42 },
  { id: 'straw', e: '🍓', name: '딸기', s: 0, cost: 40, days: 5, sell: 34, regrow: 2 },
  { id: 'tomato', e: '🍅', name: '토마토', s: 1, cost: 24, days: 4, sell: 30, regrow: 2 },
  { id: 'corn', e: '🌽', name: '옥수수', s: 1, cost: 26, days: 5, sell: 72 },
  { id: 'melon', e: '🍉', name: '수박', s: 1, cost: 60, days: 6, sell: 190 },
  { id: 'eggplant', e: '🍆', name: '가지', s: 2, cost: 22, days: 4, sell: 28, regrow: 2 },
  { id: 'sweetpot', e: '🍠', name: '고구마', s: 2, cost: 18, days: 4, sell: 48 },
  { id: 'pumpkin', e: '🎃', name: '호박', s: 2, cost: 50, days: 6, sell: 170 },
  { id: 'cabbage', e: '🥬', name: '배추', s: 3, cost: 20, days: 4, sell: 52 },
  { id: 'garlic', e: '🧄', name: '마늘', s: 3, cost: 14, days: 3, sell: 34 },
];
const UPG = [
  { id: 'field5', e: '🟫', name: '밭 넓히기 (5×5)', cost: 300, desc: '심을 칸이 9개 늘어나요', need: null },
  { id: 'field6', e: '🟫', name: '밭 넓히기 (6×6)', cost: 900, desc: '심을 칸이 11개 더!', need: 'field5' },
  { id: 'can', e: '🚿', name: '황금 물뿌리개', cost: 450, desc: '한 번에 십자 모양 5칸에 물', need: null },
  { id: 'scare', e: '🎎', name: '허수아비', cost: 120, desc: '까마귀가 작물을 못 먹어요', need: null },
  { id: 'coop', e: '🐔', name: '닭장 + 닭 2마리', cost: 600, desc: '매일 아침 달걀 🥚 2개', need: null },
  { id: 'barn', e: '🐄', name: '외양간 + 소', cost: 1500, desc: '매일 아침 우유 🥛', need: null },
  { id: 'bed', e: '🛏️', name: '푹신한 침대', cost: 800, desc: '하루 기운 40 → 55', need: null },
];
const GOODS = { egg: { e: '🥚', name: '달걀', sell: 22 }, milk: { e: '🥛', name: '우유', sell: 65 } };

// ---------------------------------------------------------------- save state
const KEY = 'farm_save';
let G = null;
function fresh() {
  return { day: 1, season: 0, year: 1, gold: 120, energy: 40, size: 4, tiles: Array.from({ length: 36 }, () => ({ till: false, crop: null, grown: 0, water: false, dead: false })), seeds: { carrot: 6 }, sel: 'carrot', basket: {}, upg: {}, rain: false, earned: 0, totalEarned: 0, shipped: {} };
}
function save() { if (G) Kit.store.set(KEY, G); }
setInterval(save, 4000); addEventListener('pagehide', save);
const maxEnergy = () => (G.upg.bed ? 55 : 40);
const crop = id => CROPS.find(c => c.id === id);
const tile = (x, y) => G.tiles[y * 6 + x];

// ---------------------------------------------------------------- layout
let L = {};
function layout() {
  const n = G ? G.size : 4, top = 110, bottom = 92, avail = Math.min(VW - 28, VH - top - bottom - 120);
  const T = Math.min(78, Math.floor(avail / 6)); const w = T * n;
  L = { T, n, x: Math.round((VW - w) / 2), y: Math.round(top + 110 + (VH - top - bottom - 110 - w) / 2) };
}
addEventListener('resize', () => G && layout());

// ---------------------------------------------------------------- actions
let fx = [], TT = 0, rainDrops = [], chickens = [];
function spend(n) { if (G.energy < n) { tip('기운이 없어요… 잠을 자요 🌙'); tone(200, .1, 'sine', .04); return false; } G.energy -= n; return true; }
function tapTile(x, y) {
  const t = tile(x, y), C = t.crop && crop(t.crop), cx = L.x + (x + .5) * L.T, cy = L.y + (y + .5) * L.T;
  if (t.dead) { if (!spend(1)) return; t.dead = false; t.crop = null; t.grown = 0; puff(cx, cy, '#8a6a4a'); tone(220, .08, 'triangle', .04); return done(); }
  if (C && t.grown >= C.days) { // harvest
    if (!spend(1)) return;
    G.basket[t.crop] = (G.basket[t.crop] || 0) + 1; fx.push({ k: 'pop', e: C.e, x: cx, y: cy, life: 1 }); chord([660, 880], .04, 'triangle', .05, .15);
    if (C.regrow) { t.grown = C.days - C.regrow; } else { t.crop = null; t.grown = 0; }
    t.water = false; return done();
  }
  if (C) { // water
    if (t.water) return tip(`${C.name}: ${C.days - t.grown}일 뒤 수확 (오늘 물 줌 💧)`);
    if (!spend(1)) return; water(x, y); return done();
  }
  if (!t.till) { if (!spend(2)) return; t.till = true; puff(cx, cy, '#a07850'); noise(.1, .06, 900); return done(); }
  // plant
  const S = G.sel && crop(G.sel);
  if (!S || !G.seeds[G.sel]) return tip('씨앗이 없어요. 상점에서 사 오세요 🏪');
  if (S.s !== G.season) return tip(`${S.name}은(는) ${SEASONS[S.s].name} 작물이에요`);
  if (!spend(1)) return;
  G.seeds[G.sel]--; t.crop = G.sel; t.grown = 0; t.water = G.rain; fx.push({ k: 'seed', x: cx, y: cy, life: .6 }); tone(520, .06, 'triangle', .04, 100);
  if (G.rain) t.water = true;
  if (!G.seeds[G.sel]) delete G.seeds[G.sel];
  done();
}
function water(x, y) {
  const cells = G.upg.can ? [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]] : [[0, 0]];
  for (const [dx, dy] of cells) { const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= G.size || ny >= G.size) continue; const t = tile(nx, ny); if (t.till) t.water = true; for (let i = 0; i < 6; i++) fx.push({ k: 'drop', x: L.x + (nx + .5) * L.T + rand(-12, 12), y: L.y + ny * L.T + rand(0, 10), vy: rand(60, 120), life: .5 }); }
  noise(.25, .05, 3000);
}
function puff(x, y, c) { for (let i = 0; i < 8; i++) fx.push({ k: 'dust', x, y, vx: rand(-60, 60), vy: rand(-80, -20), life: .5, c }); }
function done() { hud(); save(); }
let tipT = 0; function tip(t) { $('tip').textContent = t; $('tip').hidden = false; tipT = 2.2; }

function ship() {
  const keys = Object.keys(G.basket).filter(k => G.basket[k] > 0);
  if (!keys.length) return tip('바구니가 비었어요');
  let sum = 0, lines = [];
  for (const k of keys) { const n = G.basket[k], info = crop(k) || GOODS[k], v = n * info.sell; sum += v; lines.push(`${info.e}×${n}`); G.shipped[k] = (G.shipped[k] || 0) + n; }
  G.basket = {}; G.gold += sum; G.earned += sum; G.totalEarned += sum;
  toast(`🪙 +${sum}`); chord([784, 988, 1175, 1568], .05, 'triangle', .05, .25);
  tip(`출하: ${lines.join(' ')}`); done();
}
function sleep() {
  closeSheet();
  const lines = [];
  // grow crops (watered or rainy today)
  let grew = 0;
  for (let i = 0; i < 36; i++) { const t = G.tiles[i]; if (t.crop && !t.dead) { if (t.water) { const C = crop(t.crop); if (t.grown < C.days) { t.grown++; grew++; } } } t.water = false; }
  if (G.earned) lines.push(`오늘 번 돈: 🪙${G.earned}`);
  G.earned = 0;
  // advance the calendar
  G.day++;
  let seasonMsg = '';
  if (G.day > DAYS) {
    G.day = 1; G.season = (G.season + 1) % 4; if (G.season === 0) G.year++;
    let died = 0; for (const t of G.tiles) if (t.crop && crop(t.crop).s !== G.season) { t.dead = true; died++; }
    seasonMsg = `🍃 ${SEASONS[G.season].name}이 왔어요!` + (died ? ` 계절이 지난 작물 ${died}개가 시들었어요.` : '');
    // carry over seeds of the old season? they just stay in the bag for next year
  }
  G.energy = maxEnergy(); G.rain = G.season !== 3 && Math.random() < .22;
  if (G.rain) { for (const t of G.tiles) if (t.crop) t.water = true; lines.push('☔ 오늘은 비가 와요. 물 안 줘도 돼요!'); }
  // crows
  if (!G.upg.scare && Math.random() < .3) { const cand = G.tiles.filter((t, i) => t.crop && !t.dead && t.grown < crop(t.crop).days && i % 6 < G.size && Math.floor(i / 6) < G.size); if (cand.length) { const v = pick(cand); lines.push(`🐦‍⬛ 까마귀가 ${crop(v.crop).name}을(를) 먹어 버렸어요… (허수아비가 있으면 막을 수 있어요)`); v.crop = null; v.grown = 0; } }
  // animals
  if (G.upg.coop) { G.basket.egg = (G.basket.egg || 0) + 2; lines.push('🐔 달걀 2개를 주웠어요'); }
  if (G.upg.barn) { G.basket.milk = (G.basket.milk || 0) + 1; lines.push('🐄 우유를 짰어요'); }
  if (grew) lines.unshift(`🌱 작물 ${grew}개가 쑥 자랐어요`);
  // year review
  let title = `${SEASONS[G.season].name} ${G.day}일`;
  if (G.season === 0 && G.day === 1 && G.year > 1) { title = `🎉 ${G.year - 1}년차 결산`; lines.unshift(`지금까지 번 돈 🪙${G.totalEarned.toLocaleString()} — ${rank(G.totalEarned)}`); }
  $('dayLbl').textContent = `${G.year}년차`; $('dayTitle').textContent = title;
  $('dayText').textContent = [seasonMsg, ...lines].filter(Boolean).join('\n') || '상쾌한 아침이에요 ☀️';
  Kit.show('dayScreen'); chord([392, 523, 659], .1, 'sine', .04, .3); save(); hud(); syncAnimals();
}
function rank(v) { return v >= 20000 ? '🏆 전설의 농부' : v >= 10000 ? '🥇 마을 최고 농부' : v >= 5000 ? '🥈 솜씨 좋은 농부' : v >= 2000 ? '🥉 성실한 새내기 농부' : '🌱 초보 농부'; }

// ---------------------------------------------------------------- sheets
function openSheet(title, html) { $('sheetTitle').textContent = title; $('sheetBody').innerHTML = html; $('sheet').hidden = false; }
function closeSheet() { $('sheet').hidden = true; }
$('sheetClose').onclick = closeSheet;
function optHTML(o) { return `<button type="button" class="opt${o.sel ? ' sel' : ''}" data-a="${o.a}" ${o.dis ? 'disabled' : ''}><span class="e">${o.e}</span><span>${o.t}</span><small>${o.s}</small></button>`; }
function bindOpts(fn) { for (const b of $('sheetBody').querySelectorAll('.opt')) b.onclick = () => fn(b.dataset.a); }
function seedSheet() {
  const owned = Object.keys(G.seeds).filter(k => G.seeds[k] > 0);
  if (!owned.length) return shopSheet();
  openSheet('씨앗 고르기', `<p class="hint">심을 씨앗을 골라요. 지금은 ${SEASONS[G.season].name}!</p><div class="grid">${owned.map(k => { const C = crop(k); return optHTML({ a: k, e: C.e, t: `${C.name} ×${G.seeds[k]}`, s: C.s === G.season ? `${C.days}일 · 판매 ${C.sell}🪙${C.regrow ? ' · 다시 열려요' : ''}` : `${SEASONS[C.s].name} 작물 (지금은 못 심어요)`, sel: G.sel === k }); }).join('')}</div>`);
  bindOpts(k => { G.sel = k; hud(); closeSheet(); });
}
function shopSheet() {
  const season = CROPS.filter(c => c.s === G.season);
  const ups = UPG.filter(u => !G.upg[u.id] && (!u.need || G.upg[u.need]));
  openSheet('마을 상점', `<p class="hint">🪙 ${G.gold} 가지고 있어요</p><h4>${SEASONS[G.season].name} 씨앗 (5개 묶음)</h4><div class="grid">${season.map(c => optHTML({ a: 's:' + c.id, e: c.e, t: `${c.name} · ${c.cost * 5}🪙`, s: `${c.days}일 · 1개 ${c.sell}🪙${c.regrow ? ` · ${c.regrow}일마다 또 열림` : ''}`, dis: G.gold < c.cost * 5 })).join('')}</div>`
    + (ups.length ? `<h4>농장 꾸미기</h4><div class="grid">${ups.map(u => optHTML({ a: 'u:' + u.id, e: u.e, t: `${u.name}`, s: `${u.cost}🪙 · ${u.desc}`, dis: G.gold < u.cost })).join('')}</div>` : ''));
  bindOpts(a => {
    const [k, id] = a.split(':');
    if (k === 's') { const c = crop(id); if (G.gold < c.cost * 5) return; G.gold -= c.cost * 5; G.seeds[id] = (G.seeds[id] || 0) + 5; G.sel = id; tone(880, .06, 'triangle', .04); toast(`${c.e} 씨앗 5개`); }
    else { const u = UPG.find(x => x.id === id); if (G.gold < u.cost) return; G.gold -= u.cost; G.upg[id] = true; chord([523, 659, 784, 1047], .06, 'triangle', .05, .3); toast(`${u.e} ${u.name}!`);
      if (id === 'field5') G.size = 5; if (id === 'field6') G.size = 6; if (id === 'bed') G.energy += 15; layout(); syncAnimals(); }
    hud(); save(); shopSheet();
  });
}
$('seedBtn').onclick = seedSheet; $('shopBtn').onclick = shopSheet; $('shipBtn').onclick = ship;
$('sleepBtn').onclick = sleep; $('dayBtn').onclick = () => { Kit.hide('dayScreen'); };

// ---------------------------------------------------------------- hud
function hud() {
  $('seasonLbl').textContent = `${SEASONS[G.season].name} · ${G.day}일${G.rain ? ' ☔' : ''}`; $('yearLbl').textContent = `${G.year}년차 · ${rank(G.totalEarned).split(' ')[0]}`;
  $('gold').textContent = '🪙 ' + G.gold.toLocaleString(); $('energy').textContent = `${G.energy}/${maxEnergy()}`; $('enBar').style.width = G.energy / maxEnergy() * 100 + '%';
  const S = G.sel && crop(G.sel), n = S ? G.seeds[G.sel] || 0 : 0;
  $('seedIco').textContent = n ? S.e : '🌱'; $('seedName').textContent = n ? S.name : '씨앗 없음'; $('seedCnt').textContent = n ? `${n}개 · 바꾸기` : '상점에서 사요';
  const bn = Object.values(G.basket).reduce((a, b) => a + b, 0); $('basketInfo').textContent = bn ? `${bn}개 팔기` : '비었음';
}

// ---------------------------------------------------------------- animals
function syncAnimals() {
  const want = (G.upg.coop ? 2 : 0) + (G.upg.barn ? 1 : 0);
  if (chickens.length !== want) { chickens = []; if (G.upg.coop) for (let i = 0; i < 2; i++) chickens.push({ e: '🐔', x: rand(.1, .9), y: 0, tx: rand(.1, .9), t: 0 }); if (G.upg.barn) chickens.push({ e: '🐄', x: .8, y: 0, tx: .8, t: 0, big: true }); }
}

// ---------------------------------------------------------------- draw
function draw(dt) {
  const c = ctx; c.setTransform(DPR, 0, 0, DPR, 0, 0); if (!G) { c.fillStyle = '#5aa848'; c.fillRect(0, 0, VW, VH); return; }
  const S = SEASONS[G.season], horizon = L.y - 70;
  // sky
  const sg = c.createLinearGradient(0, 0, 0, horizon); sg.addColorStop(0, G.rain ? '#8a98a8' : S.sky[0]); sg.addColorStop(1, G.rain ? '#c8d0d8' : S.sky[1]); c.fillStyle = sg; c.fillRect(0, 0, VW, horizon + 2);
  if (!G.rain) { c.fillStyle = '#fff6b0'; c.beginPath(); c.arc(VW - 60, 140, 26, 0, 7); c.fill(); c.fillStyle = 'rgba(255,246,176,.25)'; c.beginPath(); c.arc(VW - 60, 140, 44, 0, 7); c.fill(); }
  c.fillStyle = 'rgba(255,255,255,.85)'; for (const [x, y, r] of [[.15, 120, 22], [.22, 112, 28], [.3, 122, 18], [.62, 96, 20], [.68, 90, 24]]) { c.beginPath(); c.arc(((x * VW + TT * 6) % (VW + 80)) - 40, y, r, 0, 7); c.fill(); }
  // hills
  c.fillStyle = S.grass[1]; c.beginPath(); c.moveTo(0, horizon); for (let x = 0; x <= VW; x += 20) c.lineTo(x, horizon - 18 - Math.sin(x / 90) * 14); c.lineTo(VW, horizon); c.fill();
  // ground
  const gg = c.createLinearGradient(0, horizon, 0, VH); gg.addColorStop(0, S.grass[0]); gg.addColorStop(1, S.grass[1]); c.fillStyle = gg; c.fillRect(0, horizon, VW, VH - horizon);
  // farmhouse & trees
  drawHouse(c, L.x + 30, horizon + 4); drawTree(c, VW - 40, horizon + 12, S.tree); drawTree(c, 26, horizon + 30, S.tree);
  if (G.upg.coop) drawCoop(c, L.x + L.T * L.n - 30, horizon + 6);
  if (G.upg.scare) drawScarecrow(c, Math.min(VW - 22, L.x + L.T * L.n + 16), L.y + L.T * .9);
  // field
  const { T, n, x: fx0, y: fy0 } = L;
  c.fillStyle = 'rgba(90,60,30,.35)'; roundRect(c, fx0 - 8, fy0 - 8, T * n + 16, T * n + 16, 14); c.fill();
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const t = tile(x, y), X = fx0 + x * T, Y = fy0 + y * T;
    c.fillStyle = t.till ? (t.water ? '#6a4428' : '#9a6a40') : (G.season === 3 ? '#d8d0c8' : '#b08a5a');
    roundRect(c, X + 2, Y + 2, T - 4, T - 4, 8); c.fill();
    if (t.till) { c.strokeStyle = t.water ? 'rgba(0,0,0,.2)' : 'rgba(80,50,20,.35)'; c.lineWidth = 2; for (let i = 1; i < 4; i++) { c.beginPath(); c.moveTo(X + 8, Y + i * T / 4); c.lineTo(X + T - 8, Y + i * T / 4); c.stroke(); } if (t.water) { c.fillStyle = 'rgba(120,180,255,.18)'; roundRect(c, X + 2, Y + 2, T - 4, T - 4, 8); c.fill(); } }
    else { c.fillStyle = 'rgba(80,140,40,.5)'; for (let i = 0; i < 3; i++) { const gx = X + T * (.25 + i * .25), gy = Y + T * (.35 + (i % 2) * .3); c.fillRect(gx, gy, 2, 6); c.fillRect(gx + 3, gy + 1, 2, 5); } }
    if (t.dead) { c.font = `${T * .5}px sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('🥀', X + T / 2, Y + T / 2); c.textBaseline = 'alphabetic'; continue; }
    if (t.crop) drawCrop(c, X + T / 2, Y + T * .62, T, crop(t.crop), t.grown);
  }
  // animals
  for (const a of chickens) { a.t -= dt; if (a.t <= 0) { a.tx = rand(.05, .95); a.t = rand(2, 5); } a.x += (a.tx - a.x) * dt * .5; const ax = a.x * VW, ay = (a.big ? horizon + 40 : VH - 120) + Math.abs(Math.sin(TT * 6 + a.x * 20)) * -3; c.font = `${a.big ? 40 : 28}px sans-serif`; c.textAlign = 'center'; c.save(); c.translate(ax, ay); if (a.tx < a.x) c.scale(-1, 1); c.fillText(a.e, 0, 0); c.restore(); }
  // effects
  for (const f of fx) {
    f.life -= dt;
    if (f.k === 'pop') { f.y -= 50 * dt; c.globalAlpha = Math.min(1, f.life * 2); c.font = '34px sans-serif'; c.textAlign = 'center'; c.fillText(f.e, f.x, f.y - 20); c.fillStyle = '#fff'; c.font = '800 14px "Pretendard Variable", sans-serif'; c.fillText('+1', f.x + 22, f.y - 38); }
    else if (f.k === 'drop') { f.y += f.vy * dt; c.globalAlpha = Math.min(1, f.life * 2); c.fillStyle = '#7ac8ff'; c.beginPath(); c.ellipse(f.x, f.y, 2.5, 5, 0, 0, 7); c.fill(); }
    else if (f.k === 'dust') { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 200 * dt; c.globalAlpha = Math.min(1, f.life * 2); c.fillStyle = f.c; c.beginPath(); c.arc(f.x, f.y, 4, 0, 7); c.fill(); }
    else if (f.k === 'seed') { c.globalAlpha = f.life; c.strokeStyle = '#fff'; c.lineWidth = 3; c.beginPath(); c.arc(f.x, f.y, (1 - f.life) * 40 + 6, 0, 7); c.stroke(); }
  }
  fx = fx.filter(f => f.life > 0); c.globalAlpha = 1;
  // weather
  if (G.rain) { if (rainDrops.length < 120) rainDrops.push({ x: rand(0, VW), y: rand(-VH, 0) }); c.strokeStyle = 'rgba(200,220,255,.55)'; c.lineWidth = 1.5; c.beginPath(); for (const r of rainDrops) { r.y += 700 * dt; r.x -= 80 * dt; if (r.y > VH) { r.y = rand(-60, 0); r.x = rand(0, VW + 100); } c.moveTo(r.x, r.y); c.lineTo(r.x - 5, r.y + 14); } c.stroke(); c.fillStyle = 'rgba(60,70,90,.12)'; c.fillRect(0, 0, VW, VH); }
  else if (G.season === 3) { if (rainDrops.length < 70) rainDrops.push({ x: rand(0, VW), y: rand(-VH, 0) }); c.fillStyle = 'rgba(255,255,255,.85)'; for (const r of rainDrops) { r.y += 50 * dt; r.x += Math.sin(TT + r.y / 40) * .4; if (r.y > VH) { r.y = -10; r.x = rand(0, VW); } c.beginPath(); c.arc(r.x, r.y, 2.2, 0, 7); c.fill(); } }
  else rainDrops = [];
  // evening tint as energy runs out
  const tired = 1 - G.energy / maxEnergy(); if (tired > .5) { c.fillStyle = `rgba(255,120,60,${(tired - .5) * .25})`; c.fillRect(0, 0, VW, VH); }
}
function drawCrop(c, x, y, T, C, g) {
  const k = T / 70, ripe = g >= C.days, p = g / C.days;
  c.save(); c.translate(x, y + Math.sin(TT * 2 + x) * .6);
  if (!ripe) {
    const h = (8 + p * 22) * k; c.strokeStyle = '#3a8a2a'; c.lineWidth = 3 * k; c.beginPath(); c.moveTo(0, 6 * k); c.lineTo(0, -h + 6 * k); c.stroke();
    c.fillStyle = '#5ac040'; const leaves = 1 + Math.floor(p * 4);
    for (let i = 0; i < leaves; i++) { const s = i % 2 ? 1 : -1, ly = 4 * k - (i + 1) * h / (leaves + 1); c.beginPath(); c.ellipse(s * 6 * k, ly, 7 * k * (.6 + p * .5), 3.5 * k, s * -.5, 0, 7); c.fill(); }
    if (p > .5) { c.globalAlpha = (p - .5) * 1.6; c.font = `${14 * k}px sans-serif`; c.textAlign = 'center'; c.fillText(C.e, 0, -h + 6 * k); c.globalAlpha = 1; }
  } else {
    const bounce = 1 + Math.sin(TT * 5 + x) * .05;
    c.fillStyle = 'rgba(255,240,140,.45)'; c.beginPath(); c.arc(0, -10 * k, 24 * k, 0, 7); c.fill();
    c.fillStyle = '#4aa83a'; for (const s of [-1, 1]) { c.beginPath(); c.ellipse(s * 10 * k, 2 * k, 10 * k, 4 * k, s * -.4, 0, 7); c.fill(); }
    c.scale(bounce, bounce); c.font = `${32 * k}px sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(C.e, 0, -10 * k); c.textBaseline = 'alphabetic';
  }
  c.restore();
}
function drawHouse(c, x, y) {
  c.save(); c.translate(x, y);
  c.fillStyle = '#fff0d8'; c.fillRect(-26, -40, 52, 40); c.fillStyle = '#d0503a'; c.beginPath(); c.moveTo(-34, -38); c.lineTo(0, -66); c.lineTo(34, -38); c.fill();
  c.fillStyle = '#8a5a3a'; c.fillRect(-7, -22, 14, 22); c.fillStyle = '#7ac8ff'; c.fillRect(10, -32, 11, 10); c.fillRect(-21, -32, 11, 10);
  c.fillStyle = '#9a8a7a'; c.fillRect(14, -64, 8, 16);
  if (Math.sin(TT) > -2) { c.fillStyle = 'rgba(255,255,255,.6)'; for (let i = 0; i < 3; i++) { const t = (TT * .3 + i / 3) % 1; c.beginPath(); c.arc(18 + t * 10, -68 - t * 30, 4 + t * 6, 0, 7); c.fill(); } }
  c.restore();
}
function drawCoop(c, x, y) { c.save(); c.translate(x, y); c.fillStyle = '#e8b870'; c.fillRect(-18, -26, 36, 26); c.fillStyle = '#a85a2a'; c.beginPath(); c.moveTo(-24, -24); c.lineTo(0, -40); c.lineTo(24, -24); c.fill(); c.fillStyle = '#5a3a1a'; c.beginPath(); c.arc(0, -10, 6, Math.PI, 0); c.fillRect(-6, -10, 12, 10); c.fill(); c.restore(); }
function drawScarecrow(c, x, y) {
  c.save(); c.translate(x, y); c.rotate(Math.sin(TT * 1.5) * .04);
  c.fillStyle = '#8a5a30'; c.fillRect(-2.5, -30, 5, 56); c.fillRect(-20, -14, 40, 5);
  c.fillStyle = '#4a8ad8'; c.beginPath(); c.moveTo(-12, -16); c.lineTo(12, -16); c.lineTo(9, 8); c.lineTo(-9, 8); c.fill();
  c.fillStyle = '#e8c070'; c.fillRect(-24, -15, 6, 4); c.fillRect(18, -15, 6, 4);
  c.fillStyle = '#f0d8a8'; c.beginPath(); c.arc(0, -26, 9, 0, 7); c.fill();
  c.fillStyle = '#2a1a10'; c.fillRect(-4, -28, 2, 2); c.fillRect(2, -28, 2, 2); c.fillRect(-3, -23, 6, 1.5);
  c.fillStyle = '#e8b84a'; c.beginPath(); c.ellipse(0, -33, 15, 4, 0, 0, 7); c.fill(); c.beginPath(); c.ellipse(0, -36, 8, 6, 0, Math.PI, 0); c.fill();
  c.fillStyle = '#d04a3a'; c.fillRect(-8, -36, 16, 2.5);
  c.restore();
}
function drawTree(c, x, y, col) { c.fillStyle = '#7a5030'; c.fillRect(x - 5, y - 30, 10, 30); c.fillStyle = col; for (const [dx, dy, r] of [[0, -46, 22], [-14, -36, 16], [14, -36, 16]]) { c.beginPath(); c.arc(x + dx, y + dy, r, 0, 7); c.fill(); } }

// ---------------------------------------------------------------- input
cv.addEventListener('pointerdown', e => {
  if (!G || !$('dayScreen').hidden) return; Kit.initAudio();
  if (!$('sheet').hidden) { closeSheet(); return; }
  const x = Math.floor((e.clientX - L.x) / L.T), y = Math.floor((e.clientY - L.y) / L.T);
  if (x >= 0 && y >= 0 && x < G.size && y < G.size) tapTile(x, y);
});
function start() { if (!G) G = fresh(); layout(); syncAnimals(); Kit.hide('startScreen'); $('bar').hidden = false; hud(); }
$('startBtn').onclick = () => { Kit.initAudio(); start(); setTimeout(() => tip('흙을 탭해서 밭을 갈아 보세요 👆'), 400); };
Kit.bindMute($('muteBtn'));
const saved = Kit.store.get(KEY, null);
if (saved) { G = Object.assign(fresh(), saved); $('startBtn').textContent = `이어서 하기 (${G.year}년차 ${SEASONS[G.season].name} ${G.day}일)`; }

let last = performance.now();
function frame(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; TT += dt; if (tipT > 0) { tipT -= dt; if (tipT <= 0) $('tip').hidden = true; } draw(dt); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
if (location.hash === '#test') window.__game = { G: () => G, tapTile, sleep, ship, set: o => { Object.assign(G, o); layout(); hud(); }, L: () => L, CROPS, buy: (id, n = 1) => { for (let i = 0; i < n; i++) { const c = CROPS.find(x => x.id === id); G.gold -= c.cost * 5; G.seeds[id] = (G.seeds[id] || 0) + 5; } G.sel = id; hud(); }, upg: id => { G.upg[id] = true; if (id === 'field5') G.size = 5; if (id === 'field6') G.size = 6; layout(); syncAnimals(); } };
})();
</script>
</body>
