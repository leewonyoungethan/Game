<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>보물섬 탐사</title>
<meta name="theme-color" content="#0a5a7a">
<link rel="icon" href="../../icons/treasure-island.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../_shared/kit.css">
<style>
  :root { --bg: #0a5a7a; --panel: rgba(4, 40, 60, .62); --a1: #ffd24a; --a2: #ff9a3a; --a3: #ff5a5a; --ink-on-grad: #3a1a00; --glow: rgba(255,170,60,.35); }
  .bar { position: fixed; z-index: 6; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); display: flex; gap: 8px; }
  .bar .pill { height: 44px; padding: 0 16px; font-size: 14px; }
  .bar .pill.on { background: rgba(255, 210, 74, .25); border-color: #ffd24a; color: #fff; }
</style>
</head>
<body>
<canvas class="stage" id="cv"></canvas>
<div class="hud">
  <div class="group">
    <div class="box"><div class="lbl">남은 함정</div><div class="big" id="left">0</div><div class="sub" id="hearts">❤️❤️❤️</div></div>
    <div class="box"><div class="lbl">시간</div><div class="big" id="time">0</div><div class="sub" id="best">최고 —</div></div>
  </div>
  <div class="stack">
    <a class="pill" href="../../">← 게임 센터</a>
    <button class="pill" id="muteBtn" type="button"></button>
  </div>
</div>
<div class="bar" id="bar" hidden>
  <button class="pill" id="digBtn" type="button">⛏️ 파기</button>
  <button class="pill" id="flagBtn" type="button">🚩 깃발</button>
  <button class="pill" id="menuBtn" type="button">☰ 처음</button>
</div>

<div class="screen" id="startScreen">
  <div class="card">
    <div class="lbl">앱개발부 퍼즐</div>
    <h1>보물섬 <span>탐사</span></h1>
    <p>모래 속에 해적 함정이 숨어 있어요. 숫자는 주변 8칸에 있는 함정의 개수! 함정을 피해 모든 모래를 파면 보물을 찾아요.</p>
    <div class="rules">
      <div><b>⛏️</b><span>탭하면 파기 · 꾹 누르거나 오른쪽 클릭하면 🚩 깃발</span></div>
      <div><b>🔢</b><span>숫자 칸을 누르면 깃발 수가 맞을 때 주변을 한 번에 파요</span></div>
      <div><b>❤️</b><span>함정을 밟으면 하트가 줄어요. 첫 삽은 항상 안전!</span></div>
    </div>
    <div class="seg" id="diff">
      <button type="button" data-d="0">쉬움</button><button type="button" data-d="1">보통</button><button type="button" data-d="2">어려움</button>
    </div>
    <button class="go" id="startBtn" type="button">탐사 시작</button>
  </div>
</div>
<div class="screen" id="overScreen" hidden>
  <div class="card">
    <div class="lbl" id="overLbl"></div>
    <h2 id="overTitle"></h2>
    <div class="final" id="finalTime"></div>
    <p id="overText"></p>
    <div class="row"><button class="go" id="againBtn" type="button">다시 탐사</button></div>
    <div class="row"><button class="go ghost" id="toMenuBtn" type="button">난이도 바꾸기</button></div>
  </div>
</div>

<script src="../_shared/kit.js"></script>
<script>
(() => {
'use strict';
const { $, roundRect, tone, noise, chord, toast, shuffle, rand } = Kit;
const DIFFS = [
  { name: '쉬움', cols: 8, rows: 10, traps: 10, lives: 3 },
  { name: '보통', cols: 10, rows: 13, traps: 22, lives: 2 },
  { name: '어려움', cols: 10, rows: 16, traps: 36, lives: 1 },
];
let diff = Kit.store.get('ti_diff', 0);
const cv = $('cv'), ctx = cv.getContext('2d');
const T = 40;                                      // tile size in world units
let D, grid, state = 'title', flagMode = false, started, startTime, elapsed, lives, dug, F, parts = [], booms = [], shake = 0, coins;

function resize() { if (D) F = Kit.fit(cv, D.cols * T, D.rows * T, { top: 96, bottom: 80 }); }
addEventListener('resize', resize);

// ---------------------------------------------------------------- board
function newBoard() {
  D = DIFFS[diff]; grid = [];
  for (let y = 0; y < D.rows; y++) for (let x = 0; x < D.cols; x++) grid.push({ x, y, trap: false, open: false, flag: false, n: 0, coin: Math.random() < .08, wobble: 0, hit: false, t: 0 });
  started = false; elapsed = 0; lives = D.lives; dug = 0; parts = []; booms = []; coins = 0;
  resize(); hud();
}
const at = (x, y) => x < 0 || y < 0 || x >= D.cols || y >= D.rows ? null : grid[y * D.cols + x];
const around = c => { const out = []; for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (dx || dy) { const n = at(c.x + dx, c.y + dy); if (n) out.push(n); } return out; };
function plant(safe) {
  // keep the first cell and its neighbours free so the first dig opens an area
  const keep = new Set([safe, ...around(safe)]);
  shuffle(grid.filter(c => !keep.has(c))).slice(0, D.traps).forEach(c => { c.trap = true; c.coin = false; });
  grid.forEach(c => c.n = around(c).filter(n => n.trap).length);
  started = true; startTime = performance.now();
}

// ---------------------------------------------------------------- actions
function dig(c) {
  if (state !== 'play' || c.open || c.flag) return;
  if (!started) plant(c);
  if (c.trap) return stepOnTrap(c);
  flood(c);
  tone(260 + Math.random() * 60, .06, 'triangle', .05); noise(.05, .04, 900);
  checkWin(); hud();
}
function flood(start) {
  const q = [start], seen = new Set([start]); let k = 0;
  while (q.length) {
    const c = q.shift(); if (c.open || c.flag) continue;
    c.open = true; c.t = k++ * .012; dug++;
    if (c.coin) { coins++; setTimeout(() => tone(1319, .08, 'square', .03), c.t * 1000); }
    if (c.n === 0) for (const n of around(c)) if (!seen.has(n) && !n.trap) { seen.add(n); q.push(n); }
  }
}
function chordDig(c) {
  if (!c.open || c.n === 0) return;
  const ns = around(c), flags = ns.filter(n => n.flag || (n.open && n.trap)).length;
  if (flags !== c.n) { c.wobble = 1; tone(180, .06, 'square', .03); return; }
  for (const n of ns) if (!n.open && !n.flag) { if (n.trap) { stepOnTrap(n); if (state !== 'play') return; } else flood(n); }
  tone(420, .08, 'triangle', .05); checkWin(); hud();
}
function toggleFlag(c) {
  if (state !== 'play' || c.open) return;
  c.flag = !c.flag; c.wobble = 1;
  tone(c.flag ? 700 : 500, .06, 'triangle', .05); if (navigator.vibrate) navigator.vibrate(15); hud();
}
function stepOnTrap(c) {
  c.open = true; c.hit = true; lives--; shake = 12;
  booms.push({ x: (c.x + .5) * T, y: (c.y + .5) * T, t: 0 });
  for (let i = 0; i < 30; i++) { const a = rand(0, 6.28), s = rand(60, 260); parts.push({ x: (c.x + .5) * T, y: (c.y + .5) * T, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, life: rand(.4, .9), c: i % 2 ? '#ffb43a' : '#6a5a4a', r: rand(2, 5) }); }
  noise(.5, .2, 600); tone(110, .5, 'sawtooth', .07, -60);
  if (lives <= 0) { lose(); return; }
  toast(`함정! 남은 하트 ${lives}`); hud();
}
function checkWin() {
  if (grid.every(c => c.trap || c.open)) win();
}
function win() {
  state = 'over'; elapsed = (performance.now() - startTime) / 1000;
  grid.forEach(c => { if (c.trap && !c.open) c.flag = true; });
  const key = 'ti_best_' + diff, b = Kit.best(key, true), isBest = b.submit(Math.round(elapsed));
  chord([523, 659, 784, 1047, 1319], .09, 'triangle', .07, .3);
  for (let i = 0; i < 80; i++) parts.push({ x: rand(0, D.cols * T), y: -10, vx: rand(-40, 40), vy: rand(80, 260), life: rand(1.2, 2.4), c: ['#ffd24a', '#ff7ab8', '#7cf09a', '#6ae2ff'][i % 4], r: rand(2, 4), conf: true });
  $('overLbl').textContent = isBest ? `🎉 ${D.name} 최고 기록!` : `${D.name} 클리어`;
  $('overTitle').textContent = '보물을 찾았어요! 💰';
  $('finalTime').textContent = fmt(elapsed);
  $('overText').textContent = `파낸 금화 ${coins}개 · 남은 하트 ${lives}`;
  setTimeout(() => Kit.show('overScreen'), 1100); hud();
}
function lose() {
  state = 'over'; elapsed = (performance.now() - startTime) / 1000;
  grid.forEach(c => { if (c.trap) c.open = true; });
  $('overLbl').textContent = D.name; $('overTitle').textContent = '해적 함정에 걸렸어요 💥';
  $('finalTime').textContent = Math.round(dug / (D.cols * D.rows - D.traps) * 100) + '%';
  $('overText').textContent = `섬의 ${Math.round(dug / (D.cols * D.rows - D.traps) * 100)}%를 탐사했어요. 숫자를 잘 보고 다시 도전!`;
  setTimeout(() => Kit.show('overScreen'), 1200); hud();
}
const fmt = s => { s = Math.floor(s); return s >= 60 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` : `${s}초`; };
function hud() {
  if (!D) return;
  $('left').textContent = Math.max(0, D.traps - grid.filter(c => c.flag || (c.open && c.trap)).length);
  $('hearts').textContent = '❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(Math.max(0, D.lives - lives));
  const b = Kit.store.get('ti_best_' + diff, null); $('best').textContent = '최고 ' + (b === null ? '—' : fmt(b));
}

// ---------------------------------------------------------------- render
const NUMC = ['', '#2a7ad8', '#2a9a4a', '#e0402a', '#7a3ac8', '#a8501a', '#1a9aa8', '#333', '#888'];
let last = performance.now(), T0 = 0;
function frame(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now; T0 += dt;
  if (state === 'play' && started) { elapsed = (now - startTime) / 1000; $('time').textContent = Math.floor(elapsed); }
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; if (!p.conf) p.vy += 500 * dt; p.life -= dt; } parts = parts.filter(p => p.life > 0);
  booms.forEach(b => b.t += dt); booms = booms.filter(b => b.t < .7);
  shake = Math.max(0, shake - dt * 40);
  if (D) draw(); requestAnimationFrame(frame);
}
function draw() {
  const c = ctx, { dpr, scale, ox, oy, vw, vh } = F, BW = D.cols * T, BH = D.rows * T;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  // sea
  const sea = c.createLinearGradient(0, 0, 0, vh); sea.addColorStop(0, '#2ab4d8'); sea.addColorStop(1, '#0a5a7a');
  c.fillStyle = sea; c.fillRect(0, 0, vw, vh);
  c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 2;
  for (let y = 20; y < vh; y += 34) { c.beginPath(); for (let x = 0; x <= vw; x += 16) { const yy = y + Math.sin(x * .04 + T0 * 1.5 + y) * 4; x ? c.lineTo(x, yy) : c.moveTo(x, yy); } c.stroke(); }
  c.translate(ox + (Math.random() - .5) * shake, oy + (Math.random() - .5) * shake); c.scale(scale, scale);
  // island shore
  c.fillStyle = 'rgba(255,255,255,.35)'; roundRect(c, -18, -18, BW + 36, BH + 36, 34); c.fill();
  c.fillStyle = '#f0d89a'; roundRect(c, -12, -12, BW + 24, BH + 24, 28); c.fill();
  c.fillStyle = '#5ab84a'; roundRect(c, -6, -6, BW + 12, BH + 12, 22); c.fill();
  for (const cell of grid) drawCell(c, cell);
  // explosions
  for (const b of booms) { const k = b.t / .7, g = c.createRadialGradient(b.x, b.y, 0, b.x, b.y, 20 + k * 70);
    g.addColorStop(0, `rgba(255,250,200,${1 - k})`); g.addColorStop(.4, `rgba(255,150,40,${.8 * (1 - k)})`); g.addColorStop(1, 'rgba(255,80,20,0)');
    c.fillStyle = g; c.beginPath(); c.arc(b.x, b.y, 20 + k * 70, 0, 7); c.fill(); }
  for (const p of parts) { c.globalAlpha = Math.max(0, Math.min(1, p.life * 1.5)); c.fillStyle = p.c; if (p.conf) c.fillRect(p.x, p.y, p.r * 2, p.r); else { c.beginPath(); c.arc(p.x, p.y, p.r, 0, 7); c.fill(); } }
  c.globalAlpha = 1;
}
function drawCell(c, cell) {
  const x = cell.x * T, y = cell.y * T, w = cell.wobble > 0 ? Math.sin(cell.wobble * 20) * 2 * cell.wobble : 0;
  if (cell.wobble > 0) cell.wobble = Math.max(0, cell.wobble - .05);
  if (!cell.open) {
    // grassy sand block
    const g = c.createLinearGradient(0, y, 0, y + T); g.addColorStop(0, '#8ae06a'); g.addColorStop(1, '#4ea83c');
    c.fillStyle = g; roundRect(c, x + 2 + w, y + 2, T - 4, T - 4, 8); c.fill();
    c.fillStyle = 'rgba(255,255,255,.28)'; roundRect(c, x + 5 + w, y + 5, T - 10, 6, 3); c.fill();
    c.fillStyle = 'rgba(30,90,30,.35)'; c.fillRect(x + 10 + w, y + 22, 3, 6); c.fillRect(x + 25 + w, y + 16, 3, 7);
    if (cell.flag) {
      c.fillStyle = '#5a3a1a'; c.fillRect(x + 17 + w, y + 9, 3, 23);
      c.fillStyle = '#e8302a'; c.beginPath(); c.moveTo(x + 20 + w, y + 9); c.lineTo(x + 33 + w, y + 14); c.lineTo(x + 20 + w, y + 20); c.fill();
      c.fillStyle = '#fff'; c.font = '700 7px sans-serif'; c.textAlign = 'center'; c.fillText('☠', x + 25 + w, y + 17);
      c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(x + 19 + w, y + 32, 7, 2.5, 0, 0, 7); c.fill();
    }
    return;
  }
  // dug sand (reveal delay gives a ripple)
  const appear = Math.min(1, Math.max(0, (performance.now() / 1000 - (cell.openAt ??= performance.now() / 1000 + cell.t)) * 8 + 1));
  const s = .6 + .4 * appear;
  c.save(); c.translate(x + T / 2, y + T / 2); c.scale(s, s);
  const g = c.createLinearGradient(0, -T / 2, 0, T / 2); g.addColorStop(0, cell.hit ? '#e8a07a' : '#f4dea8'); g.addColorStop(1, cell.hit ? '#c8604a' : '#e0c080');
  c.fillStyle = g; roundRect(c, -T / 2 + 1, -T / 2 + 1, T - 2, T - 2, 6); c.fill();
  c.fillStyle = 'rgba(160,110,40,.18)'; c.beginPath(); c.arc(-8, 8, 2, 0, 7); c.arc(9, -6, 1.6, 0, 7); c.fill();
  c.textAlign = 'center'; c.textBaseline = 'middle';
  if (cell.trap) {
    c.fillStyle = '#2a2230'; c.beginPath(); c.arc(0, 2, 11, 0, 7); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(0, 0, 6.5, 0, 7); c.fill(); c.fillRect(-4, 4, 8, 5);
    c.fillStyle = '#2a2230'; c.beginPath(); c.arc(-2.4, -.5, 1.8, 0, 7); c.arc(2.4, -.5, 1.8, 0, 7); c.fill();
    c.strokeStyle = '#ffb43a'; c.lineWidth = 2; c.beginPath(); c.moveTo(6, -8); c.quadraticCurveTo(10, -14, 14, -12); c.stroke();
  } else if (cell.n > 0) {
    c.fillStyle = NUMC[cell.n]; c.font = '900 22px "Pretendard Variable", system-ui, sans-serif'; c.fillText(cell.n, 0, 2);
  } else if (cell.coin) {
    const cg = c.createRadialGradient(-2, -2, 0, 0, 0, 9); cg.addColorStop(0, '#fff6b0'); cg.addColorStop(1, '#d89a00');
    c.fillStyle = cg; c.beginPath(); c.arc(0, 0, 8, 0, 7); c.fill(); c.strokeStyle = '#8a5a00'; c.lineWidth = 1.5; c.stroke();
    c.fillStyle = '#8a5a00'; c.font = '800 9px sans-serif'; c.fillText('$', 0, 1);
  }
  c.restore();
}

// ---------------------------------------------------------------- input
function cellAt(e) {
  const x = Math.floor(((e.clientX - F.ox) / F.scale) / T), y = Math.floor(((e.clientY - F.oy) / F.scale) / T);
  return at(x, y);
}
let pressT = null, pressCell = null, longDone = false;
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  const c = cellAt(e); if (!c) return;
  if (e.button === 2) { toggleFlag(c); return; }
  pressCell = c; longDone = false;
  pressT = setTimeout(() => { longDone = true; if (!c.open) toggleFlag(c); }, 380);
});
addEventListener('pointerup', e => {
  if (pressT) clearTimeout(pressT); pressT = null;
  if (state !== 'play' || !pressCell || longDone || e.button === 2) { pressCell = null; return; }
  const c = cellAt(e); if (c !== pressCell) { pressCell = null; return; }
  if (c.open) chordDig(c); else if (flagMode) toggleFlag(c); else dig(c);
  pressCell = null;
});
addEventListener('pointercancel', () => { if (pressT) clearTimeout(pressT); pressCell = null; });
function setMode(f) { flagMode = f; $('digBtn').classList.toggle('on', !f); $('flagBtn').classList.toggle('on', f); }
$('digBtn').onclick = () => setMode(false); $('flagBtn').onclick = () => setMode(true);
addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F') setMode(!flagMode); });

// ---------------------------------------------------------------- flow
const segBtns = [...$('diff').children];
function paintDiff() { segBtns.forEach(b => b.classList.toggle('on', +b.dataset.d === diff)); }
segBtns.forEach(b => b.onclick = () => { diff = +b.dataset.d; Kit.store.set('ti_diff', diff); paintDiff(); newBoard(); });
function start() { newBoard(); state = 'play'; setMode(false); Kit.hide('startScreen', 'overScreen'); $('bar').hidden = false; $('time').textContent = '0'; }
$('startBtn').onclick = start; $('againBtn').onclick = start;
$('toMenuBtn').onclick = () => { Kit.hide('overScreen'); state = 'title'; $('bar').hidden = true; Kit.show('startScreen'); };
$('menuBtn').onclick = () => { state = 'title'; $('bar').hidden = true; Kit.show('startScreen'); };
Kit.bindMute($('muteBtn'));
paintDiff(); newBoard(); requestAnimationFrame(frame);
if (location.hash === '#test') window.__game = { s: () => ({ grid, D, state, lives, started }), dig: (x, y) => dig(at(x, y)), flag: (x, y) => toggleFlag(at(x, y)), chord: (x, y) => chordDig(at(x, y)) };
})();
</script>
</body>
</html>
