<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>구름 카페</title>
<meta name="theme-color" content="#f8d8c8">
<link rel="icon" href="../../icons/cloud-cafe.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../_shared/kit.css">
<style>
  :root { --bg: #2a1c22; --panel: rgba(50, 30, 36, .72); --a1: #ffd0a0; --a2: #ff9ab0; --a3: #c89aff; --ink-on-grad: #3a1420; --glow: rgba(255,160,180,.35); }
  .hud .box { padding: 7px 11px; } .hud .big { font-size: 21px; }
  .tbar { height: 6px; width: 96px; border-radius: 9px; background: rgba(255,255,255,.15); overflow: hidden; margin-top: 4px; }
  .tbar i { display: block; height: 100%; background: linear-gradient(90deg, #ffd0a0, #ff9ab0); }
  .work { position: fixed; z-index: 6; left: 50%; transform: translateX(-50%); width: min(720px, 100%); bottom: 0; padding: 10px 12px calc(env(safe-area-inset-bottom, 0px) + 12px); background: linear-gradient(180deg, #5a3a2e, #3a241c); border-top: 4px solid #8a5a40; border-radius: 22px 22px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,.35); }
  .work[hidden] { display: none; }
  .hold { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 8px; align-items: center; }
  .cup { min-height: 48px; border-radius: 14px; background: rgba(255,255,255,.1); border: 1px dashed rgba(255,255,255,.3); display: flex; align-items: center; gap: 6px; padding: 6px 10px; flex-wrap: wrap; font-size: 13px; font-weight: 800; }
  .cup .lbl2 { color: var(--muted); font-weight: 700; margin-right: 2px; }
  .cup .chip { background: rgba(255,255,255,.14); border-radius: 999px; padding: 3px 8px; }
  .cup .made { background: linear-gradient(100deg, #ffd0a0, #ff9ab0); color: #3a1420; border-radius: 999px; padding: 4px 10px; }
  .trash { height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.08); color: var(--text); font-weight: 800; cursor: pointer; }
  .ings { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .ing { position: relative; display: grid; justify-items: center; gap: 1px; padding: 8px 0 6px; border-radius: 14px; border: 1px solid rgba(255,255,255,.18); background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.06)); color: var(--text); font-size: 11.5px; font-weight: 800; cursor: pointer; touch-action: manipulation; overflow: hidden; }
  .ing span { font-size: 24px; line-height: 1.1; }
  .ing:active { transform: scale(.95); }
  .ing:disabled { opacity: .3; }
  .ing .prog { position: absolute; left: 0; bottom: 0; height: 4px; background: #ffd0a0; width: 0; }
  .menu { margin-top: 8px; font-size: 11.5px; color: var(--muted); text-align: center; line-height: 1.6; word-break: keep-all; }
  .sheet { position: fixed; z-index: 7; left: 0; right: 0; bottom: 0; max-height: 82vh; overflow-y: auto; background: #2a1c22; border-top: 1px solid var(--line); border-radius: 22px 22px 0 0; padding: 16px 14px calc(env(safe-area-inset-bottom, 0px) + 16px); }
  .sheet[hidden] { display: none; }
  .sheet h3 { margin: 0 0 6px; font-size: 20px; }
  .sheet h4 { margin: 14px 0 6px; font-size: 13px; color: var(--muted); }
  .sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; margin: 6px 0 4px; }
  .sum div { background: rgba(255,255,255,.06); border-radius: 12px; padding: 8px 0; font-size: 12px; color: var(--muted); }
  .sum b { display: block; color: var(--text); font-size: 18px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .opt { display: grid; grid-template-columns: 36px 1fr; gap: 2px 10px; align-items: center; text-align: left; padding: 9px 10px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.05); color: var(--text); cursor: pointer; font-size: 13.5px; font-weight: 750; }
  .opt .e { grid-row: span 2; font-size: 26px; text-align: center; }
  .opt small { color: var(--muted); font-size: 11px; font-weight: 600; }
  .opt:disabled { opacity: .4; cursor: default; }
  .opt.own { border-color: #9ae0a0; background: rgba(150,230,160,.1); cursor: default; }
</style>
</head>
<body>
<canvas class="stage" id="cv"></canvas>
<div class="hud">
  <div class="group">
    <div class="box"><div class="lbl" id="dayLbl">1일차</div><div class="big" id="money">🪙 0</div><div class="sub" id="rep">☆☆☆☆☆</div></div>
    <div class="box"><div class="lbl">영업 시간</div><div class="big" id="served">0명</div><div class="tbar"><i id="timeBar"></i></div></div>
  </div>
  <div class="stack">
    <a class="pill" href="../../">← 센터</a>
    <button class="pill" id="muteBtn" type="button"></button>
  </div>
</div>
<div class="work" id="work" hidden>
  <div class="hold"><div class="cup" id="cup"></div><button class="trash" id="trashBtn" type="button">🗑️ 비우기</button></div>
  <div class="ings" id="ings"></div>
  <div class="menu" id="menuLine"></div>
</div>
<div class="sheet" id="sheet" hidden>
  <h3 id="sumTitle"></h3>
  <div class="sum" id="sum"></div>
  <h4>새 메뉴 연구</h4><div class="grid" id="research"></div>
  <h4>카페 꾸미기</h4><div class="grid" id="upgrades"></div>
  <button class="go" id="openBtn" type="button" style="margin-top:14px">☀️ 다음 날 영업 시작</button>
</div>

<div class="screen" id="startScreen">
  <div class="card">
    <div class="lbl">앱개발부 카페 경영 RPG</div>
    <h1>구름 <span>카페</span></h1>
    <p>구름 위 작은 카페의 새 사장님이 되었어요! 동물 손님들의 주문을 빠르고 정확하게 만들어 최고의 카페로 키워 주세요.</p>
    <div class="rules">
      <div><b>💬</b><span>손님 말풍선의 메뉴를 확인해요</span></div>
      <div><b>☕</b><span>아래 재료를 눌러 컵에 담아요 (순서는 상관없어요)</span></div>
      <div><b>👆</b><span>다 만들었으면 그 손님을 탭해서 건네줘요</span></div>
      <div><b>⭐</b><span>빨리 줄수록 팁과 평판이 올라가요. 영업이 끝나면 새 메뉴를 연구해요!</span></div>
    </div>
    <button class="go" id="startBtn" type="button">카페 문 열기</button>
  </div>
</div>

<script src="../_shared/kit.js"></script>
<script>
(() => {
'use strict';
const { $, rand, randi, pick, clamp, tone, noise, chord, toast, roundRect } = Kit;
const cv = $('cv'), ctx = cv.getContext('2d');
let VW, VH, DPR; function resize() { DPR = Math.min(2, devicePixelRatio || 1); VW = innerWidth; VH = innerHeight; cv.width = VW * DPR; cv.height = VH * DPR; } addEventListener('resize', resize); resize();

// ---------------------------------------------------------------- data
const ING = {
  esp: { e: '☕', name: '에스프레소', brew: true },
  water: { e: '💧', name: '물' }, milk: { e: '🥛', name: '우유' }, ice: { e: '🧊', name: '얼음', need: 'ice' },
  choco: { e: '🍫', name: '초코' }, straw: { e: '🍓', name: '딸기', need: 'straw' }, matcha: { e: '🍵', name: '말차', need: 'matcha' },
  honey: { e: '🍯', name: '꿀', need: 'honey' }, cake: { e: '🍰', name: '케이크', need: 'dessert', food: true }, croi: { e: '🥐', name: '크루아상', need: 'dessert', food: true },
};
const MENU = [
  { id: 'ame', name: '아메리카노', e: '☕', r: ['esp', 'water'], price: 21 },
  { id: 'latte', name: '카페라떼', e: '🥛', r: ['esp', 'milk'], price: 27 },
  { id: 'choco', name: '초코라떼', e: '🍫', r: ['choco', 'milk'], price: 25 },
  { id: 'iame', name: '아이스 아메리카노', e: '🧊', r: ['esp', 'water', 'ice'], price: 25, need: 'ice' },
  { id: 'ilatte', name: '아이스 라떼', e: '🧋', r: ['esp', 'milk', 'ice'], price: 31, need: 'ice' },
  { id: 'smilk', name: '딸기우유', e: '🍓', r: ['straw', 'milk'], price: 29, need: 'straw' },
  { id: 'smoo', name: '딸기 스무디', e: '🍹', r: ['straw', 'milk', 'ice'], price: 36, need: ['straw', 'ice'] },
  { id: 'matcha', name: '말차라떼', e: '🍵', r: ['matcha', 'milk'], price: 34, need: 'matcha' },
  { id: 'honey', name: '꿀 라떼', e: '🍯', r: ['esp', 'milk', 'honey'], price: 35, need: 'honey' },
  { id: 'cake', name: '딸기 케이크', e: '🍰', r: ['cake'], price: 31, need: 'dessert', food: true },
  { id: 'croi', name: '크루아상', e: '🥐', r: ['croi'], price: 22, need: 'dessert', food: true },
];
const RESEARCH = [
  { id: 'ice', e: '🧊', name: '아이스 메뉴', cost: 360, desc: '아이스 아메리카노·아이스 라떼' },
  { id: 'straw', e: '🍓', name: '딸기 메뉴', cost: 520, desc: '딸기우유 (얼음이 있으면 스무디도!)' },
  { id: 'dessert', e: '🍰', name: '디저트', cost: 760, desc: '케이크·크루아상 (주문이 2개씩 와요)' },
  { id: 'matcha', e: '🍵', name: '말차라떼', cost: 840, desc: '비싸게 팔리는 인기 메뉴' },
  { id: 'honey', e: '🍯', name: '꿀 라떼', cost: 960, desc: '에스프레소 + 우유 + 꿀' },
];
const UPGRADES = [
  { id: 'machine', e: '⚙️', name: '반짝 커피머신', cost: 500, desc: '에스프레소가 2배 빨리 나와요' },
  { id: 'seat4', e: '🪑', name: '자리 하나 더', cost: 600, desc: '손님 4명까지' },
  { id: 'seat5', e: '🛋️', name: '소파 자리', cost: 1400, desc: '손님 5명까지', need: 'seat4' },
  { id: 'cozy', e: '🪴', name: '아늑한 인테리어', cost: 900, desc: '손님이 30% 더 오래 기다려 줘요' },
  { id: 'music', e: '🎶', name: '구름 라디오', cost: 700, desc: '팁이 20% 늘어요' },
  { id: 'sign', e: '🌈', name: '무지개 간판', cost: 1200, desc: '평판이 더 빨리 올라요' },
];
const ANIMALS = ['🐰', '🐻', '🐱', '🐶', '🦊', '🐼', '🐨', '🐸', '🐹', '🐯', '🐷', '🐧', '🦄', '🐮'];

// ---------------------------------------------------------------- save
const KEY = 'cafe_save';
let S = Kit.store.get(KEY, null);
function freshSave() { return { day: 1, money: 60, rep: 10, own: {}, best: 0, totalServed: 0 }; }
if (!S) S = freshSave();
function save() { Kit.store.set(KEY, S); }

// ---------------------------------------------------------------- day state
const DAY_LEN = 95;
let state = 'title', T = 0, spawnT = 0, seats = [], cup = [], brewing = null, served = 0, earned = 0, tips = 0, angry = 0, perfect = 0, fx = [], TT = 0;
const nSeats = () => (S.own.seat5 ? 5 : S.own.seat4 ? 4 : 3);
const has = need => !need || (Array.isArray(need) ? need.every(n => S.own[n]) : S.own[need]);
const avail = () => MENU.filter(m => has(m.need));
const stars = () => clamp(S.rep / 20, 0, 5);
function startDay() {
  state = 'open'; T = 0; spawnT = 1.5; seats = Array(nSeats()).fill(null); cup = []; brewing = null; served = 0; earned = 0; tips = 0; angry = 0; perfect = 0;
  $('sheet').hidden = true; Kit.hide('startScreen'); $('work').hidden = false; buildIngs(); renderCup(); hud();
  toast(`${S.day}일차 영업 시작!`); chord([523, 659, 784], .06, 'triangle', .05, .2);
}
function spawn() {
  const free = seats.map((s, i) => (s ? -1 : i)).filter(i => i >= 0); if (!free.length) return;
  const i = pick(free), menu = avail(), drinks = menu.filter(m => !m.food), foods = menu.filter(m => m.food);
  const order = [pick(drinks)]; if (foods.length && Math.random() < .5) order.push(pick(foods));
  const pat = (24 + order.length * 8) * (S.own.cozy ? 1.3 : 1) * (1 - Math.min(.25, S.day * .012));
  seats[i] = { a: pick(ANIMALS), order: order.map(o => ({ ...o, done: false })), pat, max: pat, enter: 0, mood: 'wait', leave: 0, bob: rand(0, 6) };
  tone(1320, .05, 'sine', .03); tone(1760, .05, 'sine', .03);
}
function update(dt) {
  if (state !== 'open' && state !== 'closing') return;
  T += dt;
  if (state === 'open') { spawnT -= dt; if (spawnT <= 0) { spawn(); spawnT = Math.max(2.2, 6.5 - stars() * .8 - S.day * .06) * rand(.75, 1.25); } if (T >= DAY_LEN) { state = 'closing'; toast('마감 시간! 남은 손님만 받아요'); } }
  for (let i = 0; i < seats.length; i++) {
    const c = seats[i]; if (!c) continue;
    c.enter = Math.min(1, c.enter + dt * 3); c.bob += dt * 3;
    if (c.mood === 'wait') { c.pat -= dt; if (c.pat <= 0) { c.mood = 'angry'; c.leave = 1.2; angry++; S.rep = Math.max(0, S.rep - 4); tone(180, .3, 'sawtooth', .04, -60); floatAt(i, '😠 기다리다 갔어요', '#ff8a8a'); } }
    else { c.leave -= dt; if (c.leave <= 0) seats[i] = null; }
  }
  if (brewing) { brewing.t += dt; const p = brewing.t / brewing.dur; const bar = document.querySelector('[data-k="esp"] .prog'); if (bar) bar.style.width = Math.min(100, p * 100) + '%'; if (p >= 1) { cup.push('esp'); brewing = null; if (bar) bar.style.width = 0; tone(900, .06, 'sine', .04); renderCup(); } }
  if (state === 'closing' && seats.every(s => !s)) endDay();
  hud();
}
function serve(i) {
  const c = seats[i]; if (!c || c.mood !== 'wait') return;
  if (!cup.length) { floatAt(i, pick(c.order.filter(o => !o.done)).name + ' 주세요!', '#fff'); return; }
  const key = [...cup].sort().join('+');
  const hit = c.order.find(o => !o.done && [...o.r].sort().join('+') === key);
  if (!hit) {
    c.pat = Math.max(1, c.pat - c.max * .3); S.rep = Math.max(0, S.rep - 1); cup = []; renderCup();
    floatAt(i, '이게 아닌데… 🤔', '#ffb0b0'); tone(220, .2, 'square', .04, -80); return;
  }
  hit.done = true; cup = []; renderCup();
  const p = c.pat / c.max, tip = Math.round(hit.price * (p > .6 ? .5 : p > .3 ? .25 : 0) * (S.own.music ? 1.2 : 1));
  earned += hit.price + tip; tips += tip; S.money += hit.price + tip;
  coinFx(i, hit.price + tip); chord([784, 988], .04, 'triangle', .05, .12);
  if (c.order.every(o => o.done)) {
    c.mood = p > .6 ? 'love' : 'ok'; c.leave = 1.1; served++; S.totalServed++;
    const g = (p > .6 ? .9 : p > .3 ? .45 : .15) * (S.own.sign ? 1.4 : 1); S.rep = Math.min(100, S.rep + g); if (p > .6) perfect++;
    floatAt(i, p > .6 ? '최고예요! 💗' : '고마워요 😊', '#ffe0f0');
  } else { c.pat = Math.min(c.max, c.pat + c.max * .25); floatAt(i, '하나 더!', '#fff'); }
}
function endDay() {
  state = 'summary'; $('work').hidden = true; save();
  chord([523, 659, 784, 1047], .08, 'triangle', .06, .3);
  $('sumTitle').textContent = `${S.day}일차 영업 끝! ${'★'.repeat(Math.floor(stars()))}${'☆'.repeat(5 - Math.floor(stars()))}`;
  $('sum').innerHTML = `<div>번 돈<b>🪙${earned}</b></div><div>손님<b>${served}명</b></div><div>칭찬<b>💗${perfect}</b></div>`;
  S.day++; S.best = Math.max(S.best, earned); save(); shopRender(); $('sheet').hidden = false;
  if (angry) setTimeout(() => toast(`그냥 간 손님 ${angry}명… 더 빨리!`, 1800), 300);
}
function shopRender() {
  const mk = (list, box) => { $(box).innerHTML = ''; for (const u of list) { if (u.need && !S.own[u.need] && box === 'upgrades') continue; const b = document.createElement('button'); b.type = 'button'; const own = S.own[u.id]; b.className = 'opt' + (own ? ' own' : ''); b.innerHTML = `<span class="e">${u.e}</span><span>${u.name}</span><small>${own ? '✔ 완료' : `${u.cost}🪙 · ${u.desc}`}</small>`; b.disabled = !own && S.money < u.cost; if (!own) b.onclick = () => { if (S.money < u.cost) return; S.money -= u.cost; S.own[u.id] = true; chord([659, 880, 1175], .05, 'triangle', .05, .2); toast(`${u.e} ${u.name}!`); save(); shopRender(); hud(); }; $(box).append(b); } };
  mk(RESEARCH, 'research'); mk(UPGRADES, 'upgrades');
}

// ---------------------------------------------------------------- work area
function buildIngs() {
  const box = $('ings'); box.innerHTML = '';
  for (const [k, I] of Object.entries(ING)) {
    if (I.need && !S.own[I.need]) continue;
    const b = document.createElement('button'); b.type = 'button'; b.className = 'ing'; b.dataset.k = k;
    b.innerHTML = `<span>${I.e}</span>${I.name}${I.brew ? '<i class="prog"></i>' : ''}`;
    b.onpointerdown = e => { e.preventDefault(); addIng(k); };
    box.append(b);
  }
  $('menuLine').textContent = '메뉴: ' + avail().map(m => `${m.e}${m.name}(${m.r.map(r => ING[r].e).join('')})`).join(' · ');
}
function addIng(k) {
  if (state !== 'open' && state !== 'closing') return; Kit.initAudio();
  const I = ING[k];
  if (I.food) { cup = [k]; tone(700, .05, 'triangle', .04); renderCup(); return; }
  if (cup.some(c => ING[c].food)) cup = [];
  if (cup.includes(k) || (brewing && k === 'esp')) { tone(200, .06, 'sine', .03); return; }
  if (cup.length >= 3) { toast('컵이 가득 찼어요'); return; }
  if (I.brew) { brewing = { t: 0, dur: S.own.machine ? .55 : 1.1 }; noise(brewing.dur, .03, 1200); return; }
  cup.push(k); tone(500 + cup.length * 120, .05, 'triangle', .04); renderCup();
}
function renderCup() {
  const el = $('cup'); const key = [...cup].sort().join('+'), m = avail().find(x => [...x.r].sort().join('+') === key);
  if (!cup.length) { el.innerHTML = '<span class="lbl2">빈 컵 — 재료를 눌러 담아요</span>'; return; }
  el.innerHTML = cup.map(c => `<span class="chip">${ING[c].e} ${ING[c].name}</span>`).join('') + (m ? `<span class="made">= ${m.e} ${m.name} 완성!</span>` : '');
}
$('trashBtn').onclick = () => { cup = []; brewing = null; renderCup(); tone(300, .08, 'sine', .03, -100); };

// ---------------------------------------------------------------- hud & fx
function hud() {
  $('dayLbl').textContent = `${S.day}일차`; $('money').textContent = '🪙 ' + S.money.toLocaleString();
  const st = stars(); $('rep').textContent = '★'.repeat(Math.floor(st)) + '☆'.repeat(5 - Math.floor(st)) + ` ${Math.floor(S.rep)}`;
  $('served').textContent = `${served}명`; $('timeBar').style.width = Math.max(0, 100 - T / DAY_LEN * 100) + '%';
}
let workH = 200;
const sceneBottom = () => VH - ($('work').hidden ? 0 : workH);
const seatY = () => Math.max(250, sceneBottom() - 110);
function seatPos(i) { const n = seats.length, w = Math.min(VW - 20, 520), gap = w / n; return { x: (VW - w) / 2 + gap * (i + .5), y: seatY() }; }
function floatAt(i, t, c) { const p = seatPos(i); fx.push({ k: 'txt', x: p.x, y: p.y - 92, t, c, life: 1.4 }); }
function coinFx(i, n) { const p = seatPos(i); fx.push({ k: 'txt', x: p.x, y: p.y - 70, t: `+🪙${n}`, c: '#ffe06a', life: 1.2 }); for (let j = 0; j < 8; j++) fx.push({ k: 'coin', x: p.x, y: p.y, vx: rand(-80, 80), vy: rand(-220, -120), life: .9 }); }

// ---------------------------------------------------------------- draw
function draw(dt) {
  const c = ctx; c.setTransform(DPR, 0, 0, DPR, 0, 0);
  // sky & clouds outside
  const g = c.createLinearGradient(0, 0, 0, VH); g.addColorStop(0, '#ffd8e0'); g.addColorStop(.5, '#ffe8d8'); g.addColorStop(1, '#f8c8b8'); c.fillStyle = g; c.fillRect(0, 0, VW, VH);
  // wall with big windows
  if (!$('work').hidden) workH = $('work').offsetHeight;
  const SY = seatY(), winTop = 108, winH = Math.max(70, SY - 140 - winTop);
  c.fillStyle = '#fff4ea'; c.fillRect(0, winTop - 16, VW, SY - winTop + 40);
  const wn = Math.max(2, Math.round(VW / 200));
  for (let i = 0; i < wn; i++) { const w = VW / wn, x = i * w + 14, y = winTop, ww = w - 28, hh = winH;
    const sg = c.createLinearGradient(0, y, 0, y + hh); sg.addColorStop(0, '#9ad0ff'); sg.addColorStop(1, '#e0f2ff'); c.fillStyle = sg; roundRect(c, x, y, ww, hh, 14); c.fill();
    c.fillStyle = '#fff'; for (let k = 0; k < 3; k++) { const cx = x + ((k * 70 + TT * 8 + i * 40) % (ww + 60)) - 30, cy = y + 18 + k * 14; c.save(); c.beginPath(); roundRect(c, x, y, ww, hh, 14); c.clip(); c.beginPath(); c.arc(cx, cy, 12, 0, 7); c.arc(cx + 14, cy - 4, 15, 0, 7); c.arc(cx + 28, cy, 11, 0, 7); c.fill(); c.restore(); }
    c.strokeStyle = '#e8c8b0'; c.lineWidth = 5; roundRect(c, x, y, ww, hh, 14); c.stroke(); }
  // bunting
  c.strokeStyle = '#d8a890'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(0, winTop - 12); c.quadraticCurveTo(VW / 2, winTop + 10, VW, winTop - 12); c.stroke();
  const cols = ['#ff9ab0', '#ffd27a', '#9ad8ff', '#b8e8a0', '#c8a8ff']; for (let i = 0; i < 14; i++) { const t = (i + .5) / 14, x = t * VW, y = winTop - 12 + Math.sin(t * Math.PI) * 11; c.fillStyle = cols[i % 5]; c.beginPath(); c.moveTo(x - 9, y); c.lineTo(x + 9, y); c.lineTo(x, y + 16); c.fill(); }
  // decor
  if (S.own.cozy) { c.font = '34px sans-serif'; c.textAlign = 'center'; c.fillText('🪴', 22, SY + 26); c.fillText('🪴', VW - 22, SY + 26); }
  if (S.own.music) { c.font = '26px sans-serif'; c.textAlign = 'center'; c.fillText('📻', VW - 30, winTop + winH + 22); if (Math.sin(TT * 3) > 0) { c.font = '16px sans-serif'; c.fillText('♪', VW - 44 + Math.sin(TT) * 4, winTop + winH - (TT * 20 % 20)); } }
  if (S.own.sign) { c.font = '800 15px "Pretendard Variable", sans-serif'; c.textAlign = 'center'; const sx = VW / 2, sy = winTop + 26; c.fillStyle = '#fff'; roundRect(c, sx - 60, sy - 18, 120, 26, 13); c.fill(); c.fillStyle = `hsl(${TT * 60 % 360},80%,55%)`; c.fillText('🌈 구름 카페', sx, sy); }
  // customers
  for (let i = 0; i < seats.length; i++) {
    const p = seatPos(i), cst = seats[i];
    // stool
    c.fillStyle = '#c8885a'; c.fillRect(p.x - 3, p.y + 20, 6, 30); c.fillStyle = '#ff9ab0'; c.beginPath(); c.ellipse(p.x, p.y + 20, 24, 8, 0, 0, 7); c.fill();
    if (!cst) continue;
    const yOff = (1 - cst.enter) * 40 + (cst.mood !== 'wait' ? (1.2 - cst.leave) * -20 : 0) + Math.sin(cst.bob) * 2;
    c.globalAlpha = cst.mood !== 'wait' ? Math.max(0, cst.leave) : cst.enter;
    c.font = '54px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(cst.a, p.x, p.y - 4 + yOff);
    if (cst.mood === 'love') c.fillText('💗', p.x + 26, p.y - 40 + yOff); if (cst.mood === 'angry') c.fillText('💢', p.x + 26, p.y - 40 + yOff);
    c.textBaseline = 'alphabetic';
    if (cst.mood === 'wait') {
      // order bubble
      const items = cst.order, bw = 40 + items.length * 34, bx = p.x - bw / 2, by = p.y - 104;
      c.fillStyle = '#fff'; roundRect(c, bx, by, bw, 44, 14); c.fill(); c.beginPath(); c.moveTo(p.x - 7, by + 43); c.lineTo(p.x, by + 54); c.lineTo(p.x + 7, by + 43); c.fill();
      items.forEach((o, j) => { const ix = bx + 37 + j * 34; c.globalAlpha = o.done ? .25 : 1; c.font = '26px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(o.e, ix, by + 22); c.textBaseline = 'alphabetic'; c.globalAlpha = 1; });
      // patience ring
      const pr = cst.pat / cst.max, rx = bx + 15, ry = by + 22;
      c.strokeStyle = '#eee'; c.lineWidth = 5; c.beginPath(); c.arc(rx, ry, 9, 0, 7); c.stroke();
      c.strokeStyle = pr > .6 ? '#6ad890' : pr > .3 ? '#ffc04a' : '#ff5a6a'; c.beginPath(); c.arc(rx, ry, 9, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * pr); c.stroke();
      // name under bubble
      if (Math.min(VW - 20, 520) / seats.length >= 120) c.fillStyle = 'rgba(80,40,40,.85)', c.font = '800 11px "Pretendard Variable", sans-serif', c.fillText(items.filter(o => !o.done).map(o => o.name).join(' + '), p.x, by - 6);
    }
    c.globalAlpha = 1;
  }
  // counter
  const cy = SY + 34, ch = VH - cy; const cg = c.createLinearGradient(0, cy, 0, cy + 90); cg.addColorStop(0, '#b87a50'); cg.addColorStop(1, '#8a5434'); c.fillStyle = cg; c.fillRect(0, cy, VW, ch);
  c.fillStyle = '#e8b890'; c.fillRect(0, cy, VW, 10); c.fillStyle = 'rgba(0,0,0,.12)'; for (let x = 20; x < VW; x += 60) c.fillRect(x, cy + 16, 2, ch);
  // espresso machine in front of the counter (brewing anim)
  const mx = VW / 2, my = cy + 62; c.fillStyle = '#c8ccd8'; roundRect(c, mx - 22, my - 44, 44, 44, 8); c.fill(); c.fillStyle = '#8a90a0'; c.fillRect(mx - 16, my - 14, 32, 6);
  if (brewing) { c.fillStyle = '#6a3a1a'; c.fillRect(mx - 2, my - 8, 4, 8); for (let k = 0; k < 3; k++) { c.fillStyle = 'rgba(255,255,255,.5)'; c.beginPath(); c.arc(mx + Math.sin(TT * 5 + k) * 6, my - 50 - ((TT * 30 + k * 10) % 30), 4, 0, 7); c.fill(); } }
  c.fillStyle = '#ff6a8a'; c.beginPath(); c.arc(mx + 12, my - 34, 3, 0, 7); c.fill();
  // fx
  for (const f of fx) {
    f.life -= dt;
    if (f.k === 'txt') { f.y -= 26 * dt; c.globalAlpha = Math.min(1, f.life * 1.5); c.font = '900 15px "Pretendard Variable", sans-serif'; c.textAlign = 'center'; c.lineWidth = 4; c.strokeStyle = 'rgba(60,20,30,.7)'; c.strokeText(f.t, f.x, f.y); c.fillStyle = f.c; c.fillText(f.t, f.x, f.y); }
    else { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 600 * dt; c.globalAlpha = Math.min(1, f.life * 2); c.fillStyle = '#ffd24a'; c.beginPath(); c.arc(f.x, f.y, 5, 0, 7); c.fill(); c.strokeStyle = '#c8901a'; c.lineWidth = 1.5; c.stroke(); }
  }
  fx = fx.filter(f => f.life > 0); c.globalAlpha = 1;
}

// ---------------------------------------------------------------- input
cv.addEventListener('pointerdown', e => {
  if (state !== 'open' && state !== 'closing') return; Kit.initAudio();
  for (let i = 0; i < seats.length; i++) { const p = seatPos(i); if (Math.abs(e.clientX - p.x) < Math.max(36, VW / seats.length / 2 - 4) && e.clientY > p.y - 120 && e.clientY < p.y + 50) { serve(i); return; } }
});
$('startBtn').onclick = () => { Kit.initAudio(); startDay(); };
$('openBtn').onclick = startDay;
Kit.bindMute($('muteBtn'));
if (S.day > 1) $('startBtn').textContent = `이어서 영업 (${S.day}일차)`;
hud();

let last = performance.now();
let SPEED = 1;
function frame(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; TT += dt; for (let i = 0; i < SPEED; i++) update(dt); draw(dt); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
if (location.hash === '#test') window.__game = { S: () => S, seats: () => seats, serve, addIng, cup: () => cup, brewing: () => brewing, state: () => state, setT: v => { T = v; }, MENU, avail, startDay, speed: v => { SPEED = v; }, info: () => ({ state, served, earned, angry, perfect, T: Math.round(T) }) };
})();
</script>
