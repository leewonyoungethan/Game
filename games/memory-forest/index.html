<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기억의 숲</title>
<meta name="theme-color" content="#1e4a2e">
<link rel="icon" href="../../icons/memory-forest.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../_shared/kit.css">
<style>
  :root { --bg: #1e4a2e; --panel: rgba(10, 40, 20, .6); --a1: #9af06a; --a2: #3ad0a0; --a3: #ffd24a; --ink-on-grad: #0a2a14; --glow: rgba(120,230,140,.35); }
  body { background: radial-gradient(ellipse at 50% 0%, #4a9a5a 0%, #1e4a2e 55%, #0c2416 100%); }
  .leaves { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .leaves i { position: absolute; top: -40px; font-style: normal; font-size: 22px; opacity: .55; animation: fall linear infinite; }
  @keyframes fall { to { transform: translate(60px, 110vh) rotate(540deg); } }
  .board { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 112px); transform: translateX(-50%);
    display: grid; gap: var(--gap); width: var(--bw); }
  .cardx { aspect-ratio: 3 / 4; perspective: 700px; cursor: pointer; border: 0; padding: 0; background: none; }
  .cardx .in { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .38s cubic-bezier(.3,1.4,.5,1); }
  .cardx.up .in, .cardx.done .in { transform: rotateY(180deg); }
  .cardx .f, .cardx .b { position: absolute; inset: 0; border-radius: 14px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: grid; place-items: center;
    box-shadow: 0 6px 14px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.4); }
  .cardx .b { background: linear-gradient(160deg, #6ad07a, #2a8a4a); border: 3px solid #e8f8d8; }
  .cardx .b::before { content: ""; position: absolute; inset: 8px; border-radius: 9px; border: 2px dashed rgba(255,255,255,.45); }
  .cardx .b::after { content: "🍃"; font-size: calc(var(--cw) * .38); filter: drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
  .cardx .f { transform: rotateY(180deg); background: linear-gradient(160deg, #fffdf2, #f2e6c8); border: 3px solid #ffd98a; font-size: calc(var(--cw) * .56); line-height: 1; }
  .cardx.done .f { border-color: #9af06a; background: linear-gradient(160deg, #f6ffe8, #d8f4c0); animation: pop .5s; }
  .cardx.shake .in { animation: shake .35s; }
  @keyframes pop { 40% { transform: rotateY(180deg) scale(1.12); } }
  @keyframes shake { 25% { transform: rotateY(180deg) translateX(-6px); } 75% { transform: rotateY(180deg) translateX(6px); } }
  .cardx:focus-visible { outline: 3px solid #ffd24a; outline-offset: 2px; border-radius: 14px; }
  .bottom { position: fixed; z-index: 6; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); display: flex; justify-content: center; gap: 8px; }
  .bottom .pill { height: 44px; font-size: 14px; padding: 0 16px; }
  .stages { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 0 0 16px; }
  .stages button { border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.07); color: var(--text); font: 800 16px var(--font); cursor: pointer; padding: 10px 0 6px; display: grid; gap: 2px; }
  .stages button small { font-size: 10px; color: #ffd24a; } .stages button:disabled { opacity: .35; cursor: default; }
  @media (prefers-reduced-motion: reduce) { .leaves i { animation: none; display: none; } .cardx .in { transition: none; } }
</style>
</head>
<body>
<div class="leaves" id="leaves" aria-hidden="true"></div>
<div class="hud">
  <div class="group">
    <div class="box"><div class="lbl" id="stageLbl">1단계</div><div class="big" id="pairs">0/6</div><div class="sub" id="movesLbl">시도 0</div></div>
    <div class="box"><div class="lbl">시간</div><div class="big" id="time">0</div><div class="sub" id="comboLbl">연속 0</div></div>
  </div>
  <div class="stack">
    <a class="pill" href="../../">← 게임 센터</a>
    <button class="pill" id="muteBtn" type="button"></button>
  </div>
</div>
<div class="board" id="board" role="grid" aria-label="카드"></div>
<div class="bottom" id="bottom" hidden>
  <button class="pill" id="peekBtn" type="button">👀 살짝 보기 1</button>
  <button class="pill" id="menuBtn" type="button">☰ 단계</button>
</div>

<div class="screen" id="startScreen">
  <div class="card">
    <div class="lbl">앱개발부 기억력 게임</div>
    <h1>기억의 <span>숲</span></h1>
    <p>숲속 친구들이 나뭇잎 카드 뒤에 숨었어요. 카드를 두 장씩 뒤집어 같은 친구를 찾아 주세요!</p>
    <div class="rules">
      <div><b>🃏</b><span>같은 그림 두 장을 연달아 뒤집으면 짝!</span></div>
      <div><b>👀</b><span>단계마다 한 번 모든 카드를 1초 동안 볼 수 있어요</span></div>
      <div><b>⭐</b><span>적게 시도할수록 별이 많아요</span></div>
    </div>
    <div class="stages" id="stages"></div>
    <button class="go" id="startBtn" type="button">시작하기</button>
  </div>
</div>
<div class="screen" id="clearScreen" hidden>
  <div class="card">
    <div class="lbl" id="clearLbl"></div>
    <h2 id="clearTitle">모두 찾았어요!</h2>
    <div class="final" id="clearStars"></div>
    <p id="clearText"></p>
    <button class="go" id="nextBtn" type="button">다음 단계</button>
    <div class="row"><button class="go ghost" id="retryBtn" type="button">다시 하기</button><button class="go ghost" id="listBtn" type="button">단계 목록</button></div>
  </div>
</div>

<script src="../_shared/kit.js"></script>
<script>
(() => {
'use strict';
const { $, shuffle, tone, chord, toast } = Kit;
const FRIENDS = ['🦊', '🐰', '🐻', '🦉', '🐸', '🦔', '🦌', '🐿️', '🍄', '🌰', '🍁', '🌸', '🦋', '🐌', '🐦', '🐞'];
const STAGES = [
  { cols: 3, rows: 4, preview: 1.6 }, { cols: 4, rows: 4, preview: 1.2 }, { cols: 4, rows: 5, preview: 0 },
  { cols: 4, rows: 6, preview: 0 }, { cols: 5, rows: 6, preview: 0 },
];
const SAVE = 'mf_progress';
let progress = Kit.store.get(SAVE, { unlocked: 1, stars: {} });
let stage = 0, cards = [], open = [], matched = 0, moves = 0, combo = 0, lock = false, startT = 0, timer = null, peeks = 1, playing = false;

// falling leaves
for (let i = 0; i < 10; i++) { const l = document.createElement('i'); l.textContent = ['🍃', '🍂', '🌿'][i % 3]; l.style.left = (i * 11 + 3) + '%'; l.style.animationDuration = (9 + i % 5 * 2) + 's'; l.style.animationDelay = (-i * 1.7) + 's'; $('leaves').append(l); }

function layout() {
  const S = STAGES[stage], vw = innerWidth, vh = innerHeight;
  const gap = Math.max(6, Math.min(12, vw * .02)), availW = Math.min(560, vw - 24), availH = vh - 112 - 84 - (parseInt(getComputedStyle(document.body).paddingTop) || 0);
  const cw = Math.min((availW - gap * (S.cols - 1)) / S.cols, ((availH - gap * (S.rows - 1)) / S.rows) * .75);
  const b = $('board'); b.style.setProperty('--gap', gap + 'px'); b.style.setProperty('--cw', cw + 'px'); b.style.setProperty('--bw', (cw * S.cols + gap * (S.cols - 1)) + 'px');
  b.style.gridTemplateColumns = `repeat(${S.cols}, ${cw}px)`;
}
addEventListener('resize', () => { if (cards.length) layout(); });

function build(i) {
  stage = i; const S = STAGES[i], n = S.cols * S.rows / 2;
  const faces = shuffle(FRIENDS.slice()).slice(0, n);
  const deck = shuffle([...faces, ...faces]);
  const b = $('board'); b.textContent = '';
  cards = deck.map((face, k) => {
    const el = document.createElement('button'); el.type = 'button'; el.className = 'cardx'; el.setAttribute('aria-label', '뒤집힌 카드');
    el.innerHTML = `<div class="in"><div class="b"></div><div class="f">${face}</div></div>`;
    const c = { face, el, done: false, up: false, k };
    el.addEventListener('click', () => flip(c));
    b.append(el); return c;
  });
  open = []; matched = 0; moves = 0; combo = 0; lock = false; peeks = 1; playing = true;
  layout(); hud();
  $('peekBtn').textContent = '👀 살짝 보기 ' + peeks; $('peekBtn').disabled = false;
  clearInterval(timer); $('time').textContent = '0';
  if (S.preview) { lock = true; cards.forEach(c => c.el.classList.add('up')); setTimeout(() => { cards.forEach(c => c.el.classList.remove('up')); lock = false; startClock(); }, S.preview * 1000); }
  else startClock();
}
function startClock() { startT = performance.now(); clearInterval(timer); timer = setInterval(() => { if (playing) $('time').textContent = Math.floor((performance.now() - startT) / 1000); }, 250); }
function flip(c) {
  if (lock || c.done || c.up || !playing) return;
  c.up = true; c.el.classList.add('up'); c.el.setAttribute('aria-label', c.face); open.push(c);
  tone(600 + open.length * 120, .06, 'triangle', .04);
  if (open.length < 2) return;
  moves++; const [a, b] = open;
  if (a.face === b.face) {
    a.done = b.done = true; matched++; combo++; open = [];
    setTimeout(() => { a.el.classList.add('done'); b.el.classList.add('done'); }, 200);
    chord(combo > 1 ? [784, 988, 1319] : [659, 880], .05, 'triangle', .06, .14);
    if (combo === 3) toast('연속 3번!'); if (combo === 5) toast('🔥 연속 5번!');
    if (matched === cards.length / 2) setTimeout(win, 650);
  } else {
    combo = 0; lock = true;
    setTimeout(() => { a.el.classList.add('shake'); b.el.classList.add('shake'); tone(220, .1, 'sine', .04); }, 300);
    setTimeout(() => { for (const c of [a, b]) { c.up = false; c.el.classList.remove('up', 'shake'); c.el.setAttribute('aria-label', '뒤집힌 카드'); } open = []; lock = false; }, 850);
  }
  hud();
}
function peek() {
  if (!playing || lock || peeks <= 0) return;
  peeks--; lock = true; $('peekBtn').textContent = '👀 살짝 보기 ' + peeks; $('peekBtn').disabled = peeks <= 0;
  cards.forEach(c => { if (!c.done) c.el.classList.add('up'); }); tone(880, .1, 'sine', .04);
  setTimeout(() => { cards.forEach(c => { if (!c.done && !open.includes(c)) { c.el.classList.remove('up'); c.up = false; } }); lock = false; }, 1000);
}
function starsFor() { const p = cards.length / 2; return moves <= Math.ceil(p * 1.4) ? 3 : moves <= Math.ceil(p * 2.1) ? 2 : 1; }
function win() {
  playing = false; clearInterval(timer);
  const secs = Math.floor((performance.now() - startT) / 1000), st = starsFor();
  progress.stars[stage] = Math.max(progress.stars[stage] || 0, st);
  progress.unlocked = Math.max(progress.unlocked, Math.min(STAGES.length, stage + 2)); Kit.store.set(SAVE, progress);
  chord([523, 659, 784, 1047, 1319], .08, 'triangle', .07, .3);
  const last = stage === STAGES.length - 1;
  $('clearLbl').textContent = `${stage + 1}단계`;
  $('clearTitle').textContent = last ? '숲속 친구를 모두 찾았어요! 🎉' : '모두 찾았어요!';
  $('clearStars').textContent = '⭐'.repeat(st) + '☆'.repeat(3 - st);
  $('clearText').textContent = `시도 ${moves}번 · ${secs}초` + (st < 3 ? ` — ${Math.ceil(cards.length / 2 * 1.4)}번 안에 찾으면 별 3개!` : ' — 기억력 최고!');
  $('nextBtn').hidden = last; Kit.show('clearScreen');
}
function hud() {
  $('stageLbl').textContent = `${stage + 1}단계`;
  $('pairs').textContent = `${matched}/${cards.length / 2}`;
  $('movesLbl').textContent = `시도 ${moves}`;
  $('comboLbl').textContent = `연속 ${combo}`;
}
function renderStages() {
  const box = $('stages'); box.textContent = '';
  STAGES.forEach((S, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.disabled = i + 1 > progress.unlocked;
    const st = progress.stars[i] || 0; b.innerHTML = `${i + 1}<small>${st ? '★'.repeat(st) : b.disabled ? '🔒' : `${S.cols * S.rows / 2}쌍`}</small>`;
    b.onclick = () => play(i); box.append(b);
  });
  $('startBtn').textContent = progress.unlocked > 1 ? `${Math.min(progress.unlocked, STAGES.length)}단계 이어하기` : '시작하기';
}
function play(i) { Kit.hide('startScreen', 'clearScreen'); $('bottom').hidden = false; build(i); }
function menu() { playing = false; clearInterval(timer); $('bottom').hidden = true; renderStages(); Kit.show('startScreen'); }
$('startBtn').onclick = () => play(Math.min(progress.unlocked, STAGES.length) - 1);
$('nextBtn').onclick = () => play(Math.min(stage + 1, STAGES.length - 1));
$('retryBtn').onclick = () => play(stage);
$('listBtn').onclick = menu; $('menuBtn').onclick = menu; $('peekBtn').onclick = peek;
Kit.bindMute($('muteBtn'));
renderStages();
if (location.hash === '#test') window.__game = { s: () => ({ cards: cards.map(c => ({ face: c.face, done: c.done })), moves, matched, lock, playing }), flip: k => flip(cards[k]) };
})();
</script>
</body>
</html>
