<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>용사 키우기</title>
<meta name="theme-color" content="#1a1430">
<link rel="icon" href="../../icons/hero-idle.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../_shared/kit.css">
<style>
  :root { --bg: #1a1430; --panel: rgba(24, 18, 44, .78); --a1: #ffd24a; --a2: #ff8a3a; --a3: #ff4a6a; --ink-on-grad: #3a1400; --glow: rgba(255,170,60,.35); }
  .hud .box { padding: 7px 11px; } .hud .big { font-size: 21px; }
  .panel { position: fixed; z-index: 6; left: 50%; transform: translateX(-50%); width: min(560px, 100%); bottom: 0; height: 46vh; display: flex; flex-direction: column; background: #1e1838; border-top: 3px solid #3a2e66; border-radius: 20px 20px 0 0; padding: 8px 10px calc(env(safe-area-inset-bottom, 0px) + 8px); }
  .panel[hidden] { display: none; }
  .skills { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
  .sk { position: relative; overflow: hidden; height: 54px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.07); color: var(--text); font-size: 11px; font-weight: 800; cursor: pointer; display: grid; place-items: center; line-height: 1.1; padding: 4px 0; }
  .sk span { font-size: 21px; }
  .sk:disabled { opacity: .45; cursor: default; }
  .sk .cd { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.55); pointer-events: none; }
  .sk.on { border-color: #ffd24a; box-shadow: inset 0 0 0 2px rgba(255,210,74,.5); }
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 6px; }
  .tabs button { height: 34px; border-radius: 10px; border: 0; background: rgba(255,255,255,.06); color: var(--muted); font-weight: 800; font-size: 13px; cursor: pointer; }
  .tabs button.on { background: rgba(255,210,74,.18); color: #ffe08a; }
  .list { flex: 1; overflow-y: auto; display: grid; gap: 6px; align-content: start; padding-bottom: 4px; }
  .row { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 14px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); }
  .row .e { font-size: 26px; text-align: center; }
  .row b { font-size: 14px; } .row small { display: block; color: var(--muted); font-size: 11.5px; }
  .buy { min-width: 86px; height: 44px; border-radius: 12px; border: 0; background: linear-gradient(180deg, #ffd24a, #f0a020); color: #3a1a00; font-weight: 900; font-size: 13px; cursor: pointer; line-height: 1.1; }
  .buy small { display: block; font-size: 10px; font-weight: 700; color: #6a3a00; }
  .buy:disabled { background: rgba(255,255,255,.1); color: var(--muted); cursor: default; }
  .buy:disabled small { color: var(--muted); }
  .note { color: var(--muted); font-size: 12.5px; line-height: 1.6; padding: 4px 4px 8px; word-break: keep-all; }
  .bossBtn { position: fixed; z-index: 6; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 104px); }
  .bossBtn[hidden] { display: none; }
</style>
</head>
<body>
<canvas class="stage" id="cv"></canvas>
<div class="hud">
  <div class="group">
    <div class="box"><div class="lbl" id="stageLbl">1-1</div><div class="big" id="gold">🪙 0</div><div class="sub" id="dps">초당 피해 0</div></div>
    <div class="box"><div class="lbl">영혼석</div><div class="big" id="souls">💎 0</div><div class="sub" id="soulBonus">보너스 +0%</div></div>
  </div>
  <div class="stack">
    <a class="pill" href="../../">← 센터</a>
    <button class="pill" id="muteBtn" type="button"></button>
  </div>
</div>
<button class="pill bossBtn" id="bossBtn" type="button" hidden>👑 보스 재도전</button>
<div class="panel" id="panel" hidden>
  <div class="skills" id="skills"></div>
  <div class="tabs" id="tabs"><button type="button" data-t="up" class="on">⚔️ 강화</button><button type="button" data-t="gear">🎒 장비</button><button type="button" data-t="soul">💎 환생</button><button type="button" data-t="rec">📜 기록</button></div>
  <div class="list" id="list"></div>
</div>

<div class="screen" id="startScreen">
  <div class="card">
    <div class="lbl">앱개발부 방치형 RPG</div>
    <h1>용사 <span>키우기</span></h1>
    <p>꼬마 용사가 알아서 싸워요! 금화를 모아 강화하고, 스킬로 보스를 무찌르며 끝없는 모험을 떠나요.</p>
    <div class="rules">
      <div><b>⚔️</b><span>용사는 자동으로 싸워요. 화면을 탭하면 같이 공격!</span></div>
      <div><b>🪙</b><span>금화로 공격력·체력·공격 속도·치명타를 강화해요</span></div>
      <div><b>👑</b><span>10번째 적은 보스! 30초 안에 물리쳐야 다음 지역으로</span></div>
      <div><b>💎</b><span>막히면 환생해서 영혼석으로 영원히 강해져요. 꺼져 있는 동안에도 금화가 쌓여요</span></div>
    </div>
    <button class="go" id="startBtn" type="button">모험 시작!</button>
  </div>
</div>
<div class="screen" id="offScreen" hidden>
  <div class="card">
    <div class="lbl">다시 오셨군요!</div>
    <h2>쉬는 동안 용사가 모은 금화</h2>
    <div class="final" id="offGold"></div>
    <p id="offText"></p>
    <button class="go" id="offBtn" type="button">받기</button>
  </div>
</div>

<script src="../_shared/kit.js"></script>
<script>
(() => {
'use strict';
const { $, rand, randi, pick, clamp, tone, noise, chord, toast, roundRect } = Kit;
const cv = $('cv'), ctx = cv.getContext('2d');
let VW, VH, DPR; function resize() { DPR = Math.min(2, devicePixelRatio || 1); VW = innerWidth; VH = innerHeight; cv.width = VW * DPR; cv.height = VH * DPR; } addEventListener('resize', resize); resize();

// ---------------------------------------------------------------- data
const ZONES = [
  { name: '초록 들판', sky: ['#8ad0ff', '#d8f4ff'], g: ['#7ad050', '#4a9a30'], mons: ['🐛', '🐌', '🐝', '🐸', '🐗'], boss: '🦂' },
  { name: '버섯 숲', sky: ['#6a9aa0', '#b8e0c8'], g: ['#4a8a4a', '#2a5a2a'], mons: ['🍄', '🦔', '🐺', '🦉', '🐻'], boss: '🧌' },
  { name: '모래 사막', sky: ['#ffb870', '#ffe8b8'], g: ['#e8c070', '#c09040'], mons: ['🦂', '🐍', '🦎', '🐪', '🏺'], boss: '🐫' },
  { name: '얼음 산맥', sky: ['#8ab0e0', '#e8f4ff'], g: ['#e8f0ff', '#a8c0e0'], mons: ['🐧', '🦭', '🐺', '❄️', '🦣'], boss: '🧊' },
  { name: '용암 화산', sky: ['#6a2a3a', '#e8704a'], g: ['#5a2a1a', '#3a1008'], mons: ['🔥', '🦎', '🌋', '👹', '🐉'], boss: '🐲' },
  { name: '구름 성', sky: ['#a890ff', '#ffd8f0'], g: ['#f0e8ff', '#c8b8f0'], mons: ['👻', '🦇', '🗿', '🧙', '🦅'], boss: '😈' },
];
const UPS = [
  { k: 'atk', e: '⚔️', name: '공격력', base: 8, grow: 1.17, desc: lv => `공격 ${fmt(baseDmg(lv))} → ${fmt(baseDmg(lv + 1))}` },
  { k: 'hp', e: '❤️', name: '체력', base: 10, grow: 1.17, desc: lv => `체력 ${fmt(baseHp(lv))} → ${fmt(baseHp(lv + 1))}` },
  { k: 'spd', e: '💨', name: '공격 속도', base: 40, grow: 1.45, max: 20, desc: lv => `초당 ${aps(lv).toFixed(2)}회 → ${aps(lv + 1).toFixed(2)}회` },
  { k: 'crit', e: '🎯', name: '치명타', base: 60, grow: 1.4, max: 25, desc: lv => `확률 ${Math.round(critP(lv) * 100)}% → ${Math.round(critP(lv + 1) * 100)}%` },
  { k: 'tap', e: '👆', name: '탭 공격', base: 15, grow: 1.18, desc: lv => `탭 1번에 공격력의 ${Math.round(tapK(lv) * 100)}% → ${Math.round(tapK(lv + 1) * 100)}%` },
  { k: 'gold', e: '💰', name: '금화 운', base: 50, grow: 1.3, max: 30, desc: lv => `금화 +${lv * 10}% → +${(lv + 1) * 10}%` },
];
const SKILLS = [
  { k: 'smash', e: '💥', name: '강타', cd: 12, unlock: 3, desc: '공격력 ×8 한 방' },
  { k: 'rage', e: '⚡', name: '질풍', cd: 30, unlock: 8, dur: 8, desc: '8초 동안 공격 속도 ×2' },
  { k: 'guard', e: '🛡️', name: '수호', cd: 35, unlock: 15, dur: 5, desc: '5초 동안 무적 + 회복' },
  { k: 'storm', e: '🔥', name: '불꽃 폭풍', cd: 45, unlock: 25, dur: 4, desc: '4초 동안 초당 공격력 ×6' },
];
const GEAR_SLOTS = [{ k: 'weapon', e: '🗡️', name: '무기', stat: '공격' }, { k: 'armor', e: '🛡️', name: '갑옷', stat: '체력' }, { k: 'ring', e: '💍', name: '반지', stat: '금화' }];
const RARITY = [['일반', '#c8c8d0', 1], ['고급', '#6ad08a', 2], ['희귀', '#5aa8ff', 3.5], ['영웅', '#c07aff', 6], ['전설', '#ffb83a', 10]];

// ---------------------------------------------------------------- save
const KEY = 'hero_save';
function fresh() { return { gold: 0, stage: 1, maxStage: 1, lv: { atk: 0, hp: 0, spd: 0, crit: 0, tap: 0, gold: 0 }, gear: { weapon: 0, armor: 0, ring: 0 }, souls: 0, rebirths: 0, kills: 0, taps: 0, last: Date.now(), auto: true, bossFail: false }; }
let H = Object.assign(fresh(), Kit.store.get(KEY, {}));
H.lv = Object.assign(fresh().lv, H.lv); H.gear = Object.assign(fresh().gear, H.gear);
function save() { H.last = Date.now(); Kit.store.set(KEY, H); }
setInterval(save, 5000); addEventListener('pagehide', save); document.addEventListener('visibilitychange', () => { if (document.hidden) save(); else offline(); });

// ---------------------------------------------------------------- formulas
const soulK = () => 1 + H.souls * .1;
const gearK = slot => 1 + H.gear[slot] * .25;
const baseDmg = lv => 5 * Math.pow(1.13, lv) + lv * 2;
const baseHp = lv => 80 * Math.pow(1.13, lv) + lv * 10;
const aps = lv => 1 + lv * .1;
const critP = lv => .05 + lv * .02;
const tapK = lv => .25 + lv * .05;
const dmg = () => baseDmg(H.lv.atk) * gearK('weapon') * soulK();
const maxHp = () => baseHp(H.lv.hp) * gearK('armor') * Math.sqrt(soulK());
const goldK = () => (1 + H.lv.gold * .1) * gearK('ring') * soulK();
const isBoss = s => s % 10 === 0;
const monHp = s => 12 * Math.pow(1.24, s - 1) * (isBoss(s) ? 7 : 1);
const monAtk = s => 2 * Math.pow(1.15, s - 1) * (isBoss(s) ? 1.6 : 1);
const monGold = s => Math.ceil(4 * Math.pow(1.19, s - 1) * (isBoss(s) ? 10 : 1) * goldK());
const cost = u => Math.ceil(u.base * Math.pow(u.grow, H.lv[u.k]));
function fmt(n) { n = Math.floor(n); if (n < 1e4) return n.toLocaleString(); const u = ['', '만', '억', '조', '경']; let i = 0; while (n >= 1e4 && i < u.length - 1) { n /= 1e4; i++; } return (n < 100 ? n.toFixed(1) : Math.floor(n)) + u[i]; }
const zoneOf = s => ZONES[Math.floor((s - 1) / 10) % ZONES.length];
const stageName = s => `${Math.floor((s - 1) / 10) + 1}-${((s - 1) % 10) + 1}`;

// ---------------------------------------------------------------- battle state
let hero, mon, fx = [], TT = 0, bossT = 0, skillCd = {}, buff = {}, tab = 'up', SPEED = 1, scroll = 0, deadT = 0;
function resetHero() { hero = { hp: maxHp(), atkT: 0, anim: 0, hurt: 0 }; }
function spawnMon() {
  const s = H.stage, Z = zoneOf(s), boss = isBoss(s);
  mon = { e: boss ? Z.boss : Z.mons[(s - 1) % 10 % Z.mons.length], hp: monHp(s), max: monHp(s), atk: monAtk(s), atkT: 1.2, boss, enter: 0, hurt: 0, dead: 0 };
  if (boss) { bossT = 30; toast(`👑 보스 등장! 30초 안에 처치!`); noise(.5, .1, 300); }
}
function hit(n, crit, src) {
  if (!mon || mon.dead) return; mon.hp -= n; mon.hurt = .15;
  if (fx.filter(f => f.k === 'num').length > 10) fx.splice(fx.findIndex(f => f.k === 'num'), 1);
  fx.push({ k: 'num', x: VW * .68 + rand(-20, 20), y: sceneH() * .5 + rand(-30, 0), t: fmt(n), c: crit ? '#ffd24a' : src === 'tap' ? '#8af0ff' : '#fff', big: crit, life: .8 });
  if (mon.hp <= 0) killMon();
}
function killMon() {
  mon.dead = .5; const g = monGold(H.stage); H.gold += g; H.kills++; hero.hp = Math.min(maxHp(), hero.hp + maxHp() * .3);
  fx.push({ k: 'num', x: VW * .68, y: sceneH() * .38, t: `+🪙${fmt(g)}`, c: '#ffe06a', life: 1.1 });
  for (let i = 0; i < 12; i++) fx.push({ k: 'coin', x: VW * .68, y: sceneH() * .55, vx: rand(-160, 60), vy: rand(-300, -120), life: .9 });
  tone(900 + rand(0, 200), .05, 'triangle', .03);
  if (mon.boss) {
    bossT = 0; chord([523, 659, 784, 1047], .08, 'triangle', .06, .3); dropGear(); H.bossFail = false; $('bossBtn').hidden = true;
    H.stage++; hero.hp = maxHp(); setTimeout(() => toast(`🗺️ ${zoneOf(H.stage).name}에 도착!`), 1600);
  } else if (!(H.bossFail && isBoss(H.stage + 1))) H.stage++; // after losing to a boss, keep farming the wave before it until the player retries
  H.maxStage = Math.max(H.maxStage, H.stage);
  renderList();
}
function dropGear() {
  const slot = pick(GEAR_SLOTS), zone = Math.floor((H.stage - 1) / 10);
  const r = Math.random(), rar = r < .02 + zone * .01 ? 4 : r < .1 + zone * .02 ? 3 : r < .3 ? 2 : r < .6 ? 1 : 0;
  const lvl = zone + 1 + rar * 2;
  if (lvl > H.gear[slot.k]) { H.gear[slot.k] = lvl; toast(`${slot.e} ${RARITY[rar][0]} ${slot.name} 획득! (${slot.stat} +${Math.round(lvl * 25)}%)`, 2200); chord([660, 880, 1175], .06, 'triangle', .05, .25); }
  else { const g = monGold(H.stage) * 3; H.gold += g; toast(`${slot.e} ${RARITY[rar][0]} ${slot.name}… 지금 게 더 좋아서 팔았어요 (+🪙${fmt(g)})`, 2000); }
}
function heroDie() {
  deadT = 2; noise(.5, .12, 300); tone(140, .5, 'sawtooth', .05, -60);
  if (mon.boss) { H.bossFail = true; H.stage--; toast('보스에게 졌어요… 강해져서 다시 도전!'); $('bossBtn').hidden = false; }
  else { H.stage = Math.max(Math.floor((H.stage - 1) / 10) * 10 + 1, H.stage - 1); toast('쓰러졌어요! 잠깐 쉬고 다시'); }
  mon = null;
}
function useSkill(k) {
  const S = SKILLS.find(s => s.k === k); if (H.maxStage < S.unlock || (skillCd[k] || 0) > 0 || !mon || deadT > 0) return;
  skillCd[k] = S.cd; Kit.initAudio();
  if (k === 'smash') { hero.anim = 1; hit(dmg() * 8, true, 'skill'); noise(.3, .12, 800); fx.push({ k: 'flash', life: .2, c: '255,240,200' }); }
  else { buff[k] = S.dur; chord(k === 'rage' ? [880, 1175] : k === 'guard' ? [523, 784] : [330, 440, 660], .05, 'sawtooth', .04, .2); if (k === 'guard') hero.hp = maxHp(); }
}
function update(dt) {
  if (!hero) return;
  for (const k in skillCd) skillCd[k] = Math.max(0, skillCd[k] - dt);
  for (const k in buff) buff[k] = Math.max(0, buff[k] - dt);
  if (H.auto) for (const S of SKILLS) if (H.maxStage >= S.unlock && !(skillCd[S.k] > 0) && mon && !mon.dead && (S.k !== 'guard' || hero.hp < maxHp() * .5)) useSkill(S.k);
  scroll += dt * (mon && !mon.dead && mon.enter >= 1 ? 0 : 160);
  if (deadT > 0) { deadT -= dt; if (deadT <= 0) { resetHero(); spawnMon(); } return; }
  if (!mon) spawnMon();
  if (mon.dead) { mon.dead -= dt; if (mon.dead <= 0) spawnMon(); return; }
  mon.enter = Math.min(1, mon.enter + dt * 2.5); if (mon.enter < 1) return;
  mon.hurt = Math.max(0, mon.hurt - dt); hero.hurt = Math.max(0, hero.hurt - dt); hero.anim = Math.max(0, hero.anim - dt * 5);
  // hero attacks
  hero.atkT -= dt * aps(H.lv.spd) * (buff.rage > 0 ? 2 : 1);
  if (hero.atkT <= 0) { hero.atkT = 1; hero.anim = 1; const crit = Math.random() < critP(H.lv.crit); hit(dmg() * (crit ? 3 : 1) * rand(.9, 1.1), crit, 'auto'); tone(crit ? 700 : 420, .03, 'square', .015); }
  if (buff.storm > 0 && mon && !mon.dead) { mon.hp -= dmg() * 6 * dt; if (Math.random() < dt * 8) fx.push({ k: 'fire', x: VW * .68 + rand(-40, 40), y: sceneH() * .62, life: .5 }); if (mon.hp <= 0) killMon(); }
  // monster attacks
  if (mon && !mon.dead) {
    mon.atkT -= dt;
    if (mon.atkT <= 0) { mon.atkT = mon.boss ? 1.1 : 1.4; if (!(buff.guard > 0)) { hero.hp -= mon.atk; hero.hurt = .2; fx.push({ k: 'num', x: VW * .3, y: sceneH() * .45, t: '-' + fmt(mon.atk), c: '#ff7a7a', life: .7 }); if (hero.hp <= 0) return heroDie(); } }
    if (mon.boss) { bossT -= dt; if (bossT <= 0) heroDie(); }
  }
  hero.hp = Math.min(maxHp(), hero.hp + maxHp() * .015 * dt);
}

// ---------------------------------------------------------------- UI
function hud() {
  $('stageLbl').textContent = `${stageName(H.stage)} · ${zoneOf(H.stage).name}`; $('gold').textContent = '🪙 ' + fmt(H.gold);
  $('dps').textContent = `초당 피해 ${fmt(dmg() * aps(H.lv.spd) * (1 + critP(H.lv.crit) * 2))}`;
  $('souls').textContent = '💎 ' + H.souls; $('soulBonus').textContent = `모든 능력 +${Math.round((soulK() - 1) * 100)}%`;
  for (const b of document.querySelectorAll('.buy[data-k]')) { const u = UPS.find(x => x.k === b.dataset.k); b.disabled = H.gold < cost(u) || (u.max && H.lv[u.k] >= u.max); }
  for (const S of SKILLS) { const b = $('sk-' + S.k); if (!b) continue; const locked = H.maxStage < S.unlock; b.disabled = locked; const cdv = skillCd[S.k] || 0; b.querySelector('.cd').style.height = locked ? '100%' : (cdv / S.cd * 100) + '%'; b.classList.toggle('on', (buff[S.k] || 0) > 0); }
}
function buildSkills() {
  $('skills').innerHTML = SKILLS.map(S => `<button type="button" class="sk" id="sk-${S.k}" title="${S.desc}"><span>${S.e}</span>${H.maxStage >= S.unlock ? S.name : `${stageName(S.unlock)} 해금`}<i class="cd"></i></button>`).join('');
  for (const S of SKILLS) $('sk-' + S.k).onclick = () => useSkill(S.k);
}
function renderList() {
  const L = $('list');
  if (tab === 'up') {
    L.innerHTML = UPS.map(u => { const maxed = u.max && H.lv[u.k] >= u.max; return `<div class="row"><span class="e">${u.e}</span><div><b>${u.name} Lv.${H.lv[u.k]}</b><small>${maxed ? '최대 레벨!' : u.desc(H.lv[u.k])}</small></div><button type="button" class="buy" data-k="${u.k}">${maxed ? 'MAX' : '강화'}<small>${maxed ? '' : '🪙' + fmt(cost(u))}</small></button></div>`; }).join('')
      + `<div class="row"><span class="e">🤖</span><div><b>자동 스킬</b><small>스킬을 알아서 써요</small></div><button type="button" class="buy" id="autoBtn">${H.auto ? '켜짐' : '꺼짐'}</button></div>`;
    for (const b of L.querySelectorAll('.buy[data-k]')) b.onclick = () => { const u = UPS.find(x => x.k === b.dataset.k); const c = cost(u); if (H.gold < c || (u.max && H.lv[u.k] >= u.max)) return; H.gold -= c; H.lv[u.k]++; if (u.k === 'hp') hero.hp += baseHp(H.lv.hp) - baseHp(H.lv.hp - 1); tone(660 + H.lv[u.k] * 5, .05, 'triangle', .04); renderList(); hud(); };
    $('autoBtn').onclick = () => { H.auto = !H.auto; renderList(); };
  } else if (tab === 'gear') {
    L.innerHTML = `<p class="note">보스를 물리치면 장비가 떨어져요. 더 좋은 장비는 자동으로 착용!</p>` + GEAR_SLOTS.map(s => { const lv = H.gear[s.k]; return `<div class="row"><span class="e">${s.e}</span><div><b>${s.name} ${lv ? '+' + lv : '없음'}</b><small>${s.stat} +${Math.round(lv * 25)}%</small></div><span></span></div>`; }).join('');
  } else if (tab === 'soul') {
    const gain = soulGain();
    L.innerHTML = `<p class="note">환생하면 금화·강화·장비·스테이지가 처음으로 돌아가지만, 영혼석 💎을 얻어요. 영혼석 1개마다 공격력·금화가 영원히 +10%! (3-1부터 가능)</p><div class="row"><span class="e">💎</span><div><b>지금 환생하면 +${gain}개</b><small>최고 스테이지 ${stageName(H.maxStage)} 기준</small></div><button type="button" class="buy" id="rebirthBtn" ${gain < 1 ? 'disabled' : ''}>환생</button></div>`;
    $('rebirthBtn').onclick = rebirth;
  } else {
    L.innerHTML = `<div class="row"><span class="e">🏆</span><div><b>최고 스테이지 ${stageName(H.maxStage)}</b><small>${zoneOf(H.maxStage).name}</small></div><span></span></div><div class="row"><span class="e">💀</span><div><b>물리친 적 ${H.kills.toLocaleString()}마리</b><small>탭 ${H.taps.toLocaleString()}번</small></div><span></span></div><div class="row"><span class="e">🔁</span><div><b>환생 ${H.rebirths}번</b><small>영혼석 💎${H.souls}</small></div><span></span></div>`;
  }
  hud();
}
const soulGain = () => (H.maxStage >= 21 ? Math.floor(Math.pow((H.maxStage - 1) / 10, 1.6)) : 0);
function rebirth() {
  const g = soulGain(); if (g < 1) return;
  const keep = { souls: H.souls + g, rebirths: H.rebirths + 1, kills: H.kills, taps: H.taps, auto: H.auto };
  H = Object.assign(fresh(), keep); resetHero(); mon = null; skillCd = {}; buff = {}; $('bossBtn').hidden = true;
  chord([523, 659, 784, 1047, 1319, 1568], .1, 'triangle', .07, .5); toast(`💎 환생! 영혼석 +${g}`, 2200); fx.push({ k: 'flash', life: .6, c: '200,180,255' });
  buildSkills(); save(); tab = 'up'; setTab(); renderList();
}
function setTab() { for (const b of $('tabs').children) b.classList.toggle('on', b.dataset.t === tab); }
for (const b of $('tabs').children) b.onclick = () => { tab = b.dataset.t; setTab(); renderList(); };
$('bossBtn').onclick = () => { H.bossFail = false; H.stage = Math.floor((H.stage - 1) / 10) * 10 + 10; mon = null; $('bossBtn').hidden = true; resetHero(); };

// ---------------------------------------------------------------- draw
const sceneH = () => VH - $('panel').offsetHeight;
function draw(dt) {
  const c = ctx; c.setTransform(DPR, 0, 0, DPR, 0, 0);
  const Z = zoneOf(H.stage), SH = $('panel').hidden ? VH : sceneH(), ground = SH * .72;
  const g = c.createLinearGradient(0, 0, 0, ground); g.addColorStop(0, Z.sky[0]); g.addColorStop(1, Z.sky[1]); c.fillStyle = g; c.fillRect(0, 0, VW, ground);
  // parallax mountains
  for (const [k, col, h] of [[.2, 'rgba(255,255,255,.25)', .35], [.5, 'rgba(0,0,0,.12)', .22]]) { c.fillStyle = col; c.beginPath(); c.moveTo(0, ground); for (let x = -100; x <= VW + 100; x += 50) { const xx = x - (scroll * k) % 100; c.lineTo(xx, ground - SH * h * (.6 + .4 * Math.sin((x + Math.floor(scroll * k / 100) * 100) * .013))); } c.lineTo(VW, ground); c.fill(); }
  const gg = c.createLinearGradient(0, ground, 0, VH); gg.addColorStop(0, Z.g[0]); gg.addColorStop(1, Z.g[1]); c.fillStyle = gg; c.fillRect(0, ground, VW, VH - ground);
  c.fillStyle = 'rgba(0,0,0,.08)'; for (let x = -(scroll % 60); x < VW; x += 60) c.fillRect(x, ground + 14, 30, 4);
  // hero
  if (hero) {
    const hx = VW * .3 + hero.anim * 30, hy = ground;
    drawHero(c, hx, hy, Math.min(1.4, SH / 420));
    bar(c, VW * .3, ground - 120 * Math.min(1.4, SH / 420), 100, hero.hp / maxHp(), '#7af0a0', deadT > 0 ? '쓰러짐…' : '용사');
    if (buff.guard > 0) { c.strokeStyle = `rgba(140,220,255,${.5 + .3 * Math.sin(TT * 8)})`; c.lineWidth = 4; c.beginPath(); c.arc(hx, hy - 40, 52, 0, 7); c.stroke(); }
  }
  // monster
  if (mon) {
    const mx = VW * .68 + (1 - mon.enter) * VW * .4 + (mon.hurt ? rand(-4, 4) : 0), my = ground, size = (mon.boss ? 110 : 76) * Math.min(1.3, SH / 420);
    c.globalAlpha = mon.dead ? Math.max(0, mon.dead * 2) : 1;
    c.fillStyle = 'rgba(0,0,0,.2)'; c.beginPath(); c.ellipse(mx, my + 4, size * .45, 10, 0, 0, 7); c.fill();
    if (mon.hurt) c.filter = 'brightness(2.5)';
    c.font = `${size}px sans-serif`; c.textAlign = 'center'; c.textBaseline = 'bottom'; c.save(); c.translate(mx, my + 8); c.scale(-1, 1); c.shadowColor = 'rgba(20,10,40,.55)'; c.shadowBlur = 10; c.shadowOffsetY = 3; c.fillText(mon.e, 0, Math.sin(TT * 3) * 3); c.restore(); c.textBaseline = 'alphabetic'; c.filter = 'none';
    if (!mon.dead) bar(c, mx, my - size - 16, 110, mon.hp / mon.max, '#ff6a7a', (mon.boss ? '👑 보스 ' : '') + stageName(H.stage));
    c.globalAlpha = 1;
    if (mon.boss && bossT > 0) { c.fillStyle = bossT < 10 ? '#ff5a6a' : '#fff'; c.font = '900 22px "Pretendard Variable", sans-serif'; c.textAlign = 'center'; c.fillText(`⏱️ ${bossT.toFixed(1)}`, VW / 2, SH * .3); }
  }
  // fx
  for (const f of fx) {
    f.life -= dt;
    if (f.k === 'num') { f.y -= 50 * dt; c.globalAlpha = Math.min(1, f.life * 2); c.font = `900 ${f.big ? 28 : 19}px "Pretendard Variable", sans-serif`; c.textAlign = 'center'; c.lineWidth = 4; c.strokeStyle = 'rgba(0,0,0,.5)'; c.strokeText(f.t, f.x, f.y); c.fillStyle = f.c; c.fillText(f.t, f.x, f.y); }
    else if (f.k === 'coin') { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 700 * dt; c.globalAlpha = Math.min(1, f.life * 2); c.fillStyle = '#ffd24a'; c.beginPath(); c.arc(f.x, f.y, 5, 0, 7); c.fill(); }
    else if (f.k === 'fire') { f.y -= 80 * dt; c.globalAlpha = f.life * 2; c.font = '28px sans-serif'; c.textAlign = 'center'; c.fillText('🔥', f.x, f.y); }
    else if (f.k === 'flash') { c.globalAlpha = f.life * 1.5; c.fillStyle = `rgb(${f.c})`; c.fillRect(0, 0, VW, VH); }
    else if (f.k === 'tap') { c.globalAlpha = f.life * 3; c.strokeStyle = '#8af0ff'; c.lineWidth = 3; c.beginPath(); c.arc(f.x, f.y, (1 - f.life * 3) * 30 + 8, 0, 7); c.stroke(); }
  }
  fx = fx.filter(f => f.life > 0); c.globalAlpha = 1;
}
function bar(c, x, y, w, p, col, label) {
  c.fillStyle = 'rgba(0,0,0,.45)'; roundRect(c, x - w / 2, y, w, 10, 5); c.fill(); c.fillStyle = col; roundRect(c, x - w / 2 + 2, y + 2, Math.max(0, (w - 4) * clamp(p, 0, 1)), 6, 3); c.fill();
  c.fillStyle = '#fff'; c.font = '800 12px "Pretendard Variable", sans-serif'; c.textAlign = 'center'; c.fillText(label, x, y - 5);
}
function drawHero(c, x, y, k) {
  const dead = deadT > 0, bob = dead ? 0 : Math.sin(TT * 6) * 2, sw = hero.anim;
  c.save(); c.translate(x, y); c.scale(k, k); if (dead) { c.rotate(-1.3); c.globalAlpha = .7; }
  if (hero.hurt) c.filter = 'brightness(2.2) saturate(.3)';
  c.fillStyle = 'rgba(0,0,0,.2)'; c.beginPath(); c.ellipse(0, 3, 26, 7, 0, 0, 7); c.fill();
  // legs
  c.fillStyle = '#4a3a6a'; c.fillRect(-11, -20, 8, 20); c.fillRect(3, -20, 8, 20);
  // cape
  c.fillStyle = '#e83a4a'; c.beginPath(); c.moveTo(-14, -52 + bob); c.quadraticCurveTo(-34, -30, -26 - Math.sin(TT * 8) * 3, -10); c.lineTo(-6, -22); c.fill();
  // body armor
  const bg = c.createLinearGradient(-16, 0, 16, 0); bg.addColorStop(0, '#8aa0d8'); bg.addColorStop(.5, '#d8e4ff'); bg.addColorStop(1, '#6a80c0'); c.fillStyle = bg; roundRect(c, -16, -54 + bob, 32, 36, 9); c.fill();
  c.fillStyle = '#ffd24a'; c.fillRect(-16, -26 + bob, 32, 5);
  // head + helmet
  c.fillStyle = '#ffd8b0'; c.beginPath(); c.arc(0, -70 + bob, 16, 0, 7); c.fill();
  c.fillStyle = '#c8d4f0'; c.beginPath(); c.arc(0, -74 + bob, 17, Math.PI, 0); c.fill(); c.fillStyle = '#e83a4a'; c.beginPath(); c.moveTo(-3, -90 + bob); c.quadraticCurveTo(10, -104 + bob, 16, -92 + bob); c.lineTo(3, -88 + bob); c.fill();
  c.fillStyle = '#2a1a1a'; c.fillRect(3, -72 + bob, 3, 5); c.fillRect(10, -72 + bob, 3, 5);
  c.fillStyle = 'rgba(255,120,140,.5)'; c.beginPath(); c.ellipse(12, -63 + bob, 4, 2.5, 0, 0, 7); c.fill();
  // sword arm
  c.save(); c.translate(14, -44 + bob); c.rotate(-1.1 + sw * 2.1);
  c.fillStyle = '#ffd8b0'; c.beginPath(); c.arc(0, 0, 6, 0, 7); c.fill();
  c.fillStyle = '#8a5a2a'; c.fillRect(-2, -14, 4, 12); c.fillStyle = '#ffd24a'; c.fillRect(-9, -16, 18, 4);
  const sg = c.createLinearGradient(-4, 0, 4, 0); sg.addColorStop(0, '#c8d4e8'); sg.addColorStop(.5, '#ffffff'); sg.addColorStop(1, '#a0b0c8'); c.fillStyle = sg; c.beginPath(); c.moveTo(-4, -16); c.lineTo(4, -16); c.lineTo(3, -56); c.lineTo(0, -62); c.lineTo(-3, -56); c.closePath(); c.fill();
  if (sw > .3) { c.strokeStyle = `rgba(255,255,255,${sw * .7})`; c.lineWidth = 6; c.beginPath(); c.arc(0, 0, 58, -2.4, -.4); c.stroke(); }
  c.restore();
  // shield
  c.fillStyle = '#4a6ad8'; c.beginPath(); c.moveTo(-26, -50 + bob); c.lineTo(-8, -50 + bob); c.lineTo(-8, -32 + bob); c.quadraticCurveTo(-17, -20 + bob, -26, -32 + bob); c.fill(); c.fillStyle = '#ffd24a'; c.fillRect(-19, -46 + bob, 4, 14); c.fillRect(-23, -42 + bob, 12, 4);
  c.filter = 'none'; c.restore();
}

// ---------------------------------------------------------------- input / loop
cv.addEventListener('pointerdown', e => {
  if (!hero || !mon || mon.dead || deadT > 0 || mon.enter < 1) return; Kit.initAudio();
  H.taps++; hit(dmg() * tapK(H.lv.tap) * (Math.random() < critP(H.lv.crit) ? 3 : 1), false, 'tap'); hero.anim = Math.max(hero.anim, .6);
  fx.push({ k: 'tap', x: e.clientX, y: e.clientY, life: .3 }); tone(600 + rand(0, 200), .025, 'square', .015);
});
function offline() {
  const away = (Date.now() - (H.last || Date.now())) / 1000; if (away < 60) return;
  const secs = Math.min(8 * 3600, away), perSec = monGold(Math.max(1, H.stage - 1)) / Math.max(2, monHp(Math.max(1, H.stage - 1)) / (dmg() * aps(H.lv.spd)) + 1.4);
  const g = Math.floor(perSec * secs * .5); if (g < 1) return;
  H.gold += g; H.last = Date.now(); save();
  $('offGold').textContent = '🪙 ' + fmt(g); $('offText').textContent = `${Math.floor(secs / 3600)}시간 ${Math.floor(secs % 3600 / 60)}분 동안 용사가 혼자 싸웠어요! (최대 8시간)`;
  if ($('startScreen').hidden) Kit.show('offScreen');
}
$('offBtn').onclick = () => { Kit.hide('offScreen'); chord([784, 988, 1175], .05, 'triangle', .05, .2); renderList(); };
function start() { Kit.initAudio(); Kit.hide('startScreen'); $('panel').hidden = false; resetHero(); buildSkills(); renderList(); if (H.bossFail) $('bossBtn').hidden = false; offline(); }
$('startBtn').onclick = start;
if (H.kills) $('startBtn').textContent = `이어서 모험 (${stageName(H.stage)})`;
Kit.bindMute($('muteBtn'));
let last = performance.now(), hudT = 0, unlocked = SKILLS.filter(S => H.maxStage >= S.unlock).length;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; TT += dt;
  for (let i = 0; i < SPEED; i++) update(dt);
  hudT -= dt; if (hudT <= 0 && hero) { hudT = .2; hud(); const u = SKILLS.filter(S => H.maxStage >= S.unlock).length; if (u !== unlocked) { if (u > unlocked) toast(`새 스킬 해금! ${SKILLS[u - 1].e} ${SKILLS[u - 1].name}`); unlocked = u; buildSkills(); } }
  draw(dt); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if (location.hash === '#test') window.__game = { H: () => H, speed: v => { SPEED = v; }, buy: k => { const u = UPS.find(x => x.k === k), c = cost(u); if (H.gold >= c && !(u.max && H.lv[k] >= u.max)) { H.gold -= c; H.lv[k]++; return true; } return false; }, rebirth, soulGain, retryBoss: () => $('bossBtn').click(), tap: () => cv.dispatchEvent(new PointerEvent('pointerdown', { clientX: VW * .7, clientY: 200 })), info: () => ({ stage: stageName(H.stage), max: H.maxStage, gold: Math.floor(H.gold), lv: { ...H.lv }, gear: { ...H.gear }, souls: H.souls, fail: H.bossFail }) };
})();
</script>
</body>
