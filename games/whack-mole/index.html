<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>두더지 팡팡</title>
<meta name="theme-color" content="#3a8a3a">
<link rel="icon" href="../../icons/whack-mole.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../_shared/kit.css">
<style>
  :root { --bg: #3a8a3a; --panel: rgba(20, 60, 20, .62); --a1: #ffd24a; --a2: #ff8a3a; --a3: #ff4f7a; --ink-on-grad: #3a1a00; --glow: rgba(255,160,60,.35); }
  .timebar { position: fixed; z-index: 6; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 104px); width: min(360px, 80vw); height: 12px;
    border-radius: 999px; background: rgba(0,0,0,.25); overflow: hidden; border: 1px solid rgba(255,255,255,.25); }
  .timebar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ff4f7a, #ffd24a 40%, #7cf09a); border-radius: inherit; transform-origin: left; }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 0 0 16px; font-size: 13px; text-align: left; }
  .legend div { background: rgba(255,255,255,.07); border-radius: 10px; padding: 7px 9px; }
</style>
</head>
<body>
<canvas class="stage" id="cv"></canvas>
<div class="hud">
  <div class="group">
    <div class="box"><div class="lbl">점수</div><div class="big" id="score">0</div><div class="sub" id="best">최고 0</div></div>
    <div class="box"><div class="lbl">콤보</div><div class="big" id="combo">0</div><div class="sub" id="time">60초</div></div>
  </div>
  <div class="stack">
    <a class="pill" href="../../">← 게임 센터</a>
    <button class="pill" id="muteBtn" type="button"></button>
  </div>
</div>
<div class="timebar" id="timebar" hidden><i id="timefill"></i></div>

<div class="screen" id="startScreen">
  <div class="card">
    <div class="lbl">앱개발부 반응속도 게임</div>
    <h1>두더지 <span>팡팡</span></h1>
    <p>60초 동안 텃밭에 튀어나오는 두더지를 최대한 많이 잡으세요! 연속으로 맞히면 콤보 점수가 올라가요.</p>
    <div class="legend">
      <div>🟤 두더지 +10</div><div>⛑️ 헬멧 두더지 2번!</div>
      <div>✨ 황금 두더지 +50</div><div>🦔 고슴도치 치면 감점</div>
      <div>🐰 시계 토끼 +3초</div><div>⌨️ 숫자 1~9 키도 돼요</div>
    </div>
    <button class="go" id="startBtn" type="button">시작하기</button>
  </div>
</div>
<div class="screen" id="overScreen" hidden>
  <div class="card">
    <div class="lbl" id="overLbl">시간 끝!</div>
    <div class="final" id="finalScore">0</div>
    <p id="overText"></p>
    <button class="go" id="againBtn" type="button">한 판 더</button>
  </div>
</div>

<script src="../_shared/kit.js"></script>
<script>
(() => {
'use strict';
const { $, rand, pick, roundRect, tone, noise, chord, toast } = Kit;
const W = 360, H = 420, GAME_TIME = 60;
const cv = $('cv'), ctx = cv.getContext('2d');
let F; function resize() { F = Kit.fit(cv, W, H, { top: 128, bottom: 24 }); } addEventListener('resize', resize); resize();
const HOLES = []; for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) HOLES.push({ x: 60 + c * 120, y: 70 + r * 135, mole: null, cool: 0 });
const KINDS = {
  mole:     { w: 60, hp: 1, pts: 10, stay: [1.0, 1.6] },
  helmet:   { w: 16, hp: 2, pts: 25, stay: [1.4, 1.9] },
  gold:     { w: 7,  hp: 1, pts: 50, stay: [.55, .8] },
  hedgehog: { w: 12, hp: 1, pts: -20, stay: [1.0, 1.4] },
  bunny:    { w: 5,  hp: 1, pts: 5, stay: [.8, 1.1] },
};
const best = Kit.best('mole_best');
let state = 'title', score, combo, maxCombo, hits, misses, timeLeft, spawnT, elapsed, pops = [], floats = [], hammer = null, stunned = 0, shake = 0;

function newGame() {
  score = 0; combo = 0; maxCombo = 0; hits = 0; misses = 0; timeLeft = GAME_TIME; spawnT = .6; elapsed = 0; pops = []; floats = []; stunned = 0;
  HOLES.forEach(h => { h.mole = null; h.cool = 0; }); hud();
}
function pickKind() {
  const lvl = Math.min(1, elapsed / GAME_TIME), list = Object.entries(KINDS);
  const weights = list.map(([k, v]) => v.w * (k === 'mole' ? 1 - lvl * .3 : 1 + lvl * .6));
  let x = Math.random() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < list.length; i++) if ((x -= weights[i]) < 0) return list[i][0];
  return 'mole';
}
function spawn() {
  const free = HOLES.filter(h => !h.mole && h.cool <= 0); if (!free.length) return;
  const h = pick(free), kind = pickKind(), K = KINDS[kind], lvl = Math.min(1, elapsed / GAME_TIME);
  h.mole = { kind, hp: K.hp, up: 0, stay: rand(...K.stay) * (1 - lvl * .35), state: 'rise', t: 0, hitT: 0 };
}
function whack(h) {
  if (state !== 'play' || stunned > 0) return;
  hammer = { x: h.x, y: h.y - 20, t: 0 };
  const m = h.mole;
  if (!m || m.state === 'hit' || m.up < .35) { combo = 0; misses++; tone(160, .06, 'square', .03); noise(.06, .05, 500); hud(); return; }
  const K = KINDS[m.kind];
  if (m.kind === 'hedgehog') {
    m.state = 'hit'; m.t = 0; score = Math.max(0, score + K.pts); combo = 0; stunned = .8; shake = 10;
    floats.push({ x: h.x, y: h.y - 70, txt: '아야! -20', c: '#ff6a6a', life: 1 }); tone(220, .25, 'sawtooth', .07, -120); if (navigator.vibrate) navigator.vibrate(60); hud(); return;
  }
  m.hp--; m.hitT = .15;
  if (m.hp > 0) { tone(900, .05, 'square', .04); noise(.05, .06, 3000); floats.push({ x: h.x, y: h.y - 70, txt: '땡!', c: '#dfe6f2', life: .6 }); return; }
  m.state = 'hit'; m.t = 0; combo++; hits++; maxCombo = Math.max(maxCombo, combo);
  const mult = 1 + Math.min(4, Math.floor(combo / 5)) * .5, gain = Math.round(K.pts * mult);
  score += gain;
  if (m.kind === 'bunny') { timeLeft = Math.min(GAME_TIME, timeLeft + 3); floats.push({ x: h.x, y: h.y - 90, txt: '+3초', c: '#7cf0ff', life: 1 }); chord([880, 1175], .05, 'triangle', .05); }
  floats.push({ x: h.x, y: h.y - 70, txt: `+${gain}`, c: m.kind === 'gold' ? '#ffe06a' : '#fff', life: 1 });
  for (let i = 0; i < (m.kind === 'gold' ? 26 : 12); i++) pops.push({ x: h.x, y: h.y - 30, vx: rand(-160, 160), vy: rand(-260, -60), life: rand(.4, .8), c: m.kind === 'gold' ? pick(['#ffe06a', '#fff6c0', '#ffb43a']) : pick(['#fff', '#ffd24a', '#a8f08a']), r: rand(2, 4) });
  tone(m.kind === 'gold' ? 1320 : 520 + Math.min(combo, 20) * 30, .09, 'triangle', .07); noise(.06, .07, 2200);
  if (combo > 0 && combo % 5 === 0 && combo <= 20) toast(`${combo >= 20 ? '🔥 ' : ''}콤보 ${combo}! 점수 ×${mult}`);
  shake = Math.max(shake, 3); hud();
}
function hud() {
  $('score').textContent = score; $('best').textContent = '최고 ' + Math.max(best.get() || 0, score);
  $('combo').textContent = combo ? '×' + combo : '0'; $('time').textContent = Math.ceil(timeLeft) + '초';
}
function gameOver() {
  state = 'over'; HOLES.forEach(h => h.mole = null); $('timebar').hidden = true;
  const isBest = best.submit(score), acc = hits + misses ? Math.round(hits / (hits + misses) * 100) : 0;
  $('finalScore').textContent = score; $('overLbl').textContent = isBest ? '🎉 최고 기록!' : '시간 끝!';
  $('overText').textContent = `잡은 두더지 ${hits}마리 · 최대 콤보 ${maxCombo} · 정확도 ${acc}%`;
  chord([523, 659, 784], .1, 'triangle', .06, .3); setTimeout(() => Kit.show('overScreen'), 600); hud();
}

// ---------------------------------------------------------------- loop
let last = performance.now(), TT = 0;
function frame(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now; TT += dt;
  if (state === 'play') {
    elapsed += dt; timeLeft -= dt; stunned = Math.max(0, stunned - dt);
    if (timeLeft <= 0) { timeLeft = 0; gameOver(); }
    spawnT -= dt;
    const lvl = Math.min(1, elapsed / GAME_TIME);
    if (spawnT <= 0) { spawn(); if (lvl > .45 && Math.random() < .35) spawn(); spawnT = rand(.55, .95) * (1 - lvl * .45); }
    $('timefill').style.transform = `scaleX(${timeLeft / GAME_TIME})`;
    $('time').textContent = Math.ceil(timeLeft) + '초';
  }
  for (const h of HOLES) {
    h.cool -= dt; const m = h.mole; if (!m) continue;
    m.t += dt; m.hitT = Math.max(0, m.hitT - dt);
    if (m.state === 'rise') { m.up = Math.min(1, m.up + dt * 7); if (m.up >= 1) { m.state = 'stay'; m.t = 0; } }
    else if (m.state === 'stay') { if (m.t > m.stay) { m.state = 'fall'; if (state === 'play' && m.kind !== 'hedgehog') { combo = 0; hud(); } } }
    else if (m.state === 'fall' || (m.state === 'hit' && m.t > .25)) { m.up = Math.max(0, m.up - dt * 6); if (m.up <= 0) { h.mole = null; h.cool = .25; } }
  }
  for (const p of pops) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; p.life -= dt; } pops = pops.filter(p => p.life > 0);
  for (const f of floats) { f.y -= 50 * dt; f.life -= dt; } floats = floats.filter(f => f.life > 0);
  if (hammer) { hammer.t += dt; if (hammer.t > .22) hammer = null; }
  shake = Math.max(0, shake - dt * 40);
  draw(); requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- draw
function draw() {
  const c = ctx, { dpr, scale, ox, oy, vw, vh } = F;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g = c.createLinearGradient(0, 0, 0, vh); g.addColorStop(0, '#8ad8ff'); g.addColorStop(.3, '#c8f0ff'); g.addColorStop(.31, '#6ac850'); g.addColorStop(1, '#2e7a2e');
  c.fillStyle = g; c.fillRect(0, 0, vw, vh);
  c.translate(ox + (Math.random() - .5) * shake, oy + (Math.random() - .5) * shake); c.scale(scale, scale);
  // garden bed
  c.fillStyle = 'rgba(30,70,20,.35)'; roundRect(c, -10, 10, W + 20, H - 10, 30); c.fill();
  // fence
  c.fillStyle = '#f4e2c0'; c.strokeStyle = '#a8865a'; c.lineWidth = 2;
  for (let x = -6; x < W + 10; x += 26) { roundRect(c, x, -28, 18, 40, 6); c.fill(); c.stroke(); }
  c.fillRect(-10, -14, W + 20, 6); c.fillRect(-10, 2, W + 20, 6);
  // flowers
  for (let i = 0; i < 12; i++) { const fx = (i * 73) % W, fy = 395 + (i % 3) * 8; c.fillStyle = ['#ff7ab8', '#ffd24a', '#fff'][i % 3]; c.beginPath(); c.arc(fx, fy, 4, 0, 7); c.fill(); }
  for (const h of HOLES) drawHole(c, h);
  // hammer
  if (hammer) {
    const k = hammer.t / .22, a = k < .4 ? -1.1 + k / .4 * 1.4 : .3 - (k - .4) * .5;
    c.save(); c.translate(hammer.x + 40, hammer.y - 10); c.rotate(a);
    c.fillStyle = '#c08a4a'; c.strokeStyle = '#5a3a1a'; c.lineWidth = 3; roundRect(c, -4, -6, 8, 60, 4); c.fill(); c.stroke();
    const hg = c.createLinearGradient(-30, -26, 30, 4); hg.addColorStop(0, '#ff8aa8'); hg.addColorStop(1, '#d8285a');
    c.fillStyle = hg; roundRect(c, -32, -28, 64, 30, 10); c.fill(); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.5)'; roundRect(c, -26, -24, 52, 7, 3); c.fill();
    c.restore();
    if (hammer.t < .1) { c.strokeStyle = '#fff'; c.lineWidth = 4; for (let i = 0; i < 6; i++) { const a2 = i * 1.05; c.beginPath(); c.moveTo(hammer.x + Math.cos(a2) * 26, hammer.y + Math.sin(a2) * 14); c.lineTo(hammer.x + Math.cos(a2) * 40, hammer.y + Math.sin(a2) * 22); c.stroke(); } }
  }
  for (const p of pops) { c.globalAlpha = Math.max(0, p.life * 1.5); c.fillStyle = p.c; c.beginPath(); c.arc(p.x, p.y, p.r, 0, 7); c.fill(); }
  c.globalAlpha = 1; c.textAlign = 'center'; c.font = '900 22px "Pretendard Variable", system-ui, sans-serif';
  for (const f of floats) { c.globalAlpha = Math.min(1, f.life * 2); c.lineWidth = 5; c.strokeStyle = 'rgba(40,20,0,.55)'; c.strokeText(f.txt, f.x, f.y); c.fillStyle = f.c; c.fillText(f.txt, f.x, f.y); }
  c.globalAlpha = 1;
  if (stunned > 0) { c.fillStyle = `rgba(255,80,80,${stunned * .25})`; c.fillRect(-20, -40, W + 40, H + 60); }
}
function drawHole(c, h) {
  const { x, y } = h;
  // back rim + hole
  c.fillStyle = '#6a4220'; c.beginPath(); c.ellipse(x, y, 50, 20, 0, 0, 7); c.fill();
  c.fillStyle = '#2a1608'; c.beginPath(); c.ellipse(x, y + 2, 42, 15, 0, 0, 7); c.fill();
  // mole clipped above the front rim
  const m = h.mole;
  if (m && m.up > 0) {
    c.save(); c.beginPath(); c.rect(x - 60, y - 140, 120, 140); c.ellipse(x, y + 2, 42, 15, 0, 0, Math.PI); c.clip();
    const bob = m.state === 'stay' ? Math.sin(m.t * 8) * 1.5 : 0, rise = (1 - easeOut(m.up)) * 80;
    c.translate(x, y + rise + bob);
    if (m.hitT > 0) c.translate((Math.random() - .5) * 6, 0);
    drawCritter(c, m);
    c.restore();
  }
  // front mound
  const g = c.createLinearGradient(0, y, 0, y + 26); g.addColorStop(0, '#a8703a'); g.addColorStop(1, '#6a4220');
  c.fillStyle = g; c.beginPath(); c.ellipse(x, y + 6, 54, 20, 0, 0, Math.PI); c.fill();
  c.fillStyle = 'rgba(255,255,255,.15)'; c.beginPath(); c.ellipse(x - 18, y + 12, 12, 4, 0, 0, 7); c.fill();
  c.fillStyle = '#5ab84a'; for (let i = -2; i <= 2; i++) { c.beginPath(); c.moveTo(x + i * 22, y + 22); c.lineTo(x + i * 22 - 4, y + 12); c.lineTo(x + i * 22 + 4, y + 13); c.fill(); }
}
const easeOut = t => 1 - (1 - t) * (1 - t);
function drawCritter(c, m) {
  const hit = m.state === 'hit';
  if (m.kind === 'hedgehog') {
    c.fillStyle = '#5a3a2a'; for (let i = 0; i < 11; i++) { const a = Math.PI + i * Math.PI / 10; c.beginPath(); c.moveTo(Math.cos(a) * 26, -36 + Math.sin(a) * 30); c.lineTo(Math.cos(a) * 46, -36 + Math.sin(a) * 50); c.lineTo(Math.cos(a + .18) * 26, -36 + Math.sin(a + .18) * 30); c.fill(); }
    c.fillStyle = '#c89a6a'; c.beginPath(); c.ellipse(0, -30, 30, 34, 0, 0, 7); c.fill();
    c.fillStyle = '#f0d0a8'; c.beginPath(); c.ellipse(0, -22, 20, 22, 0, 0, 7); c.fill();
    eyes(c, hit, '#2a1a10'); c.fillStyle = '#2a1a10'; c.beginPath(); c.arc(0, -24, 4, 0, 7); c.fill();
    if (!hit) { c.fillStyle = '#ff4f4f'; c.font = '900 18px sans-serif'; c.textAlign = 'center'; c.fillText('!', 26, -64); }
    return;
  }
  if (m.kind === 'bunny') {
    c.fillStyle = '#fff'; c.strokeStyle = '#d8c8d8'; c.lineWidth = 2;
    c.beginPath(); c.ellipse(-12, -78, 8, 24, -.15, 0, 7); c.ellipse(12, -78, 8, 24, .15, 0, 7); c.fill(); c.stroke();
    c.fillStyle = '#ffb0c8'; c.beginPath(); c.ellipse(-12, -78, 4, 16, -.15, 0, 7); c.ellipse(12, -78, 4, 16, .15, 0, 7); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.ellipse(0, -30, 30, 34, 0, 0, 7); c.fill(); c.stroke();
    eyes(c, hit, '#3a2030'); c.fillStyle = '#ff7aa8'; c.beginPath(); c.arc(0, -24, 4, 0, 7); c.fill();
    c.fillStyle = '#7cf0ff'; c.strokeStyle = '#1a6a8a'; c.lineWidth = 3; c.beginPath(); c.arc(22, -8, 12, 0, 7); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(22, -8); c.lineTo(22, -15); c.moveTo(22, -8); c.lineTo(27, -6); c.stroke();
    return;
  }
  const gold = m.kind === 'gold';
  const g = c.createRadialGradient(-8, -46, 4, 0, -30, 40);
  g.addColorStop(0, gold ? '#fff6b0' : '#c8946a'); g.addColorStop(.7, gold ? '#ffcc2a' : '#8a5a3a'); g.addColorStop(1, gold ? '#c88a00' : '#5a3620');
  c.fillStyle = g; c.beginPath(); c.ellipse(0, -30, 32, 38, 0, 0, 7); c.fill();
  c.fillStyle = gold ? '#fff2c0' : '#e8c8a8'; c.beginPath(); c.ellipse(0, -16, 20, 16, 0, 0, 7); c.fill();
  eyes(c, hit, '#1a0e08');
  c.fillStyle = '#ff8aa8'; c.beginPath(); c.ellipse(0, -24, 6, 4.5, 0, 0, 7); c.fill();
  c.fillStyle = '#fff'; c.fillRect(-4, -18, 3.5, 5); c.fillRect(.5, -18, 3.5, 5);
  c.fillStyle = 'rgba(255,120,150,.45)'; c.beginPath(); c.ellipse(-18, -24, 6, 3.5, 0, 0, 7); c.ellipse(18, -24, 6, 3.5, 0, 0, 7); c.fill();
  c.fillStyle = gold ? '#e8a800' : '#6a4228'; c.beginPath(); c.ellipse(-24, -6, 9, 6, -.4, 0, 7); c.ellipse(24, -6, 9, 6, .4, 0, 7); c.fill();
  if (m.kind === 'helmet' && m.hp > 1) {
    const hg = c.createLinearGradient(0, -72, 0, -42); hg.addColorStop(0, '#ffe06a'); hg.addColorStop(1, '#e0a000');
    c.fillStyle = hg; c.beginPath(); c.ellipse(0, -48, 34, 26, 0, Math.PI, 0); c.fill(); c.fillRect(-38, -50, 76, 7);
    c.fillStyle = '#fff'; c.beginPath(); c.arc(0, -62, 6, 0, 7); c.fill();
  }
  if (gold) { c.fillStyle = 'rgba(255,255,255,.8)'; c.beginPath(); c.arc(-14, -52, 4, 0, 7); c.fill(); }
}
function eyes(c, hit, col) {
  c.strokeStyle = col; c.fillStyle = col; c.lineWidth = 3;
  if (hit) { for (const s of [-1, 1]) { c.beginPath(); c.moveTo(s * 11 - 4, -40); c.lineTo(s * 11 + 4, -34); c.moveTo(s * 11 + 4, -40); c.lineTo(s * 11 - 4, -34); c.stroke(); } }
  else { c.beginPath(); c.arc(-11, -38, 4.2, 0, 7); c.arc(11, -38, 4.2, 0, 7); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.arc(-10, -39.5, 1.5, 0, 7); c.arc(12, -39.5, 1.5, 0, 7); c.fill(); }
}

// ---------------------------------------------------------------- input
cv.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  const x = (e.clientX - F.ox) / F.scale, y = (e.clientY - F.oy) / F.scale;
  let best = null, bd = 1e9;
  for (const h of HOLES) { const d = Math.hypot((x - h.x) / 1.1, y - (h.y - 25)); if (d < bd) { bd = d; best = h; } }
  if (best && bd < 70) whack(best);
});
addEventListener('keydown', e => {
  if (state !== 'play') return;
  const map = { '7': 0, '8': 1, '9': 2, '4': 3, '5': 4, '6': 5, '1': 6, '2': 7, '3': 8, q: 0, w: 1, e: 2, a: 3, s: 4, d: 5, z: 6, x: 7, c: 8 };
  const i = map[e.key.toLowerCase()]; if (i !== undefined) whack(HOLES[i]);
});
function start() { newGame(); state = 'play'; Kit.hide('startScreen', 'overScreen'); $('timebar').hidden = false; }
$('startBtn').onclick = start; $('againBtn').onclick = start;
Kit.bindMute($('muteBtn'));
newGame(); requestAnimationFrame(frame);
if (location.hash === '#test') window.__game = { s: () => ({ HOLES, state, score, combo, timeLeft, hits, misses }), whack: i => whack(HOLES[i]), setTime: t => { timeLeft = t; } };
})();
</script>
</body>
</html>
